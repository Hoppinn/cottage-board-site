<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/images/main/favicon-square.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/images/main/favicon-square.png">
  <title>로그인 처리 중...</title>
  <style>
    body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; background: #faf9f5; color: #555; }
  </style>
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <p>로그인 처리 중...</p>
  <script>
    (async function () {
      const queryParams = new URLSearchParams(window.location.search);
      const returnUrl = sessionStorage.getItem('kakao_login_return') || '/index.html';
      sessionStorage.removeItem('kakao_login_return');

      const code = queryParams.get('code');

      if (code) {
        // Kakao SDK v2: authorize()로 받은 code를 REST API로 교환
        try {
          const res = await fetch('https://kauth.kakao.com/oauth/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=utf-8' },
            body: new URLSearchParams({
              grant_type: 'authorization_code',
              client_id: '0e496d427628f9f9b239b106cb5313fa',
              redirect_uri: window.location.origin + '/auth-callback.html',
              code: code,
            }),
          });
          const tokenData = await res.json();
          const accessToken = tokenData.access_token;

          if (!accessToken) {
            console.error('kakao token error', tokenData);
            document.querySelector('p').textContent = '로그인 오류: ' + (tokenData.error_description || tokenData.error || '알 수 없음');
            return;
          }
          const userRes = await fetch('https://kapi.kakao.com/v2/user/me', {
            headers: { 'Authorization': 'Bearer ' + accessToken },
          });
          const data = await userRes.json();
          const profile = data.kakao_account?.profile || {};
          const userId = String(data.id);
          const customNick = localStorage.getItem(`cottage_custom_nick_${userId}`);
          const customPhoto = localStorage.getItem(`cottage_custom_photo_${userId}`);
          const kakaoImg = (profile.profile_image_url || '').replace(/^http:\/\//, 'https://');

          // localStorage에 없는 항목(닉네임·사진)을 DB에서 복원 시도
          let dbNick = null, dbPhoto = null;
          if (!customNick || !customPhoto) {
            try {
              const pRes = await fetch(
                'https://fqddfvprknwcgojwfrbs.supabase.co/rest/v1/profiles?user_id=eq.' + userId + '&select=nickname,photo_url&limit=1',
                { headers: { 'apikey': 'sb_publishable_gPxHQyp4fG7l3YBrCVUWJw_2-mBnNpl', 'Authorization': 'Bearer sb_publishable_gPxHQyp4fG7l3YBrCVUWJw_2-mBnNpl' } }
              );
              const pData = await pRes.json();
              const dbProfile = pData?.[0];
              if (!customNick && dbProfile?.nickname && dbProfile.nickname !== (profile.nickname || '')) {
                dbNick = dbProfile.nickname;
                localStorage.setItem(`cottage_custom_nick_${userId}`, dbNick);
              }
              if (!customPhoto && dbProfile?.photo_url) {
                dbPhoto = dbProfile.photo_url;
                localStorage.setItem(`cottage_custom_photo_${userId}`, dbPhoto);
                console.log('[auth-callback] DB photo_url 복원 성공');
              } else if (!customPhoto) {
                console.log('[auth-callback] DB photo_url 없음 (null 또는 컬럼 미존재)', dbProfile);
              }
            } catch (e) { console.warn('[auth-callback] DB profile fetch 실패', e); }
          }

          const user = {
            id: userId,
            nickname: customNick || dbNick || profile.nickname || '손님',
            kakaoNickname: profile.nickname || '',
            profileImage: customPhoto || dbPhoto || kakaoImg,
            kakaoProfileImage: kakaoImg,
          };
          localStorage.setItem('kakao_user', JSON.stringify(user));
        } catch (e) {
          console.error('kakao auth error', e);
          document.querySelector('p').textContent = '로그인 오류 (네트워크): ' + e.message;
          return;
        }
      }

      window.location.replace(returnUrl);
    })();
  </script>
</body>
</html>
