  <style>
    .loc-search-wrap { margin-bottom: 20px; }
    .loc-search-input {
      width: 100%;
      padding: 13px 16px;
      font-size: 16px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      outline: none;
      box-sizing: border-box;
      font-family: inherit;
      background: #fff;
    }
    .loc-search-input:focus { border-color: #6b4c3b; }

    .loc-search-results { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
    .loc-result-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #faf7f4;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid #ece6df;
    }
    .loc-result-item:active { background: #f0ebe4; }
    .loc-code-badge {
      font-weight: 800;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 5px;
      background: #5c3d2e;
      color: #fff;
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: 0.03em;
    }
    .loc-code-badge--sub { background: #8b6350; }
    .loc-code-badge--none { background: #aaa; }
    .loc-result-name { font-size: 14px; color: #222; flex: 1; }
    .loc-result-section { font-size: 12px; color: #999; white-space: nowrap; }

    .loc-sections { display: flex; flex-direction: column; gap: 6px; }
    .loc-section {
      border: 1.5px solid #e4dcd4;
      border-radius: 10px;
      overflow: hidden;
    }
    .loc-section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      cursor: pointer;
      background: #faf7f4;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .loc-section-header:active { background: #f3ede6; }
    .loc-section-code {
      font-size: 16px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 7px;
      background: #5c3d2e;
      color: #fff;
      min-width: 38px;
      text-align: center;
      flex-shrink: 0;
    }
    .loc-series-A .loc-section-code        { background: #c0632a; }
    .loc-series-A.loc-section--sub .loc-section-code { background: #d4845a; }
    .loc-series-B .loc-section-code        { background: #3a7a52; }
    .loc-series-B.loc-section--sub .loc-section-code { background: #5a9a72; }
    .loc-series-C .loc-section-code        { background: #2d5c9c; }
    .loc-series-C.loc-section--sub .loc-section-code { background: #4d7cbc; }
    .loc-series-D .loc-section-code        { background: #4a7a6a; }
    .loc-series-E .loc-section-code        { background: #8c3a6a; }
    .loc-series-F .loc-section-code        { background: #7c2020; }
    .loc-series-F.loc-section--sub .loc-section-code { background: #9c4040; }
    .loc-series-Z .loc-section-code        { background: #525270; }
    .loc-series-Z.loc-section--sub .loc-section-code { background: #727290; }
    .loc-section--inactive .loc-section-code { background: #bbb; }
    .loc-section-info { flex: 1; min-width: 0; }
    .loc-section-label { font-size: 14px; font-weight: 600; color: #222; }
    .loc-section-count { font-size: 12px; color: #999; margin-top: 1px; }
    .loc-section-arrow { font-size: 13px; color: #bbb; transition: transform 0.2s; flex-shrink: 0; }
    .loc-section.is-open .loc-section-arrow { transform: rotate(180deg); }
    .loc-section-body {
      display: none;
      padding: 10px 14px 14px;
      border-top: 1px solid #e8e0d8;
      background: #fff;
    }
    .loc-section.is-open .loc-section-body { display: block; }
    .loc-game-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .loc-game-chip {
      font-size: 13px;
      padding: 5px 11px;
      border-radius: 20px;
      background: #f0ebe5;
      color: #333;
      cursor: pointer;
      white-space: nowrap;
      line-height: 1.3;
    }
    .loc-game-chip:active { background: #e4dcd4; }
    .loc-empty { color: #bbb; font-size: 13px; padding: 2px 0; }
    .loc-game-chip--highlight { background: #fbecd8; color: #7a4828; font-weight: 700; border: 1.5px solid #d4a878; }

    .loc-section-divider {
      margin: 10px 0 6px;
      font-size: 11px;

      letter-spacing: 0.05em;
      color: #bbb;
      text-transform: uppercase;
    }

  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    if (params.get('embed') === '1') document.body.classList.add('embed-mode');

    const SECTIONS = [
      { id: 'party',          code: 'A',   label: '파티게임',           sub: false },
      { id: 'dexterity',      code: 'A-1', label: '몸으로 하는 게임',   sub: true  },
      { id: 'popular',        code: 'A-2', label: '대중적인 게임',       sub: true  },
      { id: 'poker_mahjong',  code: 'A-3', label: '포커칩·마작패',      sub: true,  items: [] },
      { id: 'display',        code: 'A-4', label: '전시된 게임',         sub: true  },
      { id: 'toy',            code: 'A-5', label: '장난감',             sub: true,  items: [] },
      { id: 'puzzle_1000',    code: 'A-6', label: '1000피스 직소퍼즐',  sub: true,  items: [] },
      { id: 'lost_found',     code: 'A-7', label: '고객분실물',         sub: true,  items: [] },
      { id: 'light_family',   code: 'B',   label: '라이트패밀리게임',   sub: false },
      { id: 'easy_coop',      code: 'B-1', label: '쉬운 협력게임',      sub: true  },
      { id: 'heavy_strategy', code: 'C',   label: '헤비 전략게임',      sub: false },
      { id: 'hard_coop',      code: 'C-1', label: '어려운 협력게임',    sub: true  },
      { id: 'mini_box',       code: 'D',   label: '작은상자게임',       sub: false },
      { id: 'two_player_best',code: 'E',   label: '2인 베스트게임',     sub: false },
      { id: 'murder_mystery', code: 'F',   label: '머더미스터리',       sub: false },
      { id: 'escape_room',    code: 'F-1', label: '방탈출',             sub: true  },
      { id: 'incoming',       code: 'Z',   label: '발매후 도착예정',      sub: false },
      { id: 'shipping',       code: 'Z-1', label: '배송중',              sub: true  },
      { id: 'to_buy',         code: 'Z-2', label: '구매예정',            sub: true  },
    ];

    const SECTION_MAP = {};
    SECTIONS.forEach(s => { SECTION_MAP[s.id] = s; });

    function getCode(id) {
      return SECTION_MAP[id] ? SECTION_MAP[id].code : null;
    }
    function getLabel(id) {
      return SECTION_MAP[id] ? SECTION_MAP[id].label : (id || '-');
    }

    function getActiveGames() {
      if (!window.gameData) return [];
      return Object.values(window.gameData).filter(g => g.cottage?.status === 'active');
    }

    function resolveShelfId(g) {
      const id = g.cottage?.shelfGroupId;
      if (id === '협력') {
        const w = g.bgg?.weight;
        return (w && w >= 2.5) ? 'hard_coop' : 'easy_coop';
      }
      return id;
    }

    function buildGroupMap(games) {
      const map = {};
      for (const g of games) {
        const id = resolveShelfId(g);
        if (!id) continue;
        if (!map[id]) map[id] = [];
        map[id].push(g);
      }
      return map;
    }

    function sortByName(arr) {
      return arr.slice().sort((a, b) =>
        (a.title?.display || a.id).localeCompare(b.title?.display || b.id, 'ko')
      );
    }

    function openGame(id) {
      const decoded = decodeURIComponent(id);
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'openGame', gameId: decoded }, '*');
        return;
      }
      if (typeof window.ensureGameSheet === 'function') window.ensureGameSheet();
      if (typeof window.openGameSheet === 'function') {
        window.openGameSheet(decoded);
      }
    }

    window._locOpenGame = openGame;

    function renderSections(groupMap, highlightId) {
      const container = document.getElementById('locSections');
      if (!container) return;

      const knownIds = new Set(SECTIONS.map(s => s.id));
      const unknownIds = Object.keys(groupMap).filter(id => !knownIds.has(id));

      let html = SECTIONS.map(s => {
        let games = sortByName(groupMap[s.id] || []);
        if (highlightId) {
          const hi = games.find(g => g.id === highlightId);
          if (hi) games = [hi, ...games.filter(g => g.id !== hi.id)];
        }
        const manualItems = s.items || [];
        const modClass = s.sub ? 'loc-section--sub' : '';
        const series = s.code.split('-')[0];
        const Z_EMPTY = { incoming: '현재 발매후 도착예정인 게임이 없습니다.', shipping: '현재 배송중인 게임이 없습니다.', to_buy: '현재 구매예정인 게임이 없습니다.' };
        const ALWAYS_COUNT = new Set(['toy', 'puzzle_1000', 'lost_found', 'poker_mahjong']);
        const gameChips = games.map(g => `<span class="loc-game-chip" data-game-id="${encodeURIComponent(g.id)}" onclick="window._locOpenGame('${encodeURIComponent(g.id)}')">${g.title?.display || g.id}</span>`).join('');
        const manualChips = manualItems.map(name => `<span class="loc-game-chip" style="cursor:default">${name}</span>`).join('');
        const emptyMsg = Z_EMPTY[s.id] || '매장 내 확인 바랍니다';
        const chips = (gameChips || manualChips)
          ? (gameChips + manualChips)
          : `<span class="loc-empty">${emptyMsg}</span>`;

        return `
          <div class="loc-section ${modClass} loc-series-${series}" data-section-id="${s.id}">
            <div class="loc-section-header" onclick="this.closest('.loc-section').classList.toggle('is-open')">
              <span class="loc-section-code">${s.code}</span>
              <div class="loc-section-info">
                <div class="loc-section-label">${s.label}</div>
                <div class="loc-section-count">${(() => { const n = games.length + manualItems.length; if (n > 0) return n + '개'; if (Z_EMPTY[s.id]) return '없음'; if (ALWAYS_COUNT.has(s.id)) return '0개'; return '매장 내 확인'; })()}</div>
              </div>
              <span class="loc-section-arrow">▾</span>
            </div>
            <div class="loc-section-body">
              <div class="loc-game-list">${chips}</div>
            </div>
          </div>
        `;
      }).join('');

      if (unknownIds.length > 0) {
        const otherGames = unknownIds.flatMap(id => groupMap[id] || []);
        const chips = sortByName(otherGames)
          .map(g => `<span class="loc-game-chip" onclick="window._locOpenGame('${encodeURIComponent(g.id)}')">${g.title?.display || g.id}</span>`)
          .join('');

        html += `
          <div class="loc-section loc-section--inactive">
            <div class="loc-section-header" onclick="this.closest('.loc-section').classList.toggle('is-open')">
              <span class="loc-section-code" style="background:#bbb">기타</span>
              <div class="loc-section-info">
                <div class="loc-section-label">비치 위치 미정 · 카운터 문의</div>
                <div class="loc-section-count">${otherGames.length}종</div>
              </div>
              <span class="loc-section-arrow">▾</span>
            </div>
            <div class="loc-section-body">
              <div class="loc-game-list">${chips}</div>
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function renderSearch(query, games) {
      const el = document.getElementById('locSearchResults');
      if (!el) return;

      if (!query.trim()) { el.innerHTML = ''; return; }

      const q = query.trim().toLowerCase();
      const matches = games.filter(g => {
        const display = (g.title?.display || g.id).toLowerCase();
        const bgg = (g.title?.bgg || '').toLowerCase();
        return display.includes(q) || bgg.includes(q);
      }).slice(0, 20);

      if (!matches.length) {
        el.innerHTML = `<div class="loc-empty" style="padding:10px 0">검색 결과 없음</div>`;
        return;
      }

      el.innerHTML = matches.map(g => {
        const id = resolveShelfId(g);
        const code = getCode(id);
        const label = getLabel(id);
        const badgeClass = code
          ? (SECTION_MAP[id]?.sub ? 'loc-code-badge loc-code-badge--sub' : 'loc-code-badge')
          : 'loc-code-badge loc-code-badge--none';
        const badgeText = code || '?';
        return `
          <div class="loc-result-item" onclick="window._locOpenGame('${encodeURIComponent(g.id)}')">
            <span class="${badgeClass}">${badgeText}</span>
            <span class="loc-result-name">${g.title?.display || g.id}</span>
            <span class="loc-result-section">${label}</span>
          </div>
        `;
      }).join('');
    }

    function init() {
      const games = getActiveGames();
      const groupMap = buildGroupMap(games);
      const highlightId = params.get('highlight') ? decodeURIComponent(params.get('highlight')) : null;

      renderSections(groupMap, highlightId);

      const input = document.getElementById('locSearchInput');
      if (input) {
        input.addEventListener('input', function () {
          renderSearch(this.value, games);
        });
      }

      const shelfParam = params.get('shelf');
      if (shelfParam) {
        const el = document.querySelector(`[data-section-id="${shelfParam}"]`);
        if (el) {
          el.classList.add('is-open');
          setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 150);
        }
      }

      if (highlightId) {
        const chip = document.querySelector(`.loc-game-chip[data-game-id="${encodeURIComponent(highlightId)}"]`);
        if (chip) chip.classList.add('loc-game-chip--highlight');
      }
    }

    if (window.gameData) {
      init();
    } else {
      window.addEventListener('DOMContentLoaded', function () {
        if (window.gameData) init();
      });
    }
  })();
  </script>
