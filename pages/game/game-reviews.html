<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>플레이 기록 | 코티지보드</title>
  <meta name="description" content="코티지보드에서 플레이한 게임을 기록하고 후기를 남겨보세요. 모임별·게임별 플레이 기록 조회.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="플레이 기록 | 코티지보드">
  <meta property="og:description" content="코티지보드에서 플레이한 게임을 기록하고 후기를 남겨보세요. 모임별·게임별 플레이 기록 조회.">
  <meta property="og:image" content="https://cottageboard.com/assets/images/main/og-image.jpg">
  <meta property="og:url" content="https://cottageboard.com/pages/game/game-reviews.html">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
  <style>
    /* tabs */
    .pr-tabs { display: flex; border-bottom: 2px solid var(--border,#e8e4dc); margin-bottom: 20px; }
    .pr-tab { flex: 1; padding: 10px 4px; font-size: 14px; font-weight: 700; color: var(--muted); background: none; border: none; border-bottom: 3px solid transparent; cursor: pointer; margin-bottom: -2px; }
    .pr-tab.is-active { color: #7a4828; border-bottom-color: #7a4828; }
    .pr-panel { display: none; }
    .pr-panel.is-active { display: block; }

    /* input form */
    .pr-field-label { font-size: 11px; color: var(--muted); margin-bottom: 3px; display: block; }
    .pr-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .pr-meta-grid input { border: 1px solid var(--border,#e8e4dc); border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit; background: var(--card-bg,#fff); width: 100%; box-sizing: border-box; }
    .pr-add-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; background: #7a4828; color: #fff; border: none; border-radius: 8px; padding: 9px 14px; font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 12px; }
    .pr-add-btn:hover { opacity: 0.85; }
    .pr-game-rows { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .pr-game-row { background: var(--card-bg,#fff); border: 1px solid var(--border,#e8e4dc); border-radius: 10px; padding: 12px; }
    .pr-row-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .pr-row-head input { flex: 1; border: 1px solid var(--border,#e8e4dc); border-radius: 7px; padding: 7px 10px; font-size: 14px; font-family: inherit; background: var(--bg,#f5f0e8); }
    .pr-rm-btn { background: none; border: none; font-size: 18px; color: var(--muted); cursor: pointer; padding: 2px 6px; flex-shrink: 0; }
    .pr-rm-btn:hover { color: #c0392b; }
    .pr-same-as-above-btn { font-size: 11px; color: #7a4828; background: #f5ede6; border: 1px solid #d4a98a; border-radius: 6px; padding: 3px 10px; cursor: pointer; margin-bottom: 6px; font-family: inherit; }
    .pr-same-as-above-btn:hover { background: #ecddd4; }
    .pr-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .pr-detail-grid input { border: 1px solid var(--border,#e8e4dc); border-radius: 7px; padding: 7px 10px; font-size: 13px; font-family: inherit; background: var(--bg,#f5f0e8); width: 100%; box-sizing: border-box; }
    .pr-review-ta { width: 100%; box-sizing: border-box; border: 1px solid var(--border,#e8e4dc); border-radius: 7px; padding: 7px 10px; font-size: 13px; font-family: inherit; resize: vertical; min-height: 52px; margin-top: 6px; background: var(--bg,#f5f0e8); }
    .pr-submit-btn { width: 100%; background: #7a4828; color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .pr-submit-btn:disabled { opacity: 0.5; }
    .pr-login-notice { text-align: center; padding: 36px 0; color: var(--muted); font-size: 14px; }

    /* ═══════════════════════════════════════
       기록 보기 — 3단 계층 디자인
       1단: 모임/그룹 (짙은 차콜)
       2단: 날짜     (테라코타 강조)
       3단: 기록 행  (흰 카드)
    ═══════════════════════════════════════ */

    /* ▸ 1단계: 모임 헤더 */
    .pr-session { border: 1px solid #d8d0c6; border-radius: 14px; margin-bottom: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .pr-session-hd {
      width: 100%; display: flex; align-items: center; gap: 10px;
      padding: 14px 16px; border: none; cursor: pointer;
      text-align: left; font-family: inherit;
    }
    .pr-session > .pr-session-hd { background: #2c3e50; }
    .pr-session > .pr-session-hd:hover { background: #34495e; }
    .pr-session-date { font-size: 16px; font-weight: 900; color: #fff; flex-shrink: 0; letter-spacing: -0.3px; }

    .pr-session-summary { font-size: 12px; color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.13); border-radius: 20px; padding: 2px 9px; flex-shrink: 0; white-space: nowrap; font-weight: 600; }
    .pr-session-arrow { font-size: 15px; color: rgba(255,255,255,0.65); flex-shrink: 0; transition: transform 0.2s; margin-left: auto; }
    .pr-session-thumb { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; flex-shrink: 0; opacity: 0.92; }
    .pr-rec-thumb { width: 38px; height: 38px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
    /* 게임별 헤더 게임명 링크 */
    .pr-session-game-link { color: inherit; text-decoration: none; }
    .pr-session-game-link:hover { text-decoration: underline; text-underline-offset: 2px; }
    /* 모임별 기록 행 게임명 링크 */
    .pr-rec-game-link { color: inherit; text-decoration: none; }
    .pr-rec-game-link:hover { text-decoration: underline; text-underline-offset: 2px; }
    .pr-session.is-open .pr-session-arrow { transform: rotate(180deg); }
    .pr-session-body { display: none; background: var(--bg,#f5f0e8); }
    .pr-session.is-open .pr-session-body { display: block; }

    /* ▸ 3단계: 기록 행 */
    .pr-rec-row { display: flex; flex-direction: column; padding: 11px 16px; border-bottom: 1px solid #ece7de; gap: 0; background: #fff; }
    .pr-rec-row:last-child { border-bottom: none; }
    .pr-rec-row:hover { background: #fdfaf6; }
    .pr-rec-row-top { display: flex; align-items: center; gap: 8px; }
    .pr-rec-main { flex: 1; min-width: 0; }
    .pr-rec-game { font-size: 15px; font-weight: 800; color: #1a1a1a; margin-bottom: 2px; display: block; }
    .pr-rec-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .pr-rec-review { font-size: 13px; color: var(--text); margin: 6px 0 0; line-height: 1.6; white-space: pre-wrap; border-left: 3px solid #c8deda; padding-left: 10px; }
    .pr-rec-tag { font-size: 12px; background: var(--bg,#f5f0e8); border-radius: 6px; padding: 2px 8px; color: var(--text,#333); font-weight: 500; }
    .pr-tag-who  { background: #fdf0e8; color: #7a4828; }
    .pr-tag-who-first { border-bottom: 2px solid #455a64 !important; padding-bottom: 1px !important; }
    .pr-tag-count-game { background: #607d8b !important; color: #fff !important; font-weight: 600 !important; }
    .pr-tag-time { background: #e3f2fd; color: #1565c0; }
    .pr-tag-score{ background: #f5ede4; color: #8a4a20; }
    /* tag input */
    .tag-input-wrap { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; border: 1px solid var(--border,#e8e4dc); border-radius: 6px; padding: 4px 8px; background: #fff; min-height: 34px; cursor: text; box-sizing: border-box; width: 100%; }
    .tag-chip { display: inline-flex; align-items: center; gap: 3px; background: #e8f5e9; color: #2e7d32; border-radius: 4px; padding: 2px 7px; font-size: 12px; }
    .tag-chip-del { background: none; border: none; color: inherit; cursor: pointer; padding: 0 1px; font-size: 14px; line-height: 1; opacity: 0.6; }
    .tag-chip-del:hover { opacity: 1; }
    .tag-text-input { border: none; outline: none; font-size: 12px; flex: 1; min-width: 70px; background: transparent; padding: 0; }
    .pr-rec-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-top: 2px; }

    .pr-rec-del { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 5px; }
    .pr-rec-del:hover { color: #c0392b; }
    .pr-rec-edit { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 5px; }
    .pr-rec-edit:hover { color: #7a4828; }
    .pr-inline-edit { background: var(--bg,#f5f0e8); border-radius: 8px; padding: 10px; margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    .pr-inline-edit input, .pr-inline-edit textarea { font-size: 12px; border: 1px solid var(--border,#e8e4dc); border-radius: 5px; padding: 4px 8px; width: 100%; box-sizing: border-box; background: #fff; }
    .pr-inline-edit textarea { resize: vertical; min-height: 50px; }
    .pr-inline-edit-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .pr-inline-save { font-size: 12px; background: #7a4828; color: #fff; border: none; border-radius: 5px; padding: 4px 12px; cursor: pointer; }

    .pr-inline-cancel { font-size: 12px; background: none; border: 1px solid var(--border,#e8e4dc); border-radius: 5px; padding: 4px 10px; cursor: pointer; color: var(--muted); }
    .pr-player-header { padding:7px 16px; display:flex; flex-wrap:wrap; gap:5px; align-items:center; border-top:1px solid #e8e4dc; background:#ece7dc; }
    .pr-player-header:first-child { border-top:none; }
    .pr-player-header .pr-rec-tag { background:#fff; color:#4a3728; font-weight:700; font-size:12px; border-radius:20px; padding:2px 9px; border: 1px solid #d8d0c6; }
    .pr-tag-count { background:#37474f !important; color:#fff !important; border-color:#37474f !important; }
    .pr-tag-icon { filter: brightness(0) invert(1); display: inline-block; font-size: 11px; }
    .pr-rec-sheet-link { font-size:16px; text-decoration:none; color:var(--muted); padding:2px 3px; border-radius:5px; flex-shrink:0; }
    .pr-rec-sheet-link:hover { background:#e8f5e9; }
    .pr-rec-row--game { padding-left:14px; }
    /* 게임별 탭 — 모임+인원 그룹 */
    .pr-game-group { border-top:1px solid var(--border,#e8e4dc); }
    .pr-game-group:first-child { border-top:none; }
    .pr-game-group-hd { padding:7px 14px; background:#eceff1; display:flex; flex-wrap:wrap; gap:5px; align-items:center; border-left:3px solid #78909c; }
    .pr-game-group-moim { font-size:11px; font-weight:700; color:#fff; background:#455a64; border-radius:20px; padding:2px 9px; }
    .pr-game-group-hd .pr-rec-tag { background:#fff; color:#455a64; font-weight:600; border:1px solid #cfd8dc; }
    .pr-rec-game-line { display:flex; align-items:center; gap:8px; }
    .pr-rec-inline-meta { display:flex; flex-wrap:wrap; gap:4px; flex-shrink:0; }
    .pr-dates-more-btn { width:100%; padding:8px; background:none; border:none; border-top:1px dashed var(--border,#e8e4dc); font-size:12px; color:var(--muted); cursor:pointer; text-align:center; }
    .pr-dates-more-btn:hover { color:var(--green); }
    .pr-dates-more-body { display:none; }
    .pr-dates-more.is-open .pr-dates-more-body { display:block; }
    .pr-dates-more.is-open .pr-dates-more-btn { color:var(--green); }

    /* single game view (from bottom sheet ?game=) */
    .rv-item { background: var(--card-bg,#fff); border: 1px solid var(--border,#e8e4dc); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
    .rv-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }

    .rv-nick { font-size: 13px; font-weight: 700; color: var(--text); }
    .rv-date { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .rv-content { font-size: 14px; line-height: 1.6; color: var(--text); white-space: pre-wrap; }
    .rv-del { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 6px; margin-left: 6px; }
    .rv-del:hover { color: #c0392b; }

    .rv-write-box { background: var(--card-bg,#fff); border: 1px solid var(--border,#e8e4dc); border-radius: 12px; padding: 14px; margin-bottom: 20px; }
    .rv-write-box textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--border,#e8e4dc); border-radius: 8px; padding: 10px; font-size: 14px; font-family: inherit; resize: vertical; min-height: 80px; }
    .rv-write-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
    .rv-submit-btn { background: var(--green); color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .rv-submit-btn:disabled { opacity: 0.5; }
    .rv-game-title { font-size: 18px; font-weight: 900; color: var(--green); margin: 0 0 4px; }
    .rv-section-title { font-size: 14px; font-weight: 700; color: var(--muted); margin: 0 0 12px; }

    /* toast */
    .pr-toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; border-radius: 22px; padding: 10px 24px; font-size: 14px; font-weight: 700; z-index: 9999; opacity: 0; transition: opacity 0.25s; pointer-events: none; white-space: nowrap; }
    .pr-toast.show { opacity: 1; }

    .pr-empty { text-align: center; color: var(--muted); font-size: 14px; padding: 36px 0; }

    /* game name autocomplete */
    .pr-autocomplete-wrap { position: relative; flex: 1; }
    .pr-autocomplete-list { position: absolute; top: calc(100% + 2px); left: 0; right: 0; background: var(--card-bg,#fff); border: 1px solid var(--border,#e8e4dc); border-radius: 6px; box-shadow: 0 3px 12px rgba(0,0,0,0.10); z-index: 200; max-height: 90px; overflow-y: auto; display: none; }
    .pr-autocomplete-list.is-open { display: block; }
    .pr-autocomplete-item { padding: 6px 10px; font-size: 12px; cursor: pointer; color: var(--text); border-bottom: 1px solid var(--border,#e8e4dc); }
    .pr-autocomplete-item:last-child { border-bottom: none; }
    .pr-autocomplete-item:hover, .pr-autocomplete-item.is-focused { background: var(--bg,#f5f0e8); }

    /* player count toggles */
    .pr-count-toggles { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
    .pr-count-btn { border: 1px solid var(--border,#e8e4dc); background: var(--card-bg,#fff); border-radius: 6px; padding: 5px 9px; font-size: 12px; cursor: pointer; font-family: inherit; color: var(--text); line-height: 1; }
    .pr-count-btn.is-on { background: var(--green); color: #fff; border-color: var(--green); }

    /* photo upload */
    .pr-photo-trigger { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; border: 1px dashed var(--border,#e8e4dc); border-radius: 7px; padding: 6px 10px; margin-top: 6px; box-sizing: border-box; }
    .pr-photo-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .pr-photo-item { position: relative; width: 80px; height: 80px; border-radius: 7px; overflow: hidden; flex-shrink: 0; }
    .pr-photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pr-photo-item-del { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1; }

    /* photo thumbnail in record row */
    .pr-rec-photo-wrap { display: flex; flex-wrap: nowrap; gap: 6px; margin-top: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; min-width: 0; max-width: 100%; }
    .pr-rec-photo-item { position: relative; flex-shrink: 0; }
    .pr-rec-photo { height: 80px; width: auto; border-radius: 6px; display: block; cursor: pointer; }
    .pr-rec-photo-del { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.55); color: #fff; border: none; border-radius: 4px; font-size: 10px; padding: 2px 6px; cursor: pointer; }
    .pr-rec-photo-more { height: 80px; min-width: 52px; background: rgba(0,0,0,0.45); color: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0; }

    /* view toggle (모임별 / 게임별) */
    .pr-view-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
    .pr-vt-btn { flex: 1; padding: 8px; font-size: 13px; font-weight: 700; border: 1px solid var(--border,#e8e4dc); border-radius: 8px; background: var(--card-bg,#fff); color: var(--muted); cursor: pointer; font-family: inherit; }
    .pr-vt-btn.is-active { background: #7a4828; color: #fff; border-color: #7a4828; }

    /* ▸ 2단계: 날짜 헤더 — 테라코타 강조 */
    .pr-sub-session { border-top: 1px solid #e8e4dc; background: var(--bg,#f5f0e8); }
    .pr-sub-session:first-child { border-top: none; }
    .pr-sub-hd { width: 100%; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--bg,#f5f0e8); border: none; border-left: 4px solid transparent; cursor: pointer; text-align: left; font-family: inherit; }
    .pr-sub-hd:hover { background: #ece7dc; }
    .pr-sub-session.is-open > .pr-sub-hd { background: #f5f0e8; border-left-color: #9e3a2a; }
    .pr-sub-date { font-size: 15px; font-weight: 900; color: #2c3e50; flex-shrink: 0; }
    .pr-sub-session.is-open > .pr-sub-hd .pr-sub-date { color: #9e3a2a; }
    .pr-sub-summary { font-size: 12px; color: #8c7e6e; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pr-sub-arrow { font-size: 13px; color: #a09080; flex-shrink: 0; transition: transform 0.2s; margin-left: auto; }
    .pr-sub-session.is-open .pr-sub-arrow { transform: rotate(180deg); }
    .pr-sub-body { display: none; }
    .pr-sub-session.is-open .pr-sub-body { display: block; }
    /* 동호회 기록 보러가기 링크 */
    .pr-club-link-row { padding: 10px 14px; border-top: 1px dashed var(--border,#e8e4dc); text-align: center; }
    .pr-club-link { font-size: 12px; color: #7a4828; text-decoration: none; font-weight: 600; }
    .pr-club-link:hover { text-decoration: underline; }
    /* 단일 게임 뷰: 코멘트·따봉 이동 링크 */
    .rv-back-to-sheet { display: block; text-align: center; background: var(--bg,#f5f0e8); border: 1px solid var(--border,#e8e4dc); border-radius: 10px; padding: 11px 14px; font-size: 14px; font-weight: 700; color: var(--green); text-decoration: none; }
    .rv-back-to-sheet:hover { background: #ede8df; }

    /* 라이트박스 */
    .pr-lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    .pr-lightbox-img { max-width: 94vw; max-height: 88vh; object-fit: contain; border-radius: 6px; display: block; user-select: none; }
    .pr-lightbox-close { position: absolute; top: 14px; right: 16px; background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .pr-lightbox-close:hover { background: rgba(255,255,255,0.3); }
    .pr-lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .pr-lightbox-nav:hover { background: rgba(255,255,255,0.3); }
    .pr-lightbox-prev { left: 10px; }
    .pr-lightbox-next { right: 10px; }
    .pr-lightbox-counter { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.7); font-size: 13px; pointer-events: none; }
  </style>
</head>

<body class="owned-page">
  <header class="site-header">
    <a class="header-logo" href="../../index.html">
      <img src="../../assets/images/main/logo.png" alt="코티지보드 로고">
    </a>
    <a class="header-center" href="../../index.html">오래 머무르고 싶은, 보드게임 공간</a>
    <div class="header-actions">
      <button class="header-search" id="headerSearchButton" type="button" aria-label="게임 검색 열기"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg></button>
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="메뉴 열기">☰</button>
    </div>
