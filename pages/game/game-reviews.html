<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>플레이 기록 | 코티지보드</title>
  <meta name="description" content="코티지보드에서 플레이한 게임을 기록하고 후기를 남겨보세요. 모임별·게임별 플레이 기록 조회.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="플레이 기록 | 코티지보드">
  <meta property="og:description" content="코티지보드에서 플레이한 게임을 기록하고 후기를 남겨보세요. 모임별·게임별 플레이 기록 조회.">
  <meta property="og:image" content="https://cottageboard.com/assets/images/main/og-image.jpg">
  <meta property="og:url" content="https://cottageboard.com/pages/game/game-reviews.html">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
  <style>
    /* tabs */
    .pr-tabs { display: flex; border-bottom: 2px solid var(--border,#e8e4dc); margin-bottom: 20px; }
    .pr-tab { flex: 1; padding: 10px 4px; font-size: 14px; font-weight: 700; color: var(--muted); background: none; border: none; border-bottom: 3px solid transparent; cursor: pointer; margin-bottom: -2px; }
    .pr-tab.is-active { color: #7a4828; border-bottom-color: #7a4828; }
    .pr-panel { display: none; }
    .pr-panel.is-active { display: block; }

    /* input form */
    .pr-field-label { font-size: 11px; color: var(--muted); margin-bottom: 3px; display: block; }
    .pr-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .pr-meta-grid input { border: 1px solid var(--border,#e8e4dc); border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit; background: var(--card-bg,#fff); width: 100%; box-sizing: border-box; }
    .pr-add-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; background: #7a4828; color: #fff; border: none; border-radius: 8px; padding: 9px 14px; font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 12px; }
    .pr-add-btn:hover { opacity: 0.85; }
    .pr-game-rows { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .pr-game-row { background: var(--card-bg,#fff); border: 1px solid var(--border,#e8e4dc); border-radius: 10px; padding: 12px; }
    .pr-row-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .pr-row-head input { flex: 1; border: 1px solid var(--border,#e8e4dc); border-radius: 7px; padding: 7px 10px; font-size: 14px; font-family: inherit; background: var(--bg,#f5f0e8); }
    .pr-rm-btn { background: none; border: none; font-size: 18px; color: var(--muted); cursor: pointer; padding: 2px 6px; flex-shrink: 0; }
    .pr-rm-btn:hover { color: #c0392b; }
    .pr-same-as-above-btn { font-size: 11px; color: #7a4828; background: #f5ede6; border: 1px solid #d4a98a; border-radius: 6px; padding: 3px 10px; cursor: pointer; margin-bottom: 6px; font-family: inherit; }
    .pr-same-as-above-btn:hover { background: #ecddd4; }
    .pr-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .pr-detail-grid input { border: 1px solid var(--border,#e8e4dc); border-radius: 7px; padding: 7px 10px; font-size: 13px; font-family: inherit; background: var(--bg,#f5f0e8); width: 100%; box-sizing: border-box; }
    .pr-review-ta { width: 100%; box-sizing: border-box; border: 1px solid var(--border,#e8e4dc); border-radius: 7px; padding: 7px 10px; font-size: 13px; font-family: inherit; resize: vertical; min-height: 52px; margin-top: 6px; background: var(--bg,#f5f0e8); }
    .pr-submit-btn { width: 100%; background: #7a4828; color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .pr-submit-btn:disabled { opacity: 0.5; }
    .pr-login-notice { text-align: center; padding: 36px 0; color: var(--muted); font-size: 14px; }

    /* ═══════════════════════════════════════
       기록 보기 — 3단 계층 디자인
       1단: 모임/그룹 (짙은 차콜)
       2단: 날짜     (테라코타 강조)
       3단: 기록 행  (흰 카드)
    ═══════════════════════════════════════ */

    /* ▸ 1단계: 모임 헤더 */
    .pr-session { border: 1px solid #d8d0c6; border-radius: 14px; margin-bottom: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .pr-session-hd {
      width: 100%; display: flex; align-items: center; gap: 10px;
      padding: 14px 16px; border: none; cursor: pointer;
      text-align: left; font-family: inherit;
    }
    .pr-session > .pr-session-hd { background: #2c3e50; }
    .pr-session > .pr-session-hd:hover { background: #34495e; }
    .pr-session-date { font-size: 16px; font-weight: 900; color: #fff; flex-shrink: 0; letter-spacing: -0.3px; }

    .pr-session-summary { font-size: 12px; color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.13); border-radius: 20px; padding: 2px 9px; flex-shrink: 0; white-space: nowrap; font-weight: 600; }
    .pr-session-arrow { font-size: 15px; color: rgba(255,255,255,0.65); flex-shrink: 0; transition: transform 0.2s; margin-left: auto; }
    .pr-session-thumb { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; flex-shrink: 0; opacity: 0.92; }
    .pr-rec-thumb { width: 38px; height: 38px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
    /* 게임별 헤더 게임명 링크 */
    .pr-session-game-link { color: inherit; text-decoration: none; }
    .pr-session-game-link:hover { text-decoration: underline; text-underline-offset: 2px; }
    /* 모임별 기록 행 게임명 링크 */
    .pr-rec-game-link { color: inherit; text-decoration: none; }
    .pr-rec-game-link:hover { text-decoration: underline; text-underline-offset: 2px; }
    .pr-session.is-open .pr-session-arrow { transform: rotate(180deg); }
    .pr-session-body { display: none; background: var(--bg,#f5f0e8); }
    .pr-session.is-open .pr-session-body { display: block; }

    /* ▸ 3단계: 기록 행 */
    .pr-rec-row { display: flex; flex-direction: column; padding: 11px 16px; border-bottom: 1px solid #ece7de; gap: 0; background: #fff; }
    .pr-rec-row:last-child { border-bottom: none; }
    .pr-rec-row:hover { background: #fdfaf6; }
    .pr-rec-row-top { display: flex; align-items: center; gap: 8px; }
    .pr-rec-main { flex: 1; min-width: 0; }
    .pr-rec-game { font-size: 15px; font-weight: 800; color: #1a1a1a; margin-bottom: 2px; display: block; }
    .pr-rec-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .pr-rec-review { font-size: 13px; color: var(--text); margin: 6px 0 0; line-height: 1.6; white-space: pre-wrap; border-left: 3px solid #c8deda; padding-left: 10px; }
    .pr-rec-tag { font-size: 12px; background: var(--bg,#f5f0e8); border-radius: 6px; padding: 2px 8px; color: var(--text,#333); font-weight: 500; }
    .pr-tag-who  { background: #e8f5e9; color: #2e7d32; }
    .pr-tag-who-first { border-bottom: 2px solid #455a64 !important; padding-bottom: 1px !important; }
    .pr-tag-count-game { background: #607d8b !important; color: #fff !important; font-weight: 600 !important; }
    .pr-tag-time { background: #e3f2fd; color: #1565c0; }
    .pr-tag-score{ background: #fff3e0; color: #e65100; }
    /* tag input */
    .tag-input-wrap { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; border: 1px solid var(--border,#e8e4dc); border-radius: 6px; padding: 4px 8px; background: #fff; min-height: 34px; cursor: text; box-sizing: border-box; width: 100%; }
    .tag-chip { display: inline-flex; align-items: center; gap: 3px; background: #e8f5e9; color: #2e7d32; border-radius: 4px; padding: 2px 7px; font-size: 12px; }
    .tag-chip-del { background: none; border: none; color: inherit; cursor: pointer; padding: 0 1px; font-size: 14px; line-height: 1; opacity: 0.6; }
    .tag-chip-del:hover { opacity: 1; }
    .tag-text-input { border: none; outline: none; font-size: 12px; flex: 1; min-width: 70px; background: transparent; padding: 0; }
    .pr-rec-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-top: 2px; }

    .pr-rec-del { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 5px; }
    .pr-rec-del:hover { color: #c0392b; }
    .pr-rec-edit { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 5px; }
    .pr-rec-edit:hover { color: #7a4828; }
    .pr-inline-edit { background: var(--bg,#f5f0e8); border-radius: 8px; padding: 10px; margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    .pr-inline-edit input, .pr-inline-edit textarea { font-size: 12px; border: 1px solid var(--border,#e8e4dc); border-radius: 5px; padding: 4px 8px; width: 100%; box-sizing: border-box; background: #fff; }
    .pr-inline-edit textarea { resize: vertical; min-height: 50px; }
    .pr-inline-edit-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .pr-inline-save { font-size: 12px; background: #7a4828; color: #fff; border: none; border-radius: 5px; padding: 4px 12px; cursor: pointer; }

    .pr-inline-cancel { font-size: 12px; background: none; border: 1px solid var(--border,#e8e4dc); border-radius: 5px; padding: 4px 10px; cursor: pointer; color: var(--muted); }
    .pr-player-header { padding:7px 16px; display:flex; flex-wrap:wrap; gap:5px; align-items:center; border-top:1px solid #e8e4dc; background:#ece7dc; }
    .pr-player-header:first-child { border-top:none; }
    .pr-player-header .pr-rec-tag { background:#fff; color:#4a3728; font-weight:700; font-size:12px; border-radius:20px; padding:2px 9px; border: 1px solid #d8d0c6; }
    .pr-tag-count { background:#37474f !important; color:#fff !important; border-color:#37474f !important; }
    .pr-tag-icon { filter: brightness(0) invert(1); display: inline-block; font-size: 11px; }
    .pr-rec-sheet-link { font-size:16px; text-decoration:none; color:var(--muted); padding:2px 3px; border-radius:5px; flex-shrink:0; }
    .pr-rec-sheet-link:hover { background:#e8f5e9; }
    .pr-rec-row--game { padding-left:14px; }
    /* 게임별 탭 — 모임+인원 그룹 */
    .pr-game-group { border-top:1px solid var(--border,#e8e4dc); }
    .pr-game-group:first-child { border-top:none; }
    .pr-game-group-hd { padding:7px 14px; background:#eceff1; display:flex; flex-wrap:wrap; gap:5px; align-items:center; border-left:3px solid #78909c; }
    .pr-game-group-moim { font-size:11px; font-weight:700; color:#fff; background:#455a64; border-radius:20px; padding:2px 9px; }
    .pr-game-group-hd .pr-rec-tag { background:#fff; color:#455a64; font-weight:600; border:1px solid #cfd8dc; }
    .pr-rec-game-line { display:flex; align-items:center; gap:8px; }
    .pr-rec-inline-meta { display:flex; flex-wrap:wrap; gap:4px; flex-shrink:0; }
    .pr-dates-more-btn { width:100%; padding:8px; background:none; border:none; border-top:1px dashed var(--border,#e8e4dc); font-size:12px; color:var(--muted); cursor:pointer; text-align:center; }
    .pr-dates-more-btn:hover { color:var(--green); }
    .pr-dates-more-body { display:none; }
    .pr-dates-more.is-open .pr-dates-more-body { display:block; }
    .pr-dates-more.is-open .pr-dates-more-btn { color:var(--green); }

    /* single game view (from bottom sheet ?game=) */
    .rv-item { background: var(--card-bg,#fff); border: 1px solid var(--border,#e8e4dc); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
    .rv-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }

    .rv-nick { font-size: 13px; font-weight: 700; color: var(--text); }
    .rv-date { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .rv-content { font-size: 14px; line-height: 1.6; color: var(--text); white-space: pre-wrap; }
    .rv-del { background: none; border: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 2px 6px; margin-left: 6px; }
    .rv-del:hover { color: #c0392b; }

    .rv-write-box { background: var(--card-bg,#fff); border: 1px solid var(--border,#e8e4dc); border-radius: 12px; padding: 14px; margin-bottom: 20px; }
    .rv-write-box textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--border,#e8e4dc); border-radius: 8px; padding: 10px; font-size: 14px; font-family: inherit; resize: vertical; min-height: 80px; }
    .rv-write-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
    .rv-submit-btn { background: var(--green); color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .rv-submit-btn:disabled { opacity: 0.5; }
    .rv-game-title { font-size: 18px; font-weight: 900; color: var(--green); margin: 0 0 4px; }
    .rv-section-title { font-size: 14px; font-weight: 700; color: var(--muted); margin: 0 0 12px; }

    /* toast */
    .pr-toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; border-radius: 22px; padding: 10px 24px; font-size: 14px; font-weight: 700; z-index: 9999; opacity: 0; transition: opacity 0.25s; pointer-events: none; white-space: nowrap; }
    .pr-toast.show { opacity: 1; }

    .pr-empty { text-align: center; color: var(--muted); font-size: 14px; padding: 36px 0; }

    /* game name autocomplete */
    .pr-autocomplete-wrap { position: relative; flex: 1; }
    .pr-autocomplete-list { position: absolute; top: calc(100% + 2px); left: 0; right: 0; background: var(--card-bg,#fff); border: 1px solid var(--border,#e8e4dc); border-radius: 6px; box-shadow: 0 3px 12px rgba(0,0,0,0.10); z-index: 200; max-height: 90px; overflow-y: auto; display: none; }
    .pr-autocomplete-list.is-open { display: block; }
    .pr-autocomplete-item { padding: 6px 10px; font-size: 12px; cursor: pointer; color: var(--text); border-bottom: 1px solid var(--border,#e8e4dc); }
    .pr-autocomplete-item:last-child { border-bottom: none; }
    .pr-autocomplete-item:hover, .pr-autocomplete-item.is-focused { background: var(--bg,#f5f0e8); }

    /* player count toggles */
    .pr-count-toggles { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
    .pr-count-btn { border: 1px solid var(--border,#e8e4dc); background: var(--card-bg,#fff); border-radius: 6px; padding: 5px 9px; font-size: 12px; cursor: pointer; font-family: inherit; color: var(--text); line-height: 1; }
    .pr-count-btn.is-on { background: var(--green); color: #fff; border-color: var(--green); }

    /* photo upload */
    .pr-photo-trigger { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; border: 1px dashed var(--border,#e8e4dc); border-radius: 7px; padding: 6px 10px; margin-top: 6px; box-sizing: border-box; }
    .pr-photo-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .pr-photo-item { position: relative; width: 80px; height: 80px; border-radius: 7px; overflow: hidden; flex-shrink: 0; }
    .pr-photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pr-photo-item-del { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1; }

    /* photo thumbnail in record row */
    .pr-rec-photo-wrap { display: flex; flex-wrap: nowrap; gap: 6px; margin-top: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; min-width: 0; max-width: 100%; }
    .pr-rec-photo-item { position: relative; flex-shrink: 0; }
    .pr-rec-photo { height: 80px; width: auto; border-radius: 6px; display: block; cursor: pointer; }
    .pr-rec-photo-del { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.55); color: #fff; border: none; border-radius: 4px; font-size: 10px; padding: 2px 6px; cursor: pointer; }
    .pr-rec-photo-more { height: 80px; min-width: 52px; background: rgba(0,0,0,0.45); color: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0; }

    /* view toggle (모임별 / 게임별) */
    .pr-view-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
    .pr-vt-btn { flex: 1; padding: 8px; font-size: 13px; font-weight: 700; border: 1px solid var(--border,#e8e4dc); border-radius: 8px; background: var(--card-bg,#fff); color: var(--muted); cursor: pointer; font-family: inherit; }
    .pr-vt-btn.is-active { background: #7a4828; color: #fff; border-color: #7a4828; }

    /* ▸ 2단계: 날짜 헤더 — 테라코타 강조 */
    .pr-sub-session { border-top: 1px solid #e8e4dc; background: var(--bg,#f5f0e8); }
    .pr-sub-session:first-child { border-top: none; }
    .pr-sub-hd { width: 100%; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--bg,#f5f0e8); border: none; border-left: 4px solid transparent; cursor: pointer; text-align: left; font-family: inherit; }
    .pr-sub-hd:hover { background: #ece7dc; }
    .pr-sub-session.is-open > .pr-sub-hd { background: #f5f0e8; border-left-color: #9e3a2a; }
    .pr-sub-date { font-size: 15px; font-weight: 900; color: #2c3e50; flex-shrink: 0; }
    .pr-sub-session.is-open > .pr-sub-hd .pr-sub-date { color: #9e3a2a; }
    .pr-sub-summary { font-size: 12px; color: #8c7e6e; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pr-sub-arrow { font-size: 13px; color: #a09080; flex-shrink: 0; transition: transform 0.2s; margin-left: auto; }
    .pr-sub-session.is-open .pr-sub-arrow { transform: rotate(180deg); }
    .pr-sub-body { display: none; }
    .pr-sub-session.is-open .pr-sub-body { display: block; }
    /* 동호회 기록 보러가기 링크 */
    .pr-club-link-row { padding: 10px 14px; border-top: 1px dashed var(--border,#e8e4dc); text-align: center; }
    .pr-club-link { font-size: 12px; color: #7a4828; text-decoration: none; font-weight: 600; }
    .pr-club-link:hover { text-decoration: underline; }
    /* 단일 게임 뷰: 코멘트·따봉 이동 링크 */
    .rv-back-to-sheet { display: block; text-align: center; background: var(--bg,#f5f0e8); border: 1px solid var(--border,#e8e4dc); border-radius: 10px; padding: 11px 14px; font-size: 14px; font-weight: 700; color: var(--green); text-decoration: none; }
    .rv-back-to-sheet:hover { background: #ede8df; }

    /* 라이트박스 */
    .pr-lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    .pr-lightbox-img { max-width: 94vw; max-height: 88vh; object-fit: contain; border-radius: 6px; display: block; user-select: none; }
    .pr-lightbox-close { position: absolute; top: 14px; right: 16px; background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .pr-lightbox-close:hover { background: rgba(255,255,255,0.3); }
    .pr-lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .pr-lightbox-nav:hover { background: rgba(255,255,255,0.3); }
    .pr-lightbox-prev { left: 10px; }
    .pr-lightbox-next { right: 10px; }
    .pr-lightbox-counter { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.7); font-size: 13px; pointer-events: none; }
  </style>
</head>

<body class="owned-page">
  <header class="site-header">
    <a class="header-logo" href="../../index.html">
      <img src="../../assets/images/main/logo.png" alt="코티지보드 로고">
    </a>
    <a class="header-center" href="../../index.html">오래 머무르고 싶은, 보드게임 공간</a>
    <div class="header-actions">
      <button class="header-search" id="headerSearchButton" type="button" aria-label="게임 검색 열기"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg></button>
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="메뉴 열기">☰</button>
    </div>

  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const GAME_ID = params.get('game') || '';

    // ── helpers ─────────────────────────────────────────────────────

    function getGameName(id) {
      if (!id) return '알 수 없는 게임';
      if (window.COTTAGE_GAMES) {
        const g = window.COTTAGE_GAMES.find(g => String(g.bggId) === String(id) || g.id === id);
        if (g) return g.display || g.titleKo || g.titleEn || id;
      }
      return id;
    }

    function getGameKey(gameId) {
      if (!gameId || !window.gameData) return null;
      if (window.gameData[gameId]) return gameId;
      const entry = Object.entries(window.gameData).find(([, g]) => String(g.bgg?.id) === String(gameId));
      return entry ? entry[0] : null;
    }

    function gameIdByName(name) {
      if (!window.COTTAGE_GAMES || !name) return name;
      const found = window.COTTAGE_GAMES.find(g => {
        const label = g.display || g.titleKo || g.titleEn || '';
        return label.trim() === name.trim();
      });
      return found ? String(found.bggId) : name;
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function todayKst() {
      return new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
    }

    function formatKstDate(d) {
      if (!d || d === '?') return d;
      const [y, m, day] = d.split('-');
      return `${y}년 ${Number(m)}월 ${Number(day)}일`;
    }

    // 한글 초성 검색 지원
    const INITIALS = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
    function toInitials(str) {
      return [...str].map(ch => {
        const code = ch.charCodeAt(0);
        return (code >= 0xAC00 && code <= 0xD7A3)
          ? INITIALS[Math.floor((code - 0xAC00) / 28 / 21)]
          : ch;
      }).join('');
    }
    function hangulMatch(target, query) {
      const t = target.toLowerCase();
      const q = query.toLowerCase();
      if (t.includes(q)) return true;
      if (/^[ㄱ-ㅎ]+$/.test(q)) return toInitials(target).includes(q);
      return false;
    }

    // photo_url 파싱: JSON 배열 문자열 또는 단일 URL 모두 처리해 URL 배열 반환
    function parsePhotoUrls(raw) {
      if (!raw) return [];
      if (raw.trimStart().startsWith('[')) {
        try { return JSON.parse(raw).filter(Boolean); } catch (_) {}
      }
      return [raw];
    }

    // 사진 썸네일 HTML 생성 — 최대 3장 표시, 초과 시 +N장 배지
    function buildPhotoHtml(photoUrls, recordId, canDelPhoto) {
      if (!photoUrls.length) return '';
      const show = photoUrls.slice(0, 3);
      const more = photoUrls.length - 3;
      const allAttr = escH(JSON.stringify(photoUrls));
      return `<div class="pr-rec-photo-wrap" data-urls="${allAttr}">
        ${show.map((u, i) => `<div class="pr-rec-photo-item"><img class="pr-rec-photo" src="${escH(u)}" alt="사진" loading="lazy" data-idx="${i}">${canDelPhoto ? `<button class="pr-rec-photo-del" data-id="${recordId}" data-url="${escH(u)}" type="button">×</button>` : ''}</div>`).join('')}
        ${more > 0 ? `<div class="pr-rec-photo-more" data-idx="3">+${more}장</div>` : ''}
      </div>`;
    }

    // 공용 자동완성 — listRef: 기존 .pr-autocomplete-list 엘리먼트 또는 부모 컨테이너
    // onSelect: 항목 선택 시 input.value 대신 실행할 콜백 (태그칩 등)
    function attachAc(input, getSuggestions, onSelect, listRef) {
      let list, focusedIdx = -1;
      if (listRef && listRef.classList.contains('pr-autocomplete-list')) {
        list = listRef;
      } else if (listRef) {
        list = document.createElement('div');
        list.className = 'pr-autocomplete-list';
        listRef.style.position = 'relative';
        listRef.appendChild(list);
      } else {
        const wrap = document.createElement('div');
        wrap.style.cssText = 'position:relative';
        input.parentNode.insertBefore(wrap, input);
        wrap.appendChild(input);
        list = document.createElement('div');
        list.className = 'pr-autocomplete-list';
        wrap.appendChild(list);
      }
      function render(matches) {
        list.innerHTML = ''; focusedIdx = -1;
        if (!matches.length) { list.classList.remove('is-open'); return; }
        matches.forEach(s => {
          const item = document.createElement('div');
          item.className = 'pr-autocomplete-item'; item.textContent = s;
          item.addEventListener('mousedown', e => {
            e.preventDefault();
            if (onSelect) { onSelect(s); } else { input.value = s; }
            list.classList.remove('is-open');
          });
          list.appendChild(item);
        });
        list.classList.add('is-open');
      }
      function updateFocus() {
        const items = [...list.querySelectorAll('.pr-autocomplete-item')];
        items.forEach((el, i) => el.classList.toggle('is-focused', i === focusedIdx));
        if (focusedIdx >= 0 && items[focusedIdx]) items[focusedIdx].scrollIntoView({ block: 'nearest' });
      }
      input.addEventListener('input', () => {
        const q = input.value.trim(), all = getSuggestions();
        render(q ? all.filter(s => hangulMatch(s, q)) : all.slice(0, 8));
      });
      input.addEventListener('focus', () => { const q = input.value.trim(), all = getSuggestions(); render(q ? all.filter(s => hangulMatch(s, q)) : all.slice(0, 8)); });
      input.addEventListener('keydown', e => {
        if (!list.classList.contains('is-open')) return;
        const items = [...list.querySelectorAll('.pr-autocomplete-item')];
        if (e.key === 'ArrowDown') { e.preventDefault(); focusedIdx = Math.min(focusedIdx + 1, items.length - 1); updateFocus(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); focusedIdx = Math.max(focusedIdx - 1, 0); updateFocus(); }
        else if (e.key === 'Enter' && focusedIdx >= 0) {
          e.preventDefault();
          const s = items[focusedIdx].textContent;
          // initTagInput보다 먼저 상태 초기화 — onSelect 내부 Enter dispatch 시 is-focused 없어야 함
          items.forEach(el => el.classList.remove('is-focused'));
          focusedIdx = -1;
          list.classList.remove('is-open');
          if (onSelect) { onSelect(s); } else { input.value = s; }
        } else if (e.key === 'Escape') { list.classList.remove('is-open'); }
      });
      input.addEventListener('blur', () => setTimeout(() => list.classList.remove('is-open'), 150));
    }

    // 공용 사진 그리드 아이템 추가 함수 — maxCount 미지정 시 제한 없음
    function buildPhotoItemAdder(grid, files, maxCount) {
      return async function(file) {
        if (maxCount && files.length >= maxCount) { alert(`사진은 최대 ${maxCount}장까지 추가할 수 있어요.`); return; }
        const resized = window.resizeImageFile ? await window.resizeImageFile(file) : file;
        files.push(resized);
        const item = document.createElement('div');
        item.className = 'pr-photo-item';
        item.dataset.idx = String(files.length - 1);
        const img = document.createElement('img');
        img.src = URL.createObjectURL(resized);
        img.style.cursor = 'pointer';
        img.addEventListener('click', e => {
          e.stopPropagation();
          const allImgs = [...grid.querySelectorAll('.pr-photo-item img')];
          openLightbox(allImgs.map(i => i.src), allImgs.indexOf(img));
        });
        const del = document.createElement('button');
        del.type = 'button'; del.className = 'pr-photo-item-del'; del.textContent = '×';
        del.addEventListener('click', () => {
          const i = parseInt(item.dataset.idx);
          files.splice(i, 1);
          item.remove();
          grid.querySelectorAll('.pr-photo-item').forEach((el, j) => el.dataset.idx = j);
        });
        item.append(img, del);
        grid.appendChild(item);
      };
    }

    // 라이트박스 — 이미지 전체화면, 좌우 스와이프/키보드 지원, 등록폼·기록 보기 공용
    function openLightbox(urls, startIdx) {
      if (!urls.length) return;
      let cur = ((startIdx || 0) + urls.length) % urls.length;

      const lb = document.createElement('div');
      lb.className = 'pr-lightbox';

      const img = document.createElement('img');
      img.className = 'pr-lightbox-img';
      img.addEventListener('click', e => e.stopPropagation());

      const close = document.createElement('button');
      close.className = 'pr-lightbox-close'; close.type = 'button'; close.textContent = '✕';

      const prev = document.createElement('button');
      prev.className = 'pr-lightbox-nav pr-lightbox-prev'; prev.type = 'button'; prev.textContent = '‹';

      const next = document.createElement('button');
      next.className = 'pr-lightbox-nav pr-lightbox-next'; next.type = 'button'; next.textContent = '›';

      const counter = document.createElement('div');
      counter.className = 'pr-lightbox-counter';

      function show(idx) {
        cur = ((idx % urls.length) + urls.length) % urls.length;
        img.src = urls[cur];
        const multi = urls.length > 1;
        prev.style.display = multi ? '' : 'none';
        next.style.display = multi ? '' : 'none';
        counter.textContent = multi ? `${cur + 1} / ${urls.length}` : '';
      }

      function closeLb() { document.removeEventListener('keydown', onKey); lb.remove(); }

      prev.addEventListener('click', e => { e.stopPropagation(); show(cur - 1); });
      next.addEventListener('click', e => { e.stopPropagation(); show(cur + 1); });
      close.addEventListener('click', closeLb);
      lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });

      let touchStartX = 0;
      lb.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
      lb.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 40) show(dx < 0 ? cur + 1 : cur - 1);
      }, { passive: true });

      function onKey(e) {
        if (e.key === 'ArrowRight') show(cur + 1);
        else if (e.key === 'ArrowLeft') show(cur - 1);
        else if (e.key === 'Escape') closeLb();
      }
      document.addEventListener('keydown', onKey);

      lb.append(close, prev, img, next, counter);
      document.body.appendChild(lb);
      show(cur);
    }

    // 공용 태그칩 입력 초기화 — 등록폼/수정폼 공용
    function initTagInput(wrap, hidden, initialValue) {
      if (!wrap) return;
      const chips = wrap.querySelector('.tag-chips');
      const text = wrap.querySelector('.tag-text-input');
      function updateHidden() {
        hidden.value = [...chips.querySelectorAll('.tag-chip')].map(c => c.dataset.val).join(', ');
      }
      function addTag(val) {
        val = val.trim();
        if (!val) return;
        const chip = document.createElement('span');
        chip.className = 'tag-chip';
        chip.dataset.val = val;
        chip.innerHTML = escH(val) + '<button type="button" class="tag-chip-del">×</button>';
        chip.querySelector('.tag-chip-del').addEventListener('click', () => { chip.remove(); updateHidden(); });
        chips.appendChild(chip);
        updateHidden();
      }
      function triggerRefresh() {
        text.dispatchEvent(new Event('input', { bubbles: true }));
      }
      text.addEventListener('keydown', e => {
        if (e.key === ' ' || e.key === 'Enter') {
          // 자동완성 아이템이 포커스된 경우 attachAc에 양보
          if (wrap.querySelector('.pr-autocomplete-item.is-focused')) { e.preventDefault(); return; }
          e.preventDefault();
          const v = text.value.trim();
          if (v) { addTag(v); text.value = ''; triggerRefresh(); text.focus(); }
        } else if (e.key === 'Backspace' && !text.value) {
          const last = chips.querySelector('.tag-chip:last-child');
          if (last) { last.remove(); updateHidden(); }
        }
      });
      // blur 시 미등록 텍스트 유지 — Enter/Space로만 등록
      wrap.addEventListener('click', () => text.focus());
      if (initialValue) initialValue.split(',').forEach(v => addTag(v));
    }

    // 참여자 이름 정규화 — 그룹핑 키 전용 (가나다순 정렬)
    function normalizeNames(raw) {
      if (!raw) return null;
      const parts = raw.split(',').map(s => s.trim()).filter(Boolean);
      if (!parts.length) return null;
      return parts.sort((a, b) => a.localeCompare(b, 'ko')).join(', ');
    }

    // 입력자를 맨 앞으로 — 신규 저장 전용
    function putSelfFirst(names, selfNick) {
      if (!names || !selfNick) return names;
      const parts = names.split(',').map(s => s.trim()).filter(Boolean);
      const idx = parts.findIndex(n => n.toLowerCase() === selfNick.toLowerCase());
      if (idx > 0) { const [me] = parts.splice(idx, 1); parts.unshift(me); }
      return parts.join(', ') || null;
    }

    function showToast(msg) {
      const t = document.getElementById('prToast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }



    // ── entry point ──────────────────────────────────────────────────

    const headerEl = document.getElementById('reviewPageHeader');
    const root = document.getElementById('reviewRoot');

    let tried = false;
    function tryInit() { if (tried) return; tried = true; GAME_ID ? initGameView() : initHub(); }
    window.addEventListener('kakao-auth-ready', tryInit);
    window.addEventListener('cottage-auth-changed', () => { if (!GAME_ID) renderInputPanel(); });
    setTimeout(tryInit, 1200);

    // ══════════════════════════════════════════════════════════════
    // HUB MODE (메인 플레이 기록 허브)
    // ══════════════════════════════════════════════════════════════

    function initHub() {
      document.title = '플레이 기록 | 코티지보드';
      // h1은 static HTML에 있음

      root.innerHTML = `
        <div class="pr-tabs">
          <button class="pr-tab is-active" data-tab="records">기록 보기</button>
          <button class="pr-tab" data-tab="input">기록 입력</button>
        </div>
        <div id="prPanelInput" class="pr-panel"></div>
        <div id="prPanelRecords" class="pr-panel is-active"></div>`;

      root.querySelectorAll('.pr-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          root.querySelectorAll('.pr-tab').forEach(t => t.classList.remove('is-active'));
          root.querySelectorAll('.pr-panel').forEach(p => p.classList.remove('is-active'));
          tab.classList.add('is-active');
          document.getElementById('prPanel' + cap(tab.dataset.tab)).classList.add('is-active');
          if (tab.dataset.tab === 'records') loadRecords();
        });
      });

      renderInputPanel();
      loadRecords();
    }

    function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

    // ── 기록 입력 탭 ─────────────────────────────────────────────

    async function renderInputPanel() {
      const panel = document.getElementById('prPanelInput');
      if (!panel) return;

      const user = window.getKakaoUser?.();
      if (!user) {
        panel.innerHTML = `<div class="pr-login-notice">
          <p>로그인하면 플레이 기록을 남길 수 있어요.</p>
          <button class="btn primary-btn" style="margin-top:14px;font-size:13px;padding:8px 18px;min-width:0" onclick="window.kakaoLogin?.()">카카오 로그인</button>
        </div>`;
        return;
      }

      const groups = await window.CottageDB?.getGroupNames() || [];
      if (!groups.includes('코티지보드 동호회')) groups.unshift('코티지보드 동호회');
      window._prGroups = groups;
      window._prPlayerNames = await window.CottageDB?.getPlayerNames() || [];

      async function refreshAutocompleteLists() {
        const fresh = await window.CottageDB?.getGroupNames() || [];
        if (!fresh.includes('코티지보드 동호회')) fresh.unshift('코티지보드 동호회');
        window._prGroups = fresh;
        window._prPlayerNames = await window.CottageDB?.getPlayerNames() || [];
        window._refreshAutocompleteLists = refreshAutocompleteLists;
      }
      window._refreshAutocompleteLists = refreshAutocompleteLists;

      panel.innerHTML = `
        <div class="pr-meta-grid">
          <div>
            <label class="pr-field-label">날짜</label>
            <input type="date" id="prDate" value="${todayKst()}">
          </div>
          <div>
            <label class="pr-field-label">그룹명 (선택)</label>
            <div class="pr-autocomplete-wrap">
              <input type="text" id="prGroup" placeholder="동호회명 등" autocomplete="off">
              <div class="pr-autocomplete-list" id="prGroupAcList"></div>
            </div>
          </div>
        </div>

        <div class="pr-game-rows" id="prGameRows"></div>
        <button class="pr-add-btn" id="prAddBtn" type="button">+ 게임 추가</button>
        <button class="pr-submit-btn" id="prSaveBtn" type="button">저장하기</button>`;

      let rowIdx = 0;

      function addRow(focusInput) {
        const div = document.createElement('div');
        div.className = 'pr-game-row';
        div.dataset.row = ++rowIdx;
        div.innerHTML = `
          <div class="pr-row-head">
            <div class="pr-autocomplete-wrap">
              <input type="text" class="pr-game-name" placeholder="게임명 검색" autocomplete="off">
              <div class="pr-autocomplete-list"></div>
            </div>
            <button class="pr-rm-btn" type="button" title="삭제">✕</button>
          </div>
          ${rowIdx > 1 ? `<button class="pr-same-as-above-btn" type="button">↑ 위와 동일 (인원·참여자)</button>` : ''}
          <div class="pr-detail-grid">
            <div>
              <label class="pr-field-label">인원수</label>
              <div class="pr-count-toggles">
                ${[1,2,3,4,5,6,7,8].map(n => `<button class="pr-count-btn" type="button" data-n="${n}">${n}명</button>`).join('')}
              </div>
            </div>
            <div>
              <label class="pr-field-label">플레이시간(분)</label>
              <input type="number" class="pr-time" placeholder="–" min="1">
            </div>
            <div>
              <label class="pr-field-label">참여자</label>
              <div class="tag-input-wrap pr-names-wrap">
                <div class="tag-chips"></div>
                <input type="text" class="tag-text-input" placeholder="이름 입력 후 엔터">
                <input type="hidden" class="pr-names">
              </div>
            </div>

    function renderGroupView(data, user) {
      // group_name → date → records[]
      const groups = new Map();
      for (const r of data) {
        const g = r.group_name || '';
        const d = r.played_at || r.created_at?.slice(0, 10) || '?';
        if (!groups.has(g)) groups.set(g, new Map());
        const dateMap = groups.get(g);
        if (!dateMap.has(d)) dateMap.set(d, []);
        dateMap.get(d).push(r);
      }

      let html = '';
      const sortedGroups = [...groups.entries()].sort((a, b) => {
        const latestA = Math.max(...[...a[1].keys()].map(d => new Date(d).getTime() || 0));
        const latestB = Math.max(...[...b[1].keys()].map(d => new Date(d).getTime() || 0));
        return latestB - latestA;
      });
      for (const [groupName, dateMap] of sortedGroups) {
        const label = groupName || '기타 기록';
        const totalGames = [...dateMap.values()].reduce((s, recs) => s + recs.length, 0);
        html += `<div class="pr-session">
          <button class="pr-session-hd" type="button">
            <span class="pr-session-date">${escH(label)}</span>
            <span class="pr-session-summary">${dateMap.size}회 · ${totalGames}게임</span>
            <span class="pr-session-arrow">▾</span>
          </button>
          <div class="pr-session-body">`;

        const MAX_DATES = 3;
        const sortedDates = [...dateMap.entries()].sort((a, b) => b[0].localeCompare(a[0]));
        const visibleDates = sortedDates.slice(0, MAX_DATES);
        const hiddenDates = sortedDates.slice(MAX_DATES);

        const renderDateBlock = ([dateStr, recs]) => {
          const gameNames = recs.map(r => getGameName(r.game_id));
          const summaryText = gameNames.slice(0, 3).join(', ') + (gameNames.length > 3 ? ` 외 ${gameNames.length - 3}개` : '');
          return `<div class="pr-sub-session">
            <button class="pr-sub-hd" type="button">
              <span class="pr-sub-date">${escH(formatKstDate(dateStr))}</span>
              <span class="pr-sub-summary">${escH(summaryText)}</span>
              <span class="pr-sub-arrow">▾</span>
            </button>
            <div class="pr-sub-body">${buildSessionBody(recs, user)}</div>
          </div>`;
        };

        html += visibleDates.map(renderDateBlock).join('');

        if (hiddenDates.length > 0) {
          html += `<div class="pr-dates-more">
            <div class="pr-dates-more-body">${hiddenDates.map(renderDateBlock).join('')}</div>
            <button class="pr-dates-more-btn" type="button">이전 ${hiddenDates.length}회 더 보기 ▾</button>
          </div>`;
        }

        if (groupName === '코티지보드 동호회') {
          html += `<div class="pr-club-link-row"><a class="pr-club-link" href="../club/club-history.html">📸 동호회 기록 &amp; 사진 게시판에서 보러가기 →</a></div>`;
        }

        html += `</div></div>`;
      }
      return html;
    }

    function renderGameView(data, user) {
      // game_id → records[]
      const games = new Map();
      for (const r of data) {
        if (!games.has(r.game_id)) games.set(r.game_id, []);
        games.get(r.game_id).push(r);
      }

      let html = '';
      for (const [gameId, recs] of games) {
        const gameName = getGameName(gameId);
        // 게임 썸네일 이미지
        const gKey = getGameKey(gameId) || gameId;
        const thumbUrl = window.gameData?.[gKey]?.images?.thumbnail || '';
        const thumbHtml = thumbUrl
          ? `<img class="pr-session-thumb" src="${escH(thumbUrl)}" alt="" loading="lazy" onerror="this.style.display='none'">`
          : '';
        const gameHref = gKey ? `../game/owned-games.html?open=${encodeURIComponent(gKey)}` : '';
        html += `<div class="pr-session">
          <button class="pr-session-hd" type="button">
            ${thumbHtml}
            <span class="pr-session-date">${gKey
              ? `<a class="pr-session-game-link" href="#" onclick="event.preventDefault();openGameSheet('${gKey.replace(/'/g,"\\'")}')">${escH(gameName)}</a>`
              : escH(gameName)}</span>
            <span class="pr-session-summary" style="font-size:${Math.min(11 + recs.length, 17)}px">${recs.length}회</span>
            <span class="pr-session-arrow">▾</span>
          </button>
          <div class="pr-session-body">${buildGameBody(recs, user)}</div>
        </div>`;
      }
      return html;
    }

    function buildSessionBody(recs, user) {
      // 참여자(인원+이름) 기준으로 묶기
      const playerGroups = new Map();
      for (const r of recs) {
        const key = `${r.player_count||''}|${normalizeNames(r.player_names)||''}`;
        if (!playerGroups.has(key)) playerGroups.set(key, []);
        playerGroups.get(key).push(r);
      }

      let html = '';
      for (const [, groupRecs] of playerGroups) {
        const first = groupRecs[0];
        const countTag = first.player_count ? `<span class="pr-rec-tag pr-tag-count"><span class="pr-tag-icon">👥</span> ${first.player_count}명</span>` : '';
        const nameTags = first.player_names
          ? first.player_names.split(',').map((n, i) => {
              const t = n.trim();
              return `<span class="pr-rec-tag pr-tag-who${i === 0 ? ' pr-tag-who-first' : ''}">${escH(t)}</span>`;
            }).join('')
          : '';

        if (countTag || nameTags) {
          html += `<div class="pr-player-header">${countTag}${nameTags}</div>`;
        }

        html += groupRecs.map(r => {
          const isMine = user && String(r.user_id) === String(user.id);
          const timeTag  = r.play_time_min ? `<span class="pr-rec-tag pr-tag-time">⏱ ${r.play_time_min}분</span>` : '';
          const scoreTag = r.score_note   ? `<span class="pr-rec-tag pr-tag-score">🏆 ${escH(r.score_note)}</span>` : '';
          const reviewHtml = r.review_text ? `<p class="pr-rec-review">${escH(r.review_text)}</p>` : '';
          const photoUrls = parsePhotoUrls(r.photo_url);
          const canDelPhoto = photoUrls.length && (isMine || window.isOwner?.());
          const photoHtml = buildPhotoHtml(photoUrls, r.id, canDelPhoto);
          const gameKey = getGameKey(r.game_id);
          const thumbUrl = gameKey ? (window.gameData?.[gameKey]?.images?.thumbnail || '') : '';
          const thumbHtml = thumbUrl ? `<img class="pr-rec-thumb" src="${escH(thumbUrl)}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';
          const isParticipant = user && (String(r.user_id) === String(user.id) || (r.player_names || '').split(',').map(n => n.trim()).some(n => n && n.toLowerCase() === (user.nickname || '').toLowerCase()));
          const sheetLink = (gameKey && isParticipant) ? `<a class="pr-rec-sheet-link" href="../game/owned-games.html?open=${encodeURIComponent(gameKey)}&scroll=comments" title="코멘트·따봉 남기기">💬👍</a>` : '';
          return `<div class="pr-rec-row pr-rec-row--game" data-id="${r.id}" data-record='${JSON.stringify({gameId: r.game_id||'', names: r.player_names||'', count: r.player_count||'', time: r.play_time_min||'', score: r.score_note||'', review: r.review_text||'', group: r.group_name||'', date: r.played_at||'', photo: r.photo_url||''})}'>
            <div class="pr-rec-row-top">
              ${thumbHtml}
              <div class="pr-rec-main">
                ${gameKey
                  ? `<a class="pr-rec-game pr-rec-game-link" href="#" onclick="event.preventDefault();openGameSheet('${gameKey.replace(/'/g,"\\'")}')">${escH(getGameName(r.game_id))}</a>`
                  : `<span class="pr-rec-game">${escH(getGameName(r.game_id))}</span>`}
                <div class="pr-rec-meta">${timeTag}${scoreTag}</div>
                ${reviewHtml}
              </div>
              <div class="pr-rec-actions">
                ${sheetLink}
                ${isMine ? `<button class="pr-rec-edit" data-id="${r.id}" type="button" title="수정">✏️</button>` : ''}
                ${isMine ? `<button class="pr-rec-del" data-id="${r.id}" type="button" title="삭제">✕</button>` : ''}
              </div>
            </div>
            ${photoHtml}
          </div>`;
        }).join('');
      }
      return html;
    }

    function buildGameBody(recs, user) {
      // group_name + player_count + player_names 동일 시 묶기
      const groups = new Map();
      for (const r of recs) {
        const key = `${r.group_name||''}|${r.player_count||''}|${normalizeNames(r.player_names)||''}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(r);
      }

      let html = '';
      let isFirst = true;
      for (const [, grp] of groups) {
        const f = grp[0];
        const groupLabel = f.group_name || '';
        const countTag = f.player_count ? `<span class="pr-rec-tag pr-tag-count-game">${f.player_count}명</span>` : '';
        const nameTags = f.player_names
          ? f.player_names.split(',').map((n, i) => {
              const t = n.trim();
              return `<span class="pr-rec-tag pr-tag-who${i === 0 ? ' pr-tag-who-first' : ''}">${escH(t)}</span>`;
            }).join('')
          : '';

        html += `<div class="pr-game-group${isFirst ? ' pr-game-group--first' : ''}">`;
        if (groupLabel || countTag || nameTags) {
          html += `<div class="pr-game-group-hd">
            ${groupLabel ? `<span class="pr-game-group-moim">${escH(groupLabel)}</span>` : ''}
            ${countTag}${nameTags}
          </div>`;
        }

        const sorted = [...grp].sort((a, b) => {
          const da = a.played_at || a.created_at?.slice(0, 10) || '';
          const db = b.played_at || b.created_at?.slice(0, 10) || '';
          return db.localeCompare(da);
        });

        html += sorted.map(r => {
          const isMine = user && String(r.user_id) === String(user.id);
          const date = r.played_at || r.created_at?.slice(0, 10) || '?';
          const timeTag  = r.play_time_min ? `<span class="pr-rec-tag pr-tag-time">⏱ ${r.play_time_min}분</span>` : '';
          const scoreTag = r.score_note   ? `<span class="pr-rec-tag pr-tag-score">🏆 ${escH(r.score_note)}</span>` : '';
          const reviewHtml = r.review_text ? `<p class="pr-rec-review">${escH(r.review_text)}</p>` : '';
          const photoUrls = parsePhotoUrls(r.photo_url);
          const canDelPhoto = photoUrls.length && (isMine || window.isOwner?.());
          const photoHtml = buildPhotoHtml(photoUrls, r.id, canDelPhoto);
          const gameKey = getGameKey(r.game_id);
          const isParticipant = user && (String(r.user_id) === String(user.id) || (r.player_names || '').split(',').map(n => n.trim()).some(n => n && n.toLowerCase() === (user.nickname || '').toLowerCase()));
          const sheetLink = (gameKey && isParticipant) ? `<a class="pr-rec-sheet-link" href="../game/owned-games.html?open=${encodeURIComponent(gameKey)}&scroll=comments" title="코멘트·따봉 남기기">💬👍</a>` : '';
          return `<div class="pr-rec-row" data-id="${r.id}" data-record='${JSON.stringify({gameId: r.game_id||'', names: r.player_names||'', count: r.player_count||'', time: r.play_time_min||'', score: r.score_note||'', review: r.review_text||'', group: r.group_name||'', date: r.played_at||'', photo: r.photo_url||''})}'>
            <div class="pr-rec-row-top">
              <div class="pr-rec-main">
                <div class="pr-rec-meta">
                  <span class="pr-rec-tag">${escH(formatKstDate(date))}</span>
                  ${timeTag}${scoreTag}
                </div>
                ${reviewHtml}
              </div>
              <div class="pr-rec-actions">
                ${sheetLink}
                ${isMine ? `<button class="pr-rec-edit" data-id="${r.id}" type="button" title="수정">✏️</button>` : ''}
                ${isMine ? `<button class="pr-rec-del" data-id="${r.id}" type="button" title="삭제">✕</button>` : ''}
              </div>
            </div>
            ${photoHtml}
          </div>`;
        }).join('');

        html += `</div>`;
        isFirst = false;
      }
      return html;
    }

    // ══════════════════════════════════════════════════════════════
    // SINGLE GAME VIEW (바텀시트에서 ?game=<id>로 진입)
    // ══════════════════════════════════════════════════════════════

    function initGameView() {
      const name = getGameName(GAME_ID);
      document.title = `${name} 플레이 기록 | 코티지보드`;

      const bc = document.getElementById('pageBreadcrumb');
      bc.innerHTML = `게임 찾기 &amp; 기록 <span>›</span> <a href="./game-reviews.html">플레이 기록</a> <span>›</span> ${escH(name)}`;

      headerEl.innerHTML = `<p class="rv-game-title">${escH(name)}</p>`;

      renderSingleGame();
    }

    async function renderSingleGame() {
      const cfg = window.SUPABASE_CONFIG;
      if (!cfg || !window.supabase) { root.innerHTML = '<p class="pr-empty">DB 연결 실패</p>'; return; }
      if (!window._cottageSupabaseDb) window._cottageSupabaseDb = window.supabase.createClient(cfg.url, cfg.anonKey);
      const db = window._cottageSupabaseDb;

      // hub와 동일한 컬럼 사용 (review_text 제외 — 컬럼 유무 불확실)
      let records = [];
      try {
        const { data, error } = await db.from('game_play_records')
          .select('id, game_id, user_id, nickname, player_count, player_names, play_time_min, score_note, group_name, played_at, photo_url, created_at')
          .eq('game_id', GAME_ID)
          .order('played_at', { ascending: false })
          .order('created_at', { ascending: false })
          .limit(50);
        if (error) console.warn('[renderSingleGame]', error);
        records = data || [];
      } catch (e) { console.warn('[renderSingleGame]', e); }

      const user = window.getKakaoUser?.();
      const gameKey = getGameKey(GAME_ID) || GAME_ID;

      const backToSheet = `<a class="rv-back-to-sheet" href="../game/owned-games.html?open=${encodeURIComponent(gameKey)}">💬 코멘트 · 👍 따봉 남기러 가기 →</a>`;

      const listHtml = records.length
        ? records.map(r => {
            const isMine = user && String(r.user_id) === String(user.id);
            const playedLabel = r.played_at ? formatKstDate(r.played_at) : formatDate(r.created_at);
            const countTag = r.player_count ? `<span class="pr-rec-tag pr-tag-who">👥 ${r.player_count}명</span>` : '';
            const timeTag  = r.play_time_min ? `<span class="pr-rec-tag pr-tag-time">⏱ ${r.play_time_min}분</span>` : '';
            const scoreTag = r.score_note ? `<span class="pr-rec-tag pr-tag-score">🏆 ${escH(r.score_note)}</span>` : '';
            const groupTag = r.group_name ? `<span class="pr-rec-tag" style="background:#e8f0ff;color:#5c6bc0">${escH(r.group_name)}</span>` : '';
            const namesTag = r.player_names ? `<span class="pr-rec-tag">${escH(r.player_names)}</span>` : '';
            const photoUrls = parsePhotoUrls(r.photo_url);
            const canDelPhoto = photoUrls.length && (isMine || window.isOwner?.());
            const photoHtml = buildPhotoHtml(photoUrls, r.id, canDelPhoto);
            return `<div class="rv-item" data-id="${r.id}">
              <div class="rv-head">
                <span class="rv-nick">${escH(r.nickname || '익명')}</span>
                <span style="display:flex;align-items:center;gap:6px">
                  <span class="rv-date">${playedLabel}</span>
                  ${isMine ? `<button class="rv-del" type="button">삭제</button>` : ''}
                </span>
              </div>
              <div class="pr-rec-meta" style="margin-bottom:4px">${groupTag}${countTag}${timeTag}${scoreTag}${namesTag}</div>
              ${photoHtml}
            </div>`;
          }).join('')
        : `<p class="pr-empty">아직 이 게임의 기록이 없어요.<br><small style="color:var(--muted)">바텀시트에서 '+ 기록하기'로 추가할 수 있어요.</small></p>`;

      root.innerHTML = `
        ${backToSheet}
        <div class="rv-section-title" style="margin-top:14px">플레이 기록 ${records.length}건</div>
        ${listHtml}`;

      root.querySelectorAll('.rv-del').forEach(btn => {
        btn.addEventListener('click', async () => {
          const item = btn.closest('.rv-item');
          if (!confirm('이 기록을 삭제할까요?')) return;
          const res = await window.CottageDB?.deleteGamePlay(item.dataset.id);
          if (!res?.error) item.remove();
        });
      });

      root.querySelectorAll('.pr-rec-photo').forEach(img => {
        img.addEventListener('click', e => {
          e.stopPropagation();
          const wrap = img.closest('.pr-rec-photo-wrap');
          try { openLightbox(JSON.parse(wrap.dataset.urls || '[]'), Number(img.dataset.idx || 0)); } catch(_) {}
        });
      });
      root.querySelectorAll('.pr-rec-photo-more').forEach(el => {
        el.addEventListener('click', e => {
          e.stopPropagation();
          const wrap = el.closest('.pr-rec-photo-wrap');
          try { openLightbox(JSON.parse(wrap.dataset.urls || '[]'), Number(el.dataset.idx || 3)); } catch(_) {}
        });
      });
    }

  })();
  </script>
