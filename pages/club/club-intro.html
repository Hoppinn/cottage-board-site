  <title>회원 자기소개 | 코티지보드 동호회</title>

<body class="owned-page">
  <script src="../../assets/js/header.js" data-index="false"></script>

  <main>
    <section class="inner-page">
      <div class="club-breadcrumb">
        <a class="club-breadcrumb-parent" href="./club.html#club-join">동호회</a>
        <span class="club-breadcrumb-sep">›</span>
        <span class="club-breadcrumb-current">회원 자기소개</span>
      </div>
      <div class="page-mini-hero page-mini-hero--club page-mini-hero--sm">
        <h1>회원 자기소개</h1>
      </div>
      <div class="inner-page-body">

        <!-- 비로그인 안내 -->
        <div class="intro-form-card" id="introLoginPrompt" style="display:none">
          <p class="intro-login-msg">자기소개를 남기려면 로그인이 필요해요. (모임 보드와 정보가 함께 연동돼요)</p>
          <button class="intro-submit-btn" onclick="document.getElementById('kakaoLoginBtn')?.click()" type="button">카카오 로그인</button>
        </div>

        <!-- 입력 폼 (로그인 시에만 노출) -->
        <div class="intro-form-card" id="introFormCard" style="display:none">
          <button class="intro-form-toggle" id="introFormToggle" type="button">
            반갑습니다! 간단히 소개해주세요 👋
            <span class="intro-form-toggle-arrow" id="introFormArrow">▾</span>
          </button>
          <div class="intro-form-body" id="introFormBody">
            <div class="intro-form-fields">
              <div class="intro-field">
                <label class="intro-label" for="introNickname">닉네임 <span class="intro-required">*</span></label>
                <input class="intro-input" id="introNickname" type="text" placeholder="단톡방 닉네임" maxlength="20">
              </div>
              <div class="intro-field">
                <label class="intro-label" for="introBio">한줄소개</label>
                <input class="intro-input" id="introBio" type="text" placeholder="나를 짧게 소개해보세요 (모임 보드와 공유돼요)" maxlength="60">
              </div>
              <div class="intro-field">
                <label class="intro-label" for="introGames">좋아하는 게임</label>
                <input class="intro-input" id="introGames" type="text" placeholder="ex. 윙스팬, 아줄, 코드네임" maxlength="100">
              </div>
              <div class="intro-field">
                <label class="intro-label" for="introAvailable">참여 가능 요일 / 시간</label>
                <input class="intro-input" id="introAvailable" type="text" placeholder="ex. 주말 오후, 평일 저녁 가능" maxlength="100">
              </div>
              <div class="intro-field">
                <label class="intro-label" for="introLocation">활동 지역</label>
                <input class="intro-input" id="introLocation" type="text" placeholder="ex. 용인, 수원, 성남, 서울 남부" maxlength="50">
              </div>
              <div class="intro-field">
                <label class="intro-label" for="introTravel">이동 가능 범위</label>
                <input class="intro-input" id="introTravel" type="text" placeholder="ex. 차로 30분 이내" maxlength="50">
              </div>
            </div>
            <button class="intro-submit-btn" id="introSubmitBtn" type="button">인사 남기기</button>
            <p class="intro-submit-msg" id="introSubmitMsg"></p>
          </div>
        </div>

        <!-- 카드뉴스 그리드 -->
        <div class="intro-card-grid" id="introList">
          <p class="intro-list-loading" style="grid-column:1/-1">불러오는 중...</p>
        </div>

      </div>
    </section>
  </main>

  <script src="../../game-system/config/bgg-label-map.js"></script>

  <script src="../../assets/js/supabase-client.js"></script>
  <script src="../../assets/js/achievements.js"></script>
  <script src="../../assets/js/page-labels.js"></script>
  <script src="../../assets/js/script-nav.js"></script>
  <script src="../../assets/js/game-sheet.js"></script>
  <script src="../../assets/js/play-records-utils.js"></script>

  <script>
  // 폼 접기/펼치기
  (function () {
    const toggle = document.getElementById('introFormToggle');
    const body   = document.getElementById('introFormBody');
    const arrow  = document.getElementById('introFormArrow');
    let open = false;
    body.style.display = 'none';
    arrow.textContent  = '▸';
    toggle.addEventListener('click', () => {
      open = !open;
      body.style.display = open ? '' : 'none';
      arrow.textContent  = open ? '▾' : '▸';
    });
  })();
  </script>

  <script>
  (function () {
    const cfg = window.SUPABASE_CONFIG;
    if (!cfg?.url || !window.supabase) return;
    if (!window._cottageSupabaseDb) window._cottageSupabaseDb = window.supabase.createClient(cfg.url, cfg.anonKey);
    const db = window._cottageSupabaseDb;

    const MY_KEY = 'cottage_my_intros';

    function escHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // 카드 컬러 팔레트 (bg, text, border)
    const CARD_PALETTE = [
      { key:'sage',  bg:'#eef5ee', text:'#3d5a3d', border:'#e2dcd6' },
      { key:'brown', bg:'#f4efe8', text:'#5a3a1a', border:'#e2dcd6' },
    ];

    function applyCardColor(cardEl, colorKey, idx) {
      const color = CARD_PALETTE.find(c => c.key === colorKey) || CARD_PALETTE[idx % CARD_PALETTE.length];
      cardEl.style.setProperty('--intro-head-bg', color.bg);
      cardEl.style.setProperty('--intro-head-text', color.text);
      cardEl.style.setProperty('--intro-border', color.border);
    }

    function formatDate(iso) {
      const d = new Date(iso);
      const kst = new Date(d.getTime() + 9 * 3600000);
      return `${kst.getUTCFullYear()}.${String(kst.getUTCMonth()+1).padStart(2,'0')}.${String(kst.getUTCDate()).padStart(2,'0')}`;
    }

    function isAdmin() { return window.isOwner?.() || false; }
    function getCurrentUser() { return window.getKakaoUser?.() || null; }

    // 자기소개 작성은 로그인 필수 (모임 보드와 user_id 기준으로 연동되기 때문)
    function _syncLoginUI() {
      const loggedIn = !!getCurrentUser();
      document.getElementById('introLoginPrompt').style.display = loggedIn ? 'none' : '';
      document.getElementById('introFormCard').style.display = loggedIn ? '' : 'none';
    }

    function getMyIds() {
      try { return JSON.parse(localStorage.getItem(MY_KEY) || '[]'); } catch { return []; }
    }
    function saveMyId(id) {
      const ids = getMyIds();
      if (!ids.includes(id)) { ids.push(id); localStorage.setItem(MY_KEY, JSON.stringify(ids)); }
    }
    function removeMyId(id) {
      localStorage.setItem(MY_KEY, JSON.stringify(getMyIds().filter(x => x !== id)));
    }

    function canDelete(r) {
      if (isAdmin()) return true;
      const u = getCurrentUser();
      if (u && r.user_id && String(r.user_id) === String(u.id)) return true;
      return getMyIds().includes(r.id);
    }

    async function deleteIntro(id) {
      if (!confirm('이 자기소개를 삭제할까요?')) return;
      const { error } = await db.from('member_intros').delete().eq('id', id);
      if (!error) {
        removeMyId(id);
        await loadIntros();
      }
    }

    function editIntro(id, r) {
      const cardEl = document.querySelector(`.intro-card-news[data-id="${id}"]`);
      if (!cardEl) return;
      cardEl.innerHTML = `
        <div class="intro-edit-form">
          <div class="intro-field">
            <label class="intro-label" for="editNick_${id}">닉네임 <span class="intro-required">*</span></label>
            <input class="intro-input" id="editNick_${id}" type="text" value="${escHtml(r.nickname)}" maxlength="20">
          </div>
          <div class="intro-field">
            <label class="intro-label" for="editBio_${id}">한줄소개</label>
            <input class="intro-input" id="editBio_${id}" type="text" value="${escHtml(r._bio || '')}" maxlength="60" placeholder="모임 보드와 공유돼요">
          </div>
          <div class="intro-field">
            <label class="intro-label" for="editGames_${id}">좋아하는 게임</label>
            <input class="intro-input" id="editGames_${id}" type="text" value="${escHtml(r.favorite_games || '')}" maxlength="100">
          </div>
          <div class="intro-field">
            <label class="intro-label" for="editAvail_${id}">참여 가능 요일 / 시간</label>
            <input class="intro-input" id="editAvail_${id}" type="text" value="${escHtml(r.available || '')}" maxlength="100">
          </div>
          <div class="intro-field">
            <label class="intro-label" for="editLoc_${id}">활동 지역</label>
            <input class="intro-input" id="editLoc_${id}" type="text" value="${escHtml(r.location || '')}" maxlength="50">
          </div>
          <div class="intro-field">
            <label class="intro-label" for="editTravel_${id}">이동 가능 범위</label>
            <input class="intro-input" id="editTravel_${id}" type="text" value="${escHtml(r.travel_range || '')}" maxlength="50">
          </div>
          <div class="intro-edit-btns">
            <button class="intro-edit-save-btn" type="button">저장</button>
            <button class="intro-edit-cancel-btn" type="button">취소</button>
          </div>
          <p class="intro-edit-msg"></p>
        </div>`;
      cardEl.querySelector('.intro-edit-cancel-btn').addEventListener('click', loadIntros);
      cardEl.querySelector('.intro-edit-save-btn').addEventListener('click', async () => {
        const nickname = cardEl.querySelector(`#editNick_${id}`).value.trim();
        const msg = cardEl.querySelector('.intro-edit-msg');
        if (!nickname) {
          msg.textContent = '닉네임을 입력해주세요.';
          msg.style.display = 'block';
          return;
        }
        const saveBtn = cardEl.querySelector('.intro-edit-save-btn');
        saveBtn.disabled = true;
        saveBtn.textContent = '저장 중...';
        const newBio = cardEl.querySelector(`#editBio_${id}`).value.trim();
        const { error } = await db.from('member_intros').update({
          nickname,
          favorite_games: cardEl.querySelector(`#editGames_${id}`).value.trim() || null,
          available: cardEl.querySelector(`#editAvail_${id}`).value.trim() || null,
          location: cardEl.querySelector(`#editLoc_${id}`).value.trim() || null,
          travel_range: cardEl.querySelector(`#editTravel_${id}`).value.trim() || null,
        }).eq('id', id);
        // profiles.bio: 취향보드와 공유하는 한줄소개 SSOT — 여기서 저장하면 모임 보드/취향보드에도 즉시 반영됨
        if (!error && r.user_id) {
          await window.CottageDB?.updateUserBio?.(r.user_id, newBio);
        }
        if (!error) {
          await loadIntros();
        } else {
          saveBtn.disabled = false;
          saveBtn.textContent = '저장';
          msg.textContent = '저장에 실패했어요. 다시 시도해주세요.';
          msg.style.display = 'block';
        }
      });
    }

    async function loadIntros() {
      _syncLoginUI();
      const el = document.getElementById('introList');
      if (!getCurrentUser()) {
        el.innerHTML = '<p class="intro-list-empty" style="grid-column:1/-1;text-align:center;padding:32px 0">🔒 카카오 로그인 후 열람할 수 있습니다.</p>';
        return;
      }
      const { data, error } = await db
        .from('member_intros')
        .select('*')
        .order('created_at', { ascending: false });
      if (error || !data?.length) {
        el.innerHTML = '<p class="intro-list-empty" style="grid-column:1/-1">아직 인사가 없어요. 첫 번째로 남겨보세요!</p>';
        return;
      }

      // profiles.bio(한줄소개 SSOT) 일괄 조회 — 취향보드/모임보드와 공유하는 값을 카드에도 표시
      const userIds = [...new Set(data.map(r => r.user_id).filter(Boolean))];
      let bioByUser = {};
      if (userIds.length) {
        const { data: profilesData } = await db.from('profiles').select('user_id, bio').in('user_id', userIds);
        bioByUser = Object.fromEntries((profilesData || []).map(p => [p.user_id, p.bio || '']));
      }
      data.forEach(r => { r._bio = r.user_id ? (bioByUser[r.user_id] || '') : ''; });

      el.innerHTML = data.map((r, idx) => {
        const canAct = canDelete(r);
        const del    = canAct ? `<button class="intro-card-del"       data-id="${r.id}" type="button" title="삭제">✕</button>` : '';
        const edit   = canAct ? `<button class="intro-card-edit"      data-id="${r.id}" type="button" title="수정">✎</button>` : '';
        const color  = canAct ? `<button class="intro-card-color-btn" data-id="${r.id}" type="button" title="색상 변경">🎨</button>` : '';
        const clickable = !!r.user_id;
        return `
        <div class="intro-card-news${clickable ? ' intro-card-news--clickable' : ''}" data-id="${r.id}" data-user-id="${escHtml(r.user_id || '')}" data-color="${escHtml(r.card_color||'')}" data-idx="${idx}">
          <div class="intro-card-news-head" style="position:relative">
            ${color}${edit}${del}
            <div class="intro-card-news-nickname">${escHtml(r.nickname)}</div>
            <div class="intro-card-news-date">${formatDate(r.created_at)}</div>
          </div>
          <div class="intro-card-news-body">
            ${r._bio ? `<div class="intro-card-news-row"><span class="intro-card-news-label">📝</span><span class="intro-card-news-val">${escHtml(r._bio)}</span></div>` : ''}
            ${r.favorite_games ? `<div class="intro-card-news-row"><span class="intro-card-news-label">🎲</span><span class="intro-card-news-val">${escHtml(r.favorite_games)}</span></div>` : ''}
            ${r.available ? `<div class="intro-card-news-row"><span class="intro-card-news-label">📅</span><span class="intro-card-news-val">${escHtml(r.available)}</span></div>` : ''}
            ${r.location ? `<div class="intro-card-news-row"><span class="intro-card-news-label">📍</span><span class="intro-card-news-val">${escHtml(r.location)}</span></div>` : ''}
            ${r.travel_range ? `<div class="intro-card-news-row"><span class="intro-card-news-label">🚗</span><span class="intro-card-news-val">${escHtml(r.travel_range)}</span></div>` : ''}
          </div>
          ${clickable ? '<div class="intro-card-news-cta">모임 보드 보기 ›</div>' : ''}
        </div>`;
      }).join('');

      // 카드 색상 적용
      el.querySelectorAll('.intro-card-news').forEach(card => {
        applyCardColor(card, card.dataset.color, Number(card.dataset.idx));
      });

      // 카드 클릭 → 해당 회원의 모임 보드 (액션 버튼 클릭은 제외)
      el.querySelectorAll('.intro-card-news--clickable').forEach(card => {
        card.addEventListener('click', e => {
          if (e.target.closest('.intro-card-news-head button') || e.target.closest('.intro-edit-form')) return;
          const uid = card.dataset.userId;
          if (uid) window.openOtherMeetingSheet?.(uid);
        });
      });

      el.querySelectorAll('.intro-card-del').forEach(btn => {
        btn.addEventListener('click', e => { e.stopPropagation(); deleteIntro(btn.dataset.id); });
      });
      el.querySelectorAll('.intro-card-edit').forEach(btn => {
        const id = btn.dataset.id;
        const r  = data.find(x => String(x.id) === String(id));
        btn.addEventListener('click', e => { e.stopPropagation(); editIntro(id, r); });
      });

      // 컬러 피커
      el.querySelectorAll('.intro-card-color-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          // 기존 팔레트 닫기
          el.querySelectorAll('.intro-color-palette').forEach(p => p.remove());

          const cardEl  = btn.closest('.intro-card-news');
          const headEl  = btn.closest('.intro-card-news-head');
          const curKey  = cardEl.dataset.color || '';

          const palette = document.createElement('div');
          palette.className = 'intro-color-palette';
          CARD_PALETTE.forEach(c => {
            const sw = document.createElement('button');
            sw.type = 'button';
            sw.className = 'intro-color-swatch' + (c.key === curKey ? ' is-selected' : '');
            sw.style.background = c.bg;
            sw.title = c.key;
            sw.addEventListener('click', async e2 => {
              e2.stopPropagation();
              palette.remove();
              cardEl.dataset.color = c.key;
              applyCardColor(cardEl, c.key, Number(cardEl.dataset.idx));
              // DB 저장 (card_color 컬럼 필요)
              await db.from('member_intros').update({ card_color: c.key }).eq('id', btn.dataset.id);
            });
            palette.appendChild(sw);
          });

          headEl.style.position = 'relative';
          headEl.appendChild(palette);

          // 외부 클릭 시 닫기
          setTimeout(() => {
            document.addEventListener('click', () => palette.remove(), { once: true });
          }, 0);
        });
      });
    }

    document.getElementById('introSubmitBtn').addEventListener('click', async () => {
      const u = getCurrentUser();
      const msg = document.getElementById('introSubmitMsg');
      if (!u?.id) {
        msg.textContent = '로그인 후 작성할 수 있어요.';
        msg.style.color = '#c0392b';
        msg.style.display = 'block';
        return;
      }

      const nickname = document.getElementById('introNickname').value.trim();
      const bio      = document.getElementById('introBio').value.trim();
      const games    = document.getElementById('introGames').value.trim();
      const avail    = document.getElementById('introAvailable').value.trim();
      const loc      = document.getElementById('introLocation').value.trim();
      const travel   = document.getElementById('introTravel').value.trim();

      if (!nickname) {
        msg.textContent = '닉네임을 입력해주세요.';
        msg.style.color = '#c0392b';
        msg.style.display = 'block';
        document.getElementById('introNickname').focus();
        return;
      }

      const btn = document.getElementById('introSubmitBtn');
      btn.disabled = true;
      btn.textContent = '등록 중...';

      // member_intros: 유저당 1행(UNIQUE user_id) — 재작성 시 upsert로 기존 행 갱신
      const { data: ins, error } = await db.from('member_intros').upsert({
        nickname,
        favorite_games: games || null,
        available: avail || null,
        location: loc || null,
        travel_range: travel || null,
        user_id: String(u.id),
      }, { onConflict: 'user_id' }).select('id');

      // profiles.bio: 취향보드와 공유하는 한줄소개 SSOT
      if (!error) await window.CottageDB?.updateUserBio?.(String(u.id), bio);

      btn.disabled = false;
      btn.textContent = '인사 남기기';

      if (error) {
        msg.textContent = '오류가 발생했어요. 다시 시도해주세요.';
        msg.style.color = '#c0392b';
        msg.style.display = 'block';
        return;
      }

      if (ins?.[0]?.id) saveMyId(ins[0].id);

      ['introNickname','introBio','introGames','introAvailable','introLocation','introTravel'].forEach(id => {
        document.getElementById(id).value = '';
      });
      msg.textContent = '인사를 남겼어요!';
      msg.style.color = 'var(--green)';
      msg.style.display = 'block';
      setTimeout(() => { msg.style.display = 'none'; }, 3000);
      await loadIntros();
    });

    ['introNickname','introBio','introGames','introAvailable','introLocation','introTravel'].forEach(id => {
      document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('introSubmitBtn').click();
      });
    });

    // 로그인/로그아웃 시 폼 표시 + 삭제 버튼 표시 여부 갱신
    window.addEventListener('cottage-auth-changed', loadIntros);

    _syncLoginUI();
    loadIntros();
  })();
  </script>
