<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/images/main/favicon-square.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/images/main/favicon-square.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>모임 플래너 | 코티지보드 동호회</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
  <style>
    .sched-confirm-btn {
      flex: 1;
      padding: 12px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      background: var(--green);
      color: white;
    }
    .sched-discard-btn {
      padding: 12px 16px;
      border-radius: 9px;
      font-size: 14px;
      cursor: pointer;
      border: 1.5px solid #d0c8bc;
      background: white;
      color: var(--muted);
    }


    .sched-loading { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }

    /* ── 주간 뷰 (Phase 1) ──────────────────────────────────── */
    .sched-week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      position: sticky;
      top: 0;
      z-index: 1;
      height: 49px;
      min-height: 49px;
      box-sizing: border-box;
      padding: 8px 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .sched-week-nav-btn {
      background: none;
      border: none;
      font-size: 13px;
      color: var(--green);
      font-weight: 600;
      cursor: pointer;
      padding: 4px 6px;
    }
    .sched-week-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .sched-toggle-cal-btn {
      display: block;
      width: 100%;
      padding: 6px;
      background: none;
      border: 1px solid #e0d8cc;
      border-radius: 7px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      margin-bottom: 8px;
      text-align: center;
    }
    .sched-toggle-cal-btn:hover { background: #faf5ec; }
    .sched-toggle-cal-btn.is-open { color: var(--green); border-color: var(--green); }
    .sched-wday-card {
      padding: 10px 13px;
      border-radius: 8px;
      background: #fcfbf8;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .sched-wday-card:hover { background: #f0ebe0; }
    .sched-wday-card.is-past { opacity: 0.3; cursor: pointer; }
    .sched-wday-card.is-today { background: #faf4eb; outline: 1px solid rgba(122,72,40,.38); }
    .sched-wday-card.is-target { background: #f5ede3; outline: 1px solid rgba(122,72,40,.72); }
    .sched-wday-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sched-wday-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .sched-wday-dow {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
    }
    .sched-wday-dow.is-sat { color: #5080e0; }
    .sched-wday-dow.is-sun { color: #e05050; }
    .sched-wday-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--green);
    }
    /* Phase 2: 카드 내 시간 바 */
    .sched-wday-card { cursor: default; }
    .sched-wday-header { cursor: pointer; }
    /* sched-card-bars·sched-card-more-btn → day-detail.js */
    /* Phase 3: 카드 푸터 */
    /* 헤더 우상단 수정/⋯ */
    .sched-card-header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sched-card-reg-hdr {
      padding: 2px 8px;
      background: none;
      border: 1px solid #c8bfb0;
      border-radius: 6px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
    }
    .sched-card-reg-hdr:hover { border-color: var(--green); color: var(--green); }
    /* 월간 달력 */
    .mcal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0 10px;
    }
    .mcal-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .mcal-nav-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--muted);
      cursor: pointer;
      padding: 0 6px;
      line-height: 1;
    }
    .mcal-nav-btn:hover { color: var(--text); }
    .mcal-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      padding-bottom: 4px;
    }
    .mcal-header .is-sat { color: #5080e0; }
    .mcal-header .is-sun { color: #e05050; }
    .mcal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .mcal-cell {
      min-height: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 2px 2px;
      border-radius: 6px;
      cursor: pointer;
    }
    .mcal-empty { cursor: default; }
    .mcal-cell.is-past { opacity: .4; cursor: pointer; }
    .mcal-cell:not(.is-past):not(.mcal-empty):hover { background: #f0ebe0; }
    .mcal-cell.is-mine { background: #f5f0e8; }
    .mcal-day {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .mcal-cell.is-sat .mcal-day { color: #5080e0; }
    .mcal-cell.is-sun .mcal-day { color: #e05050; }
    .mcal-cell.is-today .mcal-day {
      background: var(--green);
      color: #fff;
    }
    .mcal-cnt {
      font-size: 10px;
      font-weight: 600;
      color: var(--green);
      margin-top: 2px;
    }
    .mcal-mine-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #c0843a;
      margin-top: 2px;
    }
    /* 시간 등록/수정 컴팩트 바텀시트 */
    .sched-sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.15);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      pointer-events: none;   /* dim만 표시, 배경 스크롤 통과 */
    }
    .sched-sheet {
      width: 100%;
      background: #fff;
      border-radius: 18px 18px 0 0;
      padding: 16px 16px 28px;
      box-shadow: 0 -4px 20px rgba(0,0,0,.12);
      pointer-events: auto;   /* 시트 본체만 인터랙션 */
    }
    .sched-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .sched-sheet-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    .sched-sheet-close-btn {
      background: none;
      border: none;
      font-size: 18px;
      color: var(--muted);
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .sched-sheet-time-display {
      text-align: center;
      margin-bottom: 12px;
    }
    .sched-sheet-time-display .sched-slider-time-val {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }
    .sched-sheet-time-display .sched-slider-sep {
      font-size: 18px;
      color: var(--muted);
      margin: 0 6px;
    }
    /* 동반 인원 스테퍼 — 단일 시트·멀티스텝 Step2 공용 */
    .sched-guest-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .sched-guest-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .sched-guest-ctrl {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
    }
    .sched-guest-btn {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--green);
      font-size: 17px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }
    .sched-guest-btn:disabled { opacity: .35; cursor: default; }
    .sched-guest-input {
      width: 52px;
      height: 32px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      -moz-appearance: textfield;
    }
    .sched-guest-input::-webkit-outer-spin-button,
    .sched-guest-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .sched-guest-total {
      width: 100%;
      text-align: right;
      font-size: 12px;
      color: var(--muted);
    }
    .sched-sheet-footer {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .sched-sheet-footer .sched-confirm-btn { flex: 1; }
    .sched-sheet-footer .sched-discard-btn { flex: 0 0 72px; }
    .sched-sheet-prevweek-row {
      text-align: right;
      margin-bottom: 2px;
    }
    .sched-sheet-prevweek-btn {
      background: none;
      border: none;
      padding: 0;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .sched-sheet-prevweek-btn:hover { color: var(--green); }
    .sched-sheet-match-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      margin-bottom: 8px;
    }
    .sched-sheet-match-label {
      width: 100%;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 1px;
    }
    .sched-sheet-match-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11.5px;
      color: var(--ink);
      cursor: pointer;
      white-space: nowrap;
    }
    .sched-sheet-match-btn:hover { border-color: var(--green); color: var(--green); }

    /* ── 모임 등록 버튼 ──────────────────────────────── */
    .sched-register-row {
      display: flex; justify-content: flex-end;
      padding-bottom: 4px;
    }
    .sched-register-btn {
      padding: 6px 13px;
      border: 1.5px solid #8a5737;
      border-radius: 20px;
      background: white; color: #6d4026;
      font-size: 12px; font-weight: 700;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .sched-register-btn:hover { background: var(--green); color: white; }

    /* ── 멀티스텝 바텀시트 (모임 등록) ───────────────── */
    .sched-multi-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 210;
      display: flex; align-items: flex-end;
    }
    .sched-multi-sheet {
      width: 100%; max-height: 72vh;
      background: #fff;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,.15);
      display: flex; flex-direction: column;
    }
    .sm-hdr {
      display: flex; align-items: center;
      padding: 10px 14px 10px;
      border-bottom: 1px solid #ede8de;
      flex-shrink: 0;
    }
    .sm-back-btn {
      background: none; border: none;
      font-size: 14px; color: var(--muted);
      cursor: pointer; padding: 4px 0;
      min-width: 52px; text-align: left;
    }
    .sm-close-btn {
      background: none; border: none;
      font-size: 18px; color: var(--muted);
      cursor: pointer; padding: 0 2px;
      margin-left: auto;
    }
    .sm-title {
      font-size: 16px; font-weight: 700;
      color: var(--text); flex: 1; text-align: center;
    }
    .sm-body { flex: 1; overflow-y: auto; padding: 12px 14px; }
    .sm-footer {
      padding: 10px 14px 18px;
      border-top: 1px solid #ede8de;
      flex-shrink: 0;
    }
    .sm-footer .sched-confirm-btn, .sm-footer .sched-discard-btn { width: 100%; }
    /* Step 1: 요일 선택 */
    .sm-hint { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
    .sm-day-chips {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    }
    .sm-day-chip {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 8px 2px; border: 1.5px solid #d0c8bc;
      border-radius: 10px; background: white; cursor: pointer;
      position: relative; gap: 2px;
      transition: border-color .15s, background .15s;
    }
    .sm-day-chip.is-sel { border-color: var(--green); background: #f5ede0; }
    .sm-day-chip.is-past { opacity: .4; cursor: default; }
    .sm-day-chip.is-today .sm-dc-dow { color: var(--green); font-weight: 700; }
    .sm-dc-dow { font-size: 13px; font-weight: 600; color: var(--text); }
    .sm-dc-date { font-size: 10px; color: var(--muted); }
    .sm-dc-mine {
      position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
      font-size: 8px; line-height: 1; color: #c0843a; white-space: nowrap;
    }
    .sm-dc-original {
      position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
      font-size: 8px; line-height: 1; color: var(--green); white-space: nowrap; font-weight: 700;
    }
    .sm-day-chip.is-registered { border-color: #d8b88a; }
    .sm-day-chip.is-registered.is-sel { border-color: var(--green); background: #f5ede0; }
    .sm-dc-cnt { font-size: 9px; color: #b0a090; line-height: 1; }
    /* Step 1: 주 네비게이션 */
    .sm-week-nav {
      display: flex; align-items: center; gap: 4px; margin-bottom: 12px;
    }
    .sm-week-nav-btn {
      background: none; border: 1px solid #d0c8bc; border-radius: 8px;
      font-size: 14px; color: var(--muted); cursor: pointer;
      padding: 5px 10px; flex-shrink: 0;
      transition: border-color .15s, color .15s;
    }
    .sm-week-nav-btn:hover { border-color: var(--green); color: var(--green); }
    .sm-week-nav-btn:disabled { opacity: .35; cursor: default; pointer-events: none; }
    .sm-week-label {
      flex: 1; text-align: center;
      font-size: 12px; font-weight: 600; color: var(--text);
    }
    .sm-sel-summary {
      font-size: 12px; color: var(--green);
      margin: 10px 0 0; line-height: 1.6; word-break: keep-all;
    }
    /* Step 2/3: 요일 탭 */
    .sm-tabs {
      display: flex; gap: 6px; overflow-x: auto;
      margin-bottom: 16px; padding-bottom: 2px; scrollbar-width: none;
    }
    .sm-tabs::-webkit-scrollbar { display: none; }
    .sm-tab {
      padding: 6px 12px; border-radius: 20px;
      border: 1.5px solid #d0c8bc; background: white;
      cursor: pointer; font-size: 13px; color: var(--muted);
      white-space: nowrap; flex-shrink: 0;
      transition: border-color .15s, background .15s, color .15s;
    }
    .sm-tab.is-active { border-color: var(--green); background: var(--green); color: white; }
    /* Step 3: 오늘 원하는 판 */
    .sm-intent-section { margin-bottom: 18px; }
    .sm-intent-section:last-child { margin-bottom: 0; }
    .sm-intent-label {
      display: block; margin-bottom: 8px;
      font-size: 13px; font-weight: 700; color: var(--text);
    }
    .sm-intent-required { color: #c0843a; font-size: 11px; margin-left: 4px; }
    .sm-intent-options { display: flex; flex-wrap: wrap; gap: 7px; }
    .sm-intent-option {
      position: relative; display: inline-flex; align-items: center;
      padding: 7px 12px; border: 1.5px solid #d0c8bc; border-radius: 18px;
      background: white; color: var(--muted); font-size: 13px; cursor: pointer;
      transition: border-color .15s, background .15s, color .15s;
    }
    .sm-intent-option:has(input:checked) {
      border-color: var(--green); background: var(--green); color: white; font-weight: 600;
    }
    .sm-intent-option input { position: absolute; opacity: 0; pointer-events: none; }
    .sm-intent-message-wrap { position: relative; }
    .sm-intent-message {
      width: 100%; box-sizing: border-box; padding: 10px 48px 10px 12px;
      border: 1.5px solid #d0c8bc; border-radius: 9px;
      font: inherit; font-size: 14px; color: var(--text); outline: none;
    }
    .sm-intent-message:focus { border-color: var(--green); }
    .sm-intent-custom-wrap { display: none; margin-top: 8px; }
    .sm-intent-custom-wrap.is-visible { display: block; }
    .sm-intent-custom-wrap .sm-intent-message { padding-right: 12px; }
    .sm-intent-count {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      font-size: 11px; color: var(--muted); pointer-events: none;
    }
    /* Step 2 */
    .sm-prevweek-row { text-align: right; margin-bottom: 4px; }
    .sm-freqtime-row { text-align: right; margin-bottom: 4px; position: relative; }
    .sm-freqtime-btn {
      background: none; border: none;
      font-size: 12px; color: var(--muted);
      cursor: pointer; padding: 0;
      text-decoration: underline dotted;
      text-underline-offset: 2px;
    }
    .sm-freqtime-btn:hover { color: var(--green); }
    .sm-freqtime-menu {
      position: absolute; right: 0; top: calc(100% + 4px);
      background: #fff; border: 1px solid #ede8de;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
      z-index: 20; min-width: 120px;
      overflow: hidden;
    }
    .sm-freqtime-opt {
      display: block; width: 100%;
      background: none; border: none;
      padding: 9px 14px; text-align: left;
      font-size: 13px; cursor: pointer; color: var(--text);
    }
    .sm-freqtime-opt:hover { background: #f5efe6; }
    /* Step 2: 날짜별 시간 행 */
    .sm-time-row {
      margin-bottom: 16px; padding-bottom: 16px;
      border-bottom: 1px solid #ede8de;
    }
    .sm-time-row:last-child { border-bottom: none; margin-bottom: 0; }
    .sm-time-row-hdr {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 8px;
    }
    .sm-time-row-label { font-size: 14px; font-weight: 700; color: var(--text); }
    .sm-time-row-val { font-size: 14px; font-weight: 600; color: var(--green); }
    .sm-date-change-btn {
      margin-left: 6px; padding: 2px 8px; border-radius: 10px;
      border: 1px solid #d0c8bc; background: white;
      font-size: 11px; font-weight: 600; color: var(--muted);
      cursor: pointer; vertical-align: middle;
    }
    .sm-date-change-btn:hover { border-color: var(--green); color: var(--green); }
    .sm-time-preset-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .sm-time-preset-chip {
      padding: 4px 12px; border-radius: 14px;
      border: 1.5px solid #d0c8bc; background: white;
      font-size: 12px; color: var(--muted);
      cursor: pointer; transition: border-color .15s, color .15s, background .15s;
    }
    .sm-time-preset-chip:hover { border-color: var(--green); color: var(--green); }
    .sm-time-preset-chip.is-active { border-color: var(--green); background: var(--green); color: white; }
    .sm-time-match-label { font-size: 11px; color: var(--muted); margin: 2px 0 4px; }
    .sm-time-match-chip { border-color: #dba07a; }
    .sm-time-match-chip.is-active { border-color: #96522a; background: #96522a; }
    .sm-time-preset-wrap { display: inline-flex; align-items: center; gap: 2px; }
    .sm-preset-del-btn {
      width: 18px; height: 18px; border-radius: 50%;
      border: none; background: none; color: var(--muted);
      font-size: 11px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .sm-preset-del-btn:hover { background: #fdecea; color: #d94f4f; }
    /* 게임 추가 섹션 (Step 3 이동 후 유지) */
    .sm-game-toggle-wrap { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
    /* 펼쳐진 섹션은 구분선 + 여백으로 다음 토글과 확실히 끊는다 — 여백만으로는
       아래 토글이 위 내용에 붙어 "배우고 싶은 게임"이 "하고 싶은 게임"의
       일부로 읽힌다. 접힘 상태는 wrap의 8px 그대로(그땐 두 줄이 명확하다). */
    .sm-game-block { display: flex; flex-direction: column; }
    .sm-game-block.is-open { padding-bottom: 22px; margin-bottom: 16px; border-bottom: 1px solid #e2dcd2; }
    .sm-game-block.is-open:last-child { padding-bottom: 0; margin-bottom: 0; border-bottom: none; }
    /* 고른 게임 목록은 입력·피커 아래 */
    .sm-game-picked { margin-top: 12px; }

    /* 아래 4개 축(입력/좋아요/지난모임/다른참여자)이 컴팩트한 알약 버튼이라, 그 위 토글
       헤더만 풀폭 큰 박스로 남아있으면 무게감이 안 맞는다(2026-08-02 사용자 지적 —
       "이렇게 박스 키울 필요 없잖아"). 내용물 크기만큼만 차지하도록 축소. */
    .sm-game-toggle {

    .sm-game-star {
      background: none; border: none; cursor: pointer;

    }

      display: flex; flex-wrap: wrap; gap: 4px;
      padding: 6px 10px 8px; border-top: 1px solid #e8e4dc;
    }
    .sm-cond-chip {

    /* 눌러도 색만 살짝 바뀌어 "눌렸는지 안 눌렸는지" 구분이 안 된다는 지적(2026-07-28) —
       배경까지 채워 star(⭐/☆)처럼 상태가 한눈에 갈리게 한다. */
    .sm-game-sync.is-active { color: white; background: var(--green); }

    .sm-game-input-row { display: flex; gap: 8px; margin-top: 4px; }
    /* 🚨 줄어들어야 하는 건 input이 아니라 **그 래퍼**다 — attachAc가 입력칸을
       클래스 없는 <div style="position:relative">로 감싼다(play-records-utils.js).
       래퍼에 min-width:0을 안 주면 입력칸이 안 줄고 오른쪽 버튼이 화면 밖으로 잘린다
       (실측 2026-07-21: 63px 넘침. 줄바꿈이 아니라 잘림이라 "한 줄인가" 검사로는 안 잡힌다). */
    .sm-game-input-row > div { flex: 1 1 auto; min-width: 0; }
    .sm-game-input-row > div > .sm-game-input { width: 100%; }
    .sm-game-input {

      font-size: 14px; outline: none; font-family: inherit;
    }
    .sm-game-input:focus { border-color: var(--green); }
    /* 축이 4개(입력 / 좋아요 / 지난모임 / 다른참여자)로 늘어 한 줄에 다 들어가야 해서
       패딩·글자크기를 줄였다(2026-08-02) — 줄바꿈 대신 크기를 줄이는 쪽을 택한 이유는
       위 2026-07-21 주석의 잘림 사고 때문에 wrap보다 압축이 더 안전하다고 판단해서다. */
    .sm-game-past-btn {

    .sm-game-past-btn.is-open { border-color: var(--green); background: #f5ede0; color: var(--green); }
    /* 피커 패널 */
    .sm-picker-panel {

    .sm-picker-item-row { display: flex; align-items: center; gap: 2px; }
    .sm-picker-item {
      display: flex; align-items: center; justify-content: space-between;
      flex: 1; min-width: 0; padding: 7px 8px; border: none; background: none;
      cursor: pointer; font-size: 13px; text-align: left;

    .sm-picker-item:hover:not(:disabled) { background: #ede8de; }

    /* 토스트 */
    .sched-toast {

    /* 홈에서 등록/수정으로 바로 진입 시 — 플래너 페이지 전체(.inner-page)를 숨기고 등록/수정
       오버레이만 남긴다(오버레이는 position:fixed라 .inner-page display:none과 독립). body 배경도

          남아 오버레이를 닫을 때 그 크롬이 한 프레임 드러나며 깜빡였다(2026-07-18 규명). */

    .sched-slider-wrap { margin-bottom: 16px; }

  <script>
  (function () {
    const MIN_H = 9, MAX_H = 27; // 27시 = 익일 새벽 3시(자정 넘김 표기, 2026-08-18)
    // 동반 인원 입력 상한 — 정책이 아니라 오타 방지(DB CHECK와 같은 값). 20명도 정상 입력이다.
    const GUEST_MAX = 99;
    const DOW = ['일','월','화','수','목','금','토'];
    const TODAY = new Date();
    TODAY.setHours(0, 0, 0, 0);

    let allVotes     = [];
    let allVoteGames = [];   // meeting_vote_games (날짜별 want/learn 게임)
    let weekOffset    = 0;
    let calMonthDate  = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
    let _sheetDs   = null;   // 바텀시트 대상 날짜 (null = 닫힘)
    let _syncSheet = null;   // initScheduleSheet에서 주입되는 슬라이더 sync 함수
    let _openMultiSheet = null; // initMultiSheet에서 주입되는 외부 진입점
    let _initDone       = false;
    let _pendingRegister = null; // 홈 등록하기 버튼 → init 완료 전 도착한 date
    let _pendingEdit     = null; // 「이날 모임 상세」 등록/수정 버튼 → init 완료 전 도착한 date (_pendingRegister와 동일한 이유)
    // 실제 Live Server 환경에서 .html/?embed=true가 정리된 URL로 iframe이 이동할 수 있다.
    // 부모 프레임 안에서 실행 중이라는 사실 자체도 embed 판정에 포함해야 ready/date 전달이 멈추지 않는다.
    const IS_EMBEDDED = window.parent !== window
      || new URLSearchParams(location.search).get('embed') === 'true';

    // 활성 뷰 체류시간 추적(PLAN_active_view_tracking.md 3차) — schedSheetOverlay(단일 날짜
    // 시간 수정)와 schedMultiOverlay(멀티스텝 등록) 둘 다 "플래너에서 등록/수정 중"이라는
    // 같은 뷰로 본다(game-sheet.js 정보↔기록과 같은 패턴). embed=true(iframe)로 실행 중일 땐
    // window.pushActiveView 자체가 이미 _isEmbeddedFrame() 가드로 no-op이라(#24 방지, 기존
    // 동작 그대로) 여기서 따로 embed 분기할 필요가 없다 — 그 경우 실제 카운팅은 day-detail.js
    // _pmReveal/_pmCloseModal(부모 window)이 대신 담당한다.
    let _plannerViewToken = null;
    let _plannerViewActive = false;
    function _ensurePlannerViewToken() {
      if (_plannerViewActive) return;
      _plannerViewActive = true;
      _plannerViewToken = window.pushActiveView?.('planner-register') ?? null;
    }
    function _popPlannerViewToken() {
      if (!_plannerViewActive) return;
      window.popActiveView?.(_plannerViewToken);
      _plannerViewActive = false;
      _plannerViewToken = null;
    }

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // 더 이상 쓰지 않을 시간 프리셋을 계정별로 숨긴다(ls-schema.md 신규 키
    // cottage_hidden_time_presets_{userId} — 기존 cottage_req_votes_{userId} 등과 같은 패턴).
    // DB의 실제 과거 참여 기록은 그대로 두고, "빈도 상위 3개" 후보 계산에서만 뺀다.
    function _getHiddenTimePresets(userId) {
      try { return new Set(JSON.parse(localStorage.getItem(`cottage_hidden_time_presets_${userId}`) || '[]')); }
      catch (_) { return new Set(); }
    }
    function _hideTimePreset(userId, s, e) {
      const set = _getHiddenTimePresets(userId);
      set.add(`${s}-${e}`);
      localStorage.setItem(`cottage_hidden_time_presets_${userId}`, JSON.stringify([...set]));
    }

    // 지난 모임 게임 피커에서 "더 이상 안 보고 싶은" 항목 숨김 — 위 시간 프리셋과 완전히
    // 같은 패턴(cottage_hidden_past_games_{userId}). DB의 실제 과거 투표 기록은 안 지우고
    // fetchPastVoteGames의 후보 계산에서만 뺀다. 키는 want/learn 리스트별로 분리
    // (`{listType}:id:{bggId}` 또는 `{listType}:nm:{커스텀이름}`).
    function _getHiddenPastGames(userId) {
      try { return new Set(JSON.parse(localStorage.getItem(`cottage_hidden_past_games_${userId}`) || '[]')); }
      catch (_) { return new Set(); }
    }
    function _hidePastGame(userId, listType, key) {
      const set = _getHiddenPastGames(userId);
      set.add(`${listType}:${key}`);
      localStorage.setItem(`cottage_hidden_past_games_${userId}`, JSON.stringify([...set]));
    }

    function toDateStr(date) {
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }

    function parseDate(s) {
      const [y, m, d] = s.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatLabel(s) {
      const d = parseDate(s);
      return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;
    }

    function isPast(s) { return parseDate(s) < TODAY; }
    function isToday(s) { return parseDate(s).getTime() === TODAY.getTime(); }

    // 방문 인원 = 등록자 + 동반 인원. 인원을 세는 자리는 전부 이 함수만 쓴다(등록 건수와 구분).
    // supabase-client.js의 공용 헬퍼에 위임 — 로드 순서 때문에 호출 시점에 참조한다.
    function partyCount(votes) {
      return window.CottageDB?.sumPartySize?.(votes) ?? (votes ? votes.length : 0);
    }

    function clampGuest(v) {
      const n = Number(v);
      if (!Number.isFinite(n) || n <= 0) return 0;
      return Math.min(GUEST_MAX, Math.floor(n));
    }

    // 지인 스테퍼 바인딩 — 단일 시트와 멀티스텝 Step2가 공유한다.
    // 직접 입력을 허용하되(20명도 정상값) 저장 직전 clampGuest로 접는다.
    // onChange(n)로 변경을 알려 호출부가 자기 상태(_guestMap 등)를 갱신한다.
    function bindGuestStepper({ input, minus, plus, total, onChange }) {
      if (!input) return;
      const render = () => {
        const n = clampGuest(input.value);
        if (minus) minus.disabled = n <= 0;
        if (total) total.textContent = n > 0 ? `나 포함 ${n + 1}명` : '나 포함 1명';
        if (onChange) onChange(n);
      };
      minus?.addEventListener('click', () => { input.value = clampGuest(input.value) - 1; render(); });
      plus?.addEventListener('click',  () => { input.value = clampGuest(input.value) + 1; render(); });
      // 타이핑 중에는 값을 되돌리지 않는다(빈 칸 상태를 지우자마자 0으로 덮으면 입력이 불가능해짐)
      input.addEventListener('input', render);
      input.addEventListener('blur', () => { input.value = clampGuest(input.value); render(); });
      render();
    }

    // ── 주간 카드 등록/변경/취소 (Phase 3) ──────────────────────────

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'sched-toast';
      t.textContent = msg;
      document.body.appendChild(t);
      requestAnimationFrame(() => t.classList.add('is-show'));
      setTimeout(() => {
        t.classList.remove('is-show');
        setTimeout(() => t.remove(), 280);
      }, 2200);
    }

    function _notifyParentSaved() {
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'cottage-meeting-saved' }, '*');
      }
    }

    // ── 시간 등록/수정 바텀시트 ──────────────────────────────────────

    function initScheduleSheet() {
      const range = MAX_H - MIN_H;
      const overlay = document.createElement('div');
      overlay.className = 'sched-sheet-overlay';
      overlay.id = 'schedSheetOverlay';
      overlay.innerHTML = `<div class="sched-sheet">
        <div class="sched-sheet-header">
          <span class="sched-sheet-title" id="ssTitle"></span>
          <button aria-label="닫기" class="sched-sheet-close-btn" id="ssClose" type="button">✕</button>
        </div>
        <div class="sched-sheet-body">
          <div class="sched-sheet-match-row" id="ssMatchRow" style="display:none"></div>
          <div class="sched-sheet-prevweek-row" id="ssPrevWeekRow">
            <button class="sched-sheet-prevweek-btn" id="ssPrevWeek" type="button"></button>
          </div>
          <div class="sched-sheet-time-display">
            <span class="sched-slider-time-val" id="ssLblS">10시</span>
            <span class="sched-slider-sep">~</span>
            <span class="sched-slider-time-val" id="ssLblE">22시</span>
          </div>
          <div class="sched-slider-wrap">
            <div class="sched-dual-range">
              <div class="sched-range-track"><div class="sched-range-fill" id="ssRangeFill"></div></div>
              <input aria-label="시작 시각" type="range" class="sched-range-input" id="ssRS"
                min="${MIN_H}" max="${MAX_H - 1}" step="0.5" value="10">
              <input aria-label="끝 시각" type="range" class="sched-range-input" id="ssRE"
                min="${MIN_H + 1}" max="${MAX_H}" step="0.5" value="22">
            </div>
            <div class="sched-range-axis">
              <span>${MIN_H}시</span><span>${Math.round((MIN_H+MAX_H)/2)}시</span><span>${MAX_H}시</span>
            </div>
          </div>
          <div class="sched-guest-row">
            <span class="sched-guest-label">👥 동반 인원</span>
            <div class="sched-guest-ctrl">
              <button class="sched-guest-btn" id="ssGuestMinus" type="button" aria-label="동반 인원 수 줄이기">−</button>
              <input class="sched-guest-input" id="ssGuest" type="number" inputmode="numeric"
                min="0" max="${GUEST_MAX}" step="1" value="0" aria-label="동반 인원 수">
              <button class="sched-guest-btn" id="ssGuestPlus" type="button" aria-label="동반 인원 수 늘리기">+</button>
            </div>
            <span class="sched-guest-total" id="ssGuestTotal">나 포함 1명</span>
          </div>
        </div>
        <div class="sched-sheet-footer">
          <button class="sched-confirm-btn" id="ssSave" type="button">등록</button>
          <button class="sched-discard-btn" id="ssDiscard" type="button">닫기</button>
        </div>
      </div>`;
      overlay.style.display = 'none';
      document.body.appendChild(overlay);

      const ssRS = document.getElementById('ssRS');
      const ssRE = document.getElementById('ssRE');
      const fill = document.getElementById('ssRangeFill');
      const lblS = document.getElementById('ssLblS');
      const lblE = document.getElementById('ssLblE');

      function syncSheet() {
        const s = parseFloat(ssRS.value), e = parseFloat(ssRE.value);
        fill.style.left  = ((s - MIN_H) / range * 100) + '%';
        fill.style.width = ((e - s)     / range * 100) + '%';
        lblS.textContent = window.formatVoteHour(s);
        lblE.textContent = window.formatVoteHour(e);
      }
      _syncSheet = syncSheet;  // 외부(지난주와 동일 버튼)에서 호출 가능하도록 노출

      ssRS.addEventListener('input', () => {
        if (parseFloat(ssRS.value) >= parseFloat(ssRE.value)) ssRS.value = parseFloat(ssRE.value) - 0.5;
        syncSheet();
      });
      ssRE.addEventListener('input', () => {
        if (parseFloat(ssRE.value) <= parseFloat(ssRS.value)) ssRE.value = parseFloat(ssRS.value) + 0.5;
        syncSheet();
      });

      bindGuestStepper({
        input: document.getElementById('ssGuest'),
        minus: document.getElementById('ssGuestMinus'),
        plus:  document.getElementById('ssGuestPlus'),
        total: document.getElementById('ssGuestTotal'),
      });

      document.getElementById('ssSave').addEventListener('click', () => {
        const btnSave = document.getElementById('ssSave');
        const guest = clampGuest(document.getElementById('ssGuest')?.value);
        saveVoteForDate(_sheetDs, parseFloat(ssRS.value), parseFloat(ssRE.value), btnSave, guest);
      });
      document.getElementById('ssDiscard').addEventListener('click', closeScheduleSheet);
      document.getElementById('ssClose').addEventListener('click', closeScheduleSheet);

      // 지난주와 동일: 같은 요일 7일 전 내 투표 → 슬라이더 이동 (자동저장 없음)
      document.getElementById('ssPrevWeek').addEventListener('click', () => {
        if (!_sheetDs) return;
        const user = window.getKakaoUser?.();
        if (!user) { showToast('로그인이 필요합니다.'); return; }
        const [y, m, d] = _sheetDs.split('-').map(Number);
        const prevDs = toDateStr(new Date(y, m - 1, d - 7));
        const prev   = allVotes.find(v => v.vote_date === prevDs && String(v.user_id) === String(user.id));
        if (!prev) { showToast('지난주 기록이 없습니다.'); return; }
        ssRS.value = prev.time_start;
        ssRE.value = prev.time_end;
        if (_syncSheet) _syncSheet();
      });

      // 바깥 클릭 닫기는 openScheduleSheet에서 document 레벨로 등록
    }

    // ── 멀티스텝 바텀시트 (모임 등록) ──────────────────────────
    function initMultiSheet() {
      let _step        = 1;
      let _days        = [];   // 선택된 날짜 배열 (정렬 유지)
      let _timeMap     = {};   // { ds: {s, e} }
      let _guestMap    = {};   // { ds: 동반 인원 수 } — 미입력이면 키 없음(=0)
      let _gameMap     = {};   // { ds: {want:[{custom_name,game_id}], learn:[...]} }
      let _intentMap   = {};   // { ds: {gameStyle,gameDepth,playTraits,recruitmentMessage} }
      let _activeDay   = null;
      let _fromStep1   = false;
      let _pickerCache = {};   // { like:[], curious:[], past:{want,learn} } — lazy fetch
      let _pickerOpen  = null; // 미사용(Step3 제거), 호환용 유지
      // 기본 펼침(2026-08-02, 사용자 요청) — 닫혀있으면 입력창·추가 버튼이 안 보여서
      // 매번 한 번 더 눌러야 하는 게 불편하다는 지적. 접고 싶으면 토글로 여전히 접을 수 있다.
      let _gameOpen    = {want:true, learn:true}; // 게임 섹션 열림 상태
      let _pastOpen    = {want:false, learn:false}; // 「지난 모임」 피커 열림 상태
      let _srcOpen     = {want:false, learn:false}; // 「좋아요/궁금」 피커 열림 상태(상시 노출 아님)
      // 「이 날 다른 참여자」 피커 열림 상태 — 좋아요/지난모임과 같은 축(같은 행의 세 번째
      // 버튼)으로 재배치(2026-08-02, 사용자가 4개 축[입력+추가 / 좋아요 / 지난모임 / 다른참여자]
      // 순서를 직접 지정). 상시노출 실험은 폐기 — 이제 클릭으로 여닫는 건 셋 다 동일하다.
      let _othersOpen  = {want:false, learn:false};
      let _modalWeekOffset = 0;
      let _historicalVotes = null; // 8주 이력 조회 결과 (프리셋·초기값용)
      let _dateChangeMap = {}; // { 지금키: 원래DB날짜 } — 날짜 변경 진행 중인 행들(여러 행 동시 가능). 저장 시 원래 날짜를 삭제
      let _dateChangeWeekOffset = 0; // 날짜 변경 picker 자체 주 네비(Step1과 별개)

      const overlay = document.createElement('div');
      overlay.className = 'sched-multi-overlay';
      overlay.id = 'schedMultiOverlay';
      overlay.innerHTML = `<div class="sched-multi-sheet">
        <div class="sm-hdr">
          <button class="sm-back-btn" id="smBack" type="button">← 뒤로</button>
          <span class="sm-title" id="smTitle"></span>
          <button class="sm-close-btn" id="smClose" type="button" aria-label="닫기">✕</button>
        </div>
        <div class="sm-body" id="smBody"></div>
        <div class="sm-footer" id="smFooter"></div>
      </div>`;
      overlay.style.display = 'none';
      document.body.appendChild(overlay);

      const $s = id => document.getElementById(id);

      function close() {
        overlay.style.display = 'none';
        _popPlannerViewToken();
        _days = []; _timeMap = {}; _gameMap = {}; _intentMap = {}; _activeDay = null; _step = 1; _pickerOpen = null; _gameOpen = {want:true, learn:true};
        _pastOpen = {want:false, learn:false}; _srcOpen = {want:false, learn:false}; _othersOpen = {want:false, learn:false};
        _modalWeekOffset = 0; _historicalVotes = null;
        _dateChangeMap = {}; _dateChangeWeekOffset = 0;
        // 홈에서 바로 진입한 경우 돌아갈 주간 뷰가 없으므로 플래너 자체를 닫는다.
        // ⚠️ is-quick-entry를 여기서 제거하지 말 것 — 이 클래스가 .inner-page(플래너 페이지
        //    전체)를 display:none으로 숨기고 있는데, 제거하면 브레드크럼·"모임 플래너" 헤더가
        //    부모가 모달을 숨기기 전에 한 프레임 그려져 깜빡인다(postMessage 비동기라 부모
        //    closeModal이 다음 태스크에 실행됨). 클래스 정리는 다음 정상 오픈(cottage-reset-week).
        if (document.body.classList.contains('is-quick-entry')) {
          if (IS_EMBEDDED) {
            window.parent.postMessage({ type: 'cottage-quick-entry-closed' }, '*');
          }
        }
      }
      $s('smClose').addEventListener('click', close);
      overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

      $s('smBack').addEventListener('click', () => {
        if (_step === 2) renderStep1();
        else if (_step === 3) { readStep4Form(); renderStep2(); }
        else if (_step === 4) renderStep4();
      });

      // ── 헬퍼 ──────────────────────────────────────────────────

      function resolveGameName(item) {
        if (item.custom_name) return item.custom_name;
        if (item.game_id) {
          const g = (window.COTTAGE_GAMES || []).find(g => g.bggId === String(item.game_id) || g.id === String(item.game_id));
          return g?.display || `#${item.game_id}`;
        }
        return '?';
      }

      function isDup(section, item) {
        const list = _gameMap[_activeDay]?.[section] || [];
        return list.some(g =>
          (g.game_id && item.game_id && String(g.game_id) === String(item.game_id)) ||
          (g.custom_name && item.custom_name && g.custom_name.trim() === item.custom_name.trim())
        );
      }

      // 조회 실패·비로그인 시의 빈 값 — 키마다 모양이 다르다(배열 vs 섹션 객체)
      function emptyPickerValue(cacheKey) {
        if (cacheKey === 'meeting') return { want: [], rule: [] };
        if (cacheKey === 'past')    return { want: [], learn: [] };
        return [];
      }

      // 「지난 모임」 피커용: 최근 8주(오늘 제외)에 내가 등록했던 게임을 최신순으로,
      // 같은 게임은 한 번만. 전용 조회 함수를 새로 만들지 않고 기존
      // getMeetingVoteGames(기간)을 재사용해 내 것만 걸러낸다.
      // 피커 항목 정규화 — 게임의 신원 표기가 출처마다 다르다(실측 2026-07-21).
      //   game_likes/game_curious : game_id에 **슬러그**('리바이브'), custom_name은 null
      //   meeting_vote_games(신)   : game_id에 **bggId**(332772)
      //   meeting_vote_games(구)   : game_id 없음 + custom_name에 '#슬러그'
      // 섞인 채로 비교하면 같은 게임을 서로 못 알아본다 → 이미 담은 게임인데 피커가
      // 「+ 추가」로 보이고(눌러도 무반응), 지난 모임 목록엔 같은 게임이 두 줄로 뜬다.
      // 여기서 전부 {bggId, 정식이름} 한 가지 모양으로 맞춘다.
      function normalizePickerItem(row) {
        const rawId = row.game_id;
        // 이미 bggId(숫자)면 그대로 — 이름은 resolveGameName이 채운다
        if (rawId != null && rawId !== '' && !isNaN(Number(rawId))) {
          return { game_id: rawId, custom_name: row.custom_name ?? null };
        }
        // 슬러그가 game_id에 있거나('리바이브'), custom_name에 '#'으로 붙어 있다
        const slug = String(rawId || row.custom_name || '').replace(/^#/, '').trim();
        if (!slug) return null;
        const cg = (window.COTTAGE_GAMES || []).find(c => c.id === slug || c.display === slug || c.titleKo === slug);
        if (!cg) return { game_id: null, custom_name: slug };
        const bgg = cg.bggId && !isNaN(Number(cg.bggId)) ? Number(cg.bggId) : null;
        return { game_id: bgg, custom_name: cg.display || slug };
      }

      const PAST_PICKER_WEEKS = 8;
      async function fetchPastVoteGames(userId) {
        const from = new Date(TODAY); from.setDate(TODAY.getDate() - PAST_PICKER_WEEKS * 7);
        const to   = new Date(TODAY); to.setDate(TODAY.getDate() - 1);
        const rows = await window.CottageDB?.getMeetingVoteGames(toDateStr(from), toDateStr(to)) || [];
        const mine = rows
          .filter(r => String(r.user_id) === String(userId))
          .sort((a, b) => String(b.vote_date || '').localeCompare(String(a.vote_date || '')));
        const hidden = _getHiddenPastGames(userId);
        const pick = listType => {
          const seen = new Set(); const out = [];
          mine.forEach(r => {
            if (r.list_type !== listType) return;
            const g = normalizePickerItem(r);
            if (!g) return;
            const key = g.game_id ? `id:${g.game_id}` : `nm:${String(g.custom_name || '').trim()}`;
            if (key === 'nm:' || seen.has(key) || hidden.has(`${listType}:${key}`)) return;
            seen.add(key);
            out.push({ ...g, _pastKey: key }); // 삭제 버튼에서 키 재계산 없이 재사용
          });
          return out;
        };
        return { want: pick('want'), learn: pick('learn') };
      }

      async function fetchPickerData(cacheKey) {
        const user = window.getKakaoUser?.();
        if (!user) { _pickerCache[cacheKey] = emptyPickerValue(cacheKey); return; }
        try {
          if (cacheKey === 'like') {
            _pickerCache.like = await window.CottageDB?.getUserLikedGamesAll(String(user.id)) || [];
          } else if (cacheKey === 'curious') {
            _pickerCache.curious = await window.CottageDB?.getUserCuriousGamesAll(String(user.id)) || [];
          } else if (cacheKey === 'meeting') {
            const profile = await window.CottageDB?.getMeetingProfile(String(user.id));
            _pickerCache.meeting = { want: profile?.wantGames || [], rule: profile?.ruleGames || [] };
          } else if (cacheKey === 'past') {
            _pickerCache.past = await fetchPastVoteGames(user.id);
          }
        } catch(e) {
          console.error('[fetchPickerData] 실패', cacheKey, e);
          _pickerCache[cacheKey] = emptyPickerValue(cacheKey);
        }
      }

      // 이 날 다른 참여자가 이미 고른 게임 — allVoteGames는 이미 메모리에 있어 like/curious/past처럼
      // 별도 fetch가 필요 없다(동기). 같은 게임을 여러 명이 골랐으면 한 항목으로 묶고 count를 단다
      // (시간 맞추기 버튼과 같은 원칙 — 동일 시간을 "OO 외 N명"으로 묶은 것과 대응).
      // 🚨 want/learn 둘 다 섞어서 반환한다(2026-08-09) — 다른 참여자가 "배우고 싶은" 게임을
      // 내가 "하고 싶을" 수도, 그 반대도 있어서 want 섹션이든 learn 섹션이든 다른참여자
      // 버튼을 누르면 둘 다 보여준다. 어느 리스트에 담길지는 items[i].listType이 아니라
      // 지금 연 섹션(want/learn) 기준 — pickerHtml에서 listType별로 나눠 그리기만 하고,
      // "+추가"는 항상 지금 섹션에 담는다(좋아요/지난모임 피커와 같은 동작 원칙 유지).
      function othersPickedGamesAll() {
        const user = window.getKakaoUser?.();
        const uid = user ? String(user.id) : null;
        const rows = (allVoteGames || []).filter(g =>
          g.vote_date === _activeDay && (g.list_type === 'want' || g.list_type === 'learn') && (!uid || String(g.user_id) !== uid));
        const groups = new Map();
        rows.forEach(raw => {
          const norm = normalizePickerItem(raw);
          if (!norm) return;
          const key = raw.list_type + '|' + (norm.game_id ?? '') + '|' + (norm.custom_name ?? '');
          if (!groups.has(key)) groups.set(key, { ...norm, listType: raw.list_type, count: 0 });
          groups.get(key).count++;
        });
        return [...groups.values()].sort((a, b) => b.count - a.count);
      }

      function getPickerItems(section, source) {
        // like/curious는 슬러그 표기라 그대로 두면 "이미 담김"을 못 알아본다 → 정규화해서 반환
        if (source === 'like')    return (_pickerCache.like    || []).map(normalizePickerItem).filter(Boolean);
        if (source === 'curious') return (_pickerCache.curious || []).map(normalizePickerItem).filter(Boolean);
        if (source === 'meeting') {
          const m = _pickerCache.meeting;
          if (!m || m === 'loading') return [];
          return section === 'want' ? (m.want || []) : (m.rule || []);
        }
        if (source === 'past') {
          const p = _pickerCache.past;
          if (!p || p === 'loading') return [];
          return section === 'want' ? (p.want || []) : (p.learn || []);
        }
        if (source === 'others') return othersPickedGamesAll();
        return [];
      }

      function pickerSectionLabel(section, source) {
        if (source === 'like')    return '좋아하는 게임 (취향보드)';
        if (source === 'curious') return '궁금한 게임 (취향보드)';
        if (source === 'meeting') return section === 'want' ? '하고 싶은 게임 (모임보드)' : '룰 설명 가능 게임 (모임보드 참고)';
        if (source === 'others')  return '이 날 다른 참여자가 고른 게임';
        return '';
      }

      function buildTabs() {
        const DOW_KR = ['일','월','화','수','목','금','토'];
        return _days.map(ds => {
          const d = parseDate(ds);
          return `<button class="sm-tab${ds === _activeDay ? ' is-active' : ''}" data-ds="${ds}" type="button">`
            + `${DOW_KR[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}</button>`;
        }).join('');
      }

      function initDay(ds) {
        if (!_timeMap[ds]) {
          const user = window.getKakaoUser?.();
          const ex = user && allVotes.find(v => v.vote_date === ds && String(v.user_id) === String(user.id));
          _timeMap[ds] = { s: ex?.time_start ?? 10, e: ex?.time_end ?? 22 };
        }
        if (!_gameMap[ds]) {
          const user = window.getKakaoUser?.();
          const uid = user ? String(user.id) : null;
          _gameMap[ds] = {
            want:  uid ? allVoteGames.filter(g => g.vote_date===ds && String(g.user_id)===uid && g.list_type==='want') .map(g=>({game_id:g.game_id, custom_name:g.custom_name, is_priority:g.is_priority??false, player_condition:g.player_condition??'any'})) : [],
            learn: uid ? allVoteGames.filter(g => g.vote_date===ds && String(g.user_id)===uid && g.list_type==='learn').map(g=>({game_id:g.game_id, custom_name:g.custom_name, is_priority:g.is_priority??false, player_condition:g.player_condition??'any'})) : []
          };
        }
        if (!_intentMap[ds]) {
          const user = window.getKakaoUser?.();
          const ex = user && allVotes.find(v => v.vote_date === ds && String(v.user_id) === String(user.id));
          _intentMap[ds] = {
            gameStyle: ex?.game_style ?? '',
            gameStyleCustom: ex?.game_style_custom ?? '',
            gameDepth: ex?.game_depth ?? '',
            playTraits: Array.isArray(ex?.play_traits) ? [...ex.play_traits] : [],
            recruitmentMessage: ex?.recruitment_message ?? '',
          };
        }
      }

      // ── Step 1: 요일 선택 ──────────────────────────────────────
      function renderStep1() {
        _step = 1;
        $s('smTitle').textContent = '함께할 날 고르기';
        $s('smBack').style.visibility = 'hidden';

        const DOW_KR = ['일','월','화','수','목','금','토'];
        const dow = TODAY.getDay();
        const daysToMon = dow === 0 ? -6 : 1 - dow;
        const monday = new Date(TODAY);
        monday.setDate(TODAY.getDate() + daysToMon + _modalWeekOffset * 7);
        const weekDates = Array.from({length:7}, (_, i) => {
          const d = new Date(monday); d.setDate(monday.getDate() + i); return d;
        });

        const wkLabel = _modalWeekOffset === 0 ? '이번주'
          : _modalWeekOffset === -1 ? '지난주'
          : _modalWeekOffset === 1 ? '다음주'
          : _modalWeekOffset > 0 ? `${_modalWeekOffset}주 후` : `${-_modalWeekOffset}주 전`;
        const wkRange = `${monday.getMonth()+1}/${monday.getDate()}~${weekDates[6].getMonth()+1}/${weekDates[6].getDate()}`;
        const prevDisabled = weekDates[6] < TODAY; // 주 전체가 과거

        const user = window.getKakaoUser?.();
        const chips = weekDates.map(d => {
          const ds   = toDateStr(d);
          const past = d < TODAY;
          const tod  = d.getTime() === TODAY.getTime();
          const sel  = _days.includes(ds);
          const mine = user && allVotes.some(v => v.vote_date===ds && String(v.user_id)===String(user.id));
          const cnt  = partyCount(allVotes.filter(v => v.vote_date === ds));
          // 🚨 2026-07-28까지 mine(이미 등록된 날)은 disabled였다 — 등록된 날끼리는
          // 절대 함께 못 골랐고, 수정 진입(cottage-edit)으로 들어온 그 하루 + "다른"
          // (미등록) 날만 엮을 수 있는 구조였다(사용자 지적: "등록된 날 중 하루+다른날만
          // 엮어서 한번에 재등록하는 시스템"). 여러 등록일을 한 번에 묶어 게임을
          // 넣고 빼려면 여기서부터 풀어야 해 disabled에서 뺐다 — 과거만 계속 막는다.
          return `<button class="sm-day-chip${sel?' is-sel':''}${past?' is-past':''}${tod?' is-today':''}${mine?' is-registered':''}"
            data-ds="${ds}" type="button"${past?' disabled':''}>
            <span class="sm-dc-dow">${DOW_KR[d.getDay()]}</span>
            <span class="sm-dc-date">${d.getMonth()+1}/${d.getDate()}</span>
            ${cnt > 0 ? `<span class="sm-dc-cnt">${cnt}명</span>` : ''}
            ${mine?'<span class="sm-dc-mine">등록됨</span>':''}
          </button>`;
        }).join('');

        function buildSummary() {
          if (!_days.length) return '';
          const formatted = _days.map(ds => {
            const d = parseDate(ds);
            return `${d.getMonth()+1}/${d.getDate()}(${DOW_KR[d.getDay()]})`;
          }).join(', ');
          return `<p class="sm-sel-summary">선택: ${formatted}</p>`;
        }

        $s('smBody').innerHTML = `
          <div class="sm-week-nav">
            <button aria-label="이전주" class="sm-week-nav-btn" id="smWkPrev" type="button"${prevDisabled?' disabled':''}>◀</button>
            <span class="sm-week-label">${wkRange} · ${wkLabel}</span>
            <button aria-label="다음주" class="sm-week-nav-btn" id="smWkNext" type="button">▶</button>
          </div>
          <p class="sm-hint">함께할 수 있는 날을 골라주세요. (여러 날 선택할 수 있고, 등록한 날도 다시 눌러 수정할 수 있어요.)</p>
          <div class="sm-day-chips" id="smDayChips">${chips}</div>
          <div id="smSelSummary">${buildSummary()}</div>`;
        $s('smFooter').innerHTML =
          `<button class="sched-confirm-btn" id="smNext1" type="button"${_days.length===0?' disabled':''}>다음 →</button>`;

        $s('smWkPrev').addEventListener('click', () => { _modalWeekOffset--; renderStep1(); });
        $s('smWkNext').addEventListener('click', () => { _modalWeekOffset++; renderStep1(); });

        $s('smDayChips').querySelectorAll('.sm-day-chip:not([disabled])').forEach(btn => {
          btn.addEventListener('click', () => {
            const ds = btn.dataset.ds;
            if (_days.includes(ds)) { _days = _days.filter(x => x !== ds); btn.classList.remove('is-sel'); }
            else { _days.push(ds); _days.sort(); btn.classList.add('is-sel'); }
            $s('smNext1').disabled = _days.length === 0;
            $s('smSelSummary').innerHTML = buildSummary();
          });
        });
        $s('smNext1').addEventListener('click', () => {
          _fromStep1 = true;
          _days.forEach(initDay);
          renderStep2();
        });
      }

      // ── Step 2: 시간 설정 (날짜별 행) ────────────────────────
      function renderStep2() {
        _step = 2;
        if (!_activeDay || !_days.includes(_activeDay)) _activeDay = _days[0];
        $s('smTitle').textContent = '시간 설정';
        $s('smBack').style.visibility = 'visible';
        $s('smBack').textContent = '← 날짜 더 선택';

        const DOW_KR = ['일','월','화','수','목','금','토'];
        const user = window.getKakaoUser?.();
        const R = MAX_H - MIN_H;

        // 프리셋: allVotes + _historicalVotes 합산, 빈도 상위 3개
        const combined = [
          ...(user ? allVotes.filter(v => String(v.user_id) === String(user.id)) : []),
          ...(_historicalVotes && user ? _historicalVotes.filter(v => String(v.user_id) === String(user.id)) : [])
        ];
        const freq = {};
        combined.forEach(v => {
          const key = `${v.time_start}-${v.time_end}`;
          if (!freq[key]) freq[key] = { s: v.time_start, e: v.time_end, count: 0, latest: v.vote_date || '' };
          freq[key].count++;
          if ((v.vote_date || '') > freq[key].latest) freq[key].latest = v.vote_date;
        });
        // 더 이상 안 쓰고 싶은 프리셋은 로컬에 숨김 처리(계정별) — 실제 과거 참여 기록(DB)은
        // 안 건드리고 "빈도 상위 3개" 후보에서만 뺀다(2026-08-02, 사용자 요청). 숨기면 그
        // 자리에 다음 순위가 올라오도록 slice(0,3) 전에 거른다.
        const _hiddenPresets = user ? _getHiddenTimePresets(user.id) : new Set();
        const presets = Object.values(freq)
          .filter(p => !_hiddenPresets.has(`${p.s}-${p.e}`))
          .sort((a, b) => b.count - a.count || b.latest.localeCompare(a.latest))
          .slice(0, 3);

        // 날짜 변경 버튼은 "그 행의 날짜가 이미 내 등록(DB)" 이거나 "이미 한 번 옮긴 중(재변경)"일 때
        // 행마다 각각 뜬다 — 여러 날짜(목·일 등)를 한 번에 편집 중이어도 각자 독립적으로 옮길 수 있다
        // (2026-07-30, 사용자 요청). 아직 저장 안 된 새 날짜(Step1에서 방금 고른 미등록일)는 애초에
        // Step1에서 다른 날을 고르면 되므로 옮길 대상이 아니다.
        // 🚨 처음엔 "선택된 날이 정확히 하루일 때만"으로 좁혀놨었는데, 여러 날 동시 수정 중엔
        // 하나도 안 떴다(사용자 요청으로 발견). _days.length 조건을 없애고 행 단위 판정으로 바꿈.
        const _canChangeDate = ds =>
          !!_dateChangeMap[ds] ||
          !!(user && allVotes.some(v => v.vote_date===ds && String(v.user_id)===String(user.id)));

        // 이 날 이미 등록한 다른 사람들의 시간 — 동일 시간(time_start·time_end 둘 다 일치)은
        // 한 그룹으로 묶는다. 내 프리셋(presets, 위)과는 출처가 다르다(내 과거 기록 vs 그 날
        // 다른 사람들의 현재 기록)라 별도 계산이지만, 렌더는 같은 .sm-time-preset-chip 클래스를
        // 재사용해 기존 활성표시·클릭 바인딩(아래 forEach)이 그대로 먹도록 한다.
        const _otherGroupsByDs = ds => {
          const others = allVotes.filter(v => v.vote_date === ds && (!user || String(v.user_id) !== String(user.id)));
          const groups = new Map();
          others.forEach(v => {
            const key = v.time_start + '-' + v.time_end;
            if (!groups.has(key)) groups.set(key, { s: v.time_start, e: v.time_end, names: [] });
            groups.get(key).names.push(v.nickname || '익명');
          });
          return [...groups.values()].sort((a, b) => b.names.length - a.names.length || a.s - b.s);
        };

        const rowsHtml = _days.map(ds => {
          const d = parseDate(ds);
          const t = _timeMap[ds] || { s: 10, e: 22 };
          const label = `${DOW_KR[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}`;
          const fl = ((t.s - MIN_H) / R * 100).toFixed(1);
          const fw = ((t.e - t.s) / R * 100).toFixed(1);
          // 내 프리셋만 ✕로 숨길 수 있다(아래 sm-preset-del-btn) — 버튼 안에 버튼을 못 넣으므로
          // 칩과 ✕를 wrap span으로 묶는다. 재사용 칩(이 날 참여자·지난주)에는 안 붙인다.
          const chipsHtml = presets.map(p =>
            `<span class="sm-time-preset-wrap">` +
            `<button class="sm-time-preset-chip${t.s===p.s&&t.e===p.e?' is-active':''}"
             data-ds="${esc(ds)}" data-s="${p.s}" data-e="${p.e}" type="button">${window.formatVoteHour(p.s)}~${window.formatVoteHour(p.e)}</button>` +
            `<button class="sm-preset-del-btn" data-s="${p.s}" data-e="${p.e}" type="button" aria-label="이 시간 프리셋 삭제" title="이 시간 프리셋 삭제">✕</button>` +
            `</span>`
          ).join('');
          const otherGroups = _otherGroupsByDs(ds);
          const matchHtml = otherGroups.length
            ? `<div class="sm-time-match-label">이 날 다른 참여자 시간에 맞추기</div><div class="sm-time-preset-chips">` +
              otherGroups.map(g => {
                const nameText = g.names.length <= 2
                  ? g.names.join(', ')
                  : `${g.names.slice(0, 2).join(', ')} 외 ${g.names.length - 2}명`;
                return `<button class="sm-time-preset-chip sm-time-match-chip${t.s===g.s&&t.e===g.e?' is-active':''}"
                 data-ds="${esc(ds)}" data-s="${g.s}" data-e="${g.e}" type="button">${window.escH(nameText)} · ${window.formatVoteHour(g.s)}~${window.formatVoteHour(g.e)}</button>`;
              }).join('') + `</div>`
            : '';
          return `<div class="sm-time-row">
            <div class="sm-time-row-hdr">
              <span class="sm-time-row-label">${esc(label)}${_canChangeDate(ds) ? ` <button class="sm-date-change-btn" data-ds="${esc(ds)}" type="button">📅 날짜 변경</button>` : ''}</span>
              <span class="sm-time-row-val" id="smTV_${ds}">${window.formatVoteHour(t.s)}~${window.formatVoteHour(t.e)}</span>
            </div>
            ${chipsHtml ? `<div class="sm-time-preset-chips">${chipsHtml}</div>` : ''}
            ${matchHtml}
            <div class="sm-time-slider-wrap">
              <div class="sched-dual-range">
                <div class="sched-range-track">
                  <div class="sched-range-fill" id="smF_${ds}" style="left:${fl}%;width:${fw}%"></div>
                </div>
                <input aria-label="시작 시각" type="range" class="sched-range-input" id="smRS_${ds}" min="${MIN_H}" max="${MAX_H-1}" step="0.5" value="${t.s}">
                <input aria-label="끝 시각" type="range" class="sched-range-input" id="smRE_${ds}" min="${MIN_H+1}" max="${MAX_H}" step="0.5" value="${t.e}">
              </div>
              <div class="sched-range-axis">
                <span>${MIN_H}시</span><span>${Math.round((MIN_H+MAX_H)/2)}시</span><span>${MAX_H}시</span>
              </div>
            </div>
            <div class="sched-guest-row">
              <span class="sched-guest-label">👥 동반 인원</span>
              <div class="sched-guest-ctrl">
                <button class="sched-guest-btn" id="smGM_${ds}" type="button" aria-label="동반 인원 수 줄이기">−</button>
                <input class="sched-guest-input" id="smG_${ds}" type="number" inputmode="numeric"
                  min="0" max="${GUEST_MAX}" step="1" value="${_guestMap[ds] || 0}" aria-label="동반 인원 수">
                <button class="sched-guest-btn" id="smGP_${ds}" type="button" aria-label="동반 인원 수 늘리기">+</button>
              </div>
              <span class="sched-guest-total" id="smGT_${ds}">나 포함 1명</span>
            </div>
          </div>`;
        }).join('');

        $s('smBody').innerHTML = rowsHtml;
        $s('smFooter').innerHTML = `<button class="sched-confirm-btn" id="smNext2" type="button">다음 →</button>`;

        $s('smBody').querySelectorAll('.sm-date-change-btn').forEach(btn => {
          btn.addEventListener('click', e => { e.stopPropagation(); renderDateChangePicker(btn.dataset.ds); });
        });

        // 프리셋 ✕ — 확인 후 계정별로 숨기고 다시 그린다(presets는 날짜 무관 — 내 과거
        // 전체 기록 기준이라 한 번 숨기면 모든 날짜 행에서 같이 빠진다).
        $s('smBody').querySelectorAll('.sm-preset-del-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            if (!user) return;
            const s = parseFloat(btn.dataset.s), eVal = parseFloat(btn.dataset.e);
            if (!confirm(`${window.formatVoteHour(s)}~${window.formatVoteHour(eVal)} 프리셋을 다시 안 보이게 할까요?`)) return;
            _hideTimePreset(user.id, s, eVal);
            renderStep2();
          });
        });

        _days.forEach(ds => {
          bindGuestStepper({
            input: $s(`smG_${ds}`), minus: $s(`smGM_${ds}`),
            plus:  $s(`smGP_${ds}`), total: $s(`smGT_${ds}`),
            onChange: n => { _guestMap[ds] = n; },
          });

          const rsEl = $s(`smRS_${ds}`);
          const reEl = $s(`smRE_${ds}`);
          const fillEl = $s(`smF_${ds}`);
          const valEl = $s(`smTV_${ds}`);
          if (!rsEl || !reEl) return;

          function syncRow() {
            const s = parseFloat(rsEl.value), e = parseFloat(reEl.value);
            fillEl.style.left = ((s-MIN_H)/R*100) + '%';
            fillEl.style.width = ((e-s)/R*100) + '%';
            valEl.textContent = `${window.formatVoteHour(s)}~${window.formatVoteHour(e)}`;
            _timeMap[ds] = { s, e };
            $s('smBody').querySelectorAll(`.sm-time-preset-chip[data-ds="${ds}"]`).forEach(c => {
              c.classList.toggle('is-active', parseFloat(c.dataset.s)===s && parseFloat(c.dataset.e)===e);
            });
          }

          rsEl.addEventListener('input', () => {
            if (parseFloat(rsEl.value) >= parseFloat(reEl.value)) rsEl.value = parseFloat(reEl.value) - 0.5;
            syncRow();
          });
          reEl.addEventListener('input', () => {
            if (parseFloat(reEl.value) <= parseFloat(rsEl.value)) reEl.value = parseFloat(rsEl.value) + 0.5;
            syncRow();
          });

          $s('smBody').querySelectorAll(`.sm-time-preset-chip[data-ds="${ds}"]`).forEach(chip => {
            chip.addEventListener('click', () => {
              rsEl.value = chip.dataset.s;
              reEl.value = chip.dataset.e;
              syncRow();
            });
          });
        });

        $s('smNext2').addEventListener('click', () => renderStep4());
      }

      // ── 날짜 변경 (행 단위) ─────────────────────────────────────
      // 등록된 요일 하나를 다른 날로 옮긴다 — 지금까지 입력한 시간/동반인원/게임은 그대로 새 날짜로
      // 옮기고, 저장 시 원래 날짜의 DB 등록을 삭제한다(saveAll 참조). 삭제+재등록을 한 번의
      // 흐름으로 감싼 것뿐이라 DB 스키마 변경은 없다. 여러 날짜를 동시에 편집 중이면(목·일 등)
      // 각 행이 독립적으로 이 picker를 열 수 있다 — currentDs로 "어느 행"인지 받는다.
      function renderDateChangePicker(currentDs) {
        const DOW_KR = ['일','월','화','수','목','금','토'];
        const user = window.getKakaoUser?.();
        // 같이 편집 중인 다른 행의 날짜들 — 옮기려는 곳이 그 날짜와 겹치면 두 행이 합쳐져야
        // 하는 모호한 상황이라 막는다(자기 자신은 제외).
        const otherRowDays = _days.filter(d => d !== currentDs);
        // 이 행의 "진짜 원본"(DB에 남아있는 날짜) — 이미 한 번 옮긴 상태라면 원래 날짜는
        // 저장 전까지 allVotes에 여전히 남아있다(삭제는 saveAll에서만 일어남). 그래서 원본을
        // takenByMe에서 빼주지 않으면 "이미 등록됨"으로 오판돼 되돌리기를 막아버린다
        // (2026-07-30 사용자 지적: 일요일→금요일로 옮긴 뒤 다시 일요일을 눌러도 안 먹힘).
        const trueOriginal = _dateChangeMap[currentDs] || currentDs;
        const dow = TODAY.getDay();
        const monday = new Date(TODAY);
        monday.setDate(TODAY.getDate() + (dow === 0 ? -6 : 1 - dow) + _dateChangeWeekOffset * 7);
        const weekDates = Array.from({length:7}, (_, i) => { const d = new Date(monday); d.setDate(monday.getDate()+i); return d; });
        const wkRange = `${monday.getMonth()+1}/${monday.getDate()}~${weekDates[6].getMonth()+1}/${weekDates[6].getDate()}`;
        const prevDisabled = weekDates[6] < TODAY;

        const chips = weekDates.map(d => {
          const ds = toDateStr(d);
          const past = d < TODAY;
          const isCurrent = ds === currentDs;
          const isOriginal = ds === trueOriginal && ds !== currentDs;
          // 지금 날짜(currentDs)와 이 행의 원래 날짜(trueOriginal)는 골라도 막지 않는다 —
          // 원래 날짜로 되돌리는 것도 "그대로"와 같은 정당한 선택이다.
          const takenByMe = ds !== currentDs && ds !== trueOriginal && user && allVotes.some(v => v.vote_date===ds && String(v.user_id)===String(user.id));
          const inOtherRow = ds !== currentDs && otherRowDays.includes(ds);
          const disabled = past || takenByMe || inOtherRow;
          return `<button class="sm-day-chip${isCurrent?' is-sel':''}${past?' is-past':''}"
            data-ds="${ds}" type="button"${disabled?' disabled':''}>
            <span class="sm-dc-dow">${DOW_KR[d.getDay()]}</span>
            <span class="sm-dc-date">${d.getMonth()+1}/${d.getDate()}</span>
            ${takenByMe?'<span class="sm-dc-mine">등록됨</span>':inOtherRow?'<span class="sm-dc-mine">편집중</span>':isOriginal?'<span class="sm-dc-original">↩ 원래 날짜</span>':''}
          </button>`;
        }).join('');

        const d0 = parseDate(currentDs);
        $s('smTitle').textContent = `날짜 변경 · ${DOW_KR[d0.getDay()]} ${d0.getMonth()+1}/${d0.getDate()}`;
        // 헤더의 "← 날짜 더 선택"은 _step(=2)만 보고 renderStep1로 보내버려 이 picker와
        // 겹친다 — picker에 있는 동안은 숨기고, 취소(smDcCancel)로만 Step2에 돌아가게 한다.
        $s('smBack').style.visibility = 'hidden';
        $s('smBody').innerHTML = `
          <p class="sm-hint">옮길 날짜를 선택하세요</p>
          <div class="sm-week-nav">
            <button aria-label="이전주" class="sm-week-nav-btn" id="smDcPrev" type="button"${prevDisabled?' disabled':''}>◀</button>
            <span class="sm-week-label">${wkRange}</span>
            <button aria-label="다음주" class="sm-week-nav-btn" id="smDcNext" type="button">▶</button>
          </div>
          <div class="sm-day-chips" id="smDcChips">${chips}</div>`;
        $s('smFooter').innerHTML = `<button class="sched-discard-btn" id="smDcCancel" type="button">취소</button>`;

        $s('smDcPrev').addEventListener('click', () => { _dateChangeWeekOffset--; renderDateChangePicker(currentDs); });
        $s('smDcNext').addEventListener('click', () => { _dateChangeWeekOffset++; renderDateChangePicker(currentDs); });
        $s('smDcCancel').addEventListener('click', () => { _dateChangeWeekOffset = 0; renderStep2(); });
        $s('smDcChips').querySelectorAll('.sm-day-chip:not([disabled])').forEach(btn => {
          btn.addEventListener('click', () => applyDateChange(currentDs, btn.dataset.ds));
        });
      }

      function applyDateChange(oldDs, newDs) {
        _dateChangeWeekOffset = 0;
        if (newDs === oldDs) { renderStep2(); return; }
        // 이 행이 이미 한 번 이상 옮겨진 적 있으면(재변경) 그 "진짜 원본"(DB 등록 날짜)을 이어받는다 —
        // oldDs 자신은 아직 저장 안 된 중간값이라 삭제 대상이 아니다.
        const trueOriginal = _dateChangeMap[oldDs] || oldDs;
        delete _dateChangeMap[oldDs];
        _dateChangeMap[newDs] = trueOriginal;
        _timeMap[newDs] = _timeMap[oldDs]; delete _timeMap[oldDs];
        _guestMap[newDs] = _guestMap[oldDs]; delete _guestMap[oldDs];
        _gameMap[newDs] = _gameMap[oldDs]; delete _gameMap[oldDs];
        _intentMap[newDs] = _intentMap[oldDs]; delete _intentMap[oldDs];
        // 이 행만 새 날짜로 교체 — 같이 편집 중인 다른 날짜(행)는 그대로 둔다.
        _days = _days.map(d => d === oldDs ? newDs : d).sort();
        if (_activeDay === oldDs) _activeDay = newDs;
        renderStep2();
      }

      // ── Step 2 게임 섹션 렌더 ────────────────────────────────────
      function renderStep2Games() {
        const wrap = document.getElementById('smGameSections');
        if (!wrap) return;
        if (!_gameMap[_activeDay]) _gameMap[_activeDay] = {want:[], learn:[]};

        function gameListHtml(type) {
          const COND_OPTS = [
            {val:'any',label:'무관'},{val:'best',label:'베스트'},{val:'recommended',label:'추천'},
            {val:'2',label:'2인'},{val:'3',label:'3인'},{val:'4',label:'4인'},{val:'5+',label:'5인+'}
          ];
          return (_gameMap[_activeDay][type] || []).map((g, i) => {
            const cond = g.player_condition ?? 'any';
            let rawGame = null;
            if (g.game_id && window.COTTAGE_GAMES) {
              const cg = window.COTTAGE_GAMES.find(c => String(c.bggId) === String(g.game_id));
              rawGame = cg ? window.gameData?.[cg.id] : null;
            }
            if (!rawGame && g.custom_name && window.COTTAGE_GAMES) {
              const pureName = (g.custom_name || '').replace(/^#/, '');
              const cg = window.COTTAGE_GAMES.find(c => c.display === pureName || c.titleKo === pureName);
              rawGame = cg ? window.gameData?.[cg.id] : null;
            }
            const hasBest = (rawGame?.bgg?.bestPlayers?.length ?? 0) > 0;
            const hasRec  = (rawGame?.bgg?.recommendedPlayers?.length ?? 0) > 0;
            const condChips = COND_OPTS.map(o => {
              const noData = (o.val === 'best' && !hasBest) || (o.val === 'recommended' && !hasRec);
              const dis = noData ? ' disabled' : '';
              const act = cond === o.val ? ' is-active' : '';
              let chipLabel = o.label;
              if ((o.val === 'best' || o.val === 'recommended') && !noData) {
                const fl = window.formatCondLabel?.(o.val, g.game_id);
                if (fl) chipLabel = fl;
              }
              return `<button class="sm-cond-chip${act}" data-cctype="${type}" data-ccidx="${i}" data-ccval="${o.val}" type="button"${dis}>${chipLabel}</button>`;
            }).join('');
            const syncBtn = _days.length > 1
              ? `<button class="sm-game-sync${g._syncOther ? ' is-active' : ''}" data-type="${type}" data-idx="${i}" type="button" aria-pressed="${g._syncOther ? 'true' : 'false'}" title="다른 날짜에도 적용" aria-label="다른 날짜에도 적용">↔</button>`
              : '';
            return `<div class="sm-game-item" style="flex-wrap:wrap;padding-bottom:0">
              <span class="sm-game-name">${esc(g.custom_name || resolveGameName(g))}</span>
              ${syncBtn}
              <button class="sm-game-star" data-type="${type}" data-idx="${i}" type="button" aria-pressed="${g.is_priority ? 'true' : 'false'}" aria-label="대표 게임 지정">${g.is_priority ? '⭐' : '☆'}</button>
              <button class="sm-game-del" data-type="${type}" data-idx="${i}" type="button" aria-label="삭제">✕</button>
              <div class="sm-cond-row" style="width:100%">${condChips}</div>
            </div>`;
          }).join('');
        }

        function pickerHtml(type, source) {
          // others는 allVoteGames에서 즉시 계산되는 동기 소스라 like/curious/past처럼
          // _pickerCache의 loading/fetch 게이트를 안 탄다 — 게이트를 그대로 적용하면
          // _pickerCache.others가 항상 undefined라 영영 빈 값으로 보인다.
          if (source !== 'others') {
            const cached = _pickerCache[source];
            if (cached === 'loading') return `<div class="sm-picker-panel"><div class="sm-picker-loading">불러오는 중…</div></div>`;
            if (!cached) return '';
          }
          const items = getPickerItems(type, source);
          const isPast = source === 'past';
          const isOthers = source === 'others';
          if (!items.length) {
            const emptyMsg = isPast ? `지난 ${PAST_PICKER_WEEKS}주 모임에 등록한 게임이 없어요`
              : isOthers ? '이 날 다른 참여자가 아직 고른 게임이 없어요'
              : '등록된 게임이 없어요';
            return `<div class="sm-picker-panel"><div class="sm-picker-empty">${emptyMsg}</div></div>`;
          }

          function itemBtnHtml(g, i, removable) {
            const name = resolveGameName(g);
            const dup  = isDup(type, g);
            const countSuffix = (isOthers && g.count > 1) ? ` · ${g.count}명` : '';
            const delBtn = removable ? `<button class="sm-picker-del" data-pdelidx="${i}" data-ptype="${type}" type="button" aria-label="목록에서 지우기" title="목록에서 지우기">✕</button>` : '';
            return `<div class="sm-picker-item-row">
              <button class="sm-picker-item${dup?' is-added':''}" data-pidx="${i}" data-ptype="${type}" data-psrc="${source}" type="button"${dup?' disabled':''}>
                <span>${esc(name)}${countSuffix}</span>
                <span class="sm-picker-tag">${dup?'추가됨':'+ 추가'}</span>
              </button>${delBtn}
            </div>`;
          }

          // 다른 참여자 피커는 want/learn이 섞여 있어 "OO가 하고 싶어하는" / "배우고 싶어하는"
          // 둘로 나눠 보여준다 — 원래 리스트 타입과 무관하게 "+추가"는 항상 지금 섹션에 담긴다.
          if (isOthers) {
            const wantIdx = [], learnIdx = [];
            items.forEach((g, i) => (g.listType === 'learn' ? learnIdx : wantIdx).push(i));
            const groupHtml = (idxs, label) => idxs.length
              ? `<div class="sm-picker-label">${esc(label)}</div>${idxs.map(i => itemBtnHtml(items[i], i, false)).join('')}`
              : '';
            return `<div class="sm-picker-panel">
              ${groupHtml(wantIdx, '다른 참여자가 하고 싶어하는 게임')}
              ${groupHtml(learnIdx, '다른 참여자가 배우고 싶어하는 게임')}
            </div>`;
          }

          const label = isPast
            ? (type === 'want' ? '지난 모임에서 하고 싶었던 게임' : '지난 모임에서 배우고 싶었던 게임')
            : (type === 'want' ? '좋아요한 게임' : '궁금한 게임');
          return `<div class="sm-picker-panel">
            <div class="sm-picker-label">${esc(label)}</div>
            ${items.map((g, i) => itemBtnHtml(g, i, isPast)).join('')}
          </div>`;
        }

        function sectionHtml(type) {
          const icon  = type === 'want' ? '🎲' : '📖';
          const label = type === 'want' ? '하고 싶은 게임' : '배우고 싶은 게임';
          const open  = _gameOpen[type];
          const count = (_gameMap[_activeDay]?.[type] || []).length;
          const source = type === 'want' ? 'like' : 'curious';

          const btnLabel = open
            ? `${icon} ${label} (${count}) ▲`
            : `${icon} ${label} (${count}) ▾`;

          if (!open) {
            return `<div class="sm-game-block"><button class="sm-game-toggle" data-gtoggle="${type}" type="button">${btnLabel}</button></div>`;
          }
          const pastLabel = type === 'want' ? '하고 싶었던' : '배우고 싶었던';
          const srcLabel   = type === 'want' ? '좋아요한 게임' : '궁금한 게임';
          const srcBtnText = type === 'want' ? '좋아요' : '궁금';
          // 4개 축: [게임이름 입력+추가] / 좋아요 / 지난모임 / 다른참여자 — 전부 한 행,
          // 셋 다 같은 클릭-토글 패턴(2026-08-02, 사용자가 순서까지 직접 지정). 상시노출
          // 실험(패널을 행 위에 항상 그리기)은 폐기하고 좋아요·지난모임과 완전히 같은 축으로.
          const othersCount = othersPickedGamesAll().length;
          const othersBtnText = othersCount ? `다른참여자 (${othersCount})` : '다른참여자';
          return `<div class="sm-game-block is-open">
            <button class="sm-game-toggle is-open" data-gtoggle="${type}" type="button">${btnLabel}</button>
            <div class="sm-game-section">
              <div class="sm-game-input-row">
                <input class="sm-game-input" id="sm_${type}_input" type="text" placeholder="게임 이름 입력 후 Enter" autocomplete="off">
                <button class="sm-game-past-btn${_srcOpen[type] ? ' is-open' : ''}" data-gsrc="${type}" type="button"
                  title="${srcLabel} 목록에서 고르기" aria-label="${srcLabel} 목록에서 고르기"
                  aria-pressed="${_srcOpen[type] ? 'true' : 'false'}">${srcBtnText}</button>
                <button class="sm-game-past-btn${_pastOpen[type] ? ' is-open' : ''}" data-gpast="${type}" type="button"
                  title="지난 모임에서 ${pastLabel} 게임 불러오기" aria-label="지난 모임에서 ${pastLabel} 게임 불러오기"
                  aria-pressed="${_pastOpen[type] ? 'true' : 'false'}">지난 모임</button>
                <button class="sm-game-past-btn${_othersOpen[type] ? ' is-open' : ''}" data-gothers="${type}" type="button"
                  title="이 날 다른 참여자가 고른 게임" aria-label="이 날 다른 참여자가 고른 게임"
                  aria-pressed="${_othersOpen[type] ? 'true' : 'false'}">${othersBtnText}</button>
              </div>
              ${_srcOpen[type] ? pickerHtml(type, source) : ''}
              ${_pastOpen[type] ? pickerHtml(type, 'past') : ''}
              ${_othersOpen[type] ? pickerHtml(type, 'others') : ''}
              ${gameListHtml(type) ? `<div class="sm-game-picked"><div class="sm-game-picked-label">고른 게임 ${count}개</div>${gameListHtml(type)}</div>` : ''}
            </div>
          </div>`;
        }

        const todayGameCount = (_gameMap[_activeDay]?.want?.length||0) + (_gameMap[_activeDay]?.learn?.length||0);
        const syncAllBtn = (_days.length > 1 && todayGameCount > 0)
          ? `<button class="sm-sync-all-btn" type="button">↔ 오늘 고른 게임 전체 다른 날짜에도 적용</button>` : '';

        wrap.innerHTML = `<div class="sm-game-toggle-wrap">
          ${syncAllBtn}
          ${sectionHtml('want')}
          ${sectionHtml('learn')}
        </div>`;

        // 섹션 펼침/접기 — 피커 조회는 여기서 하지 않는다(버튼을 눌렀을 때만)
        wrap.querySelectorAll('[data-gtoggle]').forEach(btn => {
          btn.addEventListener('click', () => {
            const type = btn.dataset.gtoggle;
            _gameOpen[type] = !_gameOpen[type];
            renderStep2Games();
          });
        });

        // 「좋아요/궁금」 피커 토글 — 상시 노출 대신 버튼으로 연다(사용자 요청 2026-07-21)
        wrap.querySelectorAll('[data-gsrc]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const type   = btn.dataset.gsrc;
            const source = type === 'want' ? 'like' : 'curious';
            _srcOpen[type] = !_srcOpen[type];
            if (_srcOpen[type] && _pickerCache[source] === undefined) {
              _pickerCache[source] = 'loading';
              renderStep2Games();
              await fetchPickerData(source);
            }
            renderStep2Games();
          });
        });

        // 「지난 모임」 피커 토글 — 최초 열 때만 조회(_pickerCache.past에 캐시)
        wrap.querySelectorAll('[data-gpast]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const type = btn.dataset.gpast;
            _pastOpen[type] = !_pastOpen[type];
            if (_pastOpen[type] && _pickerCache.past === undefined) {
              _pickerCache.past = 'loading';
              renderStep2Games();
              await fetchPickerData('past');
            }
            renderStep2Games();
          });
        });

        // 「이 날 다른 참여자」 피커 토글 — allVoteGames가 이미 메모리에 있어 fetch 없이 즉시 토글
        wrap.querySelectorAll('[data-gothers]').forEach(btn => {
          btn.addEventListener('click', () => {
            const type = btn.dataset.gothers;
            _othersOpen[type] = !_othersOpen[type];
            renderStep2Games();
          });
        });

        // Enter 키
        ['want','learn'].forEach(type => {
          const el = document.getElementById(`sm_${type}_input`);
          if (!el) return;
          el.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            const acList = el.closest('div')?.querySelector('.pr-autocomplete-list');
            if (acList?.classList.contains('is-open')) return;
            const val = el.value.trim();
            if (val) { addGameStep2(type, val, null, true); el.value = ''; }
          });
        });

        // 자동완성 (전체 게임 목록)
        if (window.attachAc) {
          ['want','learn'].forEach(type => {
            const el = document.getElementById(`sm_${type}_input`);
            if (!el) return;
            window.attachAc(
              el,
              () => (window.COTTAGE_GAMES || []).map(g => g.display).filter(Boolean),
              (selected) => {
                const cg = (window.COTTAGE_GAMES || []).find(g => g.display === selected);
                const gameId = cg?.bggId && !isNaN(Number(cg.bggId)) ? Number(cg.bggId) : null;
                addGameStep2(type, selected, gameId, false);
                el.value = '';
              }
            );
            // .sm-body(overflow-y:auto)가 드롭다운을 클리핑하는 문제 우회
            // 수정 모드에서 기존 게임이 있으면 입력창이 아래로 밀려 드롭다운이 잘림
            const acList = el.parentElement?.querySelector('.pr-autocomplete-list');
            if (acList) {
              acList.style.position = 'fixed';
              acList.style.zIndex = '500';
              const _repos = () => {
                const r = el.getBoundingClientRect();
                // 폭은 **입력칸이 아니라 입력줄 전체**에 맞춘다 — 버튼이 늘어 입력칸이
                // 114px까지 줄면(실측 356px 화면) 게임 이름이 두 줄로 접혀 못 읽는다.
                const rowR = el.closest('.sm-game-input-row')?.getBoundingClientRect() || r;
                acList.style.left = rowR.left + 'px';
                acList.style.top = (r.bottom + 2) + 'px';
                acList.style.width = rowR.width + 'px';
              };
              el.addEventListener('input', _repos, { passive: true });
              el.addEventListener('focus', _repos, { passive: true });
            }
          });
        }

        // 삭제 — ↔로 동기화해 둔 항목이면 다른 날짜에 심어둔 사본도 같이 뗀다.
        // "다른 날짜에도 같이 해제되는 기능도 있어야 한다"(2026-07-28 사용자 요청) —
        // 동기화는 양방향이라 넣을 때 같이 넣었으면 지울 때도 같이 지워야 짝이 맞는다.
        wrap.querySelectorAll('.sm-game-del').forEach(btn => {
          btn.addEventListener('click', () => {
            const type = btn.dataset.type;
            const idx = parseInt(btn.dataset.idx);
            const g = (_gameMap[_activeDay]?.[type] || [])[idx];
            if (g?._syncOther) removeFromOtherDates(type, g);
            _gameMap[_activeDay][type].splice(idx, 1);
            renderStep2Games();
          });
        });

        // ⭐ 대표 게임 토글 (로컬 — DB 호출 없음), want+learn 합산 최대 2개
        wrap.querySelectorAll('.sm-game-star').forEach(btn => {
          btn.addEventListener('click', () => {
            const type = btn.dataset.type;
            const idx = parseInt(btn.dataset.idx);
            const day = _gameMap[_activeDay];
            const g = (day[type] || [])[idx];
            if (!g) return;
            if (!g.is_priority) {
              const starred = [...(day.want||[]), ...(day.learn||[])].filter(x => x.is_priority).length;
              if (starred >= 2) { showToast('대표 게임은 최대 2개까지 지정할 수 있어요 (want+learn 합산)'); return; }
            }
            g.is_priority = !g.is_priority;
            renderStep2Games();
          });
        });

        // ↔ 다른 날짜에도 적용 토글 (즉시 반영/취소, DB 쓰기는 저장 시점에만)
        wrap.querySelectorAll('.sm-game-sync').forEach(btn => {
          btn.addEventListener('click', () => {
            const type = btn.dataset.type;
            const idx = parseInt(btn.dataset.idx);
            const g = (_gameMap[_activeDay]?.[type] || [])[idx];
            if (!g) return;
            g._syncOther = !g._syncOther;
            if (g._syncOther) applyToOtherDates(type, g); else removeFromOtherDates(type, g);
            // 단일 날짜 수정에서 동기화하면 _days가 늘어 탭이 새로 생길 수 있다 —
