<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/images/main/favicon-square.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/images/main/favicon-square.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>모임 플래너 | 코티지보드 동호회</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
  <style>
    .sched-confirm-btn {
      flex: 1;
      padding: 12px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      background: var(--green);
      color: white;
    }
    .sched-discard-btn {
      padding: 12px 16px;
      border-radius: 9px;
      font-size: 14px;
      cursor: pointer;
      border: 1.5px solid #d0c8bc;
      background: white;
      color: var(--muted);
    }


    .sched-loading { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }

    /* ── 주간 뷰 (Phase 1) ──────────────────────────────────── */
    .sched-week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .sched-week-nav-btn {
      background: none;
      border: none;
      font-size: 13px;
      color: var(--green);
      font-weight: 600;
      cursor: pointer;
      padding: 4px 6px;
    }
    .sched-week-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
    }
    .sched-toggle-cal-btn {
      display: block;
      width: 100%;
      padding: 8px;
      background: none;
      border: 1px solid #e0d8cc;
      border-radius: 8px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      margin-bottom: 14px;
      text-align: center;
    }
    .sched-toggle-cal-btn:hover { background: #faf5ec; }
    .sched-toggle-cal-btn.is-open { color: var(--green); border-color: var(--green); }
    .sched-wday-card {
      padding: 12px 14px;
      border-radius: 10px;
      background: #faf8f5;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .sched-wday-card:hover { background: #f0ebe0; }
    .sched-wday-card.is-past { opacity: 0.3; cursor: pointer; }
    .sched-wday-card.is-today { background: #f5ece0; outline: 2px solid var(--green); }
    .sched-wday-card.is-target { outline: 2px dashed var(--green); }
    .sched-wday-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sched-wday-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .sched-wday-dow {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .sched-wday-dow.is-sat { color: #5080e0; }
    .sched-wday-dow.is-sun { color: #e05050; }
    .sched-wday-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--green);
    }
    /* Phase 2: 카드 내 시간 바 */
    .sched-wday-card { cursor: default; }
    .sched-wday-header { cursor: pointer; }
    /* sched-card-bars·sched-card-more-btn → day-detail.js */
    /* Phase 3: 카드 푸터 */
    /* 헤더 우상단 수정/⋯ */
    .sched-card-header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sched-card-reg-hdr {
      padding: 2px 8px;
      background: none;
      border: 1px solid #c8bfb0;
      border-radius: 6px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
    }
    .sched-card-reg-hdr:hover { border-color: var(--green); color: var(--green); }
    /* 월간 달력 */
    .mcal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0 10px;
    }
    .mcal-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .mcal-nav-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--muted);
      cursor: pointer;
      padding: 0 6px;
      line-height: 1;
    }
    .mcal-nav-btn:hover { color: var(--text); }
    .mcal-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      padding-bottom: 4px;
    }
    .mcal-header .is-sat { color: #5080e0; }
    .mcal-header .is-sun { color: #e05050; }
    .mcal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .mcal-cell {
      min-height: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 2px 2px;
      border-radius: 6px;
      cursor: pointer;
    }
    .mcal-empty { cursor: default; }
    .mcal-cell.is-past { opacity: .4; cursor: pointer; }
    .mcal-cell:not(.is-past):not(.mcal-empty):hover { background: #f0ebe0; }
    .mcal-cell.is-mine { background: #f5f0e8; }
    .mcal-day {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .mcal-cell.is-sat .mcal-day { color: #5080e0; }
    .mcal-cell.is-sun .mcal-day { color: #e05050; }
    .mcal-cell.is-today .mcal-day {
      background: var(--green);
      color: #fff;
    }
    .mcal-cnt {
      font-size: 10px;
      font-weight: 600;
      color: var(--green);
      margin-top: 2px;
    }
    .mcal-mine-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #c0843a;
      margin-top: 2px;
    }
    /* 시간 등록/수정 컴팩트 바텀시트 */
    .sched-sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.15);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      pointer-events: none;   /* dim만 표시, 배경 스크롤 통과 */
    }
    .sched-sheet {
      width: 100%;
      background: #fff;
      border-radius: 18px 18px 0 0;
      padding: 16px 16px 28px;
      box-shadow: 0 -4px 20px rgba(0,0,0,.12);
      pointer-events: auto;   /* 시트 본체만 인터랙션 */
    }
    .sched-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .sched-sheet-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    .sched-sheet-close-btn {
      background: none;
      border: none;
      font-size: 18px;
      color: var(--muted);
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .sched-sheet-time-display {
      text-align: center;
      margin-bottom: 12px;
    }
    .sched-sheet-time-display .sched-slider-time-val {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }
    .sched-sheet-time-display .sched-slider-sep {
      font-size: 18px;
      color: var(--muted);
      margin: 0 6px;
    }
    .sched-sheet-footer {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .sched-sheet-footer .sched-confirm-btn { flex: 1; }
    .sched-sheet-footer .sched-discard-btn { flex: 0 0 72px; }
    .sched-sheet-prevweek-row {
      text-align: right;
      margin-bottom: 2px;
    }
    .sched-sheet-prevweek-btn {
      background: none;
      border: none;
      padding: 0;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .sched-sheet-prevweek-btn:hover { color: var(--green); }

    /* ── 모임 등록 버튼 ──────────────────────────────── */
    .sched-register-row {
      display: flex; justify-content: flex-end;
      padding-bottom: 10px;
    }
    .sched-register-btn {
      padding: 7px 16px;
      border: 1.5px solid var(--green);
      border-radius: 20px;
      background: white; color: var(--green);
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .sched-register-btn:hover { background: var(--green); color: white; }

    /* ── 멀티스텝 바텀시트 (모임 등록) ───────────────── */
    .sched-multi-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 210;
      display: flex; align-items: flex-end;
    }
    .sched-multi-sheet {
      width: 100%; max-height: 72vh;
      background: #fff;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,.15);
      display: flex; flex-direction: column;
    }
    .sm-hdr {
      display: flex; align-items: center;
      padding: 10px 14px 10px;
      border-bottom: 1px solid #ede8de;
      flex-shrink: 0;
    }
    .sm-back-btn {
      background: none; border: none;
      font-size: 14px; color: var(--muted);
      cursor: pointer; padding: 4px 0;
      min-width: 52px; text-align: left;
    }
    .sm-close-btn {
      background: none; border: none;
      font-size: 18px; color: var(--muted);
      cursor: pointer; padding: 0 2px;
      margin-left: auto;
    }
    .sm-title {
      font-size: 16px; font-weight: 700;
      color: var(--text); flex: 1; text-align: center;
    }
    .sm-body { flex: 1; overflow-y: auto; padding: 12px 14px; }
    .sm-footer {
      padding: 10px 14px 18px;
      border-top: 1px solid #ede8de;
      flex-shrink: 0;
    }
    .sm-footer .sched-confirm-btn { width: 100%; }
    /* Step 1: 요일 선택 */
    .sm-hint { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
    .sm-day-chips {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    }
    .sm-day-chip {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 8px 2px; border: 1.5px solid #d0c8bc;
      border-radius: 10px; background: white; cursor: pointer;
      position: relative; gap: 2px;
      transition: border-color .15s, background .15s;
    }
    .sm-day-chip.is-sel { border-color: var(--green); background: #f0f7f0; }
    .sm-day-chip.is-past { opacity: .4; cursor: default; }
    .sm-day-chip.is-today .sm-dc-dow { color: var(--green); font-weight: 700; }
    .sm-dc-dow { font-size: 13px; font-weight: 600; color: var(--text); }
    .sm-dc-date { font-size: 10px; color: var(--muted); }
    .sm-dc-mine {
      position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
      font-size: 8px; line-height: 1; color: #c0843a; white-space: nowrap;
    }
    .sm-day-chip.is-registered { opacity: .5; cursor: default; border-color: #d8b88a; }
    .sm-dc-cnt { font-size: 9px; color: #b0a090; line-height: 1; }
    /* Step 1: 주 네비게이션 */
    .sm-week-nav {
      display: flex; align-items: center; gap: 4px; margin-bottom: 12px;
    }
    .sm-week-nav-btn {
      background: none; border: 1px solid #d0c8bc; border-radius: 8px;
      font-size: 14px; color: var(--muted); cursor: pointer;
      padding: 5px 10px; flex-shrink: 0;
      transition: border-color .15s, color .15s;
    }
    .sm-week-nav-btn:hover { border-color: var(--green); color: var(--green); }
    .sm-week-nav-btn:disabled { opacity: .35; cursor: default; pointer-events: none; }
    .sm-week-label {
      flex: 1; text-align: center;
      font-size: 12px; font-weight: 600; color: var(--text);
    }
    .sm-sel-summary {
      font-size: 12px; color: var(--green);
      margin: 10px 0 0; line-height: 1.6; word-break: keep-all;
    }
    /* Step 2/3: 요일 탭 */
    .sm-tabs {
      display: flex; gap: 6px; overflow-x: auto;
      margin-bottom: 16px; padding-bottom: 2px; scrollbar-width: none;
    }
    .sm-tabs::-webkit-scrollbar { display: none; }
    .sm-tab {
      padding: 6px 12px; border-radius: 20px;
      border: 1.5px solid #d0c8bc; background: white;
      cursor: pointer; font-size: 13px; color: var(--muted);
      white-space: nowrap; flex-shrink: 0;
      transition: border-color .15s, background .15s, color .15s;
    }
    .sm-tab.is-active { border-color: var(--green); background: var(--green); color: white; }
    /* Step 2 */
    .sm-prevweek-row { text-align: right; margin-bottom: 4px; }
    .sm-freqtime-row { text-align: right; margin-bottom: 4px; position: relative; }
    .sm-freqtime-btn {
      background: none; border: none;
      font-size: 12px; color: var(--muted);
      cursor: pointer; padding: 0;
      text-decoration: underline dotted;
      text-underline-offset: 2px;
    }
    .sm-freqtime-btn:hover { color: var(--green); }
    .sm-freqtime-menu {
      position: absolute; right: 0; top: calc(100% + 4px);
      background: #fff; border: 1px solid #ede8de;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
      z-index: 20; min-width: 120px;
      overflow: hidden;
    }
    .sm-freqtime-opt {
      display: block; width: 100%;
      background: none; border: none;
      padding: 9px 14px; text-align: left;
      font-size: 13px; cursor: pointer; color: var(--text);
    }
    .sm-freqtime-opt:hover { background: #f5efe6; }
    /* Step 2: 날짜별 시간 행 */
    .sm-time-row {
      margin-bottom: 16px; padding-bottom: 16px;
      border-bottom: 1px solid #ede8de;
    }
    .sm-time-row:last-child { border-bottom: none; margin-bottom: 0; }
    .sm-time-row-hdr {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 8px;
    }
    .sm-time-row-label { font-size: 14px; font-weight: 700; color: var(--text); }
    .sm-time-row-val { font-size: 14px; font-weight: 600; color: var(--green); }
    .sm-time-preset-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .sm-time-preset-chip {
      padding: 4px 12px; border-radius: 14px;
      border: 1.5px solid #d0c8bc; background: white;
      font-size: 12px; color: var(--muted);
      cursor: pointer; transition: border-color .15s, color .15s, background .15s;
    }
    .sm-time-preset-chip:hover { border-color: var(--green); color: var(--green); }
    .sm-time-preset-chip.is-active { border-color: var(--green); background: var(--green); color: white; }
    /* 게임 추가 섹션 (Step 3 이동 후 유지) */
    .sm-game-toggle-wrap { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
    .sm-game-toggle {
      width: 100%; padding: 10px 14px;
      border: 1.5px dashed #c8c0b4; border-radius: 10px;
      background: #faf8f5; font-size: 13px; color: var(--muted);
      cursor: pointer; text-align: left; font-family: inherit;
      transition: border-color .15s, color .15s, background .15s;
    }
    .sm-game-toggle:hover { border-color: var(--green); color: var(--green); }
    .sm-game-toggle.is-open {
      border-color: var(--green); color: var(--green);
      background: #f0f7f0; border-style: solid;
    }
    .sm-game-section { padding: 10px 2px 2px; }
    .sm-games-wrap { display: flex; flex-direction: column; gap: 20px; }
    .sm-games-lbl { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
    .sm-game-item {
      display: flex; align-items: center;
      padding: 8px 10px; background: #f8f5f0;
      border-radius: 8px; margin-bottom: 6px;
    }
    .sm-game-name { flex: 1; font-size: 14px; color: var(--text); }
    .sm-game-del {
      background: none; border: none; font-size: 14px;
      color: var(--muted); cursor: pointer; padding: 0 0 0 8px;
      transition: color .15s;
    }
    .sm-game-del:hover { color: #d94f4f; }
    .sm-game-star {
      background: none; border: none; cursor: pointer;
      font-size: 16px; line-height: 1; color: inherit;
      padding: 4px 6px; margin: -4px 0;
    }
    .sm-cond-row {
      display: flex; flex-wrap: wrap; gap: 4px;
      padding: 6px 10px 8px; border-top: 1px solid #e8e4dc;
    }
    .sm-cond-chip {
      padding: 3px 9px; border-radius: 20px; border: 1.5px solid #d0c8bc;
      background: #f8f5f0; color: var(--muted); font-size: 12px;
      cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .sm-cond-chip.is-active {
      border-color: var(--green); background: var(--green);
      color: white; font-weight: 600;
    }
    .sm-cond-chip:disabled { opacity: .35; cursor: default; }
    .sm-game-input-row { display: flex; gap: 8px; margin-top: 4px; }
    .sm-game-input {
      flex: 1; padding: 9px 12px;
      border: 1.5px solid #d0c8bc; border-radius: 8px;
      font-size: 14px; outline: none; font-family: inherit;
    }
    .sm-game-input:focus { border-color: var(--green); }
    .sm-game-add-btn {
      padding: 9px 14px; border: none; border-radius: 8px;
      background: var(--green); color: white;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    /* 피커 패널 */
    .sm-picker-panel {
      margin-top: 8px; padding: 10px;
      border: 1.5px solid #d0c8bc; border-radius: 10px;
      background: #faf8f5; max-height: 170px; overflow-y: auto;
    }
    .sm-picker-label {
      font-size: 11px; color: var(--muted);
      font-weight: 600; margin-bottom: 6px;
    }
    .sm-picker-item {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 7px 8px; border: none; background: none;
      cursor: pointer; font-size: 13px; text-align: left;
      border-radius: 6px; transition: background .1s; font-family: inherit;
    }
    .sm-picker-item:hover:not(:disabled) { background: #ede8de; }
    .sm-picker-item:disabled { opacity: .45; cursor: default; }
    .sm-picker-tag {
      font-size: 11px; color: var(--green);
      font-weight: 600; flex-shrink: 0; margin-left: 8px;
    }
    .sm-picker-item:disabled .sm-picker-tag { color: var(--muted); }
    .sm-picker-loading, .sm-picker-empty {
      text-align: center; font-size: 13px; color: var(--muted); padding: 8px 0;
    }

    /* 토스트 */
    .sched-toast {
      position: fixed;
      bottom: 260px;
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: rgba(0,0,0,.72);
      color: #fff;
      font-size: 13px;
      padding: 8px 18px;
      border-radius: 20px;
      z-index: 210;
      opacity: 0;
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      white-space: nowrap;
    }
    .sched-toast.is-show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    body.is-embedded .site-footer,
    body.is-embedded .header-bar,
    body.is-embedded .owned-page-nav { display: none !important; }
    body.is-embedded { overflow-x: hidden; }

    /* 홈에서 등록/수정으로 바로 진입 시 — 주간 뷰를 아예 숨기고, body 배경도 투명하게 만들어
       뒤에 있는 홈 화면이 그대로 비치게 함(플래너 페이지 자체가 안 보여야 함) */
    body.is-quick-entry #viewWeek,
    body.is-quick-entry #mainLoading { display: none !important; }
    body.is-quick-entry,
    body.is-quick-entry .inner-page { background: transparent !important; }

    .sched-slider-wrap { margin-bottom: 16px; }
    .sched-dual-range {
      position: relative;
      height: 40px;
      margin: 0 4px;
    }
    .sched-range-track {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      left: 0; right: 0;
      height: 6px;
      background: #ddd8cc;
      border-radius: 3px;
    }
    .sched-range-fill {
      position: absolute;
      height: 100%;
      background: var(--green);
      border-radius: 3px;
    }
    input.sched-range-input {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 100%; margin: 0;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      pointer-events: none;
      height: 40px;
    }
    input.sched-range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--green);
      cursor: pointer;
      pointer-events: all;
      border: 3px solid white;
      box-shadow: 0 1px 5px rgba(0,0,0,0.28);
    }
    input.sched-range-input::-moz-range-thumb {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--green);
      cursor: pointer;
      pointer-events: all;
      border: 3px solid white;
      box-shadow: 0 1px 5px rgba(0,0,0,0.28);
    }
    .sched-range-axis {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 10px;

    }
  </style>
</head>

  <script>
  (function () {
    const MIN_H = 9, MAX_H = 23;
    const DOW = ['일','월','화','수','목','금','토'];
    const TODAY = new Date();
    TODAY.setHours(0, 0, 0, 0);

    let allVotes     = [];
    let allVoteGames = [];   // meeting_vote_games (날짜별 want/learn 게임)
    let weekOffset    = 0;
    let calMonthDate  = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
    let _sheetDs   = null;   // 바텀시트 대상 날짜 (null = 닫힘)
    let _syncSheet = null;   // initScheduleSheet에서 주입되는 슬라이더 sync 함수
    let _openMultiSheet = null; // initMultiSheet에서 주입되는 외부 진입점
    let _initDone       = false;
    let _pendingRegister = null; // 홈 등록하기 버튼 → init 완료 전 도착한 date

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function toDateStr(date) {
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }

    function parseDate(s) {
      const [y, m, d] = s.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatLabel(s) {
      const d = parseDate(s);
      return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;
    }

    function isPast(s) { return parseDate(s) < TODAY; }
    function isToday(s) { return parseDate(s).getTime() === TODAY.getTime(); }

    // ── 날짜별 요약 계산 ─────────────────────────────────────
    function calcSummary(votes) {
      if (!votes.length) return null;
      const totalStart = Math.min(...votes.map(v => v.time_start));
      const totalEnd = Math.max(...votes.map(v => v.time_end));
      const blocks = calcOverlap(votes);
      const top = blocks[0] || null;
      return {
        count: votes.length,
        totalStart, totalEnd,
        overlapStart: top?.start,
        overlapEnd: top?.end,
        overlapCount: top?.count,
        names: votes.map(v => v.nickname),
      };
    }

    // ── 겹침 계산 ─────────────────────────────────────────────
    function calcOverlap(votes) {
      if (!votes.length) return [];
      const slots = [];
      for (let h = MIN_H; h < MAX_H; h++) {
        slots.push({
          h,
          names: votes.filter(v => v.time_start <= h && v.time_end > h).map(v => v.nickname)
        });
      }
      const blocks = [];
      let i = 0;
      while (i < slots.length) {
        const names = slots[i].names;
        const key = [...names].sort().join('§');
        let j = i + 1;
        while (j < slots.length && [...slots[j].names].sort().join('§') === key) j++;
        if (names.length > 0) {
          const endH = j < slots.length ? slots[j].h : MAX_H;
          blocks.push({ start: slots[i].h, end: endH, count: names.length, names: [...names] });
        }
        i = j;
      }
      return blocks.sort((a, b) => b.count - a.count || (b.end - b.start) - (a.end - a.start));
    }

    // ── 주간 카드 등록/변경/취소 (Phase 3) ──────────────────────────

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'sched-toast';
      t.textContent = msg;
      document.body.appendChild(t);
      requestAnimationFrame(() => t.classList.add('is-show'));
      setTimeout(() => {
        t.classList.remove('is-show');
        setTimeout(() => t.remove(), 280);
      }, 2200);
    }

    function _notifyParentSaved() {
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'cottage-meeting-saved' }, '*');
      }
    }

    // ── 시간 등록/수정 바텀시트 ──────────────────────────────────────

    function initScheduleSheet() {
      const range = MAX_H - MIN_H;
      const overlay = document.createElement('div');
      overlay.className = 'sched-sheet-overlay';
      overlay.id = 'schedSheetOverlay';
      overlay.innerHTML = `<div class="sched-sheet">
        <div class="sched-sheet-header">
          <span class="sched-sheet-title" id="ssTitle"></span>
          <button class="sched-sheet-close-btn" id="ssClose" type="button">✕</button>
        </div>
        <div class="sched-sheet-body">
          <div class="sched-sheet-prevweek-row" id="ssPrevWeekRow">
            <button class="sched-sheet-prevweek-btn" id="ssPrevWeek" type="button"></button>
          </div>
          <div class="sched-sheet-time-display">
            <span class="sched-slider-time-val" id="ssLblS">10시</span>
            <span class="sched-slider-sep">~</span>
            <span class="sched-slider-time-val" id="ssLblE">22시</span>
          </div>
          <div class="sched-slider-wrap">
            <div class="sched-dual-range">
              <div class="sched-range-track"><div class="sched-range-fill" id="ssRangeFill"></div></div>
              <input type="range" class="sched-range-input" id="ssRS"
                min="${MIN_H}" max="${MAX_H - 1}" step="1" value="10">
              <input type="range" class="sched-range-input" id="ssRE"
                min="${MIN_H + 1}" max="${MAX_H}" step="1" value="22">
            </div>
            <div class="sched-range-axis">
              <span>${MIN_H}시</span><span>${Math.round((MIN_H+MAX_H)/2)}시</span><span>${MAX_H}시</span>
            </div>
          </div>
        </div>
        <div class="sched-sheet-footer">
          <button class="sched-confirm-btn" id="ssSave" type="button">등록</button>
          <button class="sched-discard-btn" id="ssDiscard" type="button">닫기</button>
        </div>
      </div>`;
      overlay.style.display = 'none';
      document.body.appendChild(overlay);

      const ssRS = document.getElementById('ssRS');
      const ssRE = document.getElementById('ssRE');
      const fill = document.getElementById('ssRangeFill');
      const lblS = document.getElementById('ssLblS');
      const lblE = document.getElementById('ssLblE');

      function syncSheet() {
        const s = parseInt(ssRS.value), e = parseInt(ssRE.value);
        fill.style.left  = ((s - MIN_H) / range * 100) + '%';
        fill.style.width = ((e - s)     / range * 100) + '%';
        lblS.textContent = s + '시';
        lblE.textContent = e + '시';
      }
      _syncSheet = syncSheet;  // 외부(지난주와 동일 버튼)에서 호출 가능하도록 노출

      ssRS.addEventListener('input', () => {
        if (parseInt(ssRS.value) >= parseInt(ssRE.value)) ssRS.value = parseInt(ssRE.value) - 1;
        syncSheet();
      });
      ssRE.addEventListener('input', () => {
        if (parseInt(ssRE.value) <= parseInt(ssRS.value)) ssRE.value = parseInt(ssRS.value) + 1;
        syncSheet();
      });

      document.getElementById('ssSave').addEventListener('click', () => {
        const btnSave = document.getElementById('ssSave');
        saveVoteForDate(_sheetDs, parseInt(ssRS.value), parseInt(ssRE.value), btnSave);
      });
      document.getElementById('ssDiscard').addEventListener('click', closeScheduleSheet);
      document.getElementById('ssClose').addEventListener('click', closeScheduleSheet);

      // 지난주와 동일: 같은 요일 7일 전 내 투표 → 슬라이더 이동 (자동저장 없음)
      document.getElementById('ssPrevWeek').addEventListener('click', () => {
        if (!_sheetDs) return;
        const user = window.getKakaoUser?.();
        if (!user) { showToast('로그인이 필요합니다.'); return; }
        const [y, m, d] = _sheetDs.split('-').map(Number);
        const prevDs = toDateStr(new Date(y, m - 1, d - 7));
        const prev   = allVotes.find(v => v.vote_date === prevDs && String(v.user_id) === String(user.id));
        if (!prev) { showToast('지난주 기록이 없습니다.'); return; }
        ssRS.value = prev.time_start;
        ssRE.value = prev.time_end;
        if (_syncSheet) _syncSheet();
      });

      // 바깥 클릭 닫기는 openScheduleSheet에서 document 레벨로 등록
    }

    // ── 멀티스텝 바텀시트 (모임 등록) ──────────────────────────
    function initMultiSheet() {
      let _step        = 1;
      let _days        = [];   // 선택된 날짜 배열 (정렬 유지)
      let _timeMap     = {};   // { ds: {s, e} }
      let _gameMap     = {};   // { ds: {want:[{custom_name,game_id}], learn:[...]} }
      let _activeDay   = null;
      let _fromStep1   = false;
      let _pickerCache = {};   // { like:[], curious:[] } — lazy fetch
      let _pickerOpen  = null; // 미사용(Step3 제거), 호환용 유지
      let _gameOpen    = {want:false, learn:false}; // 게임 섹션 열림 상태
      let _modalWeekOffset = 0;
      let _historicalVotes = null; // 8주 이력 조회 결과 (프리셋·초기값용)

      const overlay = document.createElement('div');
      overlay.className = 'sched-multi-overlay';
      overlay.id = 'schedMultiOverlay';
      overlay.innerHTML = `<div class="sched-multi-sheet">
        <div class="sm-hdr">
          <button class="sm-back-btn" id="smBack" type="button">← 뒤로</button>
          <span class="sm-title" id="smTitle"></span>
          <button class="sm-close-btn" id="smClose" type="button" aria-label="닫기">✕</button>
        </div>
        <div class="sm-body" id="smBody"></div>
        <div class="sm-footer" id="smFooter"></div>
      </div>`;
      overlay.style.display = 'none';
      document.body.appendChild(overlay);

      const $s = id => document.getElementById(id);

      function close() {
        overlay.style.display = 'none';
        _days = []; _timeMap = {}; _gameMap = {}; _activeDay = null; _step = 1; _pickerOpen = null; _gameOpen = {want:false, learn:false};
        _modalWeekOffset = 0; _historicalVotes = null;
        // 홈에서 바로 진입한 경우 돌아갈 주간 뷰가 없으므로 플래너 자체를 닫는다.
        // ⚠️ is-quick-entry를 여기서 제거하지 말 것 — 제거하면 #viewWeek(주간뷰)가
        //    부모가 모달을 숨기기 전에 한 프레임 그려져 "플래너가 켜졌다 꺼지는" 깜빡임이
        //    난다(postMessage가 비동기라 부모 closeModal이 다음 태스크에 실행됨). 클래스는
        //    다음 정상 오픈(cottage-reset-week)에서 정리한다 = 주간뷰를 실제로 보여줄 때만.
        if (document.body.classList.contains('is-quick-entry')) {
          if (new URLSearchParams(location.search).get('embed') === 'true') {
            window.parent.postMessage({ type: 'cottage-quick-entry-closed' }, '*');
          }
        }
      }
      $s('smClose').addEventListener('click', close);
      overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

      $s('smBack').addEventListener('click', () => {
        if (_step === 2) renderStep1();
        else if (_step === 3) renderStep2();
      });

      // ── 헬퍼 ──────────────────────────────────────────────────

      function resolveGameName(item) {
        if (item.custom_name) return item.custom_name;
        if (item.game_id) {
          const g = (window.COTTAGE_GAMES || []).find(g => g.bggId === String(item.game_id) || g.id === String(item.game_id));
          return g?.display || `#${item.game_id}`;
        }
        return '?';
      }

      function isDup(section, item) {
        const list = _gameMap[_activeDay]?.[section] || [];
        return list.some(g =>
          (g.game_id && item.game_id && String(g.game_id) === String(item.game_id)) ||
          (g.custom_name && item.custom_name && g.custom_name.trim() === item.custom_name.trim())
        );
      }

      async function fetchPickerData(cacheKey) {
        const user = window.getKakaoUser?.();
        if (!user) { _pickerCache[cacheKey] = cacheKey === 'meeting' ? {want:[], rule:[]} : []; return; }
        try {
          if (cacheKey === 'like') {
            _pickerCache.like = await window.CottageDB?.getUserLikedGamesAll(String(user.id)) || [];
          } else if (cacheKey === 'curious') {
            _pickerCache.curious = await window.CottageDB?.getUserCuriousGamesAll(String(user.id)) || [];
          } else if (cacheKey === 'meeting') {
            const profile = await window.CottageDB?.getMeetingProfile(String(user.id));
            _pickerCache.meeting = { want: profile?.wantGames || [], rule: profile?.ruleGames || [] };
          }
        } catch(_) {
          _pickerCache[cacheKey] = cacheKey === 'meeting' ? {want:[], rule:[]} : [];
        }
      }

      function getPickerItems(section, source) {
        if (source === 'like')    return _pickerCache.like || [];
        if (source === 'curious') return _pickerCache.curious || [];
        if (source === 'meeting') {
          const m = _pickerCache.meeting;
          if (!m || m === 'loading') return [];
          return section === 'want' ? (m.want || []) : (m.rule || []);
        }
        return [];
      }

      function pickerSectionLabel(section, source) {
        if (source === 'like')    return '좋아하는 게임 (취향보드)';
        if (source === 'curious') return '궁금한 게임 (취향보드)';
        if (source === 'meeting') return section === 'want' ? '하고 싶은 게임 (모임보드)' : '룰 설명 가능 게임 (모임보드 참고)';
        return '';
      }

      function buildTabs() {
        const DOW_KR = ['일','월','화','수','목','금','토'];
        return _days.map(ds => {
          const d = parseDate(ds);
          return `<button class="sm-tab${ds === _activeDay ? ' is-active' : ''}" data-ds="${ds}" type="button">`
            + `${DOW_KR[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}</button>`;
        }).join('');
      }

      function initDay(ds) {
        if (!_timeMap[ds]) {
          const user = window.getKakaoUser?.();
          const ex = user && allVotes.find(v => v.vote_date === ds && String(v.user_id) === String(user.id));
          _timeMap[ds] = { s: ex?.time_start ?? 10, e: ex?.time_end ?? 22 };
        }
        if (!_gameMap[ds]) {
          const user = window.getKakaoUser?.();
          const uid = user ? String(user.id) : null;
          _gameMap[ds] = {
            want:  uid ? allVoteGames.filter(g => g.vote_date===ds && String(g.user_id)===uid && g.list_type==='want') .map(g=>({game_id:g.game_id, custom_name:g.custom_name, is_priority:g.is_priority??false, player_condition:g.player_condition??'any'})) : [],
            learn: uid ? allVoteGames.filter(g => g.vote_date===ds && String(g.user_id)===uid && g.list_type==='learn').map(g=>({game_id:g.game_id, custom_name:g.custom_name, is_priority:g.is_priority??false, player_condition:g.player_condition??'any'})) : []
          };
        }
      }

      // ── Step 1: 요일 선택 ──────────────────────────────────────
      function renderStep1() {
        _step = 1;
        $s('smTitle').textContent = '모임 등록';
        $s('smBack').style.visibility = 'hidden';

        const DOW_KR = ['일','월','화','수','목','금','토'];
        const dow = TODAY.getDay();
        const daysToMon = dow === 0 ? -6 : 1 - dow;
        const monday = new Date(TODAY);
        monday.setDate(TODAY.getDate() + daysToMon + _modalWeekOffset * 7);
        const weekDates = Array.from({length:7}, (_, i) => {
          const d = new Date(monday); d.setDate(monday.getDate() + i); return d;
        });

        const wkLabel = _modalWeekOffset === 0 ? '이번 주'
          : _modalWeekOffset === -1 ? '지난 주'
          : _modalWeekOffset === 1 ? '다음 주'
          : _modalWeekOffset > 0 ? `${_modalWeekOffset}주 후` : `${-_modalWeekOffset}주 전`;
        const wkRange = `${monday.getMonth()+1}/${monday.getDate()}~${weekDates[6].getMonth()+1}/${weekDates[6].getDate()}`;
        const prevDisabled = weekDates[6] < TODAY; // 주 전체가 과거

        const user = window.getKakaoUser?.();
        const chips = weekDates.map(d => {
          const ds   = toDateStr(d);
          const past = d < TODAY;
          const tod  = d.getTime() === TODAY.getTime();
          const sel  = _days.includes(ds);
          const mine = user && allVotes.some(v => v.vote_date===ds && String(v.user_id)===String(user.id));
          const cnt  = allVotes.filter(v => v.vote_date === ds).length;
          return `<button class="sm-day-chip${sel?' is-sel':''}${past?' is-past':''}${tod?' is-today':''}${mine?' is-registered':''}"
            data-ds="${ds}" type="button"${(past||mine)?' disabled':''}>
            <span class="sm-dc-dow">${DOW_KR[d.getDay()]}</span>
            <span class="sm-dc-date">${d.getMonth()+1}/${d.getDate()}</span>
            ${cnt > 0 ? `<span class="sm-dc-cnt">${cnt}명</span>` : ''}
            ${mine?'<span class="sm-dc-mine">등록됨</span>':''}
          </button>`;
        }).join('');

        function buildSummary() {
          if (!_days.length) return '';
          const formatted = _days.map(ds => {
            const d = parseDate(ds);
            return `${d.getMonth()+1}/${d.getDate()}(${DOW_KR[d.getDay()]})`;
          }).join(', ');
          return `<p class="sm-sel-summary">선택: ${formatted}</p>`;
        }

        $s('smBody').innerHTML = `
          <div class="sm-week-nav">
            <button class="sm-week-nav-btn" id="smWkPrev" type="button"${prevDisabled?' disabled':''}>◀</button>
            <span class="sm-week-label">${wkRange} · ${wkLabel}</span>
            <button class="sm-week-nav-btn" id="smWkNext" type="button">▶</button>
          </div>
          <p class="sm-hint">참여할 요일을 선택하세요 (여러 날 선택 가능)</p>
          <div class="sm-day-chips" id="smDayChips">${chips}</div>
          <div id="smSelSummary">${buildSummary()}</div>`;
        $s('smFooter').innerHTML =
          `<button class="sched-confirm-btn" id="smNext1" type="button"${_days.length===0?' disabled':''}>다음 →</button>`;

        $s('smWkPrev').addEventListener('click', () => { _modalWeekOffset--; renderStep1(); });
        $s('smWkNext').addEventListener('click', () => { _modalWeekOffset++; renderStep1(); });

        $s('smDayChips').querySelectorAll('.sm-day-chip:not([disabled])').forEach(btn => {
          btn.addEventListener('click', () => {
            const ds = btn.dataset.ds;
            if (_days.includes(ds)) { _days = _days.filter(x => x !== ds); btn.classList.remove('is-sel'); }
            else { _days.push(ds); _days.sort(); btn.classList.add('is-sel'); }
            $s('smNext1').disabled = _days.length === 0;
            $s('smSelSummary').innerHTML = buildSummary();
          });
        });
        $s('smNext1').addEventListener('click', () => {
          _fromStep1 = true;
          _days.forEach(initDay);
          renderStep2();
        });
      }

      // ── Step 2: 시간 설정 (날짜별 행) ────────────────────────
      function renderStep2() {
        _step = 2;
        if (!_activeDay || !_days.includes(_activeDay)) _activeDay = _days[0];
        $s('smTitle').textContent = '시간 설정';
        $s('smBack').style.visibility = 'visible';
        $s('smBack').textContent = '← 날짜 더 선택';

        const DOW_KR = ['일','월','화','수','목','금','토'];
        const user = window.getKakaoUser?.();
        const R = MAX_H - MIN_H;

        // 프리셋: allVotes + _historicalVotes 합산, 빈도 상위 3개
        const combined = [
          ...(user ? allVotes.filter(v => String(v.user_id) === String(user.id)) : []),
          ...(_historicalVotes && user ? _historicalVotes.filter(v => String(v.user_id) === String(user.id)) : [])
        ];
        const freq = {};
        combined.forEach(v => {
          const key = `${v.time_start}-${v.time_end}`;
          if (!freq[key]) freq[key] = { s: v.time_start, e: v.time_end, count: 0, latest: v.vote_date || '' };
          freq[key].count++;
          if ((v.vote_date || '') > freq[key].latest) freq[key].latest = v.vote_date;
        });
        const presets = Object.values(freq)
          .sort((a, b) => b.count - a.count || b.latest.localeCompare(a.latest))
          .slice(0, 3);

        const rowsHtml = _days.map(ds => {
          const d = parseDate(ds);
          const t = _timeMap[ds] || { s: 10, e: 22 };
          const label = `${DOW_KR[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}`;
          const fl = ((t.s - MIN_H) / R * 100).toFixed(1);
          const fw = ((t.e - t.s) / R * 100).toFixed(1);
          const chipsHtml = presets.map(p =>
            `<button class="sm-time-preset-chip${t.s===p.s&&t.e===p.e?' is-active':''}"
             data-ds="${esc(ds)}" data-s="${p.s}" data-e="${p.e}" type="button">${p.s}~${p.e}시</button>`
          ).join('');
          return `<div class="sm-time-row">
            <div class="sm-time-row-hdr">
              <span class="sm-time-row-label">${esc(label)}</span>
              <span class="sm-time-row-val" id="smTV_${ds}">${t.s}~${t.e}시</span>
            </div>
            ${chipsHtml ? `<div class="sm-time-preset-chips">${chipsHtml}</div>` : ''}
            <div class="sm-time-slider-wrap">
              <div class="sched-dual-range">
                <div class="sched-range-track">
                  <div class="sched-range-fill" id="smF_${ds}" style="left:${fl}%;width:${fw}%"></div>
                </div>
                <input type="range" class="sched-range-input" id="smRS_${ds}" min="${MIN_H}" max="${MAX_H-1}" step="1" value="${t.s}">
                <input type="range" class="sched-range-input" id="smRE_${ds}" min="${MIN_H+1}" max="${MAX_H}" step="1" value="${t.e}">
              </div>
              <div class="sched-range-axis">
                <span>${MIN_H}시</span><span>${Math.round((MIN_H+MAX_H)/2)}시</span><span>${MAX_H}시</span>
              </div>
            </div>
          </div>`;
        }).join('');

        $s('smBody').innerHTML = rowsHtml;
        $s('smFooter').innerHTML = `<button class="sched-confirm-btn" id="smNext2" type="button">다음 →</button>`;

        _days.forEach(ds => {
          const rsEl = $s(`smRS_${ds}`);
          const reEl = $s(`smRE_${ds}`);
          const fillEl = $s(`smF_${ds}`);
          const valEl = $s(`smTV_${ds}`);
          if (!rsEl || !reEl) return;

          function syncRow() {
            const s = parseInt(rsEl.value), e = parseInt(reEl.value);
            fillEl.style.left = ((s-MIN_H)/R*100) + '%';
            fillEl.style.width = ((e-s)/R*100) + '%';
            valEl.textContent = `${s}~${e}시`;
            _timeMap[ds] = { s, e };
            $s('smBody').querySelectorAll(`.sm-time-preset-chip[data-ds="${ds}"]`).forEach(c => {
              c.classList.toggle('is-active', parseInt(c.dataset.s)===s && parseInt(c.dataset.e)===e);
            });
          }

          rsEl.addEventListener('input', () => {
            if (parseInt(rsEl.value) >= parseInt(reEl.value)) rsEl.value = parseInt(reEl.value) - 1;
            syncRow();
          });
          reEl.addEventListener('input', () => {
            if (parseInt(reEl.value) <= parseInt(rsEl.value)) reEl.value = parseInt(rsEl.value) + 1;
            syncRow();
          });

          $s('smBody').querySelectorAll(`.sm-time-preset-chip[data-ds="${ds}"]`).forEach(chip => {
            chip.addEventListener('click', () => {
              rsEl.value = chip.dataset.s;
              reEl.value = chip.dataset.e;
              syncRow();
            });
          });
        });

        $s('smNext2').addEventListener('click', () => renderStep3());
      }

      // ── Step 2 게임 섹션 렌더 ────────────────────────────────────
      function renderStep2Games() {
        const wrap = document.getElementById('smGameSections');
        if (!wrap) return;
        if (!_gameMap[_activeDay]) _gameMap[_activeDay] = {want:[], learn:[]};

        function gameListHtml(type) {
          const COND_OPTS = [
            {val:'any',label:'무관'},{val:'best',label:'베스트'},{val:'recommended',label:'추천'},
            {val:'2',label:'2인'},{val:'3',label:'3인'},{val:'4',label:'4인'},{val:'5+',label:'5인+'}
          ];
          return (_gameMap[_activeDay][type] || []).map((g, i) => {
            const cond = g.player_condition ?? 'any';
            let rawGame = null;
            if (g.game_id && window.COTTAGE_GAMES) {
              const cg = window.COTTAGE_GAMES.find(c => String(c.bggId) === String(g.game_id));
              rawGame = cg ? window.gameData?.[cg.id] : null;
            }
            if (!rawGame && g.custom_name && window.COTTAGE_GAMES) {
              const pureName = (g.custom_name || '').replace(/^#/, '');
              const cg = window.COTTAGE_GAMES.find(c => c.display === pureName || c.titleKo === pureName);
              rawGame = cg ? window.gameData?.[cg.id] : null;
            }
            const hasBest = (rawGame?.bgg?.bestPlayers?.length ?? 0) > 0;
            const hasRec  = (rawGame?.bgg?.recommendedPlayers?.length ?? 0) > 0;
            const condChips = COND_OPTS.map(o => {
              const noData = (o.val === 'best' && !hasBest) || (o.val === 'recommended' && !hasRec);
              const dis = noData ? ' disabled' : '';
              const act = cond === o.val ? ' is-active' : '';
              let chipLabel = o.label;
              if ((o.val === 'best' || o.val === 'recommended') && !noData) {
                const fl = window.formatCondLabel?.(o.val, g.game_id);
                if (fl) chipLabel = fl;
              }
              return `<button class="sm-cond-chip${act}" data-cctype="${type}" data-ccidx="${i}" data-ccval="${o.val}" type="button"${dis}>${chipLabel}</button>`;
            }).join('');
            return `<div class="sm-game-item" style="flex-wrap:wrap;padding-bottom:0">
              <span class="sm-game-name">${esc(g.custom_name || resolveGameName(g))}</span>
              <button class="sm-game-star" data-type="${type}" data-idx="${i}" type="button" aria-pressed="${g.is_priority ? 'true' : 'false'}" aria-label="대표 게임 지정">${g.is_priority ? '⭐' : '☆'}</button>
              <button class="sm-game-del" data-type="${type}" data-idx="${i}" type="button" aria-label="삭제">✕</button>
              <div class="sm-cond-row" style="width:100%">${condChips}</div>
            </div>`;
          }).join('');
        }

        function pickerHtml(type) {
          const source = type === 'want' ? 'like' : 'curious';
          const cached = _pickerCache[source];
          if (cached === 'loading') return `<div class="sm-picker-panel"><div class="sm-picker-loading">불러오는 중…</div></div>`;
          if (!cached) return '';
          const items = getPickerItems(type, source);
          if (!items.length) return `<div class="sm-picker-panel"><div class="sm-picker-empty">등록된 게임이 없어요</div></div>`;
          const label = type === 'want' ? '좋아요한 게임' : '궁금한 게임';
          return `<div class="sm-picker-panel">
            <div class="sm-picker-label">${esc(label)}</div>
            ${items.map((g, i) => {
              const name = resolveGameName(g);
              const dup  = isDup(type, g);
              return `<button class="sm-picker-item${dup?' is-added':''}" data-pidx="${i}" data-ptype="${type}" type="button"${dup?' disabled':''}>
                <span>${esc(name)}</span>
                <span class="sm-picker-tag">${dup?'추가됨':'+ 추가'}</span>
              </button>`;
            }).join('')}
          </div>`;
        }

        function sectionHtml(type) {
          const icon  = type === 'want' ? '🎲' : '📖';
          const label = type === 'want' ? '하고 싶은 게임' : '배우고 싶은 게임';
          const open  = _gameOpen[type];
          const count = (_gameMap[_activeDay]?.[type] || []).length;
          const source = type === 'want' ? 'like' : 'curious';

          const btnLabel = open
            ? `${icon} ${label} (${count}) ▲`
            : `${icon} ${label} (${count}) ▾`;

          if (!open) return `<button class="sm-game-toggle" data-gtoggle="${type}" type="button">${btnLabel}</button>`;
          return `<button class="sm-game-toggle is-open" data-gtoggle="${type}" type="button">${btnLabel}</button>
            <div class="sm-game-section">
              ${gameListHtml(type)}
              <div class="sm-game-input-row">
                <input class="sm-game-input" id="sm_${type}_input" type="text" placeholder="게임 이름 직접 입력" autocomplete="off">
                <button class="sm-game-add-btn" data-gadd="${type}" type="button">추가</button>
              </div>
              ${_pickerCache[source] !== undefined ? pickerHtml(type) : ''}
            </div>`;
        }

        wrap.innerHTML = `<div class="sm-game-toggle-wrap">
          ${sectionHtml('want')}
          ${sectionHtml('learn')}
        </div>`;

        // 토글
        wrap.querySelectorAll('[data-gtoggle]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const type   = btn.dataset.gtoggle;
            const source = type === 'want' ? 'like' : 'curious';
            _gameOpen[type] = !_gameOpen[type];
            if (_gameOpen[type] && _pickerCache[source] === undefined) {
              _pickerCache[source] = 'loading';
              renderStep2Games();
              await fetchPickerData(source);
            }
            renderStep2Games();
          });
        });

        // 추가 버튼
        wrap.querySelectorAll('[data-gadd]').forEach(btn => {
          btn.addEventListener('click', () => {
            const type  = btn.dataset.gadd;
            const input = document.getElementById(`sm_${type}_input`);
            const val   = input?.value.trim();
            if (val) { addGameStep2(type, val, null, true); input.value = ''; }
          });
        });

        // Enter 키
        ['want','learn'].forEach(type => {
          const el = document.getElementById(`sm_${type}_input`);
          if (!el) return;
          el.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            const acList = el.closest('div')?.querySelector('.pr-autocomplete-list');
            if (acList?.classList.contains('is-open')) return;
            const val = el.value.trim();
            if (val) { addGameStep2(type, val, null, true); el.value = ''; }
          });
        });

        // 자동완성 (전체 게임 목록)
        if (window.attachAc) {
          ['want','learn'].forEach(type => {
            const el = document.getElementById(`sm_${type}_input`);
            if (!el) return;
            window.attachAc(
              el,
              () => (window.COTTAGE_GAMES || []).map(g => g.display).filter(Boolean),
              (selected) => {
                const cg = (window.COTTAGE_GAMES || []).find(g => g.display === selected);
                const gameId = cg?.bggId && !isNaN(Number(cg.bggId)) ? Number(cg.bggId) : null;
                addGameStep2(type, selected, gameId, false);
                el.value = '';
              }
            );
            // .sm-body(overflow-y:auto)가 드롭다운을 클리핑하는 문제 우회
            // 수정 모드에서 기존 게임이 있으면 입력창이 아래로 밀려 드롭다운이 잘림
            const acList = el.parentElement?.querySelector('.pr-autocomplete-list');
            if (acList) {
              acList.style.position = 'fixed';
              acList.style.zIndex = '500';
              const _repos = () => {
                const r = el.getBoundingClientRect();
                acList.style.left = r.left + 'px';
                acList.style.top = (r.bottom + 2) + 'px';
                acList.style.width = r.width + 'px';
              };
              el.addEventListener('input', _repos, { passive: true });
              el.addEventListener('focus', _repos, { passive: true });
            }
          });
        }

        // 삭제
        wrap.querySelectorAll('.sm-game-del').forEach(btn => {
          btn.addEventListener('click', () => {
            _gameMap[_activeDay][btn.dataset.type].splice(parseInt(btn.dataset.idx), 1);
            renderStep2Games();
          });
        });

        // ⭐ 대표 게임 토글 (로컬 — DB 호출 없음), want+learn 합산 최대 2개
        wrap.querySelectorAll('.sm-game-star').forEach(btn => {
          btn.addEventListener('click', () => {
            const type = btn.dataset.type;
            const idx = parseInt(btn.dataset.idx);
            const day = _gameMap[_activeDay];
            const g = (day[type] || [])[idx];
            if (!g) return;
            if (!g.is_priority) {
              const starred = [...(day.want||[]), ...(day.learn||[])].filter(x => x.is_priority).length;
              if (starred >= 2) { showToast('대표 게임은 최대 2개까지 지정할 수 있어요 (want+learn 합산)'); return; }
            }
            g.is_priority = !g.is_priority;
            renderStep2Games();
          });
        });

        // 인원 조건 칩 선택
        wrap.querySelectorAll('.sm-cond-chip:not([disabled])').forEach(btn => {
          btn.addEventListener('click', () => {
            const type = btn.dataset.cctype;
            const idx  = parseInt(btn.dataset.ccidx);
            const val  = btn.dataset.ccval;
            const g = (_gameMap[_activeDay]?.[type] || [])[idx];
            if (!g) return;
            g.player_condition = val;
            renderStep2Games();
          });
        });

        // 피커 항목 선택
        wrap.querySelectorAll('.sm-picker-item:not([disabled])').forEach(btn => {
          btn.addEventListener('click', () => {
            const type   = btn.dataset.ptype;
            const source = type === 'want' ? 'like' : 'curious';
            const items  = getPickerItems(type, source);
            const item   = items[parseInt(btn.dataset.pidx)];
            if (!item || isDup(type, item)) return;
            const _cg = item.game_id ? (window.COTTAGE_GAMES || []).find(c => c.bggId === String(item.game_id) || c.id === String(item.game_id)) : null;
            const _resolvedId = _cg?.bggId && !isNaN(Number(_cg.bggId)) ? Number(_cg.bggId) : null;
            addGameStep2(type, resolveGameName(item), _resolvedId, false);
          });
        });

        if (_step === 3) {
          const btn = $s('smSave');
          if (btn) {
            const total = _days.reduce((n, ds) => n + (_gameMap[ds]?.want?.length||0) + (_gameMap[ds]?.learn?.length||0), 0);
            btn.textContent = total > 0 ? '저장' : '건너뛰고 저장';
          }
        }
      }

      // ── Step 3: 게임 선택 ───────────────────────────────────────
      function renderStep3() {
        _step = 3;
        if (!_activeDay || !_days.includes(_activeDay)) _activeDay = _days[0];
        $s('smTitle').textContent = '게임 선택';
        $s('smBack').style.visibility = 'visible';
        $s('smBack').textContent = '← 시간 수정';

        const tabsHtml = _days.length > 1
          ? `<div class="sm-tabs" id="smGameTabs">${buildTabs()}</div>` : '';
        $s('smBody').innerHTML =
          `${tabsHtml}<p class="sm-hint">선택 사항이에요 — 없으면 건너뛰세요.</p><div id="smGameSections"></div>`;
        $s('smFooter').innerHTML =
          `<button class="sched-confirm-btn" id="smSave" type="button">건너뛰고 저장</button>`;

        renderStep2Games();

        if (_days.length > 1) {
          document.getElementById('smGameTabs')?.querySelectorAll('.sm-tab').forEach(tab => {
            tab.addEventListener('click', () => {
              _activeDay = tab.dataset.ds;
              document.getElementById('smGameTabs').querySelectorAll('.sm-tab').forEach(t =>
                t.classList.toggle('is-active', t.dataset.ds === _activeDay));
              renderStep2Games();
            });
          });
        }

        $s('smSave').addEventListener('click', () => saveAll());
      }

      // ── 게임 추가 + 역연동 + 다중날짜 전파 ──────────────────────
      async function addGameStep2(type, name, gameId, isManualInput) {
        if (!_gameMap[_activeDay]) _gameMap[_activeDay] = {want:[], learn:[]};
        const entry = {custom_name: name, game_id: gameId ?? null, is_priority: false, player_condition: 'any'};
        if (isDup(type, entry)) return;

        _gameMap[_activeDay][type].push(entry);
        renderStep2Games();

        if (isManualInput)   await promptCrossSync(type, name, gameId);
        if (_days.length > 1) await promptOtherDates(type, entry);
      }

      async function promptCrossSync(type, name, gameId) {
        const user = window.getKakaoUser?.();
        if (!user) return;
        const source = type === 'want' ? 'like' : 'curious';
        const cached = _pickerCache[source];
        if (!Array.isArray(cached)) return;
        const alreadyIn = cached.some(g =>
          (gameId && g.game_id && String(g.game_id) === String(gameId)) ||
          (g.custom_name && g.custom_name.trim() === name.trim())
        );
        if (alreadyIn) return;
        const boardLabel = type === 'want' ? '좋아요한 게임' : '궁금한 게임';
        const table      = type === 'want' ? 'game_likes' : 'game_curious';
        if (confirm(`"${name}"을(를) ${boardLabel}에도 추가할까요?`)) {
          try {
            await window.CottageDB?.addGamePref(String(user.id), gameId ?? null, name, table);
            _pickerCache[source].push({game_id: gameId ?? null, custom_name: name});
          } catch(e) { console.error('addGamePref 오류:', e); }
        }
      }

      async function promptOtherDates(type, entry) {
        const otherDays = _days.filter(d => d !== _activeDay);
        if (!otherDays.length) return;
        const label = type === 'want' ? '하고 싶은 게임' : '배우고 싶은 게임';
        if (confirm(`다른 날짜에도 "${entry.custom_name}"을(를) ${label}로 추가할까요?`)) {
          otherDays.forEach(ds => {
            if (!_gameMap[ds]) _gameMap[ds] = {want:[], learn:[]};
            const dup = _gameMap[ds][type].some(g =>
              (entry.game_id && g.game_id && String(g.game_id) === String(entry.game_id)) ||
              (entry.custom_name && g.custom_name === entry.custom_name)
            );
            if (!dup) _gameMap[ds][type].push({...entry});
          });
        }
      }

      function saveCurrentTime() {
        const rs = $s('smRS'), re = $s('smRE');
        if (rs && re && _activeDay) _timeMap[_activeDay] = { s: parseInt(rs.value), e: parseInt(re.value) };
      }

      // ── 저장 ───────────────────────────────────────────────────
      async function saveAll() {
        const user = window.getKakaoUser?.();
        if (!user) { showToast('로그인이 필요합니다.'); return; }
        const saveBtn = $s('smSave');
        if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '저장 중...'; }

        try {
          for (const ds of _days) {
            const t = _timeMap[ds] || {s:10, e:22};
            const result = await window.CottageDB?.upsertMeetingVote(String(user.id), user.nickname||'익명', ds, t.s, t.e);
            if (!result?.success) throw new Error(result?.error?.message || '시간 저장 오류');

            // 기존 게임 삭제 후 재삽입
            const existingGames = allVoteGames.filter(g => g.vote_date===ds && String(g.user_id)===String(user.id));
            for (const g of existingGames) {
              await window.CottageDB?.removeMeetingVoteGame(String(user.id), ds, g.list_type, g.game_id, g.custom_name);
            }
            const dayGames = _gameMap[ds] || {want:[], learn:[]};
            for (const g of dayGames.want) {
              if (g.custom_name || g.game_id) await window.CottageDB?.addMeetingVoteGame(String(user.id), ds, 'want', g.game_id??null, g.custom_name??null);
            }
            for (const g of dayGames.learn) {
              if (g.custom_name || g.game_id) await window.CottageDB?.addMeetingVoteGame(String(user.id), ds, 'learn', g.game_id??null, g.custom_name??null);
            }
            // INSERT 직후 is_priority + player_condition 반영 (want+learn 모두, 항상 전송)
            for (const [listType, list] of [['want', dayGames.want], ['learn', dayGames.learn]]) {
              for (const g of list) {
                if (!(g.custom_name || g.game_id)) continue;
                if (g.is_priority) {
                  const r = await window.CottageDB?.setMeetingVoteGamePriority(String(user.id), ds, g.game_id??null, g.custom_name??null, listType, true);
                  if (r && !r.ok) console.error('[setMeetingVoteGamePriority]', r);
                }
                const cond = g.player_condition ?? 'any';
                const rc = await window.CottageDB?.setMeetingVoteGameCondition(String(user.id), ds, g.game_id??null, g.custom_name??null, listType, cond);
                if (rc && !rc.ok) console.error('[setMeetingVoteGameCondition]', rc);
              }
            }

            // 메모리 갱신
            allVotes = allVotes.filter(v => !(v.vote_date===ds && String(v.user_id)===String(user.id)));
            allVotes.push({vote_date:ds, user_id:String(user.id), nickname:user.nickname||'익명', time_start:t.s, time_end:t.e});
            allVoteGames = allVoteGames.filter(g => !(g.vote_date===ds && String(g.user_id)===String(user.id)));
            for (const g of dayGames.want) {
              if (g.custom_name || g.game_id) allVoteGames.push({vote_date:ds, user_id:String(user.id), list_type:'want', game_id:g.game_id??null, custom_name:g.custom_name??null, is_priority:g.is_priority??false, player_condition:g.player_condition??'any'});
            }
            for (const g of dayGames.learn) {
              if (g.custom_name || g.game_id) allVoteGames.push({vote_date:ds, user_id:String(user.id), list_type:'learn', game_id:g.game_id??null, custom_name:g.custom_name??null, is_priority:g.is_priority??false, player_condition:g.player_condition??'any'});
            }
          }
          _notifyParentSaved();
          close();
          renderWeekView(weekOffset);
          showToast('저장되었습니다!');
        } catch(err) {
          console.error(err);
          showToast('저장 중 오류가 발생했습니다.');
          if (saveBtn) { saveBtn.disabled=false; saveBtn.textContent='저장'; }
        }
      }

      // ── 외부 진입점 ────────────────────────────────────────────
      _openMultiSheet = function({ startStep=1, dates=[] } = {}) {
        _fromStep1 = startStep === 1;
        if (dates.length > 0) {
          // 첫 날짜의 주차로 _modalWeekOffset 계산 (reset-week 등 외부 상태 무관)
          const d = parseDate(dates[0]);
          const dow = TODAY.getDay();
          const curMon = new Date(TODAY);
          curMon.setDate(TODAY.getDate() + (dow === 0 ? -6 : 1 - dow));
          const tdow = d.getDay();
          const tgtMon = new Date(d);
          tgtMon.setDate(d.getDate() + (tdow === 0 ? -6 : 1 - tdow));
          _modalWeekOffset = Math.round((tgtMon - curMon) / 6048e5);
        } else {
          _modalWeekOffset = weekOffset;
        }
        _historicalVotes = null;
        _days = [...dates].sort();
        _timeMap = {}; _gameMap = {}; _activeDay = null; _gameOpen = {want:false, learn:false};
        _days.forEach(initDay);
        overlay.style.display = '';
        if (startStep === 2) renderStep2();
        else renderStep1();

        // 8주 이력 비차단 조회 — Step2 프리셋·초기값 반영
        const _histUser = window.getKakaoUser?.();
        if (_histUser) {
          const past = new Date(TODAY);
          past.setDate(TODAY.getDate() - 56);
          window.CottageDB?.getMeetingVotes(toDateStr(past), toDateStr(TODAY))
            .then(votes => {
              _historicalVotes = votes || [];
              const myPast = _historicalVotes
                .filter(v => String(v.user_id) === String(_histUser.id))
                .sort((a, b) => b.vote_date.localeCompare(a.vote_date));
              if (!myPast.length) return;
              const recent = myPast[0];
              _days.forEach(ds => {
                const hasExisting = allVotes.some(v => v.vote_date === ds && String(v.user_id) === String(_histUser.id));
                if (!hasExisting && _timeMap[ds] && _timeMap[ds].s === 10 && _timeMap[ds].e === 22) {
                  _timeMap[ds] = { s: recent.time_start, e: recent.time_end };
                }
              });
            })
            .catch(() => { _historicalVotes = []; });
        }
      };
    }

    function openScheduleSheet(ds, myVote) {
      _sheetDs = ds;
      const [y, m, d] = ds.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      const action = myVote ? '시간 수정' : '시간 등록';
      document.getElementById('ssTitle').textContent =
        `${m}/${d}(${DOW[date.getDay()]}) ${action}`;

      const btnSave = document.getElementById('ssSave');
      btnSave.textContent = myVote ? '저장' : '등록';
      btnSave.disabled = false;

      const initS = myVote?.time_start ?? 10;
      const initE = myVote?.time_end ?? 22;
      const range = MAX_H - MIN_H;
      const ssRS = document.getElementById('ssRS');
      const ssRE = document.getElementById('ssRE');
      ssRS.value = initS;
      ssRE.value = initE;
      document.getElementById('ssRangeFill').style.left  = ((initS - MIN_H) / range * 100) + '%';
      document.getElementById('ssRangeFill').style.width = ((initE - initS) / range * 100) + '%';
      document.getElementById('ssLblS').textContent = initS + '시';
      document.getElementById('ssLblE').textContent = initE + '시';

      // 지난주 버튼: 데이터 있으면 시간 표시, 없으면 row 숨김
      const _user = window.getKakaoUser?.();
      const prevDs = toDateStr(new Date(y, m - 1, d - 7));
      const prevVote = _user
        ? allVotes.find(v => v.vote_date === prevDs && String(v.user_id) === String(_user.id))
        : null;
      const rowPrev = document.getElementById('ssPrevWeekRow');
      if (prevVote) {
        document.getElementById('ssPrevWeek').textContent =
          `지난주 ${prevVote.time_start}~${prevVote.time_end} 적용`;
        rowPrev.style.display = '';
      } else {
        rowPrev.style.display = 'none';
      }

      document.getElementById('schedSheetOverlay').style.display = '';

      // 마지막 카드가 시트에 가려지지 않도록 여백 추가
      const listEl = document.getElementById('weekDayList');
      if (listEl) listEl.style.paddingBottom = '260px';

      // 바깥 클릭 → 닫기 (열기 클릭이 즉시 발동하지 않도록 setTimeout)
      setTimeout(() => {
        document.addEventListener('click', _closeSheetOnOutsideClick);
      }, 0);
    }

    function _closeSheetOnOutsideClick(e) {
      const sheet = document.querySelector('.sched-sheet');
      if (sheet && !sheet.contains(e.target)) closeScheduleSheet();
    }

    function closeScheduleSheet() {
      document.getElementById('schedSheetOverlay').style.display = 'none';
      const listEl = document.getElementById('weekDayList');
      if (listEl) listEl.style.paddingBottom = '';
      document.removeEventListener('click', _closeSheetOnOutsideClick);
      _sheetDs = null;
    }

    async function saveVoteForDate(ds, start, end, btnSave) {
      const user = window.getKakaoUser?.();
      if (!user) return;
      if (btnSave) btnSave.disabled = true;

      const result = await window.CottageDB?.upsertMeetingVote(
        String(user.id), user.nickname || '익명', ds, start, end
      );
      if (result?.success) {
        allVotes = allVotes.filter(v => !(v.vote_date === ds && String(v.user_id) === String(user.id)));
        allVotes.push({ vote_date: ds, user_id: String(user.id), nickname: user.nickname || '익명', time_start: start, time_end: end });
        _notifyParentSaved();
        closeScheduleSheet();
        renderWeekView(weekOffset);
      } else {
        if (btnSave) btnSave.disabled = false;
        alert(`저장 오류: ${result?.error?.message || '알 수 없는 오류'}`);
      }
    }

    async function removeVoteForDate(ds) {
      if (!confirm('참여를 취소할까요?')) return;
      const user = window.getKakaoUser?.();
      if (!user) return;
      const result = await window.CottageDB?.deleteMeetingVote(String(user.id), ds);
      if (result?.success) {
        allVotes = allVotes.filter(v => !(v.vote_date === ds && String(v.user_id) === String(user.id)));
        _notifyParentSaved();
        renderWeekView(weekOffset);
      } else {
        alert('취소 중 오류가 발생했어요.');
      }
    }

    // ── 월간 달력 (달력보기 토글) ────────────────────────────────────
    function renderMonthCalendar() {
      const cal = document.getElementById('viewCalendar');
      const y   = calMonthDate.getFullYear();
      const m   = calMonthDate.getMonth();
      const MONTH_NAMES = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

      const firstDow  = new Date(y, m, 1).getDay();
      const lastDate  = new Date(y, m + 1, 0).getDate();
      const startOff  = firstDow === 0 ? 6 : firstDow - 1; // 0=월 기준

      const cntByDate = {};
      const myDates   = new Set();
      const user      = window.getKakaoUser?.();
      const todayStr  = toDateStr(TODAY);
      for (const v of allVotes) {
        if (!cntByDate[v.vote_date]) cntByDate[v.vote_date] = 0;
        cntByDate[v.vote_date]++;
        if (user && String(v.user_id) === String(user.id)) myDates.add(v.vote_date);
      }

      const totalCells = Math.ceil((startOff + lastDate) / 7) * 7;
      let cells = '';
      for (let i = 0; i < totalCells; i++) {
        const day = i - startOff + 1;
        if (day < 1 || day > lastDate) { cells += '<div class="mcal-cell mcal-empty"></div>'; continue; }
        const ds     = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const cnt    = cntByDate[ds] || 0;
        const past   = ds < todayStr;
        const tod    = ds === todayStr;
        const mine   = myDates.has(ds);
        const dow    = (startOff + day - 1) % 7;  // 0=월..4=금,5=토,6=일
        const clsList = ['mcal-cell',
          past ? 'is-past' : '', tod ? 'is-today' : '',
          mine ? 'is-mine' : '', dow === 5 ? 'is-sat' : '', dow === 6 ? 'is-sun' : ''
        ].filter(Boolean).join(' ');

        cells += `<div class="${clsList}" data-date="${ds}">
          <span class="mcal-day">${day}</span>
          ${cnt > 0 ? `<span class="mcal-cnt">${cnt}명</span>` : ''}
          ${mine ? `<span class="mcal-mine-dot"></span>` : ''}
        </div>`;
      }

      cal.innerHTML = `
        <div class="mcal-nav">
          <button class="mcal-nav-btn" id="calPrev" type="button">‹</button>
          <span class="mcal-title">${y}년 ${MONTH_NAMES[m]}</span>
          <button class="mcal-nav-btn" id="calNext" type="button">›</button>
        </div>
        <div class="mcal-header"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="is-sat">토</span><span class="is-sun">일</span></div>
        <div class="mcal-grid">${cells}</div>`;

      document.getElementById('calPrev').addEventListener('click', () => {
        calMonthDate = new Date(y, m - 1, 1); renderMonthCalendar();
      });
      document.getElementById('calNext').addEventListener('click', () => {
        calMonthDate = new Date(y, m + 1, 1); renderMonthCalendar();
      });
      cal.querySelectorAll('.mcal-cell[data-date]').forEach(cell => {
        cell.addEventListener('click', () => navigateToDate(cell.dataset.date));
      });
    }

    // ── 주간 뷰 헬퍼 / 렌더러 (Phase 1+2) ────────────────────────

    function getWeekOffset(ds) {
      const target = new Date(ds + 'T00:00:00');
      const targetDow = target.getDay();
      const targetMon = new Date(target);
      targetMon.setDate(target.getDate() - (targetDow === 0 ? 6 : targetDow - 1));
      targetMon.setHours(0, 0, 0, 0);
      const todayDow = TODAY.getDay();
      const thisMon = new Date(TODAY);
      thisMon.setDate(TODAY.getDate() - (todayDow === 0 ? 6 : todayDow - 1));
      return Math.round((targetMon - thisMon) / (7 * 86400000));
    }

    function navigateToDate(ds) {
      const cal = document.getElementById('viewCalendar');
      const btn = document.getElementById('btnToggleCal');
      if (cal && cal.style.display !== 'none') {
        cal.style.display = 'none';
        if (btn) { btn.textContent = '달력 보기 ▾'; btn.classList.remove('is-open'); }
      }
      renderWeekView(getWeekOffset(ds), ds);
    }

    function getWeekTitle(monday) {
      // 목요일 기준으로 해당 월·주차 결정 (월경계 주 처리)
      const thu = new Date(monday);
      thu.setDate(monday.getDate() + 3);
      const m = thu.getMonth() + 1;
      const weekNum = Math.ceil(thu.getDate() / 7);
      const ord = ['첫째','둘째','셋째','넷째','다섯째'];
      return `${m}월 ${ord[weekNum - 1] || weekNum + '번째'} 주`;
    }

    function renderWeekView(offset, targetDate = null) {
      weekOffset = offset;
      const todayDow = TODAY.getDay();
      const daysToMon = todayDow === 0 ? -6 : 1 - todayDow;
      const monday = new Date(TODAY);
      monday.setDate(TODAY.getDate() + daysToMon + offset * 7);

      const _relLabel = offset === 0 ? '이번 주' : offset === -1 ? '지난 주' : offset === 1 ? '다음 주' : null;
      document.getElementById('weekTitle').textContent = getWeekTitle(monday) + (_relLabel ? ` (${_relLabel})` : '');

      const user = window.getKakaoUser?.();

      // 모임 등록 버튼: 로그인 시만 표시, 핸들러 매번 재연결
      const regRow = document.getElementById('schedRegisterRow');
      const regBtn = document.getElementById('btnScheduleRegister');
      if (regRow) regRow.style.display = user ? '' : 'none';
      if (regBtn) {
        regBtn.onclick = () => _openMultiSheet?.({ startStep: 1 });
      }

      const el   = document.getElementById('weekDayList');
      let html = '';

      for (let d = 0; d < 7; d++) {
        const date = new Date(monday);
        date.setDate(monday.getDate() + d);
        const ds  = toDateStr(date);
        const dow = date.getDay();
        const past = date < TODAY;
        const tod  = date.getTime() === TODAY.getTime();

        const dayVotes = allVotes.filter(v => v.vote_date === ds);
        const myVote   = dayVotes.find(v => user && String(v.user_id) === String(user.id));
        const cnt      = new Set(dayVotes.map(v => v.user_id)).size;

        const dowCls  = dow === 0 ? ' is-sun' : dow === 6 ? ' is-sat' : '';
        const pastCls = past ? ' is-past' : '';
        const todCls  = tod  ? ' is-today' : '';
        const tgtCls  = (targetDate && ds === targetDate && !tod) ? ' is-target' : '';
        const todayBadge = tod ? '<span class="sdc-today-label">오늘</span>' : '';

        let headerBtns = '';
        if (user && !past && !myVote) {
          headerBtns = `<div class="sched-card-header-actions">
            <button class="sched-card-reg-hdr" type="button">+ 등록</button>
          </div>`;
        }

        html += `<div class="sched-wday-card${pastCls}${todCls}${tgtCls}" data-date="${ds}">
          <div class="sched-wday-header" data-date="${ds}">
            <div class="sched-wday-left">
              <span class="sched-wday-dow${dowCls}">${date.getMonth()+1}/${date.getDate()}(${DOW[dow]})</span>
              ${todayBadge}
              <span class="sched-wday-count">👥 ${cnt}명</span>
            </div>
            ${headerBtns}
          </div>
          ${window.buildBarsInCard(dayVotes, allVoteGames, myVote)}
          ${dayVotes.length ? `<button class="sched-card-detail-btn" type="button" data-date="${ds}">이날 모임 상세 →</button>` : ''}
        </div>`;
      }
      el.innerHTML = html;

      // 이날 모임 한눈에 보기 → 집계 모달 (홈 미리보기와 동일 모달)
      el.querySelectorAll('.sched-card-detail-btn[data-date]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const ds = btn.dataset.date;
          const dv = allVotes.filter(v => v.vote_date === ds);
          const dg = allVoteGames.filter(g => g.vote_date === ds);
          window.openDateMeetingModal?.(ds, dv, dg, {});
        });
      });

      // 헤더 클릭만 상세(등록) 화면 이동 — 바 영역 클릭은 이동 없음
      el.querySelectorAll('.sched-wday-header[data-date]').forEach(hdr => {
        hdr.addEventListener('click', () => navigateToDate(hdr.dataset.date));
      });

      // 이름 클릭 → 해당 유저 모임 보드
      el.querySelectorAll('.sched-bar-name').forEach(n => {
        n.addEventListener('click', () => {
          window.CottageDB?.trackEvent('meeting_profile_click');
          window.openOtherMeetingSheet?.(n.dataset.uid);
        });
      });

      // 막대 클릭 → 일정 상세 모달 (통계 포함)
      el.querySelectorAll('.sched-bar-track[data-date]').forEach(track => {
        track.addEventListener('click', () => {
          window.CottageDB?.trackEvent('meeting_planner_bar_click');
          const _uid = track.dataset.uid, _date = track.dataset.date;
          window.openDateScheduleModal?.(_uid, _date, {
            onDirtyClosed: (updatedGames) => {
              if (updatedGames) {
                allVoteGames = allVoteGames.filter(g => !(g.vote_date === _date && String(g.user_id) === _uid));
                allVoteGames.push(...updatedGames);
              }
              renderWeekView(weekOffset);
              try { window.parent?.postMessage({ type: 'cottage-meeting-saved' }, '*'); } catch (_) {}
            },
          });
        });
      });

      // +N명 더보기 토글
      el.querySelectorAll('.sched-card-more-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const hiddenEl  = btn.previousElementSibling;
          const isExpanded = hiddenEl.style.display !== 'none';
          hiddenEl.style.display = isExpanded ? 'none' : '';
          const hiddenCnt = hiddenEl.querySelectorAll('.sched-bar-item').length;
          btn.textContent = isExpanded ? `+${hiddenCnt}명 더보기` : '접기 ▴';
        });
      });

      // 등록 버튼 (헤더 우상단, 미등록) → 바텀시트 열기
      el.querySelectorAll('.sched-card-reg-hdr').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          _openMultiSheet?.({ startStep: 2, dates: [btn.closest('.sched-wday-card').dataset.date] });
        });
      });

      // ✏ 수정 (내 막대 행) → 멀티스텝 시트 열기
      el.querySelectorAll('.sched-bar-edit-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          _openMultiSheet?.({ startStep: 2, dates: [btn.closest('.sched-wday-card').dataset.date] });
        });
      });

      // ✕ 참여 취소 (내 막대 행)
      el.querySelectorAll('.sched-bar-del-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          removeVoteForDate(btn.closest('.sched-wday-card').dataset.date);
        });
      });

    }
