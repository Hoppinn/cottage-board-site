<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/images/main/favicon-square.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/images/main/favicon-square.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>모임 플래너 | 코티지보드 동호회</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
  <style>
    /* ── 4주 뷰 ─────────────────────────────────────── */
    .sched-week-section { margin-bottom: 22px; }
    .sched-week-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: .04em;
      margin-bottom: 8px;
    }
    .sched-week-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    @media (min-width: 520px) {
      .sched-week-row { grid-template-columns: repeat(4, 1fr); }
    }
    .sched-day-card {
      padding: 10px 10px 10px;
      border-radius: 10px;
      background: #faf8f5;
      cursor: pointer;
      min-height: 80px;
    }
    .sched-day-card:hover { background: #f0ebe0; }
    .sched-day-card.is-today { background: #f5ece0; outline: 2px solid var(--green); }
    .sched-day-card.is-past { opacity: 0.28; cursor: default; pointer-events: none; }
    .sched-day-card.is-empty { background: transparent; border: 1px dashed #e8e0d4; cursor: default; pointer-events: none; opacity: 0.35; }
    .sdc-header { display: flex; align-items: baseline; gap: 5px; margin-bottom: 5px; }
    .sdc-dow { font-size: 11px; color: var(--muted); font-weight: 600; line-height: 1; }
    .sdc-date { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1; }
    .sched-day-card.is-sat .sdc-dow,
    .sched-day-card.is-sat .sdc-date { color: #5080e0; }
    .sched-day-card.is-sun .sdc-dow,
    .sched-day-card.is-sun .sdc-date { color: #e05050; }
    .sdc-today-label { font-size: 9px; font-weight: 800; color: var(--green); background: #e6f4e8; border-radius: 4px; padding: 1px 5px; line-height: 1.5; }
    .sdc-count { font-size: 13px; font-weight: 800; color: var(--green); margin-bottom: 3px; }
    .sdc-time-row { font-size: 11px; color: var(--muted); line-height: 1.5; }
    .sdc-time-row strong { color: var(--text); font-weight: 700; }
    .sdc-names { font-size: 11px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sdc-no-overlap { color: #e05050 !important; }
    .sched-week-section.is-this-week {
      background: #faf5ec;
      border-radius: 10px;
      padding: 10px 10px 12px;
      margin: 0 -8px 20px;
    }

    /* ── 날짜 상세 요약 ──────────────────────────────── */
    .sched-summary-card {
      background: #f5ece0;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      display: flex;
      gap: 14px;
    }
    .sched-summary-item { flex: 1; text-align: center; }
    .sched-summary-lbl { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: .03em; margin-bottom: 3px; }
    .sched-summary-val { font-size: 14px; font-weight: 800; color: var(--text); line-height: 1.2; }
    .sched-summary-val.is-green { color: var(--green); }

    /* ── 시간대별 인원 ───────────────────────────────── */
    .sched-hrly-section { margin-bottom: 22px; }
    .sched-hrly-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }
    .sched-hrly-time { font-size: 11px; color: var(--muted); width: 64px; flex-shrink: 0; text-align: right; }
    .sched-hrly-bar-wrap { flex: 1; height: 16px; background: #ede8e0; border-radius: 4px; overflow: hidden; }
    .sched-hrly-bar { height: 100%; background: var(--green); border-radius: 4px; opacity: 0.55; transition: width 0.2s; }
    .sched-hrly-row.is-peak .sched-hrly-bar { opacity: 1; }
    .sched-hrly-row.is-peak .sched-hrly-time { color: var(--text); font-weight: 700; }
    .sched-hrly-count { font-size: 11px; font-weight: 700; color: var(--muted); width: 24px; flex-shrink: 0; }
    .sched-hrly-row.is-peak .sched-hrly-count { color: var(--green); }

    /* ── 날짜 상세 ────────────────────────────────── */
    .sched-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--green);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      margin-bottom: 10px;
    }
    .sched-day-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--text);
      margin: 0 0 18px;
    }

    /* 섹션 레이블 */
    .sched-section-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    /* 겹침 카드 */
    .sched-overlap-section { margin-bottom: 22px; }
    .sched-overlap-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 10px;
      background: #f5ece0;
      margin-bottom: 6px;
    }
    .sched-overlap-emoji { font-size: 20px; flex-shrink: 0; }
    .sched-overlap-info { flex: 1; min-width: 0; }
    .sched-overlap-time { font-size: 16px; font-weight: 700; color: var(--text); }
    .sched-overlap-who {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sched-overlap-count {
      font-size: 24px;
      font-weight: 800;
      color: var(--green);
      flex-shrink: 0;
    }
    .sched-overlap-count span { font-size: 13px; font-weight: 600; }

    .sched-no-votes {
      text-align: center;
      color: var(--muted);
      padding: 28px 0;
      font-size: 14px;
      line-height: 1.7;
    }

    /* 막대 그래프 */
    .sched-bar-section { margin-bottom: 22px; }
    .sched-bar-axis {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 6px;
      padding-left: 60px;
    }
    .sched-bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      position: relative;
    }
    /* 바 행 + 게임명 묶음 */
    .sched-bar-group { margin-bottom: 7px; }
    .sched-bar-group .sched-bar-row { margin-bottom: 2px; }
    .sched-bar-games {
      padding-left: 60px; /* name(52px) + gap(8px) — bar-track 시작점에 맞춤 */
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
    }
    .sched-card-bars.has-mine .sched-bar-games { padding-right: 62px; }
    /* 내 행이 있을 때: 모든 바+축을 동일 너비로 맞추고 오른쪽 60px에 버튼 공간 확보 */
    .sched-card-bars.has-mine .sched-bar-axis { padding-right: 60px; }
    .sched-card-bars.has-mine .sched-bar-track { margin-right: 60px; }
    .sched-bar-actions {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      gap: 2px;
    }
    .sched-bar-edit-btn,
    .sched-bar-del-btn {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      border-radius: 50%;
      font-size: 15px;
      cursor: pointer;
      color: #b8b0a4;
      padding: 0;
      transition: background .15s, color .15s;
    }
    .sched-bar-edit-btn:hover,
    .sched-bar-edit-btn:active { background: #ede8de; color: var(--green); }
    .sched-bar-del-btn:hover,
    .sched-bar-del-btn:active { background: #fdecea; color: #d94f4f; }
    .sched-bar-name {
      font-size: 12px;
      color: var(--text);
      width: 52px;
      flex-shrink: 0;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      text-decoration: underline dotted;
      text-underline-offset: 2px;
    }
    .sched-bar-name:hover { color: var(--green); text-decoration: underline; }
    .sched-bar-track {
      flex: 1;
      height: 24px;
      background: #ede8e0;
      border-radius: 5px;
      position: relative;
    }
    .sched-bar-fill {
      position: absolute;
      top: 0; bottom: 0;
      background: var(--green);
      border-radius: 5px;
      opacity: 0.72;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 6px;
      min-width: 32px;
      overflow: hidden;
    }
    .sched-bar-fill.is-mine { background: #c0843a; opacity: 0.9; }
    .sched-bar-time {
      font-size: 10px;
      color: white;
      font-weight: 700;
      white-space: nowrap;
    }

    /* 내 등록 */
    .sched-my-section {
      border-bottom: 1px solid #ede8e0;
      padding-bottom: 18px;
      margin-bottom: 18px;
    }
    .sched-my-status {
      font-size: 13px;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 8px;
    }
    .sched-register-btn {
      width: 100%;
      padding: 13px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .sched-register-btn:hover { opacity: 0.88; }
    .sched-login-hint {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      padding: 10px 0;
    }
    .sched-my-current {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f0ece0;
      border-radius: 10px;
      padding: 13px 14px;
      margin-bottom: 0;
    }
    .sched-my-time { font-size: 16px; font-weight: 700; color: var(--text); }
    .sched-my-actions { display: flex; gap: 8px; }
    .sched-action-btn {
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid;
    }
    .sched-action-btn--edit { border-color: var(--green); color: var(--green); background: white; }
    .sched-action-btn--del { border-color: #d0c8bc; color: var(--muted); background: white; }
    .sched-action-btn--del:hover { border-color: #e05050; color: #e05050; }

    /* 슬라이더 */
    .sched-slider-wrap { margin-bottom: 16px; }
    .sched-slider-times {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 14px;
    }
    .sched-slider-time-val { font-size: 26px; font-weight: 800; color: var(--green); }
    .sched-slider-sep { font-size: 16px; color: var(--muted); }

    .sched-dual-range {
      position: relative;
      height: 40px;
      margin: 0 4px;
    }
    .sched-range-track {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      left: 0; right: 0;
      height: 6px;
      background: #ddd8cc;
      border-radius: 3px;
    }
    .sched-range-fill {
      position: absolute;
      height: 100%;
      background: var(--green);
      border-radius: 3px;
    }
    input.sched-range-input {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 100%; margin: 0;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      pointer-events: none;
      height: 40px;
    }
    input.sched-range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--green);
      cursor: pointer;
      pointer-events: all;
      border: 3px solid white;
      box-shadow: 0 1px 5px rgba(0,0,0,0.28);
    }
    input.sched-range-input::-moz-range-thumb {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--green);
      cursor: pointer;
      pointer-events: all;
      border: 3px solid white;
      box-shadow: 0 1px 5px rgba(0,0,0,0.28);
    }
    .sched-range-axis {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 10px;
      color: var(--muted);
    }
    .sched-confirm-row { display: flex; gap: 8px; margin-top: 14px; }
    .sched-confirm-btn {
      flex: 1;
      padding: 12px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      background: var(--green);
      color: white;
    }
    .sched-discard-btn {
      padding: 12px 16px;
      border-radius: 9px;
      font-size: 14px;
      cursor: pointer;
      border: 1.5px solid #d0c8bc;
      background: white;
      color: var(--muted);
    }


    .sched-loading { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }

    /* ── 주간 뷰 (Phase 1) ──────────────────────────────────── */
    .sched-week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .sched-week-nav-btn {
      background: none;
      border: none;
      font-size: 13px;
      color: var(--green);
      font-weight: 600;
      cursor: pointer;
      padding: 4px 6px;
    }
    .sched-week-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
    }
    .sched-toggle-cal-btn {
      display: block;
      width: 100%;
      padding: 8px;
      background: none;
      border: 1px solid #e0d8cc;
      border-radius: 8px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      margin-bottom: 14px;
      text-align: center;
    }
    .sched-toggle-cal-btn:hover { background: #faf5ec; }
    .sched-toggle-cal-btn.is-open { color: var(--green); border-color: var(--green); }
    .sched-wday-card {
      padding: 12px 14px;
      border-radius: 10px;
      background: #faf8f5;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .sched-wday-card:hover { background: #f0ebe0; }
    .sched-wday-card.is-past { opacity: 0.3; cursor: default; pointer-events: none; }
    .sched-wday-card.is-today { background: #f5ece0; outline: 2px solid var(--green); }
    .sched-wday-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sched-wday-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .sched-wday-dow {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .sched-wday-dow.is-sat { color: #5080e0; }
    .sched-wday-dow.is-sun { color: #e05050; }
    .sched-wday-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--green);
    }
    /* Phase 2: 카드 내 시간 바 */
    .sched-wday-card { cursor: default; }
    .sched-wday-header { cursor: pointer; }
    .sched-card-bars {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #ede8e0;
    }
    .sched-card-more-btn {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 4px 0;
      background: none;
      border: none;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      text-align: center;
    }
    .sched-card-more-btn:hover { color: var(--green); }
    /* Phase 3: 카드 푸터 */
    /* 헤더 우상단 수정/⋯ */
    .sched-card-header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sched-card-reg-hdr {
      padding: 2px 8px;
      background: none;
      border: 1px solid #c8bfb0;
      border-radius: 6px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
    }
    .sched-card-reg-hdr:hover { border-color: var(--green); color: var(--green); }
    /* 월간 달력 */
    .mcal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0 10px;
    }
    .mcal-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .mcal-nav-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--muted);
      cursor: pointer;
      padding: 0 6px;
      line-height: 1;
    }
    .mcal-nav-btn:hover { color: var(--text); }
    .mcal-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      padding-bottom: 4px;
    }
    .mcal-header .is-sat { color: #5080e0; }
    .mcal-header .is-sun { color: #e05050; }
    .mcal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .mcal-cell {
      min-height: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 2px 2px;
      border-radius: 6px;
      cursor: pointer;
    }
    .mcal-empty { cursor: default; }
    .mcal-cell.is-past { opacity: .4; cursor: default; pointer-events: none; }
    .mcal-cell:not(.is-past):not(.mcal-empty):hover { background: #f0ebe0; }
    .mcal-cell.is-mine { background: #f5f0e8; }
    .mcal-day {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .mcal-cell.is-sat .mcal-day { color: #5080e0; }
    .mcal-cell.is-sun .mcal-day { color: #e05050; }
    .mcal-cell.is-today .mcal-day {
      background: var(--green);
      color: #fff;
    }
    .mcal-cnt {
      font-size: 10px;
      font-weight: 600;
      color: var(--green);
      margin-top: 2px;
    }
    .mcal-mine-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #c0843a;
      margin-top: 2px;
    }
    /* 시간 등록/수정 컴팩트 바텀시트 */
    .sched-sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.15);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      pointer-events: none;   /* dim만 표시, 배경 스크롤 통과 */
    }
    .sched-sheet {
      width: 100%;
      background: #fff;
      border-radius: 18px 18px 0 0;
      padding: 16px 16px 28px;
      box-shadow: 0 -4px 20px rgba(0,0,0,.12);
      pointer-events: auto;   /* 시트 본체만 인터랙션 */
    }
    .sched-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .sched-sheet-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    .sched-sheet-close-btn {
      background: none;
      border: none;
      font-size: 18px;
      color: var(--muted);
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .sched-sheet-time-display {
      text-align: center;
      margin-bottom: 12px;
    }
    .sched-sheet-time-display .sched-slider-time-val {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }
    .sched-sheet-time-display .sched-slider-sep {
      font-size: 18px;
      color: var(--muted);
      margin: 0 6px;
    }
    .sched-sheet-footer {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .sched-sheet-footer .sched-confirm-btn { flex: 1; }
    .sched-sheet-footer .sched-discard-btn { flex: 0 0 72px; }
    .sched-sheet-prevweek-row {
      text-align: right;
      margin-bottom: 2px;
    }
    .sched-sheet-prevweek-btn {
      background: none;
      border: none;
      padding: 0;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .sched-sheet-prevweek-btn:hover { color: var(--green); }
    /* 토스트 */
    .sched-toast {
      position: fixed;
      bottom: 260px;
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: rgba(0,0,0,.72);
      color: #fff;
      font-size: 13px;
      padding: 8px 18px;
      border-radius: 20px;
      z-index: 210;
      opacity: 0;
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      white-space: nowrap;
    }
    .sched-toast.is-show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

  </style>
</head>

<body class="owned-page">
  <script src="../../assets/js/header.js" data-index="false"></script>

  <main>
    <section class="inner-page">
      <nav class="breadcrumb owned-page-breadcrumb">
        <a href="./club.html#club-meeting">동호회</a> <span class="bc-sep">›</span> 모임 플래너
      </nav>
      <div class="page-mini-hero page-mini-hero--club">
        <h1>모임 플래너</h1>
      </div>
      <div class="inner-page-body">

        <div class="sched-loading" id="mainLoading">불러오는 중...</div>

        <!-- 주간 뷰 (Phase 1) ─ 기본 화면 -->
        <div id="viewWeek" style="display:none">
          <div class="sched-week-nav">
            <button class="sched-week-nav-btn" id="btnPrevWeek">← 이전 주</button>
            <span class="sched-week-title" id="weekTitle"></span>
            <button class="sched-week-nav-btn" id="btnNextWeek">다음 주 →</button>
          </div>
          <button class="sched-toggle-cal-btn" id="btnToggleCal">달력 보기 ▾</button>
          <!-- 4주 달력 (토글, 기존 viewCalendar 이동) -->

        <!-- 날짜 상세 뷰 (기존 유지) -->
        <div id="viewDay" style="display:none">

          <h2 class="sched-day-title" id="dayTitle"></h2>
          <div id="myVoteSection"></div>
          <div id="overlapSection"></div>
          <div id="barSection"></div>
        </div>

      </div>

  <script src="../../game-system/config/bgg-label-map.js"></script>
  <script src="../../game-system/game-data/library/3-output/cottage-games-data-output.js"></script>
  <script src="../../assets/js/game-display-adapter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../../assets/js/supabase-config.js"></script>
  <script src="../../assets/js/supabase-client.js"></script>
  <script src="../../assets/js/achievements.js"></script>
  <script src="../../assets/js/page-labels.js"></script>
  <script src="../../assets/js/script.js"></script>
  <script src="../../assets/js/play-records-utils.js"></script>
  <script src="../../assets/js/kakao-auth.js"></script>

  <script>
  (function () {
    const MIN_H = 9, MAX_H = 23;
    const DOW = ['일','월','화','수','목','금','토'];
    const TODAY = new Date();
    TODAY.setHours(0, 0, 0, 0);

    let allVotes     = [];
    let allVoteGames = [];   // meeting_vote_games (날짜별 want/learn 게임)
    let currentDate = null;
    let sliderMode = false;
    let sliderStart = 10, sliderEnd = 22;
    let weekOffset    = 0;
    let calMonthDate  = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
    let _sheetDs   = null;   // 바텀시트 대상 날짜 (null = 닫힘)
    let _syncSheet = null;   // initScheduleSheet에서 주입되는 슬라이더 sync 함수

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function toDateStr(date) {
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }

    function parseDate(s) {
      const [y, m, d] = s.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatLabel(s) {
      const d = parseDate(s);
      return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;
    }

    function isPast(s) { return parseDate(s) < TODAY; }
    function isToday(s) { return parseDate(s).getTime() === TODAY.getTime(); }

    // ── 날짜별 요약 계산 ─────────────────────────────────────
    function calcSummary(votes) {
      if (!votes.length) return null;
      const totalStart = Math.min(...votes.map(v => v.time_start));
      const totalEnd = Math.max(...votes.map(v => v.time_end));
      const blocks = calcOverlap(votes);
      const top = blocks[0] || null;
      return {
        count: votes.length,
        totalStart, totalEnd,
        overlapStart: top?.start,
        overlapEnd: top?.end,
        overlapCount: top?.count,
        names: votes.map(v => v.nickname),
      };
    }

    // ── 겹침 계산 ─────────────────────────────────────────────
    function calcOverlap(votes) {
      if (!votes.length) return [];
      const slots = [];
      for (let h = MIN_H; h < MAX_H; h++) {
        slots.push({
          h,
          names: votes.filter(v => v.time_start <= h && v.time_end > h).map(v => v.nickname)
        });
      }
      const blocks = [];
      let i = 0;
      while (i < slots.length) {
        const names = slots[i].names;
        const key = [...names].sort().join('§');
        let j = i + 1;
        while (j < slots.length && [...slots[j].names].sort().join('§') === key) j++;
        if (names.length > 0) {
          const endH = j < slots.length ? slots[j].h : MAX_H;
          blocks.push({ start: slots[i].h, end: endH, count: names.length, names: [...names] });
        }
        i = j;
      }
      return blocks.sort((a, b) => b.count - a.count || (b.end - b.start) - (a.end - a.start));
    }

    // ── 4주 뷰 렌더 (이번 주 포함 월~일 고정) ─────────────────
    function renderCalendar() {
      const countByDate = {}, votesByDate = {};
      for (const v of allVotes) {
        if (!countByDate[v.vote_date]) countByDate[v.vote_date] = new Set();
        countByDate[v.vote_date].add(v.user_id);
        if (!votesByDate[v.vote_date]) votesByDate[v.vote_date] = [];
        votesByDate[v.vote_date].push(v);
      }

      // 이번 주 월요일
      const todayDow = TODAY.getDay(); // 0=Sun
      const daysToMon = todayDow === 0 ? -6 : -(todayDow - 1);
      const thisMonday = new Date(TODAY);
      thisMonday.setDate(TODAY.getDate() + daysToMon);

      function buildCard(date) {
        const ds = toDateStr(date);
        const dow = date.getDay();
        const tod = date.getTime() === TODAY.getTime();
        const past = date < TODAY;
        const dayVotes = votesByDate[ds] || [];
        const cnt = countByDate[ds]?.size || 0;
        const dowCls = dow === 0 ? ' is-sun' : dow === 6 ? ' is-sat' : '';
        const pastCls = past ? ' is-past' : '';
        const todayCls = tod ? ' is-today' : '';
        const todayLabel = tod ? '<span class="sdc-today-label">오늘</span>' : '';

        let infoHtml = '';
        if (!past && cnt > 0) {
          const s = calcSummary(dayVotes);
          const nameStr = s.names.length <= 2
            ? s.names.map(n => esc(n)).join(', ')
            : `${esc(s.names[0])} 외 ${s.names.length - 1}명`;
          const overlapLine = s.overlapStart != null
            ? `겹침 <strong>${s.overlapStart}~${s.overlapEnd}</strong>`
            : `<span class="sdc-no-overlap">겹침 없음</span>`;
          infoHtml = `<div class="sdc-count">${cnt}명</div>
            <div class="sdc-time-row">전체 <strong>${s.totalStart}~${s.totalEnd}</strong></div>
            <div class="sdc-time-row">${overlapLine}</div>
            <div class="sdc-names">${nameStr}</div>`;
        }

        return `<div class="sched-day-card${dowCls}${pastCls}${todayCls}" data-date="${ds}">
          <div class="sdc-header">${todayLabel}<span class="sdc-dow">${DOW[dow]}</span><span class="sdc-date">${date.getMonth()+1}/${date.getDate()}</span></div>
          ${infoHtml}
        </div>`;
      }

      const sectionLabels = ['이번 주', '다음 주', '2주 뒤', '3주 뒤'];
      let html = '';
      for (let w = 0; w < 4; w++) {
        const thisCls = w === 0 ? ' is-this-week' : '';
        html += `<div class="sched-week-section${thisCls}"><div class="sched-week-label">${sectionLabels[w]}</div><div class="sched-week-row">`;
        for (let d = 0; d < 7; d++) {
          const date = new Date(thisMonday);
          date.setDate(thisMonday.getDate() + w * 7 + d);
          html += buildCard(date);
        }
        html += '</div></div>';
      }

      const el = document.getElementById('weekView');
      el.innerHTML = html;
      el.querySelectorAll('.sched-day-card:not(.is-past)').forEach(card => {
        card.addEventListener('click', () => openDay(card.dataset.date));
      });
    }

    // ── 날짜 상세 ─────────────────────────────────────────────
    function openDay(ds) {
      currentDate = ds;
      sliderMode = false;
      document.getElementById('viewWeek').style.display = 'none';
      document.getElementById('viewDay').style.display = '';
      document.getElementById('dayTitle').textContent = formatLabel(ds);
      renderDayDetail(ds);
    }

    function renderDayDetail(ds) {
      const dayVotes = allVotes.filter(v => v.vote_date === ds);
      const user = window.getKakaoUser?.();
      const myVote = dayVotes.find(v => user && String(v.user_id) === String(user.id));
      renderMyVote(ds, myVote);
      renderOverlap(dayVotes);
      renderBars(dayVotes, myVote);
    }

    function renderHourlyBreakdown(votes) {
      if (votes.length < 2) return '';
      const hourCounts = [];
      for (let h = MIN_H; h < MAX_H; h++) {
        const cnt = votes.filter(v => v.time_start <= h && v.time_end > h).length;
        if (cnt > 0) hourCounts.push({ h, cnt });
      }
      if (!hourCounts.length) return '';
      const groups = [];
      let i = 0;
      while (i < hourCounts.length) {
        const cnt = hourCounts[i].cnt;
        let j = i + 1;
        while (j < hourCounts.length && hourCounts[j].cnt === cnt) j++;
        const endH = j < hourCounts.length ? hourCounts[j].h : MAX_H;
        groups.push({ start: hourCounts[i].h, end: endH, cnt });
        i = j;
      }
      const maxCnt = Math.max(...groups.map(g => g.cnt));
      const rows = groups.map(g => {
        const pct = (g.cnt / votes.length * 100).toFixed(0);
        const peak = g.cnt === maxCnt;
        return `<div class="sched-hrly-row${peak ? ' is-peak' : ''}">
          <span class="sched-hrly-time">${g.start}~${g.end}시</span>
          <div class="sched-hrly-bar-wrap"><div class="sched-hrly-bar" style="width:${pct}%"></div></div>
          <span class="sched-hrly-count">${g.cnt}명</span>
        </div>`;
      }).join('');
      return `<div class="sched-hrly-section">
        <div class="sched-section-label">시간대별 인원</div>
        ${rows}
      </div>`;
    }

    function renderOverlap(votes) {
      const el = document.getElementById('overlapSection');
      if (!votes.length) {
        el.innerHTML = '<div class="sched-no-votes">아직 등록된 일정이 없어요.<br>첫 번째로 등록해보세요!</div>';
        return;
      }
      const s = calcSummary(votes);
      const blocks = calcOverlap(votes);
      const top = blocks[0];
      const summaryHtml = `<div class="sched-summary-card">
        <div class="sched-summary-item">
          <div class="sched-summary-lbl">👥 참여</div>
          <div class="sched-summary-val is-green">${s.count}명</div>
        </div>
        <div class="sched-summary-item">
          <div class="sched-summary-lbl">⏰ 전체</div>
          <div class="sched-summary-val">${s.totalStart}~${s.totalEnd}시</div>
        </div>
        <div class="sched-summary-item">
          <div class="sched-summary-lbl">🔥 겹침</div>
          <div class="sched-summary-val${top ? ' is-green' : ''}">${top ? `${top.start}~${top.end}시` : '없음'}</div>
        </div>
      </div>`;
      const emojis = ['🔥','😊','📌'];
      const blocksHtml = blocks.length ? blocks.slice(0, 3).map((b, i) => `
        <div class="sched-overlap-card">
          <span class="sched-overlap-emoji">${emojis[i] || '·'}</span>
          <div class="sched-overlap-info">
            <div class="sched-overlap-time">${b.start}:00 ~ ${b.end}:00</div>
            <div class="sched-overlap-who">${b.names.map(n => esc(n)).join(' · ')}</div>
          </div>
          <div class="sched-overlap-count">${b.count}<span>명</span></div>
        </div>`).join('') : '<div style="color:var(--muted);font-size:13px;padding:4px 0">겹치는 시간이 없어요.</div>';
      el.innerHTML = `<div class="sched-overlap-section">
        ${summaryHtml}
        <div class="sched-section-label">🔥 모두 가능한 시간</div>
        ${blocksHtml}
        ${renderHourlyBreakdown(votes)}
      </div>`;
    }

    function renderBars(votes, myVote) {
      const el = document.getElementById('barSection');
      if (!votes.length) { el.innerHTML = ''; return; }
      const range = MAX_H - MIN_H;
      const rows = votes.map(v => {
        const left = ((v.time_start - MIN_H) / range * 100).toFixed(1);
        const width = ((v.time_end - v.time_start) / range * 100).toFixed(1);
        const mine = myVote && String(v.user_id) === String(myVote.user_id);
        return `<div class="sched-bar-row">
          <span class="sched-bar-name" data-uid="${esc(v.user_id)}" data-nick="${esc(v.nickname)}">${esc(v.nickname)}</span>
          <div class="sched-bar-track">
            <div class="sched-bar-fill${mine ? ' is-mine' : ''}" style="left:${left}%;width:${width}%">
              <span class="sched-bar-time">${v.time_start}~${v.time_end}</span>
            </div>
          </div>
        </div>`;
      }).join('');

      el.innerHTML = `<div class="sched-bar-section">
        <div class="sched-section-label">참여 가능 시간</div>
        <div class="sched-bar-axis">
          <span>${MIN_H}시</span><span>${Math.round((MIN_H + MAX_H) / 2)}시</span><span>${MAX_H}시</span>
        </div>
        ${rows}
      </div>`;

      el.querySelectorAll('.sched-bar-name').forEach(n => {
        n.addEventListener('click', () => window.openOtherMeetingSheet?.(n.dataset.uid));
      });
    }

    function renderMyVote(ds, myVote) {
      const el = document.getElementById('myVoteSection');
      const user = window.getKakaoUser?.();

      if (!user) {
        el.innerHTML = `<div class="sched-my-section">
          <div class="sched-login-hint">가능 시간을 등록하려면 로그인이 필요해요.</div>
          <button class="sched-register-btn" onclick="document.getElementById('kakaoLoginBtn')?.click()" type="button">카카오 로그인</button>
        </div>`;
        return;
      }

      if (sliderMode) {
        renderSlider(el, ds, myVote);
        return;
      }

      if (myVote) {
        el.innerHTML = `<div class="sched-my-section">
          <div class="sched-my-status">✅ 참여중</div>
          <div class="sched-my-current">
            <span class="sched-my-time">${myVote.time_start}:00 ~ ${myVote.time_end}:00</span>
            <div class="sched-my-actions">
              <button class="sched-action-btn sched-action-btn--edit" id="btnEdit">시간 변경</button>
              <button class="sched-action-btn sched-action-btn--del" id="btnDel">참여 취소</button>
            </div>
          </div>
        </div>`;
        document.getElementById('btnEdit').addEventListener('click', () => {
          sliderStart = myVote.time_start;
          sliderEnd = myVote.time_end;
          sliderMode = true;
          renderMyVote(ds, myVote);
        });
        document.getElementById('btnDel').addEventListener('click', () => removeVote(ds));
      } else {
        el.innerHTML = `<div class="sched-my-section">
          <button class="sched-register-btn" id="btnRegister">나도 등록하기</button>
        </div>`;
        document.getElementById('btnRegister').addEventListener('click', () => {
          sliderStart = 10; sliderEnd = 22;
          sliderMode = true;
          renderMyVote(ds, myVote);
        });
      }
    }

    function renderSlider(container, ds, myVote) {
      const range = MAX_H - MIN_H;
      container.innerHTML = `<div class="sched-my-section">
        <div class="sched-section-label">가능 시간 선택</div>
        <div class="sched-slider-wrap">
          <div class="sched-slider-times">
            <span class="sched-slider-time-val" id="lblS">${sliderStart}시</span>
            <span class="sched-slider-sep">~</span>
            <span class="sched-slider-time-val" id="lblE">${sliderEnd}시</span>
          </div>
          <div class="sched-dual-range">
            <div class="sched-range-track">
              <div class="sched-range-fill" id="rangeFill"></div>
            </div>
            <input type="range" class="sched-range-input" id="rS"
              min="${MIN_H}" max="${MAX_H - 1}" step="1" value="${sliderStart}">
            <input type="range" class="sched-range-input" id="rE"
              min="${MIN_H + 1}" max="${MAX_H}" step="1" value="${sliderEnd}">
          </div>
          <div class="sched-range-axis">
            <span>${MIN_H}시</span>
            <span>${Math.round((MIN_H + MAX_H) / 2)}시</span>
            <span>${MAX_H}시</span>
          </div>
        </div>
        <div class="sched-confirm-row">
          <button class="sched-confirm-btn" id="btnSave">등록</button>
          <button class="sched-discard-btn" id="btnDiscardSlider">닫기</button>
        </div>
      </div>`;

      const rS = document.getElementById('rS');
      const rE = document.getElementById('rE');
      const fill = document.getElementById('rangeFill');
      const lblS = document.getElementById('lblS');
      const lblE = document.getElementById('lblE');

      function sync() {
        const s = parseInt(rS.value), e = parseInt(rE.value);
        fill.style.left = ((s - MIN_H) / range * 100) + '%';
        fill.style.width = ((e - s) / range * 100) + '%';
        lblS.textContent = s + '시';
        lblE.textContent = e + '시';
        sliderStart = s; sliderEnd = e;
      }
      rS.addEventListener('input', () => {
        if (parseInt(rS.value) >= parseInt(rE.value)) rS.value = parseInt(rE.value) - 1;
        sync();
      });
      rE.addEventListener('input', () => {
        if (parseInt(rE.value) <= parseInt(rS.value)) rE.value = parseInt(rS.value) + 1;
        sync();
      });
      sync();

      document.getElementById('btnSave').addEventListener('click', () => saveVote(ds));
      document.getElementById('btnDiscardSlider').addEventListener('click', () => {
        sliderMode = false;
        renderMyVote(ds, myVote);
      });
    }

    async function saveVote(ds) {
      const user = window.getKakaoUser?.();
      if (!user) return;
      const btn = document.getElementById('btnSave');
      if (btn) btn.disabled = true;

      const result = await window.CottageDB?.upsertMeetingVote(
        String(user.id), user.nickname || '익명', ds, sliderStart, sliderEnd
      );

      if (result?.success) {
        allVotes = allVotes.filter(v => !(v.vote_date === ds && String(v.user_id) === String(user.id)));
        allVotes.push({ vote_date: ds, user_id: String(user.id), nickname: user.nickname || '익명', time_start: sliderStart, time_end: sliderEnd });
        sliderMode = false;
        renderCalendar();
        renderDayDetail(ds);
      } else {
        if (btn) btn.disabled = false;
        const msg = result?.error?.message || '알 수 없는 오류';
        alert(`저장 오류: ${msg}`);
      }
    }

    async function removeVote(ds) {
      if (!confirm('참여를 취소할까요?')) return;
      const user = window.getKakaoUser?.();
      if (!user) return;

      const result = await window.CottageDB?.deleteMeetingVote(String(user.id), ds);
      if (result?.success) {
        allVotes = allVotes.filter(v => !(v.vote_date === ds && String(v.user_id) === String(user.id)));
        renderCalendar();
        renderDayDetail(ds);
      } else {
        alert('취소 중 오류가 발생했어요.');
      }
    }


    // ── 주간 카드 등록/변경/취소 (Phase 3) ──────────────────────────

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'sched-toast';
      t.textContent = msg;
      document.body.appendChild(t);
      requestAnimationFrame(() => t.classList.add('is-show'));
      setTimeout(() => {
        t.classList.remove('is-show');
        setTimeout(() => t.remove(), 280);
      }, 2200);
    }

    // ── 시간 등록/수정 바텀시트 ──────────────────────────────────────

    function initScheduleSheet() {
      const range = MAX_H - MIN_H;
      const overlay = document.createElement('div');
      overlay.className = 'sched-sheet-overlay';
      overlay.id = 'schedSheetOverlay';
      overlay.innerHTML = `<div class="sched-sheet">
        <div class="sched-sheet-header">
          <span class="sched-sheet-title" id="ssTitle"></span>
          <button class="sched-sheet-close-btn" id="ssClose" type="button">✕</button>
        </div>
        <div class="sched-sheet-body">
          <div class="sched-sheet-prevweek-row" id="ssPrevWeekRow">
            <button class="sched-sheet-prevweek-btn" id="ssPrevWeek" type="button"></button>
          </div>
          <div class="sched-sheet-time-display">
            <span class="sched-slider-time-val" id="ssLblS">10시</span>
            <span class="sched-slider-sep">~</span>
            <span class="sched-slider-time-val" id="ssLblE">22시</span>
          </div>
          <div class="sched-slider-wrap">
            <div class="sched-dual-range">
              <div class="sched-range-track"><div class="sched-range-fill" id="ssRangeFill"></div></div>
              <input type="range" class="sched-range-input" id="ssRS"
                min="${MIN_H}" max="${MAX_H - 1}" step="1" value="10">
              <input type="range" class="sched-range-input" id="ssRE"
                min="${MIN_H + 1}" max="${MAX_H}" step="1" value="22">
            </div>
            <div class="sched-range-axis">
              <span>${MIN_H}시</span><span>${Math.round((MIN_H+MAX_H)/2)}시</span><span>${MAX_H}시</span>
            </div>
          </div>
        </div>
        <div class="sched-sheet-footer">
          <button class="sched-confirm-btn" id="ssSave" type="button">등록</button>
          <button class="sched-discard-btn" id="ssDiscard" type="button">닫기</button>
        </div>
      </div>`;
      overlay.style.display = 'none';
      document.body.appendChild(overlay);

      const ssRS = document.getElementById('ssRS');
      const ssRE = document.getElementById('ssRE');
      const fill = document.getElementById('ssRangeFill');
      const lblS = document.getElementById('ssLblS');
      const lblE = document.getElementById('ssLblE');

      function syncSheet() {
        const s = parseInt(ssRS.value), e = parseInt(ssRE.value);
        fill.style.left  = ((s - MIN_H) / range * 100) + '%';
        fill.style.width = ((e - s)     / range * 100) + '%';
        lblS.textContent = s + '시';
        lblE.textContent = e + '시';
      }
      _syncSheet = syncSheet;  // 외부(지난주와 동일 버튼)에서 호출 가능하도록 노출

      ssRS.addEventListener('input', () => {
        if (parseInt(ssRS.value) >= parseInt(ssRE.value)) ssRS.value = parseInt(ssRE.value) - 1;
        syncSheet();
      });
      ssRE.addEventListener('input', () => {
        if (parseInt(ssRE.value) <= parseInt(ssRS.value)) ssRE.value = parseInt(ssRS.value) + 1;
        syncSheet();
      });

      document.getElementById('ssSave').addEventListener('click', () => {
        const btnSave = document.getElementById('ssSave');
        saveVoteForDate(_sheetDs, parseInt(ssRS.value), parseInt(ssRE.value), btnSave);
      });
      document.getElementById('ssDiscard').addEventListener('click', closeScheduleSheet);
      document.getElementById('ssClose').addEventListener('click', closeScheduleSheet);

      // 지난주와 동일: 같은 요일 7일 전 내 투표 → 슬라이더 이동 (자동저장 없음)
      document.getElementById('ssPrevWeek').addEventListener('click', () => {
        if (!_sheetDs) return;
        const user = window.getKakaoUser?.();
        if (!user) { showToast('로그인이 필요합니다.'); return; }
        const [y, m, d] = _sheetDs.split('-').map(Number);
        const prevDs = toDateStr(new Date(y, m - 1, d - 7));
        const prev   = allVotes.find(v => v.vote_date === prevDs && String(v.user_id) === String(user.id));
        if (!prev) { showToast('지난주 기록이 없습니다.'); return; }
        ssRS.value = prev.time_start;
        ssRE.value = prev.time_end;
        if (_syncSheet) _syncSheet();
      });

      // 바깥 클릭 닫기는 openScheduleSheet에서 document 레벨로 등록
    }

    function openScheduleSheet(ds, myVote) {
      _sheetDs = ds;
      const [y, m, d] = ds.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      const action = myVote ? '시간 수정' : '시간 등록';
      document.getElementById('ssTitle').textContent =
        `${DOW[date.getDay()]} ${m}/${d} ${action}`;

      const btnSave = document.getElementById('ssSave');
      btnSave.textContent = myVote ? '저장' : '등록';
      btnSave.disabled = false;

      const initS = myVote?.time_start ?? 10;
      const initE = myVote?.time_end ?? 22;
      const range = MAX_H - MIN_H;
      const ssRS = document.getElementById('ssRS');
      const ssRE = document.getElementById('ssRE');
      ssRS.value = initS;
      ssRE.value = initE;
      document.getElementById('ssRangeFill').style.left  = ((initS - MIN_H) / range * 100) + '%';
      document.getElementById('ssRangeFill').style.width = ((initE - initS) / range * 100) + '%';
      document.getElementById('ssLblS').textContent = initS + '시';
      document.getElementById('ssLblE').textContent = initE + '시';

      // 지난주 버튼: 데이터 있으면 시간 표시, 없으면 row 숨김
      const _user = window.getKakaoUser?.();
      const prevDs = toDateStr(new Date(y, m - 1, d - 7));
      const prevVote = _user
        ? allVotes.find(v => v.vote_date === prevDs && String(v.user_id) === String(_user.id))
        : null;
      const rowPrev = document.getElementById('ssPrevWeekRow');
      if (prevVote) {
        document.getElementById('ssPrevWeek').textContent =
          `지난주 ${prevVote.time_start}~${prevVote.time_end} 적용`;
        rowPrev.style.display = '';
      } else {
        rowPrev.style.display = 'none';
      }

      document.getElementById('schedSheetOverlay').style.display = '';

      // 마지막 카드가 시트에 가려지지 않도록 여백 추가
      const listEl = document.getElementById('weekDayList');
      if (listEl) listEl.style.paddingBottom = '260px';

      // 바깥 클릭 → 닫기 (열기 클릭이 즉시 발동하지 않도록 setTimeout)
      setTimeout(() => {
        document.addEventListener('click', _closeSheetOnOutsideClick);
      }, 0);
    }

    function _closeSheetOnOutsideClick(e) {
      const sheet = document.querySelector('.sched-sheet');
      if (sheet && !sheet.contains(e.target)) closeScheduleSheet();
    }

    function closeScheduleSheet() {
      document.getElementById('schedSheetOverlay').style.display = 'none';
      const listEl = document.getElementById('weekDayList');
      if (listEl) listEl.style.paddingBottom = '';
      document.removeEventListener('click', _closeSheetOnOutsideClick);
      _sheetDs = null;
    }

    async function saveVoteForDate(ds, start, end, btnSave) {
      const user = window.getKakaoUser?.();
      if (!user) return;
      if (btnSave) btnSave.disabled = true;

      const result = await window.CottageDB?.upsertMeetingVote(
        String(user.id), user.nickname || '익명', ds, start, end
      );
      if (result?.success) {
        allVotes = allVotes.filter(v => !(v.vote_date === ds && String(v.user_id) === String(user.id)));
        allVotes.push({ vote_date: ds, user_id: String(user.id), nickname: user.nickname || '익명', time_start: start, time_end: end });
        closeScheduleSheet();
        renderWeekView(weekOffset);
      } else {
        if (btnSave) btnSave.disabled = false;
        alert(`저장 오류: ${result?.error?.message || '알 수 없는 오류'}`);
      }
    }

    async function removeVoteForDate(ds) {
      if (!confirm('참여를 취소할까요?')) return;
      const user = window.getKakaoUser?.();
      if (!user) return;
      const result = await window.CottageDB?.deleteMeetingVote(String(user.id), ds);
      if (result?.success) {
        allVotes = allVotes.filter(v => !(v.vote_date === ds && String(v.user_id) === String(user.id)));
        renderWeekView(weekOffset);
      } else {
        alert('취소 중 오류가 발생했어요.');
      }
    }

    // ── 월간 달력 (달력보기 토글) ────────────────────────────────────
    function renderMonthCalendar() {
      const cal = document.getElementById('viewCalendar');
      const y   = calMonthDate.getFullYear();
      const m   = calMonthDate.getMonth();
      const MONTH_NAMES = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

      const firstDow  = new Date(y, m, 1).getDay();
      const lastDate  = new Date(y, m + 1, 0).getDate();
      const startOff  = firstDow === 0 ? 6 : firstDow - 1; // 0=월 기준

      const cntByDate = {};
      const myDates   = new Set();
      const user      = window.getKakaoUser?.();
      const todayStr  = toDateStr(TODAY);
      for (const v of allVotes) {
        if (!cntByDate[v.vote_date]) cntByDate[v.vote_date] = 0;
        cntByDate[v.vote_date]++;
        if (user && String(v.user_id) === String(user.id)) myDates.add(v.vote_date);
      }

      const totalCells = Math.ceil((startOff + lastDate) / 7) * 7;
      let cells = '';
      for (let i = 0; i < totalCells; i++) {
        const day = i - startOff + 1;
        if (day < 1 || day > lastDate) { cells += '<div class="mcal-cell mcal-empty"></div>'; continue; }
        const ds     = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const cnt    = cntByDate[ds] || 0;
        const past   = ds < todayStr;
        const tod    = ds === todayStr;
        const mine   = myDates.has(ds);
        const dow    = (startOff + day - 1) % 7;  // 0=월..4=금,5=토,6=일
        const clsList = ['mcal-cell',
          past ? 'is-past' : '', tod ? 'is-today' : '',
          mine ? 'is-mine' : '', dow === 5 ? 'is-sat' : '', dow === 6 ? 'is-sun' : ''
        ].filter(Boolean).join(' ');

        cells += `<div class="${clsList}" data-date="${ds}">
          <span class="mcal-day">${day}</span>
          ${cnt > 0 ? `<span class="mcal-cnt">${cnt}명</span>` : ''}
          ${mine ? `<span class="mcal-mine-dot"></span>` : ''}
        </div>`;
      }

      cal.innerHTML = `
        <div class="mcal-nav">
          <button class="mcal-nav-btn" id="calPrev" type="button">‹</button>
          <span class="mcal-title">${y}년 ${MONTH_NAMES[m]}</span>
          <button class="mcal-nav-btn" id="calNext" type="button">›</button>
        </div>
        <div class="mcal-header"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="is-sat">토</span><span class="is-sun">일</span></div>
        <div class="mcal-grid">${cells}</div>`;

      document.getElementById('calPrev').addEventListener('click', () => {
        calMonthDate = new Date(y, m - 1, 1); renderMonthCalendar();
      });
      document.getElementById('calNext').addEventListener('click', () => {
        calMonthDate = new Date(y, m + 1, 1); renderMonthCalendar();
      });
      cal.querySelectorAll('.mcal-cell[data-date]:not(.is-past)').forEach(cell => {
        cell.addEventListener('click', () => openDay(cell.dataset.date));
      });
    }

    // ── 주간 뷰 헬퍼 / 렌더러 (Phase 1+2) ────────────────────────
    function getWeekTitle(monday) {
      // 목요일 기준으로 해당 월·주차 결정 (월경계 주 처리)
      const thu = new Date(monday);
      thu.setDate(monday.getDate() + 3);
      const m = thu.getMonth() + 1;
      const weekNum = Math.ceil(thu.getDate() / 7);
      const ord = ['첫째','둘째','셋째','넷째','다섯째'];
      return `${m}월 ${ord[weekNum - 1] || weekNum + '번째'} 주`;
    }

    // 카드 내 시간 바 HTML 빌더 — renderBars() 미수정, 독립 함수
    function buildBarsInCard(dayVotes, myVote) {
      if (!dayVotes.length) return '';
      const LIMIT = 3;
      const range = MAX_H - MIN_H;
      const hasMine = !!myVote;

      function gameNames(voteDate, userId, listType) {
        const games = allVoteGames.filter(g =>
          g.vote_date === voteDate &&
          String(g.user_id) === String(userId) &&
          g.list_type === listType
        );
        if (!games.length) return '';
        const names = games.map(g => esc(g.custom_name || `#${g.game_id}`));
        if (names.length <= 2) return names.join(' · ');
        return names.slice(0, 1).join('') + ` 외 ${names.length - 1}개`;
      }

      function barRow(v) {
        const left  = ((v.time_start - MIN_H) / range * 100).toFixed(1);
        const width = ((v.time_end - v.time_start) / range * 100).toFixed(1);
        const mine  = myVote && String(v.user_id) === String(myVote.user_id);
        const actions = mine
          ? `<div class="sched-bar-actions">
              <button class="sched-bar-edit-btn" type="button" aria-label="참여 시간 수정">✎</button>
              <button class="sched-bar-del-btn" type="button" aria-label="참여 취소">✕</button>
            </div>`
          : '';
        const want  = gameNames(v.vote_date, v.user_id, 'want');
        const learn = gameNames(v.vote_date, v.user_id, 'learn');
        const gamesHtml = (want || learn) ? `<div class="sched-bar-games">${
          [want ? `🎲 ${want}` : '', learn ? `📖 ${learn}` : ''].filter(Boolean).join('  ')
        }</div>` : '';
        return `<div class="sched-bar-group">
          <div class="sched-bar-row">
            <span class="sched-bar-name" data-uid="${esc(v.user_id)}">${esc(v.nickname)}</span>
            <div class="sched-bar-track">
              <div class="sched-bar-fill${mine ? ' is-mine' : ''}" style="left:${left}%;width:${width}%">
                <span class="sched-bar-time">${v.time_start}~${v.time_end}</span>
              </div>
            </div>
            ${actions}
          </div>
          ${gamesHtml}
        </div>`;
      }

      const shown  = dayVotes.slice(0, LIMIT);
      const hidden = dayVotes.slice(LIMIT);
      const moreHtml = hidden.length
        ? `<div class="sched-card-hidden-rows" style="display:none">${hidden.map(barRow).join('')}</div>
           <button class="sched-card-more-btn" type="button">+${hidden.length}명 더보기</button>`
        : '';

      return `<div class="sched-card-bars${hasMine ? ' has-mine' : ''}">
        <div class="sched-bar-axis">
          <span>${MIN_H}시</span><span>${Math.round((MIN_H + MAX_H) / 2)}시</span><span>${MAX_H}시</span>
        </div>
        ${shown.map(barRow).join('')}
        ${moreHtml}
      </div>`;
    }

    function renderWeekView(offset) {
      weekOffset = offset;
      const todayDow = TODAY.getDay();
      const daysToMon = todayDow === 0 ? -6 : 1 - todayDow;
      const monday = new Date(TODAY);
      monday.setDate(TODAY.getDate() + daysToMon + offset * 7);

      const _relLabel = offset === 0 ? '이번 주' : offset === -1 ? '지난 주' : offset === 1 ? '다음 주' : null;
      document.getElementById('weekTitle').textContent = getWeekTitle(monday) + (_relLabel ? ` (${_relLabel})` : '');

      const user = window.getKakaoUser?.();
      const el   = document.getElementById('weekDayList');
      let html = '';

      for (let d = 0; d < 7; d++) {
        const date = new Date(monday);
        date.setDate(monday.getDate() + d);
        const ds  = toDateStr(date);
        const dow = date.getDay();
        const past = date < TODAY;
        const tod  = date.getTime() === TODAY.getTime();

        const dayVotes = allVotes.filter(v => v.vote_date === ds);
        const myVote   = dayVotes.find(v => user && String(v.user_id) === String(user.id));
        const cnt      = new Set(dayVotes.map(v => v.user_id)).size;

        const dowCls  = dow === 0 ? ' is-sun' : dow === 6 ? ' is-sat' : '';
        const pastCls = past ? ' is-past' : '';
        const todCls  = tod  ? ' is-today' : '';
        const todayBadge = tod ? '<span class="sdc-today-label">오늘</span>' : '';

        let headerBtns = '';
        if (user && !past && !myVote) {
          headerBtns = `<div class="sched-card-header-actions">
            <button class="sched-card-reg-hdr" type="button">+ 등록</button>
          </div>`;
        }

        html += `<div class="sched-wday-card${pastCls}${todCls}" data-date="${ds}">
          <div class="sched-wday-header" data-date="${ds}">
            <div class="sched-wday-left">
              <span class="sched-wday-dow${dowCls}">${DOW[dow]} ${date.getMonth()+1}/${date.getDate()}</span>
              ${todayBadge}
              <span class="sched-wday-count">👥 ${cnt}명</span>
            </div>
            ${headerBtns}
          </div>
          ${buildBarsInCard(dayVotes, myVote)}
        </div>`;
      }
      el.innerHTML = html;

      // 헤더 클릭만 상세(등록) 화면 이동 — 바 영역 클릭은 이동 없음
      el.querySelectorAll('.sched-wday-header[data-date]').forEach(hdr => {
        hdr.addEventListener('click', () => openDay(hdr.dataset.date));
      });

      // 이름 클릭 → 해당 유저 모임 보드
      el.querySelectorAll('.sched-bar-name').forEach(n => {
        n.addEventListener('click', () => window.openOtherMeetingSheet?.(n.dataset.uid));
      });

      // +N명 더보기 토글
      el.querySelectorAll('.sched-card-more-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const hiddenEl  = btn.previousElementSibling;
          const isExpanded = hiddenEl.style.display !== 'none';
          hiddenEl.style.display = isExpanded ? 'none' : '';
          const hiddenCnt = hiddenEl.querySelectorAll('.sched-bar-row').length;
          btn.textContent = isExpanded ? `+${hiddenCnt}명 더보기` : '접기 ▴';
        });
      });

      // 등록 버튼 (헤더 우상단, 미등록) → 바텀시트 열기
      el.querySelectorAll('.sched-card-reg-hdr').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          openScheduleSheet(btn.closest('.sched-wday-card').dataset.date, null);
        });
      });

      // ✏ 수정 (내 막대 행) → 바텀시트 열기
      el.querySelectorAll('.sched-bar-edit-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const ds = btn.closest('.sched-wday-card').dataset.date;
          const myVote = allVotes.find(v => v.vote_date === ds && user && String(v.user_id) === String(user.id));
          openScheduleSheet(ds, myVote);
        });
      });

      // ✕ 참여 취소 (내 막대 행)
      el.querySelectorAll('.sched-bar-del-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          removeVoteForDate(btn.closest('.sched-wday-card').dataset.date);
        });
      });

    }

      if (myId === '__dev_me__') {
        window.addEventListener('cottage-auth-changed', () => {
          const u = window.getKakaoUser?.();

    // ── 초기화 ────────────────────────────────────────────────
    async function init() {
      initScheduleSheet();
      const todayStr = toDateStr(TODAY);
      const end = new Date(TODAY);
      end.setDate(end.getDate() + 62); // 달력 다음달 이동까지 커버
      const endStr = toDateStr(end);

      // 지난주와 동일 기능을 위해 7일 전부터 fetch
      const fetchStart = new Date(TODAY);
      fetchStart.setDate(TODAY.getDate() - 7);
      const startStr = toDateStr(fetchStart);
      [allVotes, allVoteGames] = await Promise.all([
        window.CottageDB?.getMeetingVotes(startStr, endStr) || Promise.resolve([]),
        window.CottageDB?.getMeetingVoteGames(startStr, endStr) || Promise.resolve([])
      ]).then(([v, g]) => [v || [], g || []]);

      // [DEV] 개발/검증용 더미 데이터 주입 — URL ?dev=3/5/8 에서만 실행
      const _devScenario = new URLSearchParams(location.search).get('dev');
      if (_devScenario) _injectDevVotes(_devScenario);

      document.getElementById('mainLoading').style.display = 'none';
      document.getElementById('viewWeek').style.display = '';
      renderWeekView(0);
    }

    document.getElementById('btnBackCal').addEventListener('click', () => {
      sliderMode = false;
      currentDate = null;
      document.getElementById('viewDay').style.display = 'none';
      document.getElementById('viewWeek').style.display = '';
      renderWeekView(weekOffset);
    });

    document.getElementById('btnPrevWeek').addEventListener('click', () => renderWeekView(weekOffset - 1));
    document.getElementById('btnNextWeek').addEventListener('click', () => renderWeekView(weekOffset + 1));
    document.getElementById('btnToggleCal').addEventListener('click', () => {
      const cal = document.getElementById('viewCalendar');
      const btn = document.getElementById('btnToggleCal');
      const isOpen = cal.style.display !== 'none';
      cal.style.display = isOpen ? 'none' : '';
      btn.textContent = isOpen ? '달력 보기 ▾' : '달력 닫기 ▴';
      btn.classList.toggle('is-open', !isOpen);
      if (!isOpen) renderMonthCalendar();
    });

    window.addEventListener('cottage-auth-changed', () => {
      if (currentDate) renderDayDetail(currentDate);
      else renderWeekView(weekOffset);  // 주간 뷰에서 로그인 시 is-mine 갱신
    });

    init();

  })();
  </script>
