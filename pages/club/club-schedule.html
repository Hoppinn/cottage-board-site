            // renderStep2Games()만으론 탭바(#smGameTabs)가 안 그려져 renderStep3() 통째로.
            renderStep3();
          });
        });

        // ↔ 오늘 고른 게임 전체를 다른 날짜에도 일괄 적용
        wrap.querySelector('.sm-sync-all-btn')?.addEventListener('click', () => {
          ['want', 'learn'].forEach(type => {
            (_gameMap[_activeDay]?.[type] || []).forEach(g => {
              g._syncOther = true;
              applyToOtherDates(type, g);
            });
          });
          renderStep3();
        });

        // 인원 조건 칩 선택
        wrap.querySelectorAll('.sm-cond-chip:not([disabled])').forEach(btn => {
          btn.addEventListener('click', () => {
            const type = btn.dataset.cctype;
            const idx  = parseInt(btn.dataset.ccidx);
            const val  = btn.dataset.ccval;
            const g = (_gameMap[_activeDay]?.[type] || [])[idx];
            if (!g) return;
            g.player_condition = val;
            renderStep2Games();
          });
        });

        // 피커 항목 선택
        wrap.querySelectorAll('.sm-picker-item:not([disabled])').forEach(btn => {
          btn.addEventListener('click', () => {
            const type   = btn.dataset.ptype;
            const source = btn.dataset.psrc || (type === 'want' ? 'like' : 'curious');
            const items  = getPickerItems(type, source);
            const item   = items[parseInt(btn.dataset.pidx)];
            if (!item || isDup(type, item)) return;
            const _cg = item.game_id ? (window.COTTAGE_GAMES || []).find(c => c.bggId === String(item.game_id) || c.id === String(item.game_id)) : null;
            const _resolvedId = _cg?.bggId && !isNaN(Number(_cg.bggId)) ? Number(_cg.bggId) : null;
            addGameStep2(type, resolveGameName(item), _resolvedId, false);
          });
        });

        // 「지난 모임」 목록에서 지우기 — DB의 과거 투표 기록은 안 건드리고
        // localStorage 숨김 목록에만 추가(위 _hidePastGame). 다음 조회부터 후보에서 빠진다.
        wrap.querySelectorAll('.sm-picker-del').forEach(btn => {
          btn.addEventListener('click', () => {
            const type = btn.dataset.ptype;
            const idx  = parseInt(btn.dataset.pdelidx);
            const items = getPickerItems(type, 'past');
            const item  = items[idx];
            const user  = window.getKakaoUser?.();
            if (!item || !user) return;
            if (!confirm(`"${resolveGameName(item)}"을(를) 목록에서 지우시겠습니까?`)) return;
            const key = item._pastKey || (item.game_id ? `id:${item.game_id}` : `nm:${String(item.custom_name || '').trim()}`);
            _hidePastGame(String(user.id), type, key);
            if (_pickerCache.past?.[type]) {
              _pickerCache.past[type] = _pickerCache.past[type].filter((_, i) => i !== idx);
            }
            renderStep2Games();
          });
        });

      }

      // ── Step 4: 게임 선택 ───────────────────────────────────────
      function renderStep3() {
        _step = 4;
        if (!_activeDay || !_days.includes(_activeDay)) _activeDay = _days[0];
        $s('smTitle').textContent = '게임 선택';
        $s('smBack').style.visibility = 'visible';
        $s('smBack').textContent = '← 원하는 판 수정';

        const tabsHtml = _days.length > 1
          ? `<div class="sm-tabs" id="smGameTabs">${buildTabs()}</div>` : '';
        $s('smBody').innerHTML =
          `${tabsHtml}<p class="sm-hint">선택 사항이에요 — 없으면 건너뛰세요.</p><div id="smGameSections"></div>`;
        $s('smFooter').innerHTML =
          `<button class="sched-confirm-btn" id="smSave" type="button">저장</button>`;

        renderStep2Games();

        if (_days.length > 1) {
          document.getElementById('smGameTabs')?.querySelectorAll('.sm-tab').forEach(tab => {
            tab.addEventListener('click', () => {
              _activeDay = tab.dataset.ds;
              document.getElementById('smGameTabs').querySelectorAll('.sm-tab').forEach(t =>
                t.classList.toggle('is-active', t.dataset.ds === _activeDay));
              renderStep2Games();
            });
          });
        }

        $s('smSave').addEventListener('click', saveAll);
      }

      const GAME_STYLE_LABELS = { party:'파티', strategy:'전략', any:'게임 유형 무관', other:'기타' };
      const GAME_DEPTH_LABELS = { light:'가볍게', medium:'적당히', deep:'깊게', any:'상관없음' };
      const PLAY_TRAIT_LABELS = { beginner_welcome:'초보 환영', new_game_ok:'새 게임 가능' };

      function readStep4Form() {
        if (!_activeDay) return;
        _intentMap[_activeDay] = {
          gameStyle: document.querySelector('input[name="smGameStyle"]:checked')?.value || null,
          gameStyleCustom: ($s('smGameStyleCustom')?.value || '').trim().slice(0, 30),
          gameDepth: document.querySelector('input[name="smGameDepth"]:checked')?.value || null,
          playTraits: [...document.querySelectorAll('input[name="smPlayTrait"]:checked')].map(el => el.value),
          recruitmentMessage: ($s('smRecruitmentMessage')?.value || '').trim().slice(0, 30),
        };
      }

      function intentOptionsHtml(name, labels, selected, type = 'radio') {
        return Object.entries(labels).map(([value, label]) =>
          `<label class="sm-intent-option"><input type="${type}" name="${name}" value="${value}"${selected?.includes?.(value) ? ' checked' : ''}>${label}</label>`
        ).join('');
      }

      // ── Step 3: 오늘 원하는 판 ──────────────────────────────────
      function renderStep4() {
        _step = 3;
        if (!_activeDay || !_days.includes(_activeDay)) _activeDay = _days[0];
        const intent = _intentMap[_activeDay] || {gameStyle:null, gameStyleCustom:'', gameDepth:null, playTraits:[], recruitmentMessage:''};
        const tabsHtml = _days.length > 1
          ? `<div class="sm-tabs" id="smIntentTabs">${buildTabs()}</div>` : '';
        $s('smTitle').textContent = '오늘 원하는 판';
        $s('smBack').style.visibility = 'visible';
        $s('smBack').textContent = '← 시간 수정';
        $s('smBody').innerHTML = `${tabsHtml}
          <p class="sm-hint">오늘 함께하고 싶은 판을 알려주세요.</p>
          <div class="sm-intent-section">
            <span class="sm-intent-label">게임 유형 <span class="sm-intent-required">필수</span></span>
            <div class="sm-intent-options">${intentOptionsHtml('smGameStyle', GAME_STYLE_LABELS, [intent.gameStyle])}</div>
            <div class="sm-intent-custom-wrap${intent.gameStyle === 'other' ? ' is-visible' : ''}" id="smGameStyleCustomWrap">
              <input class="sm-intent-message" id="smGameStyleCustom" type="text" maxlength="30"
                placeholder="원하는 게임 유형을 입력해주세요" value="${esc(intent.gameStyleCustom || '')}">
            </div>
          </div>
          <div class="sm-intent-section">
            <span class="sm-intent-label">게임 깊이 <span class="sm-intent-required">필수</span></span>
            <div class="sm-intent-options">${intentOptionsHtml('smGameDepth', GAME_DEPTH_LABELS, [intent.gameDepth])}</div>
          </div>
          <div class="sm-intent-section">
            <span class="sm-intent-label">이런 판에도 열려 있어요 <span class="sm-intent-required">선택</span></span>
            <div class="sm-intent-options">${intentOptionsHtml('smPlayTrait', PLAY_TRAIT_LABELS, intent.playTraits || [], 'checkbox')}</div>
          </div>
          <div class="sm-intent-section">
            <label class="sm-intent-label" for="smRecruitmentMessage">한줄 모집 <span class="sm-intent-required">선택 · 최대 30자</span></label>
            <div class="sm-intent-message-wrap">
              <input class="sm-intent-message" id="smRecruitmentMessage" type="text" maxlength="30"
                placeholder="예: 초보도 편하게 같이 해요" value="${esc(intent.recruitmentMessage || '')}">
              <span class="sm-intent-count" id="smRecruitmentCount">${(intent.recruitmentMessage || '').length}/30</span>
            </div>
          </div>`;
        $s('smFooter').innerHTML = `<button class="sched-confirm-btn" id="smNext3" type="button">게임 선택 →</button>`;

        document.getElementById('smIntentTabs')?.querySelectorAll('.sm-tab').forEach(tab => {
          tab.addEventListener('click', () => {
            readStep4Form();
            _activeDay = tab.dataset.ds;
            renderStep4();
          });
        });
        $s('smRecruitmentMessage')?.addEventListener('input', e => {
          $s('smRecruitmentCount').textContent = `${e.target.value.length}/30`;
        });
        document.querySelectorAll('input[name="smGameStyle"]').forEach(input => {
          input.addEventListener('change', () => {
            const customWrap = $s('smGameStyleCustomWrap');
            const isOther = input.checked && input.value === 'other';
            customWrap?.classList.toggle('is-visible', isOther);
            if (isOther) $s('smGameStyleCustom')?.focus();
          });
        });
        $s('smNext3').addEventListener('click', () => {
          readStep4Form();
          const missingDay = _days.find(ds => {
            const dayIntent = _intentMap[ds];
            return !dayIntent?.gameStyle || !dayIntent?.gameDepth
              || (dayIntent.gameStyle === 'other' && !dayIntent.gameStyleCustom);
          });
          if (missingDay) {
            _activeDay = missingDay;
            renderStep4();
            const missingIntent = _intentMap[missingDay];
            showToast(missingIntent?.gameStyle === 'other' && !missingIntent?.gameStyleCustom
              ? `${formatLabel(missingDay)}의 기타 게임 유형을 입력해주세요.`
              : `${formatLabel(missingDay)}의 게임 유형과 깊이를 선택해주세요.`);
            return;
          }
          renderStep3();
        });
      }

      // ── 게임 추가 + 역연동 + 다중날짜 전파 ──────────────────────
      async function addGameStep2(type, name, gameId, isManualInput) {
        if (!_gameMap[_activeDay]) _gameMap[_activeDay] = {want:[], learn:[]};
        const entry = {custom_name: name, game_id: gameId ?? null, is_priority: false, player_condition: 'any'};
        if (isDup(type, entry)) return;

        _gameMap[_activeDay][type].push(entry);
        renderStep2Games();

        if (isManualInput)   await promptCrossSync(type, name, gameId);
      }

      async function promptCrossSync(type, name, gameId) {
        const user = window.getKakaoUser?.();
        if (!user) return;
        const source = type === 'want' ? 'like' : 'curious';
        // 피커가 버튼 토글이 된 뒤로는 한 번도 안 열었으면 캐시가 비어 있다 →
        // 여기서 조회하지 않으면 "좋아요한 게임에도 추가할까요?"가 통째로 안 뜬다
        if (_pickerCache[source] === undefined) await fetchPickerData(source);
        const cached = _pickerCache[source];
        if (!Array.isArray(cached)) return;
        // 정규화한 목록과 비교한다 — 원본은 슬러그 표기라 bggId·이름 어느 쪽과도 안 맞아
        // 이미 좋아요한 게임에도 "추가할까요?"를 다시 물었다
        const alreadyIn = getPickerItems(type, source).some(g =>
          (gameId && g.game_id && String(g.game_id) === String(gameId)) ||
          (g.custom_name && g.custom_name.trim() === name.trim())
        );
        if (alreadyIn) return;
        const boardLabel = type === 'want' ? '좋아요한 게임' : '궁금한 게임';
        const table      = type === 'want' ? 'game_likes' : 'game_curious';
        if (confirm(`"${name}"을(를) ${boardLabel}에도 추가할까요?`)) {
          try {
            await window.CottageDB?.addGamePref(String(user.id), gameId ?? null, name, table);
            _pickerCache[source].push({game_id: gameId ?? null, custom_name: name});
          } catch(e) { console.error('addGamePref 오류:', e); }
        }
      }

      // ↔ 동기화 대상 날짜 = 지금 함께 편집 중인(_days) 다른 날짜들.
      // 「등록된 날도 Step1에서 다시 골라 함께 묶을 수 있게」 된 뒤(renderStep1의
      // disabled 완화)로는 여기서 임의로 "다른 미래 날짜 전부"를 추측할 필요가 없다
      // — 사용자가 Step1(또는 수정 화면의 "← 날짜 더 선택")에서 명시적으로 고른
      // 날짜들만 대상이다. 예전엔 단일 날짜 수정 진입에서 이 함수가 비어 있어
      // 토글 자체가 안 보였는데(→ Step1 fix로 해결), 그 자리에 "등록된 다른 날짜
      // 전부 자동 동기화"를 임시로 넣었다가 사용자 설명("하루+다른날만 엮어서")과
      // 안 맞아 되돌렸다(2026-07-28).
      function _syncTargetDates() {
        return _days.filter(d => d !== _activeDay);
      }

      // 동기화 대상 날짜를 건드리기 전에 initDay로 기존 시간·게임이 채워져 있는지
      // 보장한다 — Step1→Step2 전환 시 `_days.forEach(initDay)`가 이미 채우므로
      // 보통은 no-op이지만, 방어적으로 유지(안 하면 빈 _gameMap을 saveAll이 그대로
      // 저장해 그 날짜의 기존 게임을 지울 수 있다).
      function _ensureSyncTarget(ds) {
        initDay(ds);
      }

      // ↔ 토글 ON: 이 항목(대표게임·인원조건 포함 현재 값)을 다른 날짜에 동기화.
      // 그 날짜에 같은 게임(game_id 또는 custom_name 일치)이 이미 있으면 덮어쓴다 —
      // 토글은 "이 상태로 맞춘다"는 명시적 행동이라 기존 값 보존보다 동기화가 우선.
      function applyToOtherDates(type, entry) {
        _syncTargetDates().forEach(ds => {
          _ensureSyncTarget(ds);
          const list = _gameMap[ds][type];
          const idx = list.findIndex(g =>
            (entry.game_id && g.game_id && String(g.game_id) === String(entry.game_id)) ||
            (entry.custom_name && g.custom_name === entry.custom_name)
          );
          const copy = {...entry};
          if (idx >= 0) list[idx] = copy; else list.push(copy);
        });
      }

      // ↔ 토글 OFF: 위에서 동기화해둔 사본을 다른 날짜에서 제거.
      function removeFromOtherDates(type, entry) {
        _syncTargetDates().forEach(ds => {
          const list = _gameMap[ds]?.[type];
          if (!list) return;
          const idx = list.findIndex(g =>
            (entry.game_id && g.game_id && String(g.game_id) === String(entry.game_id)) ||
            (entry.custom_name && g.custom_name === entry.custom_name)
          );
          if (idx >= 0) list.splice(idx, 1);
        });
      }

      function saveCurrentTime() {
        const rs = $s('smRS'), re = $s('smRE');
        if (rs && re && _activeDay) _timeMap[_activeDay] = { s: parseInt(rs.value), e: parseInt(re.value) };
      }

      // ── 저장 ───────────────────────────────────────────────────
      async function saveAll() {
        const user = window.getKakaoUser?.();
        if (!user) { showToast('로그인이 필요합니다.'); return; }
        const saveBtn = $s('smSave');
        if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '저장 중...'; }

        try {
          for (const ds of _days) {
            const t = _timeMap[ds] || {s:10, e:22};
            const intent = _intentMap[ds];
            const result = await window.CottageDB?.upsertMeetingVote(
              String(user.id), user.nickname||'익명', ds, t.s, t.e, clampGuest(_guestMap[ds]), intent
            );
            if (!result?.success) throw new Error(result?.error?.message || '시간 저장 오류');

            // 기존 게임 삭제 후 재삽입
            const existingGames = allVoteGames.filter(g => g.vote_date===ds && String(g.user_id)===String(user.id));
            for (const g of existingGames) {
              await window.CottageDB?.removeMeetingVoteGame(String(user.id), ds, g.list_type, g.game_id, g.custom_name);
            }
            const dayGames = _gameMap[ds] || {want:[], learn:[]};
            for (const g of dayGames.want) {
              if (g.custom_name || g.game_id) await window.CottageDB?.addMeetingVoteGame(String(user.id), ds, 'want', g.game_id??null, g.custom_name??null);
            }
            for (const g of dayGames.learn) {
              if (g.custom_name || g.game_id) await window.CottageDB?.addMeetingVoteGame(String(user.id), ds, 'learn', g.game_id??null, g.custom_name??null);
            }
            // INSERT 직후 is_priority + player_condition 반영 (want+learn 모두, 항상 전송)
            for (const [listType, list] of [['want', dayGames.want], ['learn', dayGames.learn]]) {
              for (const g of list) {
                if (!(g.custom_name || g.game_id)) continue;
                if (g.is_priority) {
                  const r = await window.CottageDB?.setMeetingVoteGamePriority(String(user.id), ds, g.game_id??null, g.custom_name??null, listType, true);
                  if (r && !r.ok) console.error('[setMeetingVoteGamePriority]', r);
                }
                const cond = g.player_condition ?? 'any';
                const rc = await window.CottageDB?.setMeetingVoteGameCondition(String(user.id), ds, g.game_id??null, g.custom_name??null, listType, cond);
                if (rc && !rc.ok) console.error('[setMeetingVoteGameCondition]', rc);
              }
            }

            // 메모리 갱신
            allVotes = allVotes.filter(v => !(v.vote_date===ds && String(v.user_id)===String(user.id)));
            allVotes.push({
              vote_date:ds, user_id:String(user.id), nickname:user.nickname||'익명',
              time_start:t.s, time_end:t.e, guest_count:clampGuest(_guestMap[ds]),
              game_style:intent.gameStyle, game_style_custom:intent.gameStyle === 'other' ? intent.gameStyleCustom : null,
              game_depth:intent.gameDepth,
              play_traits:[...(intent.playTraits || [])], recruitment_message:intent.recruitmentMessage || null,
            });
            allVoteGames = allVoteGames.filter(g => !(g.vote_date===ds && String(g.user_id)===String(user.id)));
            for (const g of dayGames.want) {
              if (g.custom_name || g.game_id) allVoteGames.push({vote_date:ds, user_id:String(user.id), list_type:'want', game_id:g.game_id??null, custom_name:g.custom_name??null, is_priority:g.is_priority??false, player_condition:g.player_condition??'any'});
            }
            for (const g of dayGames.learn) {
              if (g.custom_name || g.game_id) allVoteGames.push({vote_date:ds, user_id:String(user.id), list_type:'learn', game_id:g.game_id??null, custom_name:g.custom_name??null, is_priority:g.is_priority??false, player_condition:g.player_condition??'any'});
            }
          }
          // 날짜 변경(applyDateChange) 진행 중이었던 행들 — 원래 날짜의 등록을 삭제(=옮기기의 뒷정리).
          // 여러 행을 동시에 옮겼을 수 있어 _dateChangeMap 전체를 돈다. _days에 원래 날짜가 이미
          // 없으므로 위 루프가 그 날짜는 안 건드렸다(안 지우면 두 날짜에 중복 등록됨).
          for (const [newDs, originalDs] of Object.entries(_dateChangeMap)) {
            if (originalDs === newDs || _days.includes(originalDs)) continue;
            const delResult = await window.CottageDB?.deleteMeetingVote(String(user.id), originalDs);
            if (!delResult?.success) console.error('[saveAll] 날짜 변경 — 원본 날짜 삭제 실패', originalDs, delResult?.error);
            allVotes = allVotes.filter(v => !(v.vote_date === originalDs && String(v.user_id) === String(user.id)));
            allVoteGames = allVoteGames.filter(g => !(g.vote_date === originalDs && String(g.user_id) === String(user.id)));
          }
          _dateChangeMap = {};
          // 「지난 모임」 피커 캐시 무효화 — 여기서 방금 저장한 게임이 다음에 그 탭을
          // 열 때 바로 잡히게 한다. 캐시는 세션 내내 한 번 채우면 다시 안 채웠으므로
          // (fetchPickerData가 `=== undefined`일 때만 재조회), 저장 후에도 리로드 전까지
          // 방금 등록한 게임이 「지난 모임」 목록에 영영 안 보였다.
          _pickerCache.past = undefined;
          _notifyParentSaved();
          close();
          renderWeekView(weekOffset);
          showToast('저장되었습니다!');
        } catch(err) {
          console.error(err);
          showToast('저장 중 오류가 발생했습니다.');
          if (saveBtn) { saveBtn.disabled=false; saveBtn.textContent='저장'; }
        }
      }

      // ── 외부 진입점 ────────────────────────────────────────────
      _openMultiSheet = function({ startStep=1, dates=[] } = {}) {
        _fromStep1 = startStep === 1;
        if (dates.length > 0) {
          // 첫 날짜의 주차로 _modalWeekOffset 계산 (reset-week 등 외부 상태 무관)
          const d = parseDate(dates[0]);
          const dow = TODAY.getDay();
          const curMon = new Date(TODAY);
          curMon.setDate(TODAY.getDate() + (dow === 0 ? -6 : 1 - dow));
          const tdow = d.getDay();
          const tgtMon = new Date(d);
          tgtMon.setDate(d.getDate() + (tdow === 0 ? -6 : 1 - tdow));
          _modalWeekOffset = Math.round((tgtMon - curMon) / 6048e5);
        } else {
          _modalWeekOffset = weekOffset;
        }
        _historicalVotes = null;
        _dateChangeMap = {}; _dateChangeWeekOffset = 0;
        _days = [...dates].sort();
        _timeMap = {}; _gameMap = {}; _intentMap = {}; _activeDay = null; _gameOpen = {want:true, learn:true};
        _pastOpen = {want:false, learn:false}; _srcOpen = {want:false, learn:false}; _othersOpen = {want:false, learn:false};
        _days.forEach(initDay);
        overlay.style.display = '';
        _ensurePlannerViewToken();
        if (startStep === 2) renderStep2();
        else renderStep1();

        // 8주 이력 비차단 조회 — Step2 프리셋·초기값 반영
        const _histUser = window.getKakaoUser?.();
        if (_histUser) {
          const past = new Date(TODAY);
          past.setDate(TODAY.getDate() - 56);
          window.CottageDB?.getMeetingVotes(toDateStr(past), toDateStr(TODAY))
            .then(votes => {
              _historicalVotes = votes || [];
              const myPast = _historicalVotes
                .filter(v => String(v.user_id) === String(_histUser.id))
                .sort((a, b) => b.vote_date.localeCompare(a.vote_date));
              if (!myPast.length) return;
              const recent = myPast[0];
              _days.forEach(ds => {
                const hasExisting = allVotes.some(v => v.vote_date === ds && String(v.user_id) === String(_histUser.id));
                if (!hasExisting && _timeMap[ds] && _timeMap[ds].s === 10 && _timeMap[ds].e === 22) {
                  _timeMap[ds] = { s: recent.time_start, e: recent.time_end };
                }
              });
            })
            .catch(() => { _historicalVotes = []; });
        }
      };
    }

    function openScheduleSheet(ds, myVote) {
      _sheetDs = ds;
      const [y, m, d] = ds.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      const action = myVote ? '시간 수정' : '시간 등록';
      document.getElementById('ssTitle').textContent =
        `${m}/${d}(${DOW[date.getDay()]}) ${action}`;

      const btnSave = document.getElementById('ssSave');
      btnSave.textContent = myVote ? '저장' : '등록';
      btnSave.disabled = false;

      const initS = myVote?.time_start ?? 10;
      const initE = myVote?.time_end ?? 22;
      const range = MAX_H - MIN_H;
      const ssRS = document.getElementById('ssRS');
      const ssRE = document.getElementById('ssRE');
      ssRS.value = initS;
      ssRE.value = initE;
      document.getElementById('ssRangeFill').style.left  = ((initS - MIN_H) / range * 100) + '%';
      document.getElementById('ssRangeFill').style.width = ((initE - initS) / range * 100) + '%';
      document.getElementById('ssLblS').textContent = initS + '시';
      document.getElementById('ssLblE').textContent = initE + '시';

      // 수정 진입이면 기존 동반 인원을 그대로 보여준다(비워두면 저장 시 0으로 덮인다)
      const ssGuest = document.getElementById('ssGuest');
      if (ssGuest) {
        ssGuest.value = clampGuest(myVote?.guest_count);
        ssGuest.dispatchEvent(new Event('input'));
      }

      // 지난주 버튼: 데이터 있으면 시간 표시, 없으면 row 숨김
      const _user = window.getKakaoUser?.();
      const prevDs = toDateStr(new Date(y, m - 1, d - 7));
      const prevVote = _user
        ? allVotes.find(v => v.vote_date === prevDs && String(v.user_id) === String(_user.id))
        : null;
      const rowPrev = document.getElementById('ssPrevWeekRow');
      if (prevVote) {
        document.getElementById('ssPrevWeek').textContent =
          `지난주 ${window.formatVoteHour(prevVote.time_start)}~${window.formatVoteHour(prevVote.time_end)} 적용`;
        rowPrev.style.display = '';
      } else {
        rowPrev.style.display = 'none';
      }

      // 이 날 이미 등록한 다른 사람들의 시간에 맞추기 — 동일 시간(time_start·time_end
      // 둘 다 같음)은 한 버튼으로 묶어 "OO 외 N명 · 10~22시"로 보여준다. 자동저장 없음
      // (지난주 버튼과 같은 동작 — 슬라이더만 옮기고 등록은 사용자가 직접 누른다).
      const matchRow = document.getElementById('ssMatchRow');
      const others = allVotes.filter(v => v.vote_date === ds && (!_user || String(v.user_id) !== String(_user.id)));
      const _matchGroups = new Map();
      others.forEach(v => {
        const key = v.time_start + '-' + v.time_end;
        if (!_matchGroups.has(key)) _matchGroups.set(key, { s: v.time_start, e: v.time_end, names: [] });
        _matchGroups.get(key).names.push(v.nickname || '익명');
      });
      const _sortedGroups = [..._matchGroups.values()].sort((a, b) => b.names.length - a.names.length || a.s - b.s);
      if (_sortedGroups.length) {
        matchRow.innerHTML = '<span class="sched-sheet-match-label">이 날 다른 참여자 시간에 맞추기</span>' +
          _sortedGroups.map((g, i) => {
            const nameText = g.names.length <= 2
              ? g.names.join(', ')
              : `${g.names.slice(0, 2).join(', ')} 외 ${g.names.length - 2}명`;
            return `<button class="sched-sheet-match-btn" type="button" data-i="${i}">${window.escH(nameText)} · ${window.formatVoteHour(g.s)}~${window.formatVoteHour(g.e)}</button>`;
          }).join('');
        matchRow.querySelectorAll('.sched-sheet-match-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const g = _sortedGroups[Number(btn.dataset.i)];
            document.getElementById('ssRS').value = g.s;
            document.getElementById('ssRE').value = g.e;
            if (_syncSheet) _syncSheet();
          });
        });
        matchRow.style.display = '';
      } else {
        matchRow.innerHTML = '';
        matchRow.style.display = 'none';
      }

      document.getElementById('schedSheetOverlay').style.display = '';
      _ensurePlannerViewToken();

      // 마지막 카드가 시트에 가려지지 않도록 여백 추가
      const listEl = document.getElementById('weekDayList');
      if (listEl) listEl.style.paddingBottom = '260px';

      // 바깥 클릭 → 닫기 (열기 클릭이 즉시 발동하지 않도록 setTimeout)
      setTimeout(() => {
        document.addEventListener('click', _closeSheetOnOutsideClick);
      }, 0);
    }

    function _closeSheetOnOutsideClick(e) {
      const sheet = document.querySelector('.sched-sheet');
      if (sheet && !sheet.contains(e.target)) closeScheduleSheet();
    }

    function closeScheduleSheet() {
      document.getElementById('schedSheetOverlay').style.display = 'none';
      const listEl = document.getElementById('weekDayList');
      if (listEl) listEl.style.paddingBottom = '';
      document.removeEventListener('click', _closeSheetOnOutsideClick);
      _sheetDs = null;
      _popPlannerViewToken();
    }

    async function saveVoteForDate(ds, start, end, btnSave, guestCount = 0) {
      const user = window.getKakaoUser?.();
      if (!user) return;
      if (btnSave) btnSave.disabled = true;
      const guest = clampGuest(guestCount);
      const previousVote = allVotes.find(v => v.vote_date === ds && String(v.user_id) === String(user.id));

      const result = await window.CottageDB?.upsertMeetingVote(
        String(user.id), user.nickname || '익명', ds, start, end, guest
      );
      if (result?.success) {
        allVotes = allVotes.filter(v => !(v.vote_date === ds && String(v.user_id) === String(user.id)));
        // 로컬 캐시에도 guest_count를 실어야 재조회 전까지의 렌더가 DB와 같은 숫자를 낸다
        allVotes.push({ ...previousVote, vote_date: ds, user_id: String(user.id), nickname: user.nickname || '익명', time_start: start, time_end: end, guest_count: guest });
        _notifyParentSaved();
        closeScheduleSheet();
        renderWeekView(weekOffset);
      } else {
        if (btnSave) btnSave.disabled = false;
        alert(`저장 오류: ${result?.error?.message || '알 수 없는 오류'}`);
      }
    }

    async function removeVoteForDate(ds) {
      if (!confirm('참여를 취소할까요?')) return;
      const user = window.getKakaoUser?.();
      if (!user) return;
      const result = await window.CottageDB?.deleteMeetingVote(String(user.id), ds);
      if (result?.success) {
        allVotes = allVotes.filter(v => !(v.vote_date === ds && String(v.user_id) === String(user.id)));
        _notifyParentSaved();
        renderWeekView(weekOffset);
      } else {
        alert('취소 중 오류가 발생했어요.');
      }
    }

    // ── 월간 달력 (달력보기 토글) ────────────────────────────────────
    function renderMonthCalendar() {
      const cal = document.getElementById('viewCalendar');
      const y   = calMonthDate.getFullYear();
      const m   = calMonthDate.getMonth();
      const MONTH_NAMES = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

      const firstDow  = new Date(y, m, 1).getDay();
      const lastDate  = new Date(y, m + 1, 0).getDate();
      const startOff  = firstDow === 0 ? 6 : firstDow - 1; // 0=월 기준

      const cntByDate = {};
      const myDates   = new Set();
      const user      = window.getKakaoUser?.();
      const todayStr  = toDateStr(TODAY);
      const votesByDate = {};
      for (const v of allVotes) {
        (votesByDate[v.vote_date] = votesByDate[v.vote_date] || []).push(v);
        if (user && String(v.user_id) === String(user.id)) myDates.add(v.vote_date);
      }
      for (const ds in votesByDate) cntByDate[ds] = partyCount(votesByDate[ds]);

      const totalCells = Math.ceil((startOff + lastDate) / 7) * 7;
      let cells = '';
      for (let i = 0; i < totalCells; i++) {
        const day = i - startOff + 1;
        if (day < 1 || day > lastDate) { cells += '<div class="mcal-cell mcal-empty"></div>'; continue; }
        const ds     = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const cnt    = cntByDate[ds] || 0;
        const past   = ds < todayStr;
        const tod    = ds === todayStr;
        const mine   = myDates.has(ds);
        const dow    = (startOff + day - 1) % 7;  // 0=월..4=금,5=토,6=일
        const clsList = ['mcal-cell',
          past ? 'is-past' : '', tod ? 'is-today' : '',
          mine ? 'is-mine' : '', dow === 5 ? 'is-sat' : '', dow === 6 ? 'is-sun' : ''
        ].filter(Boolean).join(' ');

        cells += `<div class="${clsList}" data-date="${ds}">
          <span class="mcal-day">${day}</span>
          ${cnt > 0 ? `<span class="mcal-cnt">${cnt}명</span>` : ''}
          ${mine ? `<span class="mcal-mine-dot"></span>` : ''}
        </div>`;
      }

      cal.innerHTML = `
        <div class="mcal-nav">
          <button aria-label="이전 달" class="mcal-nav-btn" id="calPrev" type="button">‹</button>
          <span class="mcal-title">${y}년 ${MONTH_NAMES[m]}</span>
          <button aria-label="다음 달" class="mcal-nav-btn" id="calNext" type="button">›</button>
        </div>
        <div class="mcal-header"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="is-sat">토</span><span class="is-sun">일</span></div>
        <div class="mcal-grid">${cells}</div>`;

      document.getElementById('calPrev').addEventListener('click', () => {
        calMonthDate = new Date(y, m - 1, 1); renderMonthCalendar();
      });
      document.getElementById('calNext').addEventListener('click', () => {
        calMonthDate = new Date(y, m + 1, 1); renderMonthCalendar();
      });
      cal.querySelectorAll('.mcal-cell[data-date]').forEach(cell => {
        cell.addEventListener('click', () => navigateToDate(cell.dataset.date));
      });
    }

    // ── 주간 뷰 헬퍼 / 렌더러 (Phase 1+2) ────────────────────────

    function getWeekOffset(ds) {
      const target = new Date(ds + 'T00:00:00');
      const targetDow = target.getDay();
      const targetMon = new Date(target);
      targetMon.setDate(target.getDate() - (targetDow === 0 ? 6 : targetDow - 1));
      targetMon.setHours(0, 0, 0, 0);
      const todayDow = TODAY.getDay();
      const thisMon = new Date(TODAY);
      thisMon.setDate(TODAY.getDate() - (todayDow === 0 ? 6 : todayDow - 1));
      return Math.round((targetMon - thisMon) / (7 * 86400000));
    }

    function navigateToDate(ds) {
      const cal = document.getElementById('viewCalendar');
      const btn = document.getElementById('btnToggleCal');
      if (cal && cal.style.display !== 'none') {
        cal.style.display = 'none';
        if (btn) { btn.textContent = '달력 보기 ▾'; btn.classList.remove('is-open'); }
      }
      renderWeekView(getWeekOffset(ds), ds);
    }

    function getWeekTitle(monday) {
      // 목요일 기준으로 해당 월·주차 결정 (월경계 주 처리)
      const thu = new Date(monday);
      thu.setDate(monday.getDate() + 3);
      const m = thu.getMonth() + 1;
      const weekNum = Math.ceil(thu.getDate() / 7);
      const ord = ['첫째','둘째','셋째','넷째','다섯째'];
      return `${m}월 ${ord[weekNum - 1] || weekNum + '번째'} 주`;
    }

    function renderWeekView(offset, targetDate = null) {
      weekOffset = offset;
      const todayDow = TODAY.getDay();
      const daysToMon = todayDow === 0 ? -6 : 1 - todayDow;
      const monday = new Date(TODAY);
      monday.setDate(TODAY.getDate() + daysToMon + offset * 7);

      const _relLabel = offset === 0 ? '이번주' : offset === -1 ? '지난주' : offset === 1 ? '다음주' : null;
      document.getElementById('weekTitle').textContent = getWeekTitle(monday) + (_relLabel ? ` (${_relLabel})` : '');

      const user = window.getKakaoUser?.();

      // 모임 등록 버튼: 로그인 시만 표시, 핸들러 매번 재연결
      const regRow = document.getElementById('schedRegisterRow');
      const regBtn = document.getElementById('btnScheduleRegister');
      if (regRow) regRow.style.display = user ? '' : 'none';
      if (regBtn) {
        regBtn.onclick = () => _openMultiSheet?.({ startStep: 1 });
      }

      const el   = document.getElementById('weekDayList');
      let html = '';

      for (let d = 0; d < 7; d++) {
        const date = new Date(monday);
        date.setDate(monday.getDate() + d);
        const ds  = toDateStr(date);
        const dow = date.getDay();
        const past = date < TODAY;
        const tod  = date.getTime() === TODAY.getTime();

        const dayVotes = allVotes.filter(v => v.vote_date === ds);
        const myVote   = dayVotes.find(v => user && String(v.user_id) === String(user.id));
        const cnt      = partyCount(dayVotes);

        const dowCls  = dow === 0 ? ' is-sun' : dow === 6 ? ' is-sat' : '';
        const pastCls = past ? ' is-past' : '';
        const todCls  = tod  ? ' is-today' : '';
        const tgtCls  = (targetDate && ds === targetDate && !tod) ? ' is-target' : '';
        const todayBadge = tod ? '<span class="sdc-today-label">오늘</span>' : '';

        let headerBtns = '';
        if (user && !past && !myVote) {
          headerBtns = `<div class="sched-card-header-actions">
            <button class="sched-card-reg-hdr" type="button">+ 등록</button>
          </div>`;
        }

        html += `<div class="sched-wday-card${pastCls}${todCls}${tgtCls}" data-date="${ds}">
          <div class="sched-wday-header" data-date="${ds}">
            <div class="sched-wday-left">
              <span class="sched-wday-dow${dowCls}">${date.getMonth()+1}/${date.getDate()}(${DOW[dow]})</span>
              ${todayBadge}
              <span class="sched-wday-count">👥 ${cnt}명</span>
            </div>
            ${headerBtns}
          </div>
          ${window.buildBarsInCard(dayVotes, allVoteGames, myVote, true)}
          ${dayVotes.length ? `<button class="sched-card-detail-btn" type="button" data-date="${ds}">이날 모임 상세 ›</button>` : ''}
        </div>`;
      }
      el.innerHTML = html;

      // 이날 모임 한눈에 보기 → 집계 모달 (홈 미리보기와 동일 모달)
      el.querySelectorAll('.sched-card-detail-btn[data-date]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const ds = btn.dataset.date;
          const dv = allVotes.filter(v => v.vote_date === ds);
          const dg = allVoteGames.filter(g => g.vote_date === ds);
          window.openDateMeetingModal?.(ds, dv, dg, {});
        });
      });

      // 헤더 클릭만 상세(등록) 화면 이동 — 바 영역 클릭은 이동 없음
      el.querySelectorAll('.sched-wday-header[data-date]').forEach(hdr => {
        hdr.addEventListener('click', () => navigateToDate(hdr.dataset.date));
      });

      // 참여자 카드 전체 → 일정 상세 모달 (통계 포함). 내부 액션은 각 핸들러에서 전파를 막는다.
      el.querySelectorAll('.sched-bar-item[data-date][data-uid]').forEach(card => {
        const openParticipant = e => {
          if (e.type === 'keydown' && !['Enter', ' '].includes(e.key)) return;
          if (e.type === 'keydown' && e.target !== card) return;
          if (e.target.closest('button, a, input, select, textarea, .dd-game-hit, .sched-bar-name')) return;
          e.preventDefault();
          e.stopPropagation();
          window.CottageDB?.trackEvent('meeting_planner_bar_click');
          const _uid = card.dataset.uid, _date = card.dataset.date;
          window.openOtherMeetingSheet?.(_uid, { focusDate: _date });
        };
        card.addEventListener('click', openParticipant);
        card.addEventListener('keydown', openParticipant);
      });

      el.querySelectorAll('.sched-bar-name[data-uid]').forEach(name => {
        const openMember = e => {
          if (e.type === 'keydown' && !['Enter', ' '].includes(e.key)) return;
          e.preventDefault();
          e.stopPropagation();
          window.CottageDB?.trackEvent('meeting_profile_click', { user_id: name.dataset.uid });
          window.openOtherProfileSheet?.(name.dataset.uid);
        };
        name.addEventListener('click', openMember);
        name.addEventListener('keydown', openMember);
      });

      // 「하고 싶은/배우고 싶은 게임」 썸네일 클릭 → 게임시트 (2026-07-27, 이 주간뷰만 안 뚫려 있었음 —
      // 홈 미리보기·플래너 막대바 모달은 이미 연결돼 있었는데 여기 바인딩 호출이 빠져 있었다)
      window._bindDdGameHitClicks?.(el);

      // +N명 더보기 토글
      el.querySelectorAll('.sched-card-more-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const hiddenEl  = btn.previousElementSibling;
          const isExpanded = hiddenEl.style.display !== 'none';
          hiddenEl.style.display = isExpanded ? 'none' : '';
          const hiddenCnt = hiddenEl.querySelectorAll('.sched-bar-item').length;
          btn.textContent = isExpanded ? `+${hiddenCnt}명 더보기` : '접기 ▴';
        });
      });

      // 등록 버튼 (헤더 우상단, 미등록) → 바텀시트 열기
      el.querySelectorAll('.sched-card-reg-hdr').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          _openMultiSheet?.({ startStep: 2, dates: [btn.closest('.sched-wday-card').dataset.date] });
        });
      });

      // ✏ 수정 (내 막대 행) → 멀티스텝 시트 열기
      el.querySelectorAll('.sched-bar-edit-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.preventDefault();
          e.stopPropagation();
          const ds = btn.closest('.sched-bar-item')?.dataset.date;
          if (ds) _openMultiSheet?.({ startStep: 2, dates: [ds] });
        });
      });

      // ✕ 참여 취소 (내 막대 행)
      el.querySelectorAll('.sched-bar-del-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.preventDefault();
          e.stopPropagation();
          const ds = btn.closest('.sched-bar-item')?.dataset.date;
          if (ds) removeVoteForDate(ds);
        });
      });

    }

          { vote_date: tgt, user_id: 'dev_u7', nickname: '더미6', time_start:  9, time_end: 23 },
          { vote_date: tgt, user_id: 'dev_u8', nickname: '더미7', time_start: 11, time_end: 16 },
        ],
      };

      const entries = DUMMY[scenario];
      if (!entries) return;
      allVotes.push(...entries);

      // 게임 더미 데이터 (allVoteGames)
      const DUMMY_GAMES = {
        '3': [
          { vote_date: tgt, user_id: myId,     list_type: 'want',  game_id: null, custom_name: '아르낙' },
          { vote_date: tgt, user_id: myId,     list_type: 'want',  game_id: null, custom_name: '원더랜드 워' },
          { vote_date: tgt, user_id: myId,     list_type: 'learn', game_id: null, custom_name: '윙스팬' },
          { vote_date: tgt, user_id: 'dev_u2', list_type: 'want',  game_id: null, custom_name: '아르낙' },
          { vote_date: tgt, user_id: 'dev_u3', list_type: 'want',  game_id: null, custom_name: '에버델' },
          { vote_date: tgt, user_id: 'dev_u3', list_type: 'learn', game_id: null, custom_name: '아르낙' },
        ],
        '5': [
          { vote_date: tgt, user_id: myId,     list_type: 'want',  game_id: '227935', custom_name: null },
          { vote_date: tgt, user_id: myId,     list_type: 'learn', game_id: null, custom_name: '글룸헤이븐' },
          { vote_date: tgt, user_id: 'dev_u2', list_type: 'want',  game_id: null, custom_name: '아르낙' },
          { vote_date: tgt, user_id: 'dev_u2', list_type: 'want',  game_id: '227935', custom_name: null },
          { vote_date: tgt, user_id: 'dev_u4', list_type: 'want',  game_id: null, custom_name: '에버델' },
          { vote_date: tgt, user_id: 'dev_u4', list_type: 'learn', game_id: null, custom_name: '아르낙' },
          { vote_date: tgt, user_id: 'dev_u5', list_type: 'want',  game_id: '227935', custom_name: null },
        ],
        '8': [
          { vote_date: tgt, user_id: myId,     list_type: 'want',  game_id: null, custom_name: '아르낙' },
          { vote_date: tgt, user_id: myId,     list_type: 'want',  game_id: null, custom_name: '원더랜드 워' },
          { vote_date: tgt, user_id: myId,     list_type: 'learn', game_id: null, custom_name: '글룸헤이븐' },
          { vote_date: tgt, user_id: 'dev_u2', list_type: 'want',  game_id: null, custom_name: '윙스팬' },
          { vote_date: tgt, user_id: 'dev_u3', list_type: 'want',  game_id: null, custom_name: '아르낙' },
          { vote_date: tgt, user_id: 'dev_u3', list_type: 'want',  game_id: null, custom_name: '에버델' },
          { vote_date: tgt, user_id: 'dev_u5', list_type: 'learn', game_id: null, custom_name: '아르낙' },
          { vote_date: tgt, user_id: 'dev_u7', list_type: 'want',  game_id: null, custom_name: '원더랜드 워' },
          { vote_date: tgt, user_id: 'dev_u7', list_type: 'want',  game_id: null, custom_name: '아르낙' },
          { vote_date: tgt, user_id: 'dev_u7', list_type: 'want',  game_id: null, custom_name: '에버델' },
        ],
      };
      const gameEntries = DUMMY_GAMES[scenario];
      if (gameEntries) allVoteGames.push(...gameEntries);

      // init() 시점에 로그인 미완료인 경우: cottage-auth-changed 후 __dev_me__ 교체
      if (myId === '__dev_me__') {
        window.addEventListener('cottage-auth-changed', () => {
          const u = window.getKakaoUser?.();
          if (!u) return;
          allVotes.forEach(v => {
            if (v.user_id === '__dev_me__') {
              v.user_id   = String(u.id);
              v.nickname  = u.nickname || v.nickname;
            }
          });
          allVoteGames.forEach(g => {
            if (g.user_id === '__dev_me__') g.user_id = String(u.id);
          });
        }, { once: true });
      }
    }

    // ── 초기화 ────────────────────────────────────────────────
    // allVotes/allVoteGames 로더. 재사용 iframe이라 홈에서 다시 열 때(cottage-reset-week)도
    // 이걸로 재조회한다 — 외부(홈 프리뷰 ✕ 등)에서 삭제/등록된 변경이 stale allVotes에 안 반영되면
    // 재등록 시 "등록됨"이 잔류해 막힌다(모달/iframe 재사용 원칙).
    async function _loadAllVotes() {
      const end = new Date(TODAY);
      end.setDate(end.getDate() + 62); // 달력 다음달 이동까지 커버
      const endStr = toDateStr(end);

      // 지난주와 동일 기능을 위해 7일 전부터 fetch
      const fetchStart = new Date(TODAY);
      fetchStart.setDate(TODAY.getDate() - 7);
      const startStr = toDateStr(fetchStart);
      [allVotes, allVoteGames] = await Promise.all([
        window.CottageDB?.getMeetingVotes(startStr, endStr) || Promise.resolve([]),
        window.CottageDB?.getMeetingVoteGames(startStr, endStr) || Promise.resolve([])
      ]).then(([v, g]) => [v || [], g || []]);

      // [DEV] 개발/검증용 더미 데이터 주입 — localhost + URL ?dev=3/5/8 에서만 실행
      const _isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      const _devScenario = _isLocal ? new URLSearchParams(location.search).get('dev') : null;
      if (_devScenario) _injectDevVotes(_devScenario);
    }

    async function init() {
      initScheduleSheet();
      initMultiSheet();
      await _loadAllVotes();

      document.getElementById('mainLoading').style.display = 'none';
      document.getElementById('viewWeek').style.display = '';
      renderWeekView(0);
      _initDone = true;
      if (_pendingRegister) {
        const ds = _pendingRegister;
        _pendingRegister = null;
        if (ds >= toDateStr(TODAY)) {
          document.body.classList.add('is-quick-entry');
          _openMultiSheet?.({ startStep: 1, dates: [ds] });
          _notifySheetShown();
        }
      }
      if (_pendingEdit) {
        const ds = _pendingEdit;
        _pendingEdit = null;
        if (ds >= toDateStr(TODAY)) {
          document.body.classList.add('is-quick-entry');
          _openMultiSheet?.({ startStep: 2, dates: [ds] });
          _notifySheetShown();
        }
      }
    }

    // 홈에서 등록/수정 진입 시 뒤쪽 주간 뷰를 보여주지 않고 대기 중인 부모창에
    // 등록 시트가 실제로 떴음을 알려 그 상태 그대로 모달을 드러내게 한다.
    function _notifySheetShown() {
      if (IS_EMBEDDED) {
        window.parent.postMessage({ type: 'cottage-sheet-shown' }, '*');
      }
    }

    document.getElementById('btnPrevWeek').addEventListener('click', () => renderWeekView(weekOffset - 1));
    document.getElementById('btnNextWeek').addEventListener('click', () => renderWeekView(weekOffset + 1));
    document.getElementById('btnToggleCal').addEventListener('click', () => {
      const cal = document.getElementById('viewCalendar');
      const btn = document.getElementById('btnToggleCal');
      const isOpen = cal.style.display !== 'none';
      cal.style.display = isOpen ? 'none' : '';
      btn.textContent = isOpen ? '달력 보기 ▾' : '달력 닫기 ▴';
      btn.classList.toggle('is-open', !isOpen);
      if (!isOpen) renderMonthCalendar();
    });

    window.addEventListener('cottage-auth-changed', () => {
      renderWeekView(weekOffset);  // 로그인 시 is-mine 갱신
    });

    window.addEventListener('message', async e => {
      if (e.data?.type === 'cottage-reset-week') {
        // 홈 빠른진입(is-quick-entry) 잔여 클래스를 여기서 정리 — 주간뷰를 실제로
        // 보여주는 유일한 진입점이라, 닫기(close)가 아니라 이 자리에서 떼야 깜빡임이 없다.
        document.body.classList.remove('is-quick-entry');
        weekOffset = e.data.offset ?? 0;
        const _cal = document.getElementById('viewCalendar');
        const _calBtn = document.getElementById('btnToggleCal');
        if (_cal) _cal.style.display = 'none';
        if (_calBtn) { _calBtn.textContent = '달력 보기 ▾'; _calBtn.classList.remove('is-open'); }
        // 재사용 iframe이라 외부 변경(홈 프리뷰 삭제 등)을 반영하려면 다시 열 때 재조회 필요.
        if (_initDone) { await _loadAllVotes(); renderWeekView(weekOffset); }
        return;
      }
      if (e.data?.type === 'cottage-edit') {
        const ds = e.data.date;
        if (!ds) return;
        if (_initDone) {
          if (ds >= toDateStr(TODAY)) {
            // 재사용 iframe이라 allVotes가 stale할 수 있다(홈 프리뷰 ✕로 방금 취소한 경우 등) —
            // cottage-reset-week와 같은 이유로 열기 전에 재조회한다(2026-08-02, 사용자 신고:
            // 취소 후 재등록 시도 시 "등록됨"이 잔류해 새로고침해야만 됐음).
            await _loadAllVotes();
            document.body.classList.add('is-quick-entry');
            _openMultiSheet?.({ startStep: 2, dates: [ds] });
            _notifySheetShown();
          }
        } else {
          // 🚨 cottage-planner-ready는 init()의 await _loadAllVotes()를 기다리지 않고
          // 곧바로 발사된다(embed 모드 진입 직후, 파일 끝 kwloc). 부모가 그 신호를 받자마자
          // cottage-edit를 보내면 _initDone이 아직 false라 조용히 무시됐다 — 「등록/수정
          // 버튼을 눌렀는데 날짜 없는 주간 뷰로 갔다」는 2026-07-22 버그가 바로 이 경로였다
          // (cottage-register는 _pendingRegister로 이미 막아뒀는데 cottage-edit만 빠져 있었음).
          _pendingEdit = ds;
        }
        return;
      }
      if (e.data?.type === 'cottage-register-open') {
        if (_initDone) {
          document.body.classList.add('is-quick-entry');
          _openMultiSheet?.({ startStep: 1 });
          _notifySheetShown();
        }
        return;
      }
      if (e.data?.type !== 'cottage-register') return;
      const ds = e.data.date;
      if (!ds) return;
      if (_initDone) {
        if (ds >= toDateStr(TODAY)) {
          // 재사용 iframe stale allVotes 대응 — cottage-edit와 같은 이유(위 주석 참고).
          await _loadAllVotes();
          document.body.classList.add('is-quick-entry');
          _openMultiSheet?.({ startStep: 1, dates: [ds] });
          _notifySheetShown();
        }
      } else {
        _pendingRegister = ds;
      }
    });

    init();

    // embed 모드: 부모 프레임에 ready 신호
    if (IS_EMBEDDED) {
      document.body.classList.add('is-embedded');
      window.parent.postMessage({ type: 'cottage-planner-ready' }, '*');
    }

  })();
  </script>
