  <script>
  (function () {
    const MIN_H = 9, MAX_H = 23;
    const DOW = ['일','월','화','수','목','금','토'];
    const TODAY = new Date();
    TODAY.setHours(0, 0, 0, 0);

    let allVotes     = [];
    let allVoteGames = [];   // meeting_vote_games (날짜별 want/learn 게임)
    let currentDate = null;
    let sliderMode = false;
    let sliderStart = 10, sliderEnd = 22;
    let weekOffset    = 0;
    let calMonthDate  = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
    let _sheetDs   = null;   // 바텀시트 대상 날짜 (null = 닫힘)
    let _syncSheet = null;   // initScheduleSheet에서 주입되는 슬라이더 sync 함수
    let _openMultiSheet = null; // initMultiSheet에서 주입되는 외부 진입점

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function toDateStr(date) {
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }

    function parseDate(s) {
      const [y, m, d] = s.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatLabel(s) {
      const d = parseDate(s);
      return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;
    }

    function isPast(s) { return parseDate(s) < TODAY; }
    function isToday(s) { return parseDate(s).getTime() === TODAY.getTime(); }

    // ── 날짜별 요약 계산 ─────────────────────────────────────
    function calcSummary(votes) {
      if (!votes.length) return null;
      const totalStart = Math.min(...votes.map(v => v.time_start));
      const totalEnd = Math.max(...votes.map(v => v.time_end));
      const blocks = calcOverlap(votes);
      const top = blocks[0] || null;
      return {
        count: votes.length,
        totalStart, totalEnd,
        overlapStart: top?.start,
        overlapEnd: top?.end,
        overlapCount: top?.count,
        names: votes.map(v => v.nickname),
      };
    }

    // ── 겹침 계산 ─────────────────────────────────────────────
    function calcOverlap(votes) {
      if (!votes.length) return [];
      const slots = [];
      for (let h = MIN_H; h < MAX_H; h++) {
        slots.push({
          h,
          names: votes.filter(v => v.time_start <= h && v.time_end > h).map(v => v.nickname)
        });
      }
      const blocks = [];
      let i = 0;
      while (i < slots.length) {
        const names = slots[i].names;
        const key = [...names].sort().join('§');
        let j = i + 1;
        while (j < slots.length && [...slots[j].names].sort().join('§') === key) j++;
        if (names.length > 0) {
          const endH = j < slots.length ? slots[j].h : MAX_H;
          blocks.push({ start: slots[i].h, end: endH, count: names.length, names: [...names] });
        }
        i = j;
      }
      return blocks.sort((a, b) => b.count - a.count || (b.end - b.start) - (a.end - a.start));
    }

    // ── 4주 뷰 렌더 (이번 주 포함 월~일 고정) ─────────────────
    function renderCalendar() {
      const countByDate = {}, votesByDate = {};
      for (const v of allVotes) {
        if (!countByDate[v.vote_date]) countByDate[v.vote_date] = new Set();
        countByDate[v.vote_date].add(v.user_id);
        if (!votesByDate[v.vote_date]) votesByDate[v.vote_date] = [];
        votesByDate[v.vote_date].push(v);
      }

      // 이번 주 월요일
      const todayDow = TODAY.getDay(); // 0=Sun
      const daysToMon = todayDow === 0 ? -6 : -(todayDow - 1);
      const thisMonday = new Date(TODAY);
      thisMonday.setDate(TODAY.getDate() + daysToMon);

      function buildCard(date) {
        const ds = toDateStr(date);
        const dow = date.getDay();
        const tod = date.getTime() === TODAY.getTime();
        const past = date < TODAY;
        const dayVotes = votesByDate[ds] || [];
        const cnt = countByDate[ds]?.size || 0;
        const dowCls = dow === 0 ? ' is-sun' : dow === 6 ? ' is-sat' : '';
        const pastCls = past ? ' is-past' : '';
        const todayCls = tod ? ' is-today' : '';
        const todayLabel = tod ? '<span class="sdc-today-label">오늘</span>' : '';

        let infoHtml = '';
        if (!past && cnt > 0) {
          const s = calcSummary(dayVotes);
          const nameStr = s.names.length <= 2
            ? s.names.map(n => esc(n)).join(', ')
            : `${esc(s.names[0])} 외 ${s.names.length - 1}명`;
          const overlapLine = s.overlapStart != null
            ? `겹침 <strong>${s.overlapStart}~${s.overlapEnd}</strong>`
            : `<span class="sdc-no-overlap">겹침 없음</span>`;
          infoHtml = `<div class="sdc-count">${cnt}명</div>
            <div class="sdc-time-row">전체 <strong>${s.totalStart}~${s.totalEnd}</strong></div>
            <div class="sdc-time-row">${overlapLine}</div>
            <div class="sdc-names">${nameStr}</div>`;
        }

        return `<div class="sched-day-card${dowCls}${pastCls}${todayCls}" data-date="${ds}">
          <div class="sdc-header">${todayLabel}<span class="sdc-dow">${DOW[dow]}</span><span class="sdc-date">${date.getMonth()+1}/${date.getDate()}</span></div>
          ${infoHtml}
        </div>`;
      }

      const sectionLabels = ['이번 주', '다음 주', '2주 뒤', '3주 뒤'];
      let html = '';
      for (let w = 0; w < 4; w++) {
        const thisCls = w === 0 ? ' is-this-week' : '';
        html += `<div class="sched-week-section${thisCls}"><div class="sched-week-label">${sectionLabels[w]}</div><div class="sched-week-row">`;
        for (let d = 0; d < 7; d++) {
          const date = new Date(thisMonday);
          date.setDate(thisMonday.getDate() + w * 7 + d);
          html += buildCard(date);
        }
        html += '</div></div>';
      }

      const el = document.getElementById('weekView');
      el.innerHTML = html;
      el.querySelectorAll('.sched-day-card:not(.is-past)').forEach(card => {
        card.addEventListener('click', () => openDay(card.dataset.date));
      });
    }

    // ── 날짜 상세 ─────────────────────────────────────────────
    function openDay(ds) {
      currentDate = ds;
      sliderMode = false;
      document.getElementById('viewWeek').style.display = 'none';
      document.getElementById('viewDay').style.display = '';
      document.getElementById('dayTitle').textContent = formatLabel(ds);
      renderDayDetail(ds);
    }

    function renderDayDetail(ds) {
      const dayVotes = allVotes.filter(v => v.vote_date === ds);
      const user = window.getKakaoUser?.();
      const myVote = dayVotes.find(v => user && String(v.user_id) === String(user.id));
      renderMyVote(ds, myVote);
      renderOverlap(dayVotes);
      renderBars(dayVotes, myVote);
    }

    function renderHourlyBreakdown(votes) {
      if (votes.length < 2) return '';
      const hourCounts = [];
      for (let h = MIN_H; h < MAX_H; h++) {
        const cnt = votes.filter(v => v.time_start <= h && v.time_end > h).length;
        if (cnt > 0) hourCounts.push({ h, cnt });
      }
      if (!hourCounts.length) return '';
      const groups = [];
      let i = 0;
      while (i < hourCounts.length) {
        const cnt = hourCounts[i].cnt;
        let j = i + 1;
        while (j < hourCounts.length && hourCounts[j].cnt === cnt) j++;
        const endH = j < hourCounts.length ? hourCounts[j].h : MAX_H;
        groups.push({ start: hourCounts[i].h, end: endH, cnt });
        i = j;
      }
      const maxCnt = Math.max(...groups.map(g => g.cnt));
      const rows = groups.map(g => {
        const pct = (g.cnt / votes.length * 100).toFixed(0);
        const peak = g.cnt === maxCnt;
        return `<div class="sched-hrly-row${peak ? ' is-peak' : ''}">
          <span class="sched-hrly-time">${g.start}~${g.end}시</span>
          <div class="sched-hrly-bar-wrap"><div class="sched-hrly-bar" style="width:${pct}%"></div></div>
          <span class="sched-hrly-count">${g.cnt}명</span>
        </div>`;
      }).join('');
      return `<div class="sched-hrly-section">
        <div class="sched-section-label">시간대별 인원</div>
        ${rows}
      </div>`;
    }

    function renderOverlap(votes) {
      const el = document.getElementById('overlapSection');
      if (!votes.length) {
        el.innerHTML = '<div class="sched-no-votes">아직 등록된 일정이 없어요.<br>첫 번째로 등록해보세요!</div>';
        return;
      }
      const s = calcSummary(votes);
      const blocks = calcOverlap(votes);
      const top = blocks[0];
      const summaryHtml = `<div class="sched-summary-card">
        <div class="sched-summary-item">
          <div class="sched-summary-lbl">👥 참여</div>
          <div class="sched-summary-val is-green">${s.count}명</div>
        </div>
        <div class="sched-summary-item">
          <div class="sched-summary-lbl">⏰ 전체</div>
          <div class="sched-summary-val">${s.totalStart}~${s.totalEnd}시</div>
        </div>
        <div class="sched-summary-item">
          <div class="sched-summary-lbl">🔥 겹침</div>
          <div class="sched-summary-val${top ? ' is-green' : ''}">${top ? `${top.start}~${top.end}시` : '없음'}</div>
        </div>
      </div>`;
      const emojis = ['🔥','😊','📌'];
      const blocksHtml = blocks.length ? blocks.slice(0, 3).map((b, i) => `
        <div class="sched-overlap-card">
          <span class="sched-overlap-emoji">${emojis[i] || '·'}</span>
          <div class="sched-overlap-info">
            <div class="sched-overlap-time">${b.start}:00 ~ ${b.end}:00</div>
            <div class="sched-overlap-who">${b.names.map(n => esc(n)).join(' · ')}</div>
          </div>
          <div class="sched-overlap-count">${b.count}<span>명</span></div>
        </div>`).join('') : '<div style="color:var(--muted);font-size:13px;padding:4px 0">겹치는 시간이 없어요.</div>';
      el.innerHTML = `<div class="sched-overlap-section">
        ${summaryHtml}
        <div class="sched-section-label">🔥 모두 가능한 시간</div>
        ${blocksHtml}
        ${renderHourlyBreakdown(votes)}
      </div>`;
    }

    function renderBars(votes, myVote) {
      const el = document.getElementById('barSection');
      if (!votes.length) { el.innerHTML = ''; return; }
      const range = MAX_H - MIN_H;
      const rows = votes.map(v => {
        const left = ((v.time_start - MIN_H) / range * 100).toFixed(1);
        const width = ((v.time_end - v.time_start) / range * 100).toFixed(1);
        const mine = myVote && String(v.user_id) === String(myVote.user_id);
        return `<div class="sched-bar-row">
          <span class="sched-bar-name" data-uid="${esc(v.user_id)}" data-nick="${esc(v.nickname)}">${esc(v.nickname)}</span>
          <div class="sched-bar-track">
            <div class="sched-bar-fill${mine ? ' is-mine' : ''}" style="left:${left}%;width:${width}%">
              <span class="sched-bar-time">${v.time_start}~${v.time_end}</span>
            </div>
          </div>
        </div>`;
      }).join('');

      el.innerHTML = `<div class="sched-bar-section">
        <div class="sched-section-label">참여 가능 시간</div>
        <div class="sched-bar-axis">
          <span>${MIN_H}시</span><span>${Math.round((MIN_H + MAX_H) / 2)}시</span><span>${MAX_H}시</span>
        </div>
        ${rows}
      </div>`;

      el.querySelectorAll('.sched-bar-name').forEach(n => {
        n.addEventListener('click', () => {
          window.CottageDB?.trackEvent('meeting_profile_click');
          window.openOtherMeetingSheet?.(n.dataset.uid);
        });
      });
    }

    function renderMyVote(ds, myVote) {
      const el = document.getElementById('myVoteSection');
      const user = window.getKakaoUser?.();

      if (!user) {
        el.innerHTML = `<div class="sched-my-section">
          <div class="sched-login-hint">가능 시간을 등록하려면 로그인이 필요해요.</div>
          <button class="sched-register-btn" onclick="document.getElementById('kakaoLoginBtn')?.click()" type="button">카카오 로그인</button>
        </div>`;
        return;
      }

      if (sliderMode) {
        renderSlider(el, ds, myVote);
        return;
      }

      if (myVote) {
        el.innerHTML = `<div class="sched-my-section">
          <div class="sched-my-status">✅ 참여중</div>
          <div class="sched-my-current">
            <span class="sched-my-time">${myVote.time_start}:00 ~ ${myVote.time_end}:00</span>
            <div class="sched-my-actions">
              <button class="sched-action-btn sched-action-btn--edit" id="btnEdit">시간 변경</button>
              <button class="sched-action-btn sched-action-btn--del" id="btnDel">참여 취소</button>
            </div>
          </div>
        </div>`;
        document.getElementById('btnEdit').addEventListener('click', () => {
          sliderStart = myVote.time_start;
          sliderEnd = myVote.time_end;
          sliderMode = true;
          renderMyVote(ds, myVote);
        });
        document.getElementById('btnDel').addEventListener('click', () => removeVote(ds));
      } else {
        el.innerHTML = `<div class="sched-my-section">
          <button class="sched-register-btn" id="btnRegister">나도 등록하기</button>
        </div>`;
        document.getElementById('btnRegister').addEventListener('click', () => {
          sliderStart = 10; sliderEnd = 22;
          sliderMode = true;
          renderMyVote(ds, myVote);
        });
      }
    }

    function renderSlider(container, ds, myVote) {
      const range = MAX_H - MIN_H;
      container.innerHTML = `<div class="sched-my-section">
        <div class="sched-section-label">가능 시간 선택</div>
        <div class="sched-slider-wrap">
          <div class="sched-slider-times">
            <span class="sched-slider-time-val" id="lblS">${sliderStart}시</span>
            <span class="sched-slider-sep">~</span>
            <span class="sched-slider-time-val" id="lblE">${sliderEnd}시</span>
          </div>
          <div class="sched-dual-range">
            <div class="sched-range-track">
              <div class="sched-range-fill" id="rangeFill"></div>
            </div>
            <input type="range" class="sched-range-input" id="rS"
              min="${MIN_H}" max="${MAX_H - 1}" step="1" value="${sliderStart}">
            <input type="range" class="sched-range-input" id="rE"
              min="${MIN_H + 1}" max="${MAX_H}" step="1" value="${sliderEnd}">
          </div>
          <div class="sched-range-axis">
            <span>${MIN_H}시</span>
            <span>${Math.round((MIN_H + MAX_H) / 2)}시</span>
            <span>${MAX_H}시</span>
          </div>
        </div>
        <div class="sched-confirm-row">
          <button class="sched-confirm-btn" id="btnSave">등록</button>
          <button class="sched-discard-btn" id="btnDiscardSlider">닫기</button>
        </div>
      </div>`;

      const rS = document.getElementById('rS');
      const rE = document.getElementById('rE');
      const fill = document.getElementById('rangeFill');
      const lblS = document.getElementById('lblS');
      const lblE = document.getElementById('lblE');

      function sync() {
        const s = parseInt(rS.value), e = parseInt(rE.value);
        fill.style.left = ((s - MIN_H) / range * 100) + '%';
        fill.style.width = ((e - s) / range * 100) + '%';
        lblS.textContent = s + '시';
        lblE.textContent = e + '시';
        sliderStart = s; sliderEnd = e;
      }
      rS.addEventListener('input', () => {
        if (parseInt(rS.value) >= parseInt(rE.value)) rS.value = parseInt(rE.value) - 1;
        sync();
      });
      rE.addEventListener('input', () => {
        if (parseInt(rE.value) <= parseInt(rS.value)) rE.value = parseInt(rS.value) + 1;
        sync();
      });
      sync();

      document.getElementById('btnSave').addEventListener('click', () => saveVote(ds));
      document.getElementById('btnDiscardSlider').addEventListener('click', () => {
        sliderMode = false;
        renderMyVote(ds, myVote);
      });
    }

    async function saveVote(ds) {
      const user = window.getKakaoUser?.();
      if (!user) return;
      const btn = document.getElementById('btnSave');
      if (btn) btn.disabled = true;

      const result = await window.CottageDB?.upsertMeetingVote(
        String(user.id), user.nickname || '익명', ds, sliderStart, sliderEnd
      );

      if (result?.success) {
        allVotes = allVotes.filter(v => !(v.vote_date === ds && String(v.user_id) === String(user.id)));
        allVotes.push({ vote_date: ds, user_id: String(user.id), nickname: user.nickname || '익명', time_start: sliderStart, time_end: sliderEnd });
        sliderMode = false;
        renderCalendar();
        renderDayDetail(ds);
      } else {
        if (btn) btn.disabled = false;
        const msg = result?.error?.message || '알 수 없는 오류';
        alert(`저장 오류: ${msg}`);
      }
    }

    async function removeVote(ds) {
      if (!confirm('참여를 취소할까요?')) return;
      const user = window.getKakaoUser?.();
      if (!user) return;

      const result = await window.CottageDB?.deleteMeetingVote(String(user.id), ds);
      if (result?.success) {
        allVotes = allVotes.filter(v => !(v.vote_date === ds && String(v.user_id) === String(user.id)));
        renderCalendar();
        renderDayDetail(ds);
      } else {
        alert('취소 중 오류가 발생했어요.');
      }
    }


    // ── 주간 카드 등록/변경/취소 (Phase 3) ──────────────────────────

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'sched-toast';
      t.textContent = msg;
      document.body.appendChild(t);
      requestAnimationFrame(() => t.classList.add('is-show'));
      setTimeout(() => {
        t.classList.remove('is-show');
        setTimeout(() => t.remove(), 280);
      }, 2200);
    }

    // ── 시간 등록/수정 바텀시트 ──────────────────────────────────────

    function initScheduleSheet() {
      const range = MAX_H - MIN_H;
      const overlay = document.createElement('div');
      overlay.className = 'sched-sheet-overlay';
      overlay.id = 'schedSheetOverlay';
      overlay.innerHTML = `<div class="sched-sheet">
        <div class="sched-sheet-header">
          <span class="sched-sheet-title" id="ssTitle"></span>
          <button class="sched-sheet-close-btn" id="ssClose" type="button">✕</button>
        </div>
        <div class="sched-sheet-body">
          <div class="sched-sheet-prevweek-row" id="ssPrevWeekRow">
            <button class="sched-sheet-prevweek-btn" id="ssPrevWeek" type="button"></button>
          </div>
          <div class="sched-sheet-time-display">
            <span class="sched-slider-time-val" id="ssLblS">10시</span>
            <span class="sched-slider-sep">~</span>
            <span class="sched-slider-time-val" id="ssLblE">22시</span>
          </div>
          <div class="sched-slider-wrap">
            <div class="sched-dual-range">
              <div class="sched-range-track"><div class="sched-range-fill" id="ssRangeFill"></div></div>
              <input type="range" class="sched-range-input" id="ssRS"
                min="${MIN_H}" max="${MAX_H - 1}" step="1" value="10">
              <input type="range" class="sched-range-input" id="ssRE"
                min="${MIN_H + 1}" max="${MAX_H}" step="1" value="22">
            </div>
            <div class="sched-range-axis">
              <span>${MIN_H}시</span><span>${Math.round((MIN_H+MAX_H)/2)}시</span><span>${MAX_H}시</span>
            </div>
          </div>
        </div>
        <div class="sched-sheet-footer">
          <button class="sched-confirm-btn" id="ssSave" type="button">등록</button>
          <button class="sched-discard-btn" id="ssDiscard" type="button">닫기</button>
        </div>
      </div>`;
      overlay.style.display = 'none';
      document.body.appendChild(overlay);

      const ssRS = document.getElementById('ssRS');
      const ssRE = document.getElementById('ssRE');
      const fill = document.getElementById('ssRangeFill');
      const lblS = document.getElementById('ssLblS');
      const lblE = document.getElementById('ssLblE');

      function syncSheet() {
        const s = parseInt(ssRS.value), e = parseInt(ssRE.value);
        fill.style.left  = ((s - MIN_H) / range * 100) + '%';
        fill.style.width = ((e - s)     / range * 100) + '%';
        lblS.textContent = s + '시';
        lblE.textContent = e + '시';
      }
      _syncSheet = syncSheet;  // 외부(지난주와 동일 버튼)에서 호출 가능하도록 노출

      ssRS.addEventListener('input', () => {
        if (parseInt(ssRS.value) >= parseInt(ssRE.value)) ssRS.value = parseInt(ssRE.value) - 1;
        syncSheet();
      });
      ssRE.addEventListener('input', () => {
        if (parseInt(ssRE.value) <= parseInt(ssRS.value)) ssRE.value = parseInt(ssRS.value) + 1;
        syncSheet();
      });

      document.getElementById('ssSave').addEventListener('click', () => {
        const btnSave = document.getElementById('ssSave');
        saveVoteForDate(_sheetDs, parseInt(ssRS.value), parseInt(ssRE.value), btnSave);
      });
      document.getElementById('ssDiscard').addEventListener('click', closeScheduleSheet);
      document.getElementById('ssClose').addEventListener('click', closeScheduleSheet);

      // 지난주와 동일: 같은 요일 7일 전 내 투표 → 슬라이더 이동 (자동저장 없음)
      document.getElementById('ssPrevWeek').addEventListener('click', () => {
        if (!_sheetDs) return;
        const user = window.getKakaoUser?.();
        if (!user) { showToast('로그인이 필요합니다.'); return; }
        const [y, m, d] = _sheetDs.split('-').map(Number);
        const prevDs = toDateStr(new Date(y, m - 1, d - 7));
        const prev   = allVotes.find(v => v.vote_date === prevDs && String(v.user_id) === String(user.id));
        if (!prev) { showToast('지난주 기록이 없습니다.'); return; }
        ssRS.value = prev.time_start;
        ssRE.value = prev.time_end;
        if (_syncSheet) _syncSheet();
      });

      // 바깥 클릭 닫기는 openScheduleSheet에서 document 레벨로 등록
    }

    // ── 멀티스텝 바텀시트 (모임 등록) ──────────────────────────
    function initMultiSheet() {
      let _step        = 1;
      let _days        = [];   // 선택된 날짜 배열 (정렬 유지)
      let _timeMap     = {};   // { ds: {s, e} }
      let _gameMap     = {};   // { ds: {want:[{custom_name,game_id}], learn:[...]} }
      let _activeDay   = null;
      let _fromStep1   = false;
      let _pickerCache = {};   // { like:[], curious:[] } — lazy fetch
      let _pickerOpen  = null; // 미사용(Step3 제거), 호환용 유지
      let _gameOpen    = {want:false, learn:false}; // 게임 섹션 열림 상태

      const overlay = document.createElement('div');
      overlay.className = 'sched-multi-overlay';
      overlay.id = 'schedMultiOverlay';
      overlay.innerHTML = `<div class="sched-multi-sheet">
        <div class="sm-hdr">
          <button class="sm-back-btn" id="smBack" type="button">← 뒤로</button>
          <span class="sm-title" id="smTitle"></span>
          <button class="sm-close-btn" id="smClose" type="button" aria-label="닫기">✕</button>
        </div>
        <div class="sm-body" id="smBody"></div>
        <div class="sm-footer" id="smFooter"></div>
      </div>`;
      overlay.style.display = 'none';
      document.body.appendChild(overlay);

      const $s = id => document.getElementById(id);

      function close() {
        overlay.style.display = 'none';
        _days = []; _timeMap = {}; _gameMap = {}; _activeDay = null; _step = 1; _pickerOpen = null; _gameOpen = {want:false, learn:false};
      }
      $s('smClose').addEventListener('click', close);
      overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

      $s('smBack').addEventListener('click', () => {
        if (_step === 2) { if (_fromStep1) renderStep1(); else close(); }
      });

      // ── 헬퍼 ──────────────────────────────────────────────────

      function resolveGameName(item) {
        if (item.custom_name) return item.custom_name;
        if (item.game_id) {
          const g = (window.COTTAGE_GAMES || []).find(g => g.bggId === String(item.game_id));
          return g?.display || `#${item.game_id}`;
        }
        return '?';
      }

      function isDup(section, item) {
        const list = _gameMap[_activeDay]?.[section] || [];
        return list.some(g =>
          (g.game_id && item.game_id && String(g.game_id) === String(item.game_id)) ||
          (g.custom_name && item.custom_name && g.custom_name.trim() === item.custom_name.trim())
        );
      }

      async function fetchPickerData(cacheKey) {
        const user = window.getKakaoUser?.();
        if (!user) { _pickerCache[cacheKey] = cacheKey === 'meeting' ? {want:[], rule:[]} : []; return; }
        try {
          if (cacheKey === 'like') {
            _pickerCache.like = await window.CottageDB?.getUserLikedGamesAll(String(user.id)) || [];
          } else if (cacheKey === 'curious') {
            _pickerCache.curious = await window.CottageDB?.getUserCuriousGamesAll(String(user.id)) || [];
          } else if (cacheKey === 'meeting') {
            const profile = await window.CottageDB?.getMeetingProfile(String(user.id));
            _pickerCache.meeting = { want: profile?.wantGames || [], rule: profile?.ruleGames || [] };
          }
        } catch(_) {
          _pickerCache[cacheKey] = cacheKey === 'meeting' ? {want:[], rule:[]} : [];
        }
      }

      function getPickerItems(section, source) {
        if (source === 'like')    return _pickerCache.like || [];
        if (source === 'curious') return _pickerCache.curious || [];
        if (source === 'meeting') {
          const m = _pickerCache.meeting;
          if (!m || m === 'loading') return [];
          return section === 'want' ? (m.want || []) : (m.rule || []);
        }
        return [];
      }

      function pickerSectionLabel(section, source) {
        if (source === 'like')    return '좋아하는 게임 (취향보드)';
        if (source === 'curious') return '궁금한 게임 (취향보드)';
        if (source === 'meeting') return section === 'want' ? '하고 싶은 게임 (모임보드)' : '룰 설명 가능 게임 (모임보드 참고)';
        return '';
      }

      function buildTabs() {
        const DOW_KR = ['일','월','화','수','목','금','토'];
        return _days.map(ds => {
          const d = parseDate(ds);
          return `<button class="sm-tab${ds === _activeDay ? ' is-active' : ''}" data-ds="${ds}" type="button">`
            + `${DOW_KR[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}</button>`;
        }).join('');
      }

      function initDay(ds) {
        if (!_timeMap[ds]) {
          const user = window.getKakaoUser?.();
          const ex = user && allVotes.find(v => v.vote_date === ds && String(v.user_id) === String(user.id));
          _timeMap[ds] = { s: ex?.time_start ?? 10, e: ex?.time_end ?? 22 };
        }
        if (!_gameMap[ds]) {
          const user = window.getKakaoUser?.();
          const uid = user ? String(user.id) : null;
          _gameMap[ds] = {
            want:  uid ? allVoteGames.filter(g => g.vote_date===ds && String(g.user_id)===uid && g.list_type==='want') .map(g=>({game_id:g.game_id, custom_name:g.custom_name})) : [],
            learn: uid ? allVoteGames.filter(g => g.vote_date===ds && String(g.user_id)===uid && g.list_type==='learn').map(g=>({game_id:g.game_id, custom_name:g.custom_name})) : []
          };
        }
      }

      // ── Step 1: 요일 선택 ──────────────────────────────────────
      function renderStep1() {
        _step = 1;
        $s('smTitle').textContent = '모임 등록';
        $s('smBack').style.visibility = 'hidden';

        const DOW_KR = ['일','월','화','수','목','금','토'];
        const dow = TODAY.getDay();
        const daysToMon = dow === 0 ? -6 : 1 - dow;
        const monday = new Date(TODAY);
        monday.setDate(TODAY.getDate() + daysToMon + weekOffset * 7);
        const weekDates = Array.from({length:7}, (_, i) => {
          const d = new Date(monday); d.setDate(monday.getDate() + i); return d;
        });

        const user = window.getKakaoUser?.();
        const chips = weekDates.map(d => {
          const ds   = toDateStr(d);
          const past = d < TODAY;
          const tod  = d.getTime() === TODAY.getTime();
          const sel  = _days.includes(ds);
          const mine = user && allVotes.some(v => v.vote_date===ds && String(v.user_id)===String(user.id));
          return `<button class="sm-day-chip${sel?' is-sel':''}${past?' is-past':''}${tod?' is-today':''}"
            data-ds="${ds}" type="button"${past?' disabled':''}>
            <span class="sm-dc-dow">${DOW_KR[d.getDay()]}</span>
            <span class="sm-dc-date">${d.getMonth()+1}/${d.getDate()}</span>
            ${mine?'<span class="sm-dc-mine"></span>':''}
          </button>`;
        }).join('');

        $s('smBody').innerHTML = `<p class="sm-hint">참여할 요일을 선택하세요 (여러 날 선택 가능)</p>
          <div class="sm-day-chips" id="smDayChips">${chips}</div>`;
        $s('smFooter').innerHTML =
          `<button class="sched-confirm-btn" id="smNext1" type="button"${_days.length===0?' disabled':''}>다음 →</button>`;

        $s('smDayChips').querySelectorAll('.sm-day-chip:not([disabled])').forEach(btn => {
          btn.addEventListener('click', () => {
            const ds = btn.dataset.ds;
            if (_days.includes(ds)) { _days = _days.filter(x => x !== ds); btn.classList.remove('is-sel'); }
            else { _days.push(ds); _days.sort(); btn.classList.add('is-sel'); }
            $s('smNext1').disabled = _days.length === 0;
          });
        });
        $s('smNext1').addEventListener('click', () => {
          _fromStep1 = true;
          _days.forEach(initDay);
          renderStep2();
        });
      }

      // ── Step 2: 시간 · 게임 설정 ──────────────────────────────
      function renderStep2() {
        _step = 2;
        if (!_activeDay || !_days.includes(_activeDay)) _activeDay = _days[0];
        $s('smTitle').textContent = '시간 설정';
        $s('smBack').style.visibility = _fromStep1 ? 'visible' : 'hidden';

        const t = _timeMap[_activeDay] || {s:10, e:22};
        const user = window.getKakaoUser?.();

        const myVotes = user ? allVotes.filter(v => String(v.user_id) === String(user.id)) : [];
        const freq = {};
        myVotes.forEach(v => {
          const key = `${v.time_start}-${v.time_end}`;
          if (!freq[key]) freq[key] = { s: v.time_start, e: v.time_end, count: 0 };
          freq[key].count++;
        });
        const topTimes = Object.values(freq).sort((a, b) => b.count - a.count).slice(0, 4);

        const tabsHtml = _days.length > 1 ? `<div class="sm-tabs">${buildTabs()}</div>` : '';
        const freqHtml = topTimes.length
          ? `<div class="sm-freqtime-row">
              <button class="sm-freqtime-btn" id="smFreqBtn" type="button">자주 사용한 시간 ▾</button>
              <div class="sm-freqtime-menu" id="smFreqMenu" style="display:none">
                ${topTimes.map(t => `<button class="sm-freqtime-opt" data-s="${t.s}" data-e="${t.e}" type="button">${t.s}~${t.e}시</button>`).join('')}
              </div>
            </div>`
          : '';

        $s('smBody').innerHTML = `${tabsHtml}${freqHtml}
          <div class="sched-sheet-time-display">
            <span class="sched-slider-time-val" id="smLblS">${t.s}시</span>
            <span class="sched-slider-sep">~</span>
            <span class="sched-slider-time-val" id="smLblE">${t.e}시</span>
          </div>
          <div class="sched-slider-wrap">
            <div class="sched-dual-range">
              <div class="sched-range-track"><div class="sched-range-fill" id="smFill"></div></div>
              <input type="range" class="sched-range-input" id="smRS" min="${MIN_H}" max="${MAX_H-1}" step="1" value="${t.s}" aria-label="시작 시간">
              <input type="range" class="sched-range-input" id="smRE" min="${MIN_H+1}" max="${MAX_H}" step="1" value="${t.e}" aria-label="종료 시간">
            </div>
            <div class="sched-range-axis">
              <span>${MIN_H}시</span><span>${Math.round((MIN_H+MAX_H)/2)}시</span><span>${MAX_H}시</span>
            </div>
          </div>
          <div id="smGameSections"></div>`;

        $s('smFooter').innerHTML = `<button class="sched-confirm-btn" id="smSave" type="button">저장</button>`;

        function syncMs() {
          const s=parseInt($s('smRS').value), e=parseInt($s('smRE').value), r=MAX_H-MIN_H;
          $s('smFill').style.left=((s-MIN_H)/r*100)+'%';
          $s('smFill').style.width=((e-s)/r*100)+'%';
          $s('smLblS').textContent=s+'시'; $s('smLblE').textContent=e+'시';
        }
        syncMs();

        $s('smRS').addEventListener('input', () => {
          if (parseInt($s('smRS').value) >= parseInt($s('smRE').value)) $s('smRS').value = parseInt($s('smRE').value)-1;
          syncMs();
        });
        $s('smRE').addEventListener('input', () => {
          if (parseInt($s('smRE').value) <= parseInt($s('smRS').value)) $s('smRE').value = parseInt($s('smRS').value)+1;
          syncMs();
        });

        if (topTimes.length) {
          const freqBtn  = $s('smFreqBtn');
          const freqMenu = $s('smFreqMenu');
          freqBtn.addEventListener('click', () => {
            freqMenu.style.display = freqMenu.style.display !== 'none' ? 'none' : '';
          });
          freqMenu.querySelectorAll('.sm-freqtime-opt').forEach(opt => {
            opt.addEventListener('click', () => {
              $s('smRS').value = opt.dataset.s;
              $s('smRE').value = opt.dataset.e;
              syncMs();
              freqMenu.style.display = 'none';
            });
          });
        }

        $s('smBody').querySelectorAll('.sm-tab').forEach(tab => {
          tab.addEventListener('click', () => { saveCurrentTime(); _activeDay = tab.dataset.ds; renderStep2(); });
        });

        $s('smSave').addEventListener('click', () => { saveCurrentTime(); saveAll(); });

        renderStep2Games();
      }

      // ── Step 2 게임 섹션 렌더 ────────────────────────────────────
      function renderStep2Games() {
        const wrap = document.getElementById('smGameSections');
        if (!wrap) return;
        if (!_gameMap[_activeDay]) _gameMap[_activeDay] = {want:[], learn:[]};

        function gameListHtml(type) {
          return (_gameMap[_activeDay][type] || []).map((g, i) =>
            `<div class="sm-game-item">
              <span class="sm-game-name">${esc(g.custom_name || resolveGameName(g))}</span>
              <button class="sm-game-del" data-type="${type}" data-idx="${i}" type="button" aria-label="삭제">✕</button>
            </div>`
          ).join('');
        }

        function pickerHtml(type) {
          const source = type === 'want' ? 'like' : 'curious';
          const cached = _pickerCache[source];
          if (cached === 'loading') return `<div class="sm-picker-panel"><div class="sm-picker-loading">불러오는 중…</div></div>`;
          if (!cached) return '';
          const items = getPickerItems(type, source);
          if (!items.length) return `<div class="sm-picker-panel"><div class="sm-picker-empty">등록된 게임이 없어요</div></div>`;
          const label = type === 'want' ? '좋아요한 게임' : '궁금한 게임';
          return `<div class="sm-picker-panel">
            <div class="sm-picker-label">${esc(label)}</div>
            ${items.map((g, i) => {
              const name = resolveGameName(g);
              const dup  = isDup(type, g);
              return `<button class="sm-picker-item${dup?' is-added':''}" data-pidx="${i}" data-ptype="${type}" type="button"${dup?' disabled':''}>
                <span>${esc(name)}</span>
                <span class="sm-picker-tag">${dup?'추가됨':'+ 추가'}</span>
              </button>`;
            }).join('')}
          </div>`;
        }

        function sectionHtml(type) {
          const icon  = type === 'want' ? '🎲' : '📖';
          const label = type === 'want' ? '하고 싶은 게임' : '배우고 싶은 게임';
          const open  = _gameOpen[type];
          const count = (_gameMap[_activeDay]?.[type] || []).length;
          const source = type === 'want' ? 'like' : 'curious';

          const btnLabel = open
            ? `${icon} ${label} (${count}) ▲`
            : `${icon} ${label} (${count}) ▾`;

          if (!open) return `<button class="sm-game-toggle" data-gtoggle="${type}" type="button">${btnLabel}</button>`;
          return `<button class="sm-game-toggle is-open" data-gtoggle="${type}" type="button">${btnLabel}</button>
            <div class="sm-game-section">
              ${gameListHtml(type)}
              <div class="sm-game-input-row">
                <input class="sm-game-input" id="sm_${type}_input" type="text" placeholder="게임 이름 직접 입력" autocomplete="off">
                <button class="sm-game-add-btn" data-gadd="${type}" type="button">추가</button>
              </div>
              ${_pickerCache[source] !== undefined ? pickerHtml(type) : ''}
            </div>`;
        }

        wrap.innerHTML = `<div class="sm-game-toggle-wrap">
          ${sectionHtml('want')}
          ${sectionHtml('learn')}
        </div>`;

        // 토글
        wrap.querySelectorAll('[data-gtoggle]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const type   = btn.dataset.gtoggle;
            const source = type === 'want' ? 'like' : 'curious';
            _gameOpen[type] = !_gameOpen[type];
            if (_gameOpen[type] && _pickerCache[source] === undefined) {
              _pickerCache[source] = 'loading';
              renderStep2Games();
              await fetchPickerData(source);
            }
            renderStep2Games();
          });
        });

        // 추가 버튼
        wrap.querySelectorAll('[data-gadd]').forEach(btn => {
          btn.addEventListener('click', () => {
            const type  = btn.dataset.gadd;
            const input = document.getElementById(`sm_${type}_input`);
            const val   = input?.value.trim();
            if (val) { addGameStep2(type, val, null, true); input.value = ''; }
          });
        });

        // Enter 키
        ['want','learn'].forEach(type => {
          const el = document.getElementById(`sm_${type}_input`);
          if (!el) return;
          el.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            const val = el.value.trim();
            if (val) { addGameStep2(type, val, null, true); el.value = ''; }
          });
        });

        // 삭제
        wrap.querySelectorAll('.sm-game-del').forEach(btn => {
          btn.addEventListener('click', () => {
            _gameMap[_activeDay][btn.dataset.type].splice(parseInt(btn.dataset.idx), 1);
            renderStep2Games();
          });
        });

        // 피커 항목 선택
        wrap.querySelectorAll('.sm-picker-item:not([disabled])').forEach(btn => {
          btn.addEventListener('click', () => {
            const type   = btn.dataset.ptype;
            const source = type === 'want' ? 'like' : 'curious';
            const items  = getPickerItems(type, source);
            const item   = items[parseInt(btn.dataset.pidx)];
            if (!item || isDup(type, item)) return;
            addGameStep2(type, resolveGameName(item), item.game_id ? Number(item.game_id) : null, false);
          });
        });
      }

      // ── 게임 추가 + 역연동 + 다중날짜 전파 ──────────────────────
      async function addGameStep2(type, name, gameId, isManualInput) {
        if (!_gameMap[_activeDay]) _gameMap[_activeDay] = {want:[], learn:[]};
        const entry = {custom_name: name, game_id: gameId ?? null};
        if (isDup(type, entry)) return;

        _gameMap[_activeDay][type].push(entry);
        renderStep2Games();

        if (isManualInput)   await promptCrossSync(type, name, gameId);
        if (_days.length > 1) await promptOtherDates(type, entry);
      }

      async function promptCrossSync(type, name, gameId) {
        const user = window.getKakaoUser?.();
        if (!user) return;
        const source = type === 'want' ? 'like' : 'curious';
        const cached = _pickerCache[source];
        if (!Array.isArray(cached)) return;
        const alreadyIn = cached.some(g =>
          (gameId && g.game_id && String(g.game_id) === String(gameId)) ||
          (g.custom_name && g.custom_name.trim() === name.trim())
        );
        if (alreadyIn) return;
        const boardLabel = type === 'want' ? '좋아요한 게임' : '궁금한 게임';
        const table      = type === 'want' ? 'game_likes' : 'game_curious';
        if (confirm(`"${name}"을(를) ${boardLabel}에도 추가할까요?`)) {
          try {
            await window.CottageDB?.addGamePref(String(user.id), gameId ?? null, name, table);
            _pickerCache[source].push({game_id: gameId ?? null, custom_name: name});
          } catch(e) { console.error('addGamePref 오류:', e); }
        }
      }

      async function promptOtherDates(type, entry) {
        const otherDays = _days.filter(d => d !== _activeDay);
        if (!otherDays.length) return;
        const label = type === 'want' ? '하고 싶은 게임' : '배우고 싶은 게임';
        if (confirm(`다른 날짜에도 "${entry.custom_name}"을(를) ${label}로 추가할까요?`)) {
          otherDays.forEach(ds => {
            if (!_gameMap[ds]) _gameMap[ds] = {want:[], learn:[]};
            const dup = _gameMap[ds][type].some(g =>
              (entry.game_id && g.game_id && String(g.game_id) === String(entry.game_id)) ||
              (entry.custom_name && g.custom_name === entry.custom_name)
            );
            if (!dup) _gameMap[ds][type].push({...entry});
          });
        }
      }

      function saveCurrentTime() {
        const rs = $s('smRS'), re = $s('smRE');
        if (rs && re && _activeDay) _timeMap[_activeDay] = { s: parseInt(rs.value), e: parseInt(re.value) };
      }

      // ── 저장 ───────────────────────────────────────────────────
      async function saveAll() {
        const user = window.getKakaoUser?.();
        if (!user) { showToast('로그인이 필요합니다.'); return; }
        const saveBtn = $s('smSave');
        if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '저장 중...'; }

        try {
          for (const ds of _days) {
            const t = _timeMap[ds] || {s:10, e:22};
            const result = await window.CottageDB?.upsertMeetingVote(String(user.id), user.nickname||'익명', ds, t.s, t.e);
            if (!result?.success) throw new Error(result?.error?.message || '시간 저장 오류');

            // 기존 게임 삭제 후 재삽입
            const existingGames = allVoteGames.filter(g => g.vote_date===ds && String(g.user_id)===String(user.id));
            for (const g of existingGames) {
              await window.CottageDB?.removeMeetingVoteGame(String(user.id), ds, g.list_type, g.game_id, g.custom_name);
            }
            const dayGames = _gameMap[ds] || {want:[], learn:[]};
            for (const g of dayGames.want) {
              if (g.custom_name || g.game_id) await window.CottageDB?.addMeetingVoteGame(String(user.id), ds, 'want', g.game_id??null, g.custom_name??null);
            }
            for (const g of dayGames.learn) {
              if (g.custom_name || g.game_id) await window.CottageDB?.addMeetingVoteGame(String(user.id), ds, 'learn', g.game_id??null, g.custom_name??null);
            }

            // 메모리 갱신
            allVotes = allVotes.filter(v => !(v.vote_date===ds && String(v.user_id)===String(user.id)));
            allVotes.push({vote_date:ds, user_id:String(user.id), nickname:user.nickname||'익명', time_start:t.s, time_end:t.e});
            allVoteGames = allVoteGames.filter(g => !(g.vote_date===ds && String(g.user_id)===String(user.id)));
            for (const g of dayGames.want) {
              if (g.custom_name || g.game_id) allVoteGames.push({vote_date:ds, user_id:String(user.id), list_type:'want', game_id:g.game_id??null, custom_name:g.custom_name??null});
            }
            for (const g of dayGames.learn) {
              if (g.custom_name || g.game_id) allVoteGames.push({vote_date:ds, user_id:String(user.id), list_type:'learn', game_id:g.game_id??null, custom_name:g.custom_name??null});
            }
          }
          close();
          renderWeekView(weekOffset);
          showToast('저장되었습니다!');
        } catch(err) {
          console.error(err);
          showToast('저장 중 오류가 발생했습니다.');
          if (saveBtn) { saveBtn.disabled=false; saveBtn.textContent='저장'; }
        }
      }

      // ── 외부 진입점 ────────────────────────────────────────────
      _openMultiSheet = function({ startStep=1, dates=[] } = {}) {
        _fromStep1 = startStep === 1;
        _days = [...dates].sort();
        _timeMap = {}; _gameMap = {}; _activeDay = null; _gameOpen = {want:false, learn:false};
        _days.forEach(initDay);
        overlay.style.display = '';
        if (startStep === 2) renderStep2();
        else renderStep1();
      };
    }

    function openScheduleSheet(ds, myVote) {
      _sheetDs = ds;
      const [y, m, d] = ds.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      const action = myVote ? '시간 수정' : '시간 등록';
      document.getElementById('ssTitle').textContent =
        `${DOW[date.getDay()]} ${m}/${d} ${action}`;

      const btnSave = document.getElementById('ssSave');
      btnSave.textContent = myVote ? '저장' : '등록';
      btnSave.disabled = false;

      const initS = myVote?.time_start ?? 10;
      const initE = myVote?.time_end ?? 22;
      const range = MAX_H - MIN_H;
      const ssRS = document.getElementById('ssRS');
      const ssRE = document.getElementById('ssRE');
      ssRS.value = initS;
      ssRE.value = initE;
      document.getElementById('ssRangeFill').style.left  = ((initS - MIN_H) / range * 100) + '%';
      document.getElementById('ssRangeFill').style.width = ((initE - initS) / range * 100) + '%';
      document.getElementById('ssLblS').textContent = initS + '시';
      document.getElementById('ssLblE').textContent = initE + '시';

      // 지난주 버튼: 데이터 있으면 시간 표시, 없으면 row 숨김
      const _user = window.getKakaoUser?.();
      const prevDs = toDateStr(new Date(y, m - 1, d - 7));
      const prevVote = _user
        ? allVotes.find(v => v.vote_date === prevDs && String(v.user_id) === String(_user.id))
        : null;
      const rowPrev = document.getElementById('ssPrevWeekRow');
      if (prevVote) {
        document.getElementById('ssPrevWeek').textContent =
          `지난주 ${prevVote.time_start}~${prevVote.time_end} 적용`;
        rowPrev.style.display = '';
      } else {
        rowPrev.style.display = 'none';
      }

      document.getElementById('schedSheetOverlay').style.display = '';

      // 마지막 카드가 시트에 가려지지 않도록 여백 추가
      const listEl = document.getElementById('weekDayList');
      if (listEl) listEl.style.paddingBottom = '260px';

      // 바깥 클릭 → 닫기 (열기 클릭이 즉시 발동하지 않도록 setTimeout)
      setTimeout(() => {
        document.addEventListener('click', _closeSheetOnOutsideClick);
      }, 0);
    }

    function _closeSheetOnOutsideClick(e) {
      const sheet = document.querySelector('.sched-sheet');
      if (sheet && !sheet.contains(e.target)) closeScheduleSheet();
    }

    function closeScheduleSheet() {
      document.getElementById('schedSheetOverlay').style.display = 'none';
      const listEl = document.getElementById('weekDayList');
      if (listEl) listEl.style.paddingBottom = '';
      document.removeEventListener('click', _closeSheetOnOutsideClick);
      _sheetDs = null;
    }

    async function saveVoteForDate(ds, start, end, btnSave) {
      const user = window.getKakaoUser?.();
      if (!user) return;
      if (btnSave) btnSave.disabled = true;

      const result = await window.CottageDB?.upsertMeetingVote(
        String(user.id), user.nickname || '익명', ds, start, end
      );
      if (result?.success) {
        allVotes = allVotes.filter(v => !(v.vote_date === ds && String(v.user_id) === String(user.id)));
        allVotes.push({ vote_date: ds, user_id: String(user.id), nickname: user.nickname || '익명', time_start: start, time_end: end });
        closeScheduleSheet();
        renderWeekView(weekOffset);
      } else {
        if (btnSave) btnSave.disabled = false;
        alert(`저장 오류: ${result?.error?.message || '알 수 없는 오류'}`);
      }
    }

    async function removeVoteForDate(ds) {
      if (!confirm('참여를 취소할까요?')) return;
      const user = window.getKakaoUser?.();
      if (!user) return;
      const result = await window.CottageDB?.deleteMeetingVote(String(user.id), ds);
      if (result?.success) {
        allVotes = allVotes.filter(v => !(v.vote_date === ds && String(v.user_id) === String(user.id)));
        renderWeekView(weekOffset);
      } else {
        alert('취소 중 오류가 발생했어요.');
      }
    }

    // ── 월간 달력 (달력보기 토글) ────────────────────────────────────
    function renderMonthCalendar() {
      const cal = document.getElementById('viewCalendar');
      const y   = calMonthDate.getFullYear();
      const m   = calMonthDate.getMonth();
      const MONTH_NAMES = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

      const firstDow  = new Date(y, m, 1).getDay();
      const lastDate  = new Date(y, m + 1, 0).getDate();
      const startOff  = firstDow === 0 ? 6 : firstDow - 1; // 0=월 기준

      const cntByDate = {};
      const myDates   = new Set();
      const user      = window.getKakaoUser?.();
      const todayStr  = toDateStr(TODAY);
      for (const v of allVotes) {
        if (!cntByDate[v.vote_date]) cntByDate[v.vote_date] = 0;
        cntByDate[v.vote_date]++;
        if (user && String(v.user_id) === String(user.id)) myDates.add(v.vote_date);
      }

      const totalCells = Math.ceil((startOff + lastDate) / 7) * 7;
      let cells = '';
      for (let i = 0; i < totalCells; i++) {
        const day = i - startOff + 1;
        if (day < 1 || day > lastDate) { cells += '<div class="mcal-cell mcal-empty"></div>'; continue; }
        const ds     = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const cnt    = cntByDate[ds] || 0;
        const past   = ds < todayStr;
        const tod    = ds === todayStr;
        const mine   = myDates.has(ds);
        const dow    = (startOff + day - 1) % 7;  // 0=월..4=금,5=토,6=일
        const clsList = ['mcal-cell',
          past ? 'is-past' : '', tod ? 'is-today' : '',
          mine ? 'is-mine' : '', dow === 5 ? 'is-sat' : '', dow === 6 ? 'is-sun' : ''
        ].filter(Boolean).join(' ');

        cells += `<div class="${clsList}" data-date="${ds}">
          <span class="mcal-day">${day}</span>
          ${cnt > 0 ? `<span class="mcal-cnt">${cnt}명</span>` : ''}
          ${mine ? `<span class="mcal-mine-dot"></span>` : ''}
        </div>`;
      }

      cal.innerHTML = `
        <div class="mcal-nav">
          <button class="mcal-nav-btn" id="calPrev" type="button">‹</button>
          <span class="mcal-title">${y}년 ${MONTH_NAMES[m]}</span>
          <button class="mcal-nav-btn" id="calNext" type="button">›</button>
        </div>
        <div class="mcal-header"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="is-sat">토</span><span class="is-sun">일</span></div>
        <div class="mcal-grid">${cells}</div>`;

      document.getElementById('calPrev').addEventListener('click', () => {
        calMonthDate = new Date(y, m - 1, 1); renderMonthCalendar();
      });
      document.getElementById('calNext').addEventListener('click', () => {
        calMonthDate = new Date(y, m + 1, 1); renderMonthCalendar();
      });
      cal.querySelectorAll('.mcal-cell[data-date]:not(.is-past)').forEach(cell => {
        cell.addEventListener('click', () => openDay(cell.dataset.date));
      });
    }

    // ── 주간 뷰 헬퍼 / 렌더러 (Phase 1+2) ────────────────────────
    function getWeekTitle(monday) {
      // 목요일 기준으로 해당 월·주차 결정 (월경계 주 처리)
      const thu = new Date(monday);
      thu.setDate(monday.getDate() + 3);
      const m = thu.getMonth() + 1;
      const weekNum = Math.ceil(thu.getDate() / 7);
      const ord = ['첫째','둘째','셋째','넷째','다섯째'];
      return `${m}월 ${ord[weekNum - 1] || weekNum + '번째'} 주`;
    }

    function renderWeekView(offset) {
      weekOffset = offset;
      const todayDow = TODAY.getDay();
      const daysToMon = todayDow === 0 ? -6 : 1 - todayDow;
      const monday = new Date(TODAY);
      monday.setDate(TODAY.getDate() + daysToMon + offset * 7);

      const _relLabel = offset === 0 ? '이번 주' : offset === -1 ? '지난 주' : offset === 1 ? '다음 주' : null;
      document.getElementById('weekTitle').textContent = getWeekTitle(monday) + (_relLabel ? ` (${_relLabel})` : '');

      const user = window.getKakaoUser?.();

      // 모임 등록 버튼: 로그인 시만 표시, 핸들러 매번 재연결
      const regRow = document.getElementById('schedRegisterRow');
      const regBtn = document.getElementById('btnScheduleRegister');
      if (regRow) regRow.style.display = user ? '' : 'none';
      if (regBtn) {
        regBtn.onclick = () => _openMultiSheet?.({ startStep: 1 });
      }

      const el   = document.getElementById('weekDayList');
      let html = '';

      for (let d = 0; d < 7; d++) {
        const date = new Date(monday);
        date.setDate(monday.getDate() + d);
        const ds  = toDateStr(date);
        const dow = date.getDay();
        const past = date < TODAY;
        const tod  = date.getTime() === TODAY.getTime();

        const dayVotes = allVotes.filter(v => v.vote_date === ds);
        const myVote   = dayVotes.find(v => user && String(v.user_id) === String(user.id));
        const cnt      = new Set(dayVotes.map(v => v.user_id)).size;

        const dowCls  = dow === 0 ? ' is-sun' : dow === 6 ? ' is-sat' : '';
        const pastCls = past ? ' is-past' : '';
        const todCls  = tod  ? ' is-today' : '';
        const todayBadge = tod ? '<span class="sdc-today-label">오늘</span>' : '';

        let headerBtns = '';
        if (user && !past && !myVote) {
          headerBtns = `<div class="sched-card-header-actions">
            <button class="sched-card-reg-hdr" type="button">+ 등록</button>
          </div>`;
        }

        html += `<div class="sched-wday-card${pastCls}${todCls}" data-date="${ds}">
          <div class="sched-wday-header" data-date="${ds}">
            <div class="sched-wday-left">
              <span class="sched-wday-dow${dowCls}">${DOW[dow]} ${date.getMonth()+1}/${date.getDate()}</span>
              ${todayBadge}
              <span class="sched-wday-count">👥 ${cnt}명</span>
            </div>
            ${headerBtns}
          </div>
          ${window.buildBarsInCard(dayVotes, allVoteGames, myVote)}
        </div>`;
      }
      el.innerHTML = html;

      // 헤더 클릭만 상세(등록) 화면 이동 — 바 영역 클릭은 이동 없음
      el.querySelectorAll('.sched-wday-header[data-date]').forEach(hdr => {
        hdr.addEventListener('click', () => openDay(hdr.dataset.date));
      });

      // 이름 클릭 → 해당 유저 모임 보드
      el.querySelectorAll('.sched-bar-name').forEach(n => {
        n.addEventListener('click', () => {
          window.CottageDB?.trackEvent('meeting_profile_click');
          window.openOtherMeetingSheet?.(n.dataset.uid);
        });
      });

      // 막대 클릭 → 일정 상세 모달 (통계 포함)
      el.querySelectorAll('.sched-bar-track[data-date]').forEach(track => {
        track.addEventListener('click', () => {
          window.CottageDB?.trackEvent('meeting_planner_bar_click');
          window.openDateScheduleModal?.(track.dataset.uid, track.dataset.date);
        });
      });

      // +N명 더보기 토글
      el.querySelectorAll('.sched-card-more-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const hiddenEl  = btn.previousElementSibling;
          const isExpanded = hiddenEl.style.display !== 'none';
          hiddenEl.style.display = isExpanded ? 'none' : '';
          const hiddenCnt = hiddenEl.querySelectorAll('.sched-bar-item').length;
          btn.textContent = isExpanded ? `+${hiddenCnt}명 더보기` : '접기 ▴';
        });
      });

      // 등록 버튼 (헤더 우상단, 미등록) → 바텀시트 열기
      el.querySelectorAll('.sched-card-reg-hdr').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          _openMultiSheet?.({ startStep: 2, dates: [btn.closest('.sched-wday-card').dataset.date] });
        });
      });

      // ✏ 수정 (내 막대 행) → 멀티스텝 시트 열기
      el.querySelectorAll('.sched-bar-edit-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          _openMultiSheet?.({ startStep: 2, dates: [btn.closest('.sched-wday-card').dataset.date] });
        });
      });

      // ✕ 참여 취소 (내 막대 행)
      el.querySelectorAll('.sched-bar-del-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          removeVoteForDate(btn.closest('.sched-wday-card').dataset.date);
        });
      });

    }

    // ── [DEV] 개발/검증용 더미 데이터 헬퍼 ──────────────────────
    // 실 DB 완전 무관 — allVotes 메모리에만 추가.
    // URL ?dev 파라미터가 없으면 절대 호출되지 않음.
    function _injectDevVotes(scenario) {
      const user   = window.getKakaoUser?.();
      const myId   = user ? String(user.id) : '__dev_me__';
      const myNick = user ? (user.nickname || '나') : '나';

      // 내일 날짜를 더미 대상 날짜로 사용
      const d = new Date(TODAY);
      d.setDate(TODAY.getDate() + 1);
      const tgt = toDateStr(d);

      const DUMMY = {

      currentDate = null;
      document.getElementById('viewDay').style.display = 'none';
      document.getElementById('viewWeek').style.display = '';
      renderWeekView(weekOffset);
    });

    document.getElementById('btnPrevWeek').addEventListener('click', () => renderWeekView(weekOffset - 1));
    document.getElementById('btnNextWeek').addEventListener('click', () => renderWeekView(weekOffset + 1));
    document.getElementById('btnToggleCal').addEventListener('click', () => {
      const cal = document.getElementById('viewCalendar');
      const btn = document.getElementById('btnToggleCal');
      const isOpen = cal.style.display !== 'none';
      cal.style.display = isOpen ? 'none' : '';
      btn.textContent = isOpen ? '달력 보기 ▾' : '달력 닫기 ▴';
      btn.classList.toggle('is-open', !isOpen);
      if (!isOpen) renderMonthCalendar();
    });

    window.addEventListener('cottage-auth-changed', () => {
      if (currentDate) renderDayDetail(currentDate);

    if (new URLSearchParams(location.search).get('embed') === 'true') {
