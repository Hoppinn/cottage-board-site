<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/images/main/favicon-square.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/images/main/favicon-square.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>모임 플래너 | 코티지보드 동호회</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
  <style>
    /* ── 4주 뷰 ─────────────────────────────────────── */
    .sched-week-section { margin-bottom: 22px; }
    .sched-week-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: .04em;
      margin-bottom: 8px;
    }
    .sched-week-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    @media (min-width: 520px) {
      .sched-week-row { grid-template-columns: repeat(4, 1fr); }
    }
    .sched-day-card {
      padding: 10px 10px 10px;
      border-radius: 10px;
      background: #faf8f5;
      cursor: pointer;
      min-height: 80px;
    }
    .sched-day-card:hover { background: #f0ebe0; }
    .sched-day-card.is-today { background: #f5ece0; outline: 2px solid var(--green); }
    .sched-day-card.is-past { opacity: 0.28; cursor: default; pointer-events: none; }
    .sched-day-card.is-empty { background: transparent; border: 1px dashed #e8e0d4; cursor: default; pointer-events: none; opacity: 0.35; }
    .sdc-header { display: flex; align-items: baseline; gap: 5px; margin-bottom: 5px; }
    .sdc-dow { font-size: 11px; color: var(--muted); font-weight: 600; line-height: 1; }
    .sdc-date { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1; }
    .sched-day-card.is-sat .sdc-dow,
    .sched-day-card.is-sat .sdc-date { color: #5080e0; }
    .sched-day-card.is-sun .sdc-dow,
    .sched-day-card.is-sun .sdc-date { color: #e05050; }
    .sdc-today-label { font-size: 9px; font-weight: 800; color: var(--green); background: #e6f4e8; border-radius: 4px; padding: 1px 5px; line-height: 1.5; }
    .sdc-count { font-size: 13px; font-weight: 800; color: var(--green); margin-bottom: 3px; }
    .sdc-time-row { font-size: 11px; color: var(--muted); line-height: 1.5; }
    .sdc-time-row strong { color: var(--text); font-weight: 700; }
    .sdc-names { font-size: 11px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sdc-no-overlap { color: #e05050 !important; }
    .sched-week-section.is-this-week {
      background: #faf5ec;
      border-radius: 10px;
      padding: 10px 10px 12px;
      margin: 0 -8px 20px;
    }

    /* ── 날짜 상세 요약 ──────────────────────────────── */
    .sched-summary-card {
      background: #f5ece0;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      display: flex;
      gap: 14px;
    }
    .sched-summary-item { flex: 1; text-align: center; }
    .sched-summary-lbl { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: .03em; margin-bottom: 3px; }
    .sched-summary-val { font-size: 14px; font-weight: 800; color: var(--text); line-height: 1.2; }
    .sched-summary-val.is-green { color: var(--green); }

    /* ── 시간대별 인원 ───────────────────────────────── */
    .sched-hrly-section { margin-bottom: 22px; }
    .sched-hrly-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }
    .sched-hrly-time { font-size: 11px; color: var(--muted); width: 64px; flex-shrink: 0; text-align: right; }
    .sched-hrly-bar-wrap { flex: 1; height: 16px; background: #ede8e0; border-radius: 4px; overflow: hidden; }
    .sched-hrly-bar { height: 100%; background: var(--green); border-radius: 4px; opacity: 0.55; transition: width 0.2s; }
    .sched-hrly-row.is-peak .sched-hrly-bar { opacity: 1; }
    .sched-hrly-row.is-peak .sched-hrly-time { color: var(--text); font-weight: 700; }
    .sched-hrly-count { font-size: 11px; font-weight: 700; color: var(--muted); width: 24px; flex-shrink: 0; }
    .sched-hrly-row.is-peak .sched-hrly-count { color: var(--green); }

    /* ── 날짜 상세 ────────────────────────────────── */
    .sched-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--green);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      margin-bottom: 10px;
    }
    .sched-day-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--text);
      margin: 0 0 18px;
    }

    /* 섹션 레이블 */
    .sched-section-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    /* 겹침 카드 */
    .sched-overlap-section { margin-bottom: 22px; }
    .sched-overlap-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 10px;
      background: #f5ece0;
      margin-bottom: 6px;
    }
    .sched-overlap-emoji { font-size: 20px; flex-shrink: 0; }
    .sched-overlap-info { flex: 1; min-width: 0; }
    .sched-overlap-time { font-size: 16px; font-weight: 700; color: var(--text); }
    .sched-overlap-who {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sched-overlap-count {
      font-size: 24px;
      font-weight: 800;
      color: var(--green);
      flex-shrink: 0;
    }
    .sched-overlap-count span { font-size: 13px; font-weight: 600; }

    .sched-no-votes {
      text-align: center;
      color: var(--muted);
      padding: 28px 0;
      font-size: 14px;
      line-height: 1.7;
    }

    /* 막대 그래프 */
    .sched-bar-section { margin-bottom: 22px; }
    .sched-bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      position: relative;
    }
    /* sched-bar-group 제거됨 — sched-bar-row에 margin-bottom 직접 적용 */
    /* sched-bar-axis·item·fill 등 공용 CSS → day-detail.js */

    /* 내 등록 */
    .sched-my-section {
      border-bottom: 1px solid #ede8e0;
      padding-bottom: 18px;
      margin-bottom: 18px;
    }
    .sched-my-status {
      font-size: 13px;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 8px;
    }
    .sched-register-btn {
      width: 100%;
      padding: 13px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .sched-register-btn:hover { opacity: 0.88; }
    .sched-login-hint {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      padding: 10px 0;
    }
    .sched-my-current {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f0ece0;
      border-radius: 10px;
      padding: 13px 14px;
      margin-bottom: 0;
    }
    .sched-my-time { font-size: 16px; font-weight: 700; color: var(--text); }
    .sched-my-actions { display: flex; gap: 8px; }
    .sched-action-btn {
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid;
    }
    .sched-action-btn--edit { border-color: var(--green); color: var(--green); background: white; }
    .sched-action-btn--del { border-color: #d0c8bc; color: var(--muted); background: white; }
    .sched-action-btn--del:hover { border-color: #e05050; color: #e05050; }

    /* 슬라이더 */
    .sched-slider-wrap { margin-bottom: 16px; }
    .sched-slider-times {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 14px;
    }
    .sched-slider-time-val { font-size: 26px; font-weight: 800; color: var(--green); }
    .sched-slider-sep { font-size: 16px; color: var(--muted); }

    .sched-dual-range {
      position: relative;
      height: 40px;
      margin: 0 4px;
    }
    .sched-range-track {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      left: 0; right: 0;
      height: 6px;
      background: #ddd8cc;
      border-radius: 3px;
    }
    .sched-range-fill {
      position: absolute;
      height: 100%;
      background: var(--green);
      border-radius: 3px;
    }
    input.sched-range-input {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 100%; margin: 0;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      pointer-events: none;
      height: 40px;
    }
    input.sched-range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--green);
      cursor: pointer;
      pointer-events: all;
      border: 3px solid white;
      box-shadow: 0 1px 5px rgba(0,0,0,0.28);
    }
    input.sched-range-input::-moz-range-thumb {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--green);
      cursor: pointer;
      pointer-events: all;
      border: 3px solid white;
      box-shadow: 0 1px 5px rgba(0,0,0,0.28);
    }
    .sched-range-axis {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 10px;
      color: var(--muted);
    }
    .sched-confirm-row { display: flex; gap: 8px; margin-top: 14px; }
    .sched-confirm-btn {
      flex: 1;
      padding: 12px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      background: var(--green);
      color: white;
    }
    .sched-discard-btn {
      padding: 12px 16px;
      border-radius: 9px;
      font-size: 14px;
      cursor: pointer;
      border: 1.5px solid #d0c8bc;
      background: white;
      color: var(--muted);
    }


    .sched-loading { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }

    /* ── 주간 뷰 (Phase 1) ──────────────────────────────────── */
    .sched-week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .sched-week-nav-btn {
      background: none;
      border: none;
      font-size: 13px;
      color: var(--green);
      font-weight: 600;
      cursor: pointer;
      padding: 4px 6px;
    }
    .sched-week-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
    }
    .sched-toggle-cal-btn {
      display: block;
      width: 100%;
      padding: 8px;
      background: none;
      border: 1px solid #e0d8cc;
      border-radius: 8px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      margin-bottom: 14px;
      text-align: center;
    }
    .sched-toggle-cal-btn:hover { background: #faf5ec; }
    .sched-toggle-cal-btn.is-open { color: var(--green); border-color: var(--green); }
    .sched-wday-card {
      padding: 12px 14px;
      border-radius: 10px;
      background: #faf8f5;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .sched-wday-card:hover { background: #f0ebe0; }
    .sched-wday-card.is-past { opacity: 0.3; cursor: default; pointer-events: none; }
    .sched-wday-card.is-today { background: #f5ece0; outline: 2px solid var(--green); }
    .sched-wday-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sched-wday-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .sched-wday-dow {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .sched-wday-dow.is-sat { color: #5080e0; }
    .sched-wday-dow.is-sun { color: #e05050; }
    .sched-wday-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--green);
    }
    /* Phase 2: 카드 내 시간 바 */
    .sched-wday-card { cursor: default; }
    .sched-wday-header { cursor: pointer; }
    /* sched-card-bars·sched-card-more-btn → day-detail.js */
    /* Phase 3: 카드 푸터 */
    /* 헤더 우상단 수정/⋯ */
    .sched-card-header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sched-card-reg-hdr {
      padding: 2px 8px;
      background: none;
      border: 1px solid #c8bfb0;
      border-radius: 6px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
    }
    .sched-card-reg-hdr:hover { border-color: var(--green); color: var(--green); }
    /* 월간 달력 */
    .mcal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0 10px;
    }
    .mcal-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .mcal-nav-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--muted);
      cursor: pointer;
      padding: 0 6px;
      line-height: 1;
    }
    .mcal-nav-btn:hover { color: var(--text); }
    .mcal-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      padding-bottom: 4px;
    }
    .mcal-header .is-sat { color: #5080e0; }
    .mcal-header .is-sun { color: #e05050; }
    .mcal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .mcal-cell {
      min-height: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 2px 2px;
      border-radius: 6px;
      cursor: pointer;
    }
    .mcal-empty { cursor: default; }
    .mcal-cell.is-past { opacity: .4; cursor: default; pointer-events: none; }
    .mcal-cell:not(.is-past):not(.mcal-empty):hover { background: #f0ebe0; }
    .mcal-cell.is-mine { background: #f5f0e8; }
    .mcal-day {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .mcal-cell.is-sat .mcal-day { color: #5080e0; }
    .mcal-cell.is-sun .mcal-day { color: #e05050; }
    .mcal-cell.is-today .mcal-day {
      background: var(--green);
      color: #fff;
    }
    .mcal-cnt {
      font-size: 10px;
      font-weight: 600;
      color: var(--green);
      margin-top: 2px;
    }
    .mcal-mine-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #c0843a;
      margin-top: 2px;
    }
    /* 시간 등록/수정 컴팩트 바텀시트 */
    .sched-sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.15);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      pointer-events: none;   /* dim만 표시, 배경 스크롤 통과 */
    }
    .sched-sheet {
      width: 100%;
      background: #fff;
      border-radius: 18px 18px 0 0;
      padding: 16px 16px 28px;
      box-shadow: 0 -4px 20px rgba(0,0,0,.12);
      pointer-events: auto;   /* 시트 본체만 인터랙션 */
    }
    .sched-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .sched-sheet-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    .sched-sheet-close-btn {
      background: none;
      border: none;
      font-size: 18px;
      color: var(--muted);
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .sched-sheet-time-display {
      text-align: center;
      margin-bottom: 12px;
    }
    .sched-sheet-time-display .sched-slider-time-val {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }
    .sched-sheet-time-display .sched-slider-sep {
      font-size: 18px;
      color: var(--muted);
      margin: 0 6px;
    }
    .sched-sheet-footer {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .sched-sheet-footer .sched-confirm-btn { flex: 1; }
    .sched-sheet-footer .sched-discard-btn { flex: 0 0 72px; }
    .sched-sheet-prevweek-row {
      text-align: right;
      margin-bottom: 2px;
    }
    .sched-sheet-prevweek-btn {
      background: none;
      border: none;
      padding: 0;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .sched-sheet-prevweek-btn:hover { color: var(--green); }

    /* ── 모임 등록 버튼 ──────────────────────────────── */
    .sched-register-row {
      display: flex; justify-content: flex-end;
      padding-bottom: 10px;
    }
    .sched-register-btn {
      padding: 7px 16px;
      border: 1.5px solid var(--green);
      border-radius: 20px;
      background: white; color: var(--green);
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .sched-register-btn:hover { background: var(--green); color: white; }

    /* ── 멀티스텝 바텀시트 (모임 등록) ───────────────── */
    .sched-multi-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 210;
      display: flex; align-items: flex-end;
    }
    .sched-multi-sheet {
      width: 100%; max-height: 72vh;
      background: #fff;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,.15);
      display: flex; flex-direction: column;
    }
    .sm-hdr {
      display: flex; align-items: center;
      padding: 10px 14px 10px;
      border-bottom: 1px solid #ede8de;
      flex-shrink: 0;
    }
    .sm-back-btn {
      background: none; border: none;
      font-size: 14px; color: var(--muted);
      cursor: pointer; padding: 4px 0;
      min-width: 52px; text-align: left;
    }
    .sm-close-btn {
      background: none; border: none;
      font-size: 18px; color: var(--muted);
      cursor: pointer; padding: 0 2px;
      margin-left: auto;
    }
    .sm-title {
      font-size: 16px; font-weight: 700;
      color: var(--text); flex: 1; text-align: center;
    }
    .sm-body { flex: 1; overflow-y: auto; padding: 12px 14px; }
    .sm-footer {
      padding: 10px 14px 18px;
      border-top: 1px solid #ede8de;
      flex-shrink: 0;
    }
    .sm-footer .sched-confirm-btn { width: 100%; }
    /* Step 1: 요일 선택 */
    .sm-hint { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
    .sm-day-chips {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    }
    .sm-day-chip {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 8px 2px; border: 1.5px solid #d0c8bc;
      border-radius: 10px; background: white; cursor: pointer;
      position: relative; gap: 2px;
      transition: border-color .15s, background .15s;
    }
    .sm-day-chip.is-sel { border-color: var(--green); background: #f0f7f0; }
    .sm-day-chip.is-past { opacity: .4; cursor: default; }
    .sm-day-chip.is-today .sm-dc-dow { color: var(--green); font-weight: 700; }
    .sm-dc-dow { font-size: 13px; font-weight: 600; color: var(--text); }
    .sm-dc-date { font-size: 10px; color: var(--muted); }
    .sm-dc-mine {
      position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
      width: 4px; height: 4px; border-radius: 50%; background: #c0843a;
    }
    /* Step 2/3: 요일 탭 */
    .sm-tabs {
      display: flex; gap: 6px; overflow-x: auto;
      margin-bottom: 16px; padding-bottom: 2px; scrollbar-width: none;
    }
    .sm-tabs::-webkit-scrollbar { display: none; }
    .sm-tab {
      padding: 6px 12px; border-radius: 20px;
      border: 1.5px solid #d0c8bc; background: white;
      cursor: pointer; font-size: 13px; color: var(--muted);
      white-space: nowrap; flex-shrink: 0;
      transition: border-color .15s, background .15s, color .15s;
    }
    .sm-tab.is-active { border-color: var(--green); background: var(--green); color: white; }
    /* Step 2 */
    .sm-prevweek-row { text-align: right; margin-bottom: 4px; }
    .sm-freqtime-row { text-align: right; margin-bottom: 4px; position: relative; }
    .sm-freqtime-btn {
      background: none; border: none;
      font-size: 12px; color: var(--muted);
      cursor: pointer; padding: 0;
      text-decoration: underline dotted;
      text-underline-offset: 2px;
    }
    .sm-freqtime-btn:hover { color: var(--green); }
    .sm-freqtime-menu {
      position: absolute; right: 0; top: calc(100% + 4px);
      background: #fff; border: 1px solid #ede8de;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
      z-index: 20; min-width: 120px;
      overflow: hidden;
    }
    .sm-freqtime-opt {
      display: block; width: 100%;
      background: none; border: none;
      padding: 9px 14px; text-align: left;
      font-size: 13px; cursor: pointer; color: var(--text);
    }
    .sm-freqtime-opt:hover { background: #f5efe6; }
    /* 게임 추가 섹션 (Step 2 하단) */
    .sm-game-toggle-wrap { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
    .sm-game-toggle {
      width: 100%; padding: 10px 14px;
      border: 1.5px dashed #c8c0b4; border-radius: 10px;
      background: #faf8f5; font-size: 13px; color: var(--muted);
      cursor: pointer; text-align: left; font-family: inherit;
      transition: border-color .15s, color .15s, background .15s;
    }
    .sm-game-toggle:hover { border-color: var(--green); color: var(--green); }
    .sm-game-toggle.is-open {
      border-color: var(--green); color: var(--green);
      background: #f0f7f0; border-style: solid;
    }
    .sm-game-section { padding: 10px 2px 2px; }
    .sm-games-wrap { display: flex; flex-direction: column; gap: 20px; }
    .sm-games-lbl { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
    .sm-game-item {
      display: flex; align-items: center;
      padding: 8px 10px; background: #f8f5f0;
      border-radius: 8px; margin-bottom: 6px;
    }
    .sm-game-name { flex: 1; font-size: 14px; color: var(--text); }
    .sm-game-del {
      background: none; border: none; font-size: 14px;
      color: var(--muted); cursor: pointer; padding: 0 0 0 8px;
      transition: color .15s;
    }
    .sm-game-del:hover { color: #d94f4f; }
    .sm-game-input-row { display: flex; gap: 8px; margin-top: 4px; }
    .sm-game-input {
      flex: 1; padding: 9px 12px;
      border: 1.5px solid #d0c8bc; border-radius: 8px;
      font-size: 14px; outline: none; font-family: inherit;
    }
    .sm-game-input:focus { border-color: var(--green); }
    .sm-game-add-btn {
      padding: 9px 14px; border: none; border-radius: 8px;
      background: var(--green); color: white;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    /* 피커 패널 */
    .sm-picker-panel {
      margin-top: 8px; padding: 10px;
      border: 1.5px solid #d0c8bc; border-radius: 10px;
      background: #faf8f5; max-height: 170px; overflow-y: auto;
    }
    .sm-picker-label {
      font-size: 11px; color: var(--muted);
      font-weight: 600; margin-bottom: 6px;
    }
    .sm-picker-item {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 7px 8px; border: none; background: none;
      cursor: pointer; font-size: 13px; text-align: left;
      border-radius: 6px; transition: background .1s; font-family: inherit;
    }
    .sm-picker-item:hover:not(:disabled) { background: #ede8de; }
    .sm-picker-item:disabled { opacity: .45; cursor: default; }
    .sm-picker-tag {
      font-size: 11px; color: var(--green);
      font-weight: 600; flex-shrink: 0; margin-left: 8px;
    }
    .sm-picker-item:disabled .sm-picker-tag { color: var(--muted); }
    .sm-picker-loading, .sm-picker-empty {
      text-align: center; font-size: 13px; color: var(--muted); padding: 8px 0;
    }

    /* 토스트 */
    .sched-toast {
      position: fixed;
      bottom: 260px;
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: rgba(0,0,0,.72);

      transition: opacity .2s, transform .2s;
