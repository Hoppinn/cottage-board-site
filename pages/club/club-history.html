<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/images/main/favicon-square.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/images/main/favicon-square.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>모임 기록 | 코티지보드</title>
  <meta name="description" content="코티지보드 동호회 모임 기록과 사진. 함께 플레이한 게임들의 기억을 남겨요.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="모임 기록 & 사진 | 코티지보드">
  <meta property="og:description" content="코티지보드 동호회 모임 기록과 사진. 함께 플레이한 게임들의 기억을 남겨요.">
  <meta property="og:image" content="https://cottageboard.com/assets/images/main/og-image-3.jpg">
  <meta property="og:url" content="https://cottageboard.com/pages/club/club-history.html">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
  <!-- history-* 전용 CSS는 style.css에 있음 -->
</head>

<body class="owned-page">
  <script src="../../assets/js/header.js" data-index="false"></script>

  <main>
    <section class="inner-page">
      <nav class="breadcrumb owned-page-breadcrumb"><a href="./club.html#club-meeting">동호회</a> <span class="bc-sep">›</span> 모임 기록 &amp; 사진</nav>
      <div class="page-mini-hero page-mini-hero--club page-mini-hero--sm">
        <h1>모임 기록 &amp; 사진</h1>
      </div>
      <div class="inner-page-body">
        <div id="historyRoot">
          <p class="history-loading">불러오는 중...</p>
        </div>
      </div>
    </section>
  </main>

  <!-- 게임 바텀시트 -->
  <div class="game-sheet" id="gameSheet">
    <div class="game-sheet-dim" id="closeGameSheetDim"></div>
    <div class="game-sheet-panel">
      <button aria-label="게임 정보 닫기" class="game-sheet-close" id="closeGameSheetButton" type="button">✕</button>
      <div class="game-sheet-scroll">
        <div id="gameSheetContent"></div>
      </div>
    </div>
  </div>

  <script src="../../game-system/config/bgg-label-map.js"></script>
  <script src="../../game-system/game-data/library/3-output/cottage-games-data-output.js"></script>
  <script src="../../assets/js/game-display-adapter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../../assets/js/supabase-config.js"></script>
  <script src="../../assets/js/supabase-client.js"></script>
  <script src="../../assets/js/play-records-utils.js"></script>
  <script src="../../assets/js/achievements.js"></script>
  <script src="../../assets/js/page-labels.js"></script>
  <script src="../../assets/js/script-nav.js"></script>
  <script src="../../assets/js/game-sheet.js"></script>
  <script src="../../assets/js/kakao-auth.js"></script>

  <script>
  (function () {
    function getGameName(gameId) {
      if (!window.COTTAGE_GAMES) return gameId;
      const g = window.COTTAGE_GAMES.find(g => String(g.bggId) === String(gameId) || g.id === gameId);
      return g ? (g.display || g.titleKo || g.titleEn || gameId) : gameId;
    }
    function getGameKey(gameId) {
      if (!gameId || !window.gameData) return null;
      if (window.gameData[gameId]) return gameId;
      const entry = Object.entries(window.gameData).find(([, g]) => String(g.bgg?.id) === String(gameId));
      return entry ? entry[0] : null;
    }
    function toKstDate(isoStr) {
      const d = new Date(new Date(isoStr).getTime() + 9 * 3600000);
      return d.toISOString().slice(0, 10);
    }
    function formatKstDate(dateStr) {
      const [y, m, d] = dateStr.split('-');
      return `${y}년 ${Number(m)}월 ${Number(d)}일`;
    }
    // 캡션 조립은 play-records-utils.js의 buildRecordCaption 하나뿐이다 —
    // 플레이기록 게시판과 양식이 갈리면 한쪽만 고쳐진다(2026-07-22 통합).
    function escH(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function escAttr(s) { return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }

    let allRecordsData = [], currentUser = null, playerNames = [];
    // 참여자 이름 → userId. game-reviews.js와 같은 규칙으로 만든다(회원 명부 ∪ 기록 작성자).
    // 명부만 쓰면 닉네임을 바꾼 회원의 옛 이름(player_names에 텍스트로 박혀 있음)이 안 잡히고,
    // 작성자만 쓰면 기록을 등록한 적 없는 회원이 조용히 클릭 불가가 된다.
    let nickUserMap = new Map();

    // ── buildBody: game-reviews.js buildSessionBody와 동일 구조, pr-* 클래스 사용 ──
    function buildBody(recs) {
      // 이 날 전체 캡션 — 행마다 다시 만들지 않고 한 번만 만들어 각 ⋯ 메뉴에 심는다
      const dayCaption = escAttr(window.buildRecordCaption?.(recs, getGameName) || '');
      const playerGroups = new Map();
      for (const r of recs) {
        const key = `${r.player_count||''}|${(r.player_names||'').split(',').map(n=>n.trim()).sort().join(',')}`;
        if (!playerGroups.has(key)) playerGroups.set(key, []);
        playerGroups.get(key).push(r);
      }
      let html = '';
      for (const [, grp] of playerGroups) {
        const f = grp[0];
        const countTag = f.player_count ? `<span class="pr-rec-tag pr-tag-count"><span class="pr-tag-icon">👥</span> ${f.player_count}명</span>` : '';
        const nameTags = f.player_names
          ? f.player_names.split(',').map((n, i) => { const t = n.trim(); return t ? `<span class="pr-rec-tag pr-tag-who${i===0?' pr-tag-who-first':''}" data-nick="${escAttr(t)}">${escH(t)}</span>` : ''; }).join('')
          : '';
        if (countTag || nameTags) html += `<div class="pr-player-header">${countTag}${nameTags}</div>`;
        html += grp.map(r => {
          const isMine = currentUser && String(r.user_id) === String(currentUser.id);
          const canEdit = isMine || window.isOwner?.();
          const name = getGameName(r.game_id);
          const gKey = getGameKey(r.game_id) || r.game_id;
          const thumbUrl = window.gameData?.[gKey]?.images?.thumbnail || '';
          const thumbHtml = thumbUrl ? `<img class="pr-rec-thumb${gKey ? ' pr-rec-thumb--link' : ''}" src="${escH(thumbUrl)}" alt="" loading="lazy" onerror="this.style.display='none'" ${gKey ? `onclick="event.stopPropagation();openGameSheet('${gKey.replace(/'/g,"\\'")}')"` : ''}>` : '';
          const photos = parsePhotoUrls(r.photo_url);
          const photoHtml = buildPhotoHtml(photos, r.id, false);
          const dlParts = [r.play_time_min ? `${r.play_time_min}분` : '', r.score_note ? (s => /\d$/.test(s) ? s.replace(/점$/, '') + '점' : s)(escH(r.score_note).trimEnd()) : ''].filter(Boolean);
          const dateline = dlParts.length ? `<span class="pr-rec-dateline">${dlParts.join(' · ')}</span>` : '';
          const reviewHtml = r.review_text ? `<p class="pr-rec-review">${escH(r.review_text)}</p>` : '';
          const editBtn = canEdit ? `<button class="pr-rec-edit" data-id="${r.id}" type="button">✏️ 수정</button>` : '';
          // 캡션 복사는 로그인·소유 여부를 안 본다 — 회원이 아니어도 필요하면 쓰라는 결정(2026-07-22).
          // 그래서 수정 권한이 없어도 ⋯ 메뉴 자체는 뜬다.
          const captionBtn = dayCaption ? `<button class="pr-rec-caption-action" data-caption="${dayCaption}" type="button">📋 이 날 캡션 복사</button>` : '';
          const moreMenu = (editBtn || captionBtn) ? `<div class="pr-rec-more"><button class="pr-rec-more-btn" type="button" title="더보기">···</button><div class="pr-rec-more-menu">${editBtn}${captionBtn}</div></div>` : '';
          const recJson = escAttr(JSON.stringify({gameId:r.game_id||'',names:r.player_names||'',count:r.player_count||'',time:r.play_time_min||'',score:r.score_note||'',review:r.review_text||'',group:r.group_name||'',date:r.played_at||'',photo:r.photo_url||'',mine:!!canEdit}));
          return `<div class="pr-rec-row pr-rec-row--game" data-id="${r.id}" data-record='${recJson}'>
            <div class="pr-rec-row-top">
              ${thumbHtml}
              <div class="pr-rec-main">
                <span class="pr-rec-game">${escH(name)}</span>
                <div class="pr-rec-meta">${dateline}</div>
                ${reviewHtml}
              </div>
              ${moreMenu ? `<div class="pr-rec-actions">${moreMenu}</div>` : ''}
            </div>
            ${photoHtml}
          </div>`;
        }).join('');
      }
      return html;
    }

    async function render() {
      const root = document.getElementById('historyRoot');
      currentUser = window.getKakaoUser?.() || null;
      if (!window.CottageDB) { root.innerHTML = '<p class="history-empty">데이터를 불러올 수 없습니다.</p>'; return; }

      if (currentUser) playerNames = await window.CottageDB.getPlayerNames?.() || [];

      const records = await window.CottageDB.getAllPlayRecordsForHistory();
      allRecordsData = records;

      const profiles = await window.CottageDB.getAllProfiles?.() || [];
      nickUserMap = new Map();
      for (const p of profiles) {
        if (p.user_id && p.nickname) nickUserMap.set(window.normalizeNick(p.nickname), String(p.user_id));
      }
      for (const r of records) {
        if (r.user_id && r.nickname) nickUserMap.set(window.normalizeNick(r.nickname), String(r.user_id));
      }

      const tipHtml = `<div class="history-tip">💡 <span><a href="../game/game-reviews.html?from=club-history" style="color:inherit;text-decoration:underline">플레이 기록</a> 시 <strong>"코티지보드 동호회"</strong>에 기록하면 동호회 게시판에도 함께 표시돼요</span></div>`;

      const clubRecords = records.filter(r => r.group_name === '코티지보드 동호회');
      if (!clubRecords.length) {
        root.innerHTML = tipHtml + '<p class="history-empty">아직 동호회 모임 기록이 없습니다.</p>';
        return;
      }

      const byDate = {};
      for (const r of clubRecords) {
        const d = r.played_at || toKstDate(r.created_at);
        if (!byDate[d]) byDate[d] = [];
        byDate[d].push(r);
      }

      const totalSessions = Object.keys(byDate).length;
      const totalGames = clubRecords.length;

      let html = tipHtml;
      html += `<div class="pr-session is-open" data-history-group="코티지보드 동호회">
        <button class="pr-session-hd" type="button">
          <span class="pr-session-date">코티지보드 동호회</span>
          <span class="pr-session-summary">${totalSessions}회 · ${totalGames}게임</span>
          <span class="pr-session-arrow">▾</span>
        </button>
        <div class="pr-session-body">`;

      for (const [dateStr, recs] of Object.entries(byDate).sort((a, b) => b[0].localeCompare(a[0]))) {
        // 캡션복사는 날짜 헤더에서 각 기록의 ⋯ 메뉴로 옮겼다(2026-07-22) —
        // 모든 날짜에 버튼이 깔려 목록이 시끄러웠고, 플레이기록 게시판과 자리도 달랐다
        html += `<div class="pr-sub-session">
          <div class="pr-sub-hd">
            <span class="pr-sub-date">${formatKstDate(dateStr)}</span>
            <span class="pr-sub-arrow">▾</span>
          </div>
          <div class="pr-sub-body">${buildBody(recs)}</div>
        </div>`;
      }

      html += `</div><a class="history-cross-link" href="../game/game-reviews.html?from=club-history">🎲 전체 플레이 기록 보기 →</a></div>`;
      root.innerHTML = html;
      attachHandlers(root);

      const groupParam = new URLSearchParams(location.search).get('group');
      if (groupParam) {
        const el = root.querySelector(`[data-history-group="${CSS.escape(groupParam)}"]`);
        if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 150);
      }
    }

    function attachHandlers(root) {
      root.querySelectorAll('.pr-session-hd').forEach(hd => {
        hd.addEventListener('click', () => hd.closest('.pr-session').classList.toggle('is-open'));
      });
      root.querySelectorAll('.pr-sub-hd').forEach(hd => {
        hd.addEventListener('click', () => hd.closest('.pr-sub-session').classList.toggle('is-open'));
      });
      root.querySelectorAll('.pr-rec-more-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const m = btn.closest('.pr-rec-more');
          const wasOpen = m.classList.contains('is-open');
          root.querySelectorAll('.pr-rec-more.is-open').forEach(x => {
            x.classList.remove('is-open');
            x.querySelector('.pr-rec-more-menu')?.removeAttribute('style');
          });
          window.untrackMoreMenu?.();
          if (!wasOpen) {
            m.classList.add('is-open');
            // 카드의 overflow:hidden에 잘리지 않도록 fixed로 띄우고 스크롤을 따라가게 한다(공용)
            window.trackMoreMenu?.(btn, m.querySelector('.pr-rec-more-menu'));
          }
        });
      });
      // 참여자 이름 클릭 → 그 회원의 읽기전용 내 보드
      // (Phase D 진입점 규칙: 모임 참여자 외 전부 openOtherProfileSheet — PROJECT_STRUCTURE §5)
      // 회원과 연결되지 않는 이름(비회원 손님 등)은 커서도 안 바뀌고 아무 일도 일어나지 않는다.
      root.querySelectorAll('.pr-tag-who[data-nick]').forEach(span => {
        const uid = nickUserMap.get(window.normalizeNick(span.dataset.nick));
        if (!uid) return;
        span.style.cursor = 'pointer';
        span.addEventListener('click', e => {
          e.stopPropagation();
          window.openOtherProfileSheet?.(uid);
        });
      });
      // ⋯ 메뉴 「이 날 캡션 복사」 — 메뉴를 닫지 않도록 전파를 멈춘다(복사됨! 표시를 봐야 한다)
      root.querySelectorAll('.pr-rec-caption-action').forEach(btn => {
        btn.addEventListener('click', e => { e.stopPropagation(); window.copyCaption?.(btn); });
      });
      root.querySelectorAll('.pr-rec-photo').forEach(img => {
        img.addEventListener('click', e => {
          e.stopPropagation();
          window.openRecordLightbox?.(img.closest('.pr-rec-photo-wrap'), img.closest('.pr-rec-row'), Number(img.dataset.idx || 0), { onAfterDelete: () => render() });
        });
      });
      root.querySelectorAll('.pr-rec-photo-more').forEach(el => {
        el.addEventListener('click', e => {
          e.stopPropagation();
          window.openRecordLightbox?.(el.closest('.pr-rec-photo-wrap'), el.closest('.pr-rec-row'), Number(el.dataset.idx || 3), { onAfterDelete: () => render() });
        });
      });
      root.querySelectorAll('.pr-rec-edit').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const item = btn.closest('.pr-rec-row');
          if (item.querySelector('.pr-inline-edit')) return;
          let rec = {};
          try { rec = JSON.parse(item.dataset.record || '{}'); } catch (_) {}
          openEditForm(item, rec);
        });
      });
    }

    function openEditForm(item, rec) {
      const currentGameDisplay = getGameName(rec.gameId || '');
      const form = document.createElement('div');
      form.className = 'pr-inline-edit';
      form.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font-size:12px;font-weight:700;color:var(--muted)">기록 수정</span>
          <button class="pr-inline-cancel" type="button">✕ 취소</button>
        </div>
        <label style="font-size:11px;font-weight:700;color:#c0392b">🎲 게임명 수정</label>
        <input class="pie-game" placeholder="게임명 검색" value="${escH(currentGameDisplay)}" autocomplete="off" style="border-color:#c0392b">
        <label style="font-size:11px;color:var(--muted)">참여자</label>
        <div class="tag-input-wrap pie-names-wrap">
          <div class="tag-chips"></div>
          <input type="text" class="tag-text-input" placeholder="이름 입력 후 엔터">
          <input type="hidden" class="pie-names">
        </div>
        <label style="font-size:11px;color:var(--muted)">인원수</label>
        <input class="pie-count" type="number" placeholder="명" value="${escH(String(rec.count||''))}">
        <label style="font-size:11px;color:var(--muted)">플레이 시간(분)</label>
        <input class="pie-time" type="number" placeholder="분" value="${escH(String(rec.time||''))}">
        <label style="font-size:11px;color:var(--muted)">점수·메모</label>
        <textarea class="pie-score" placeholder="예: 83 / 75점" rows="2">${escH(rec.score||'')}</textarea>
        <label style="font-size:11px;color:var(--muted)">날짜</label>
        <input aria-label="플레이 날짜" class="pie-date" type="date" value="${escH(rec.date||'')}">
        <label style="font-size:11px;color:var(--muted)">게임평</label>
        <textarea class="pie-review" placeholder="게임평">${escH(rec.review||'')}</textarea>
        <label style="font-size:11px;color:var(--muted)">사진</label>
        <div class="pie-cur-photos">
          ${parsePhotoUrls(rec.photo).map(u => `<div class="pie-existing-item" data-url="${escAttr(u)}"><img src="${escAttr(u)}" alt=""><button aria-label="사진 빼기" type="button" class="pie-existing-del">×</button></div>`).join('')}
        </div>
        <div class="pr-photo-grid pie-new-grid"></div>
        <label class="pr-photo-trigger">📷 사진 추가<input type="file" class="pie-photo-file" accept="image/*" multiple style="display:none"></label>
        <div class="pr-inline-edit-actions">
          <button class="pr-inline-save" type="button">저장</button>
        </div>`;
      item.appendChild(form);

      attachAc(form.querySelector('.pie-game'), () => (window.COTTAGE_GAMES || []).map(g => g.display).filter(Boolean));
      initTagInput(form.querySelector('.pie-names-wrap'), form.querySelector('.pie-names'), rec.names || '');
      attachAc(
        form.querySelector('.pie-names-wrap .tag-text-input'),
        () => {
          const added = [...form.querySelectorAll('.pie-names-wrap .tag-chip')].map(c => c.dataset.val.trim().toLowerCase());
          return playerNames.filter(s => !s.split(',').map(n => n.trim().toLowerCase()).some(n => n && added.includes(n)));
        },
        s => {
          const ti = form.querySelector('.pie-names-wrap .tag-text-input');
          s.split(',').forEach(name => { name = name.trim(); if (!name) return; ti.value = name; ti.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true })); });
        },
        form.querySelector('.pie-names-wrap')
      );
      form.querySelectorAll('.pie-existing-del').forEach(d => d.addEventListener('click', () => d.closest('.pie-existing-item').remove()));

      const piePhotoFile = form.querySelector('.pie-photo-file');
      const pieNewFiles = [];
      const addPieNewItem = buildPhotoItemAdder(form.querySelector('.pie-new-grid'), pieNewFiles);
      if (piePhotoFile) piePhotoFile.addEventListener('change', async () => { for (const f of Array.from(piePhotoFile.files)) await addPieNewItem(f); piePhotoFile.value = ''; });

      form.querySelector('.pr-inline-cancel').addEventListener('click', () => form.remove());
      form.querySelector('.pr-inline-save').addEventListener('click', async () => {
        const saveBtn = form.querySelector('.pr-inline-save');
        saveBtn.disabled = true;
        const gameDisplayInput = form.querySelector('.pie-game').value.trim();
        let newGameId = null;
        if (gameDisplayInput) {
          const found = (window.COTTAGE_GAMES || []).find(g => g.display === gameDisplayInput);
          newGameId = found ? found.id : gameDisplayInput;
        }
        const remainingUrls = [...form.querySelectorAll('.pie-existing-item')].map(el => el.dataset.url).filter(Boolean);
        const uploadedUrls = [];
        let uploadErr = false;
        for (const pf of pieNewFiles) {
          const url = await window.CottageDB.uploadPlayPhoto(pf, currentUser.id);
          if (url) uploadedUrls.push(url); else uploadErr = true;
        }
        if (uploadErr) { saveBtn.disabled = false; alert('사진 업로드에 실패했습니다.'); return; }
        const allPhotoUrls = [...remainingUrls, ...uploadedUrls];
        const photoUrlUpd = allPhotoUrls.length === 1 ? allPhotoUrls[0] : allPhotoUrls.length > 1 ? JSON.stringify(allPhotoUrls) : null;
        const rawScore = form.querySelector('.pie-score').value.trim();
        const updFields = {
          player_names: form.querySelector('.pie-names').value.trim() || null,
          player_count: parseInt(form.querySelector('.pie-count').value) || null,
          play_time_min: parseInt(form.querySelector('.pie-time').value) || null,
          score_note: rawScore.split(/\n+/).map(s => s.trim()).filter(Boolean).join(' / ') || null,
          played_at: form.querySelector('.pie-date').value || null,
          review_text: form.querySelector('.pie-review').value.trim() || null,
          ...(newGameId ? { game_id: newGameId } : {}),
          photo_url: photoUrlUpd,
        };
        const res = await window.CottageDB?.updateGamePlay(item.dataset.id, updFields);
        if (!res?.error) {
          const idx = allRecordsData.findIndex(r => String(r.id) === String(item.dataset.id));
          if (idx !== -1) Object.assign(allRecordsData[idx], updFields);
          form.remove();
          render();
        } else { saveBtn.disabled = false; alert('수정에 실패했습니다.'); }
      });
    }

    // 더보기 메뉴 외부 클릭 시 닫기
    document.addEventListener('click', e => {
      document.querySelectorAll('.pr-rec-more.is-open').forEach(m => {
        // fixed로 띄운 메뉴는 .pr-rec-more 안에 그려지지만 화면상으론 떨어져 있다 —
        // contains로만 판정하면 메뉴 안 버튼 클릭도 「밖」으로 오인하지 않도록 메뉴도 함께 본다
        if (m.contains(e.target)) return;
        m.classList.remove('is-open');
        m.querySelector('.pr-rec-more-menu')?.removeAttribute('style');
        window.untrackMoreMenu?.();
      });
    });

    window.addEventListener('cottage-auth-changed', () => render());
    document.addEventListener('DOMContentLoaded', () => { window.renderCrossBackLink?.(); render(); });
  })();
  </script>
