<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모임 일정 미리보기</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #7a4828;
      --text: #3b2f2f;
      --muted: #9e8e7e;
      --paper: #fffaf0;
      --bg: #f5f0e8;
    }

    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px 16px 60px;
      max-width: 640px;
      margin: 0 auto;
    }

    h1 {
      font-size: 18px; font-weight: 800;
      color: var(--green);
      margin-bottom: 4px;
    }

    .meta {
      font-size: 12px; color: var(--muted);
      margin-bottom: 20px;
    }

    /* 요약 박스 */
    .summary-box {
      background: var(--paper);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 24px;
      border: 1px solid #e8e0d4;
    }
    .summary-box h2 {
      font-size: 13px; font-weight: 700;
      color: var(--green);
      margin-bottom: 10px;
    }
    .summary-row {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .summary-chip {
      font-size: 11px;
      background: #f0ece6;
      border-radius: 20px;
      padding: 3px 10px;
      color: var(--text);
    }
    .summary-chip.highlight {
      background: #e8f2e8;
      color: var(--green);
      font-weight: 600;
    }
    .summary-game-line {
      font-size: 12px; color: var(--text);
      margin-bottom: 3px;
    }
    .summary-game-line .cnt {
      font-weight: 700; color: var(--green);
    }

    /* 날짜 섹션 */
    .date-section {
      background: var(--paper);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #e8e0d4;
    }
    .date-section.is-past {
      opacity: 0.55;
    }
    .date-title {
      font-size: 14px; font-weight: 700;
      color: var(--green);
      margin-bottom: 12px;
      display: flex; align-items: center; gap: 6px;
    }
    .date-title .past-badge {
      font-size: 10px; font-weight: 500;
      background: #e8e0d4; color: var(--muted);
      border-radius: 8px; padding: 1px 7px;
    }

    /* 게임 목록 */
    .game-list-wrap {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #e8e0d4;
      display: flex; flex-direction: column; gap: 6px;
    }
    .user-games {
      display: flex; align-items: flex-start; gap: 6px; flex-wrap: wrap;
    }
    .user-nick {
      font-size: 11px; font-weight: 600;
      color: var(--green);
      min-width: 36px;
      padding-top: 2px;
    }
    .game-tag {
      font-size: 11px;
      border-radius: 8px;
      padding: 2px 8px;
    }
    .game-tag.want  { background: #eef4ff; color: #4060b0; }
    .game-tag.learn { background: #fff3e8; color: #b06020; }

    .no-games { font-size: 11px; color: var(--muted); font-style: italic; }

    /* 날짜 없는 빈 상태 */
    .empty { text-align: center; padding: 40px 0; color: var(--muted); font-size: 14px; }

    /* 범위 컨트롤 */
    .ctrl {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 20px;
    }
    .ctrl label { font-size: 12px; color: var(--muted); }
    .ctrl select {
      font-size: 12px;
      border: 1px solid #d0c8bc;
      border-radius: 8px;
      padding: 4px 8px;
      background: var(--paper);
      color: var(--text);
    }
    .ctrl button {
      font-size: 12px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 5px 12px;
      cursor: pointer;
    }

    #loading { text-align: center; padding: 40px 0; color: var(--muted); }
  </style>
</head>
<body>

<h1>📅 모임 일정 미리보기</h1>
<p class="meta" id="meta"></p>

<div class="ctrl">
  <label>조회 범위</label>
  <select id="rangeSelect">
    <option value="30">최근 30일 ~ 4주 뒤</option>
    <option value="60" selected>최근 60일 ~ 8주 뒤</option>
    <option value="90">최근 90일 ~ 12주 뒤</option>
    <option value="all">전체 (느림)</option>
  </select>
  <button id="reloadBtn">다시 불러오기</button>
</div>
<div class="ctrl" style="margin-top:-12px">
  <label>더미 추가</label>
  <button onclick="location.search='?dev=3'">+3명</button>
  <button onclick="location.search='?dev=5'">+5명</button>
  <button onclick="location.search='?dev=8'">+8명</button>
  <button onclick="location.search=''">실 데이터만</button>
</div>

<div id="loading">불러오는 중…</div>
<div id="output" style="display:none"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../../assets/js/supabase-config.js"></script>
<script src="../../assets/js/supabase-client.js"></script>
<script src="../../game-system/config/bgg-label-map.js"></script>
<script src="../../game-system/game-data/library/3-output/cottage-games-data-output.js"></script>
<script src="../../assets/js/game-display-adapter.js"></script>
<script src="../../assets/js/day-detail.js"></script>
<script>
(async function main() {
  const DOW    = ['일','월','화','수','목','금','토'];
  const today  = new Date();
  const todayStr = today.toISOString().slice(0, 10);

  function fmt(d) { return d.toISOString().slice(0, 10); }

  function resolveGameName(g) {
    if (g.custom_name) return g.custom_name;
    if (window.COTTAGE_GAMES) {
      const f = window.COTTAGE_GAMES.find(c => c.bggId === String(g.game_id));
      if (f) return f.display || f.name || `#${g.game_id}`;
    }
    return g.game_id ? `#${g.game_id}` : '(알 수 없음)';
  }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function load() {
    document.getElementById('loading').style.display = '';
    document.getElementById('output').style.display  = 'none';

    const range = document.getElementById('rangeSelect').value;
    const past  = range === 'all' ? 365 : parseInt(range);
    const future = range === 'all' ? 365 : parseInt(range) * 2;

    const start = new Date(today); start.setDate(today.getDate() - past);
    const end   = new Date(today); end.setDate(today.getDate() + future);

    document.getElementById('meta').textContent =
      `${fmt(start)} ~ ${fmt(end)} 기준`;

    let [votes, voteGames] = await Promise.all([
      window.CottageDB?.getMeetingVotes(fmt(start), fmt(end)) ?? [],
      window.CottageDB?.getMeetingVoteGames(fmt(start), fmt(end)) ?? [],
    ]);

    // ?dev=3/5/8 — 메모리 전용 더미 주입 (DB 무관)
    const devN = parseInt(new URLSearchParams(location.search).get('dev') || '0');
    if (devN >= 2) {
      const tgt = fmt(new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1));
      const NAMES = ['서연','지호','유나','현우','채원','도현','수아','민재'];
      const TIMES = [[10,15],[9,12],[12,17],[14,19],[16,21],[18,23],[9,23],[11,16]];
      const WANT  = ['아르낙','윙스팬','에버델','원더랜드 워','글룸헤이븐','브라스','파운더스','테라포밍'];
      const LEARN = ['글룸헤이븐','루트','추산도','퀄라나리','팬데믹','윙스팬','아크노바'];
      for (let i = 0; i < Math.min(devN - 1, NAMES.length); i++) {
        const uid = `dev_u${i+2}`;
        votes = [...votes, { vote_date: tgt, user_id: uid, nickname: NAMES[i], time_start: TIMES[i][0], time_end: TIMES[i][1] }];
        if (WANT[i])  voteGames = [...voteGames, { vote_date: tgt, user_id: uid, list_type: 'want',  game_id: null, custom_name: WANT[i] }];
        if (LEARN[i]) voteGames = [...voteGames, { vote_date: tgt, user_id: uid, list_type: 'learn', game_id: null, custom_name: LEARN[i] }];
        if (WANT[i+1]) voteGames = [...voteGames, { vote_date: tgt, user_id: uid, list_type: 'want', game_id: null, custom_name: WANT[i+1] }];
      }
      document.getElementById('meta').textContent += `  ⚠️ DEV 모드: ${devN}명 더미 추가됨 (내일 날짜)`;
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('output').style.display  = '';

    if (!votes.length) {
      document.getElementById('output').innerHTML =
        '<div class="empty">등록된 일정이 없습니다.</div>';
      return;
    }

    /* ── 요약 ── */
    const allUsers = [...new Map(votes.map(v => [String(v.user_id), v])).values()];

    // 게임별 집계 (want)
    const wantCount = {};
    voteGames.filter(g => g.list_type === 'want').forEach(g => {
      const name = resolveGameName(g);
      wantCount[name] = (wantCount[name] || 0) + 1;
    });
    const learnCount = {};
    voteGames.filter(g => g.list_type === 'learn').forEach(g => {
      const name = resolveGameName(g);
      learnCount[name] = (learnCount[name] || 0) + 1;
    });

    const topWant  = Object.entries(wantCount).sort((a,b) => b[1]-a[1]).slice(0, 8);
    const topLearn = Object.entries(learnCount).sort((a,b) => b[1]-a[1]).slice(0, 8);

    let summaryHtml = `<div class="summary-box">
      <h2>전체 요약</h2>
      <div class="summary-row">
        <span class="summary-chip highlight">👥 참여자 ${allUsers.length}명</span>
        ${allUsers.map(v => `<span class="summary-chip">${esc(v.nickname)}</span>`).join('')}
      </div>
      ${topWant.length ? `
        <p style="font-size:11px;color:var(--muted);margin:8px 0 4px">🎲 하고 싶은 게임 (전체 기간)</p>
        ${topWant.map(([name, cnt]) =>
          `<div class="summary-game-line"><span class="cnt">${cnt}명</span> ${esc(name)}</div>`
        ).join('')}` : ''}
      ${topLearn.length ? `
        <p style="font-size:11px;color:var(--muted);margin:8px 0 4px">📖 배우고 싶은 게임 (전체 기간)</p>
        ${topLearn.map(([name, cnt]) =>
          `<div class="summary-game-line"><span class="cnt">${cnt}명</span> ${esc(name)}</div>`
        ).join('')}` : ''}
    </div>`;

    /* ── 날짜별 ── */
    const byDate = {};
    votes.forEach(v => {
      if (!byDate[v.vote_date]) byDate[v.vote_date] = [];
      byDate[v.vote_date].push(v);
    });

    let sectionsHtml = '';
    for (const [date, dayVotes] of Object.entries(byDate).sort()) {
      const d      = new Date(date + 'T00:00:00');
      const isPast = date < todayStr;
      const dayGames = voteGames.filter(g => g.vote_date === date);
      const uniqueUsers = [...new Map(dayVotes.map(v => [String(v.user_id), v])).values()];

      // 참여자별 게임
      const userGamesHtml = uniqueUsers.map(v => {
        const myGames = dayGames.filter(g => String(g.user_id) === String(v.user_id));
        const want    = myGames.filter(g => g.list_type === 'want');
        const learn   = myGames.filter(g => g.list_type === 'learn');
        if (!want.length && !learn.length) return '';
        return `<div class="user-games">
          <span class="user-nick">${esc(v.nickname)}</span>
          ${want.length  ? `<span class="game-tag want">🎲 ${want.map(g => esc(resolveGameName(g))).join(' · ')}</span>`  : ''}
          ${learn.length ? `<span class="game-tag learn">📖 ${learn.map(g => esc(resolveGameName(g))).join(' · ')}</span>` : ''}
        </div>`;
      }).join('');

      const hasGames = uniqueUsers.some(v =>
        dayGames.some(g => String(g.user_id) === String(v.user_id))
      );

      sectionsHtml += `<section class="date-section${isPast ? ' is-past' : ''}">
        <h2 class="date-title">
          ${date} (${DOW[d.getDay()]}) · ${uniqueUsers.length}명
          ${isPast ? '<span class="past-badge">지남</span>' : ''}
        </h2>
        ${window.buildBarsInCard(dayVotes, dayGames, null)}
        ${hasGames ? `<div class="game-list-wrap">${userGamesHtml || '<span class="no-games">게임 선택 없음</span>'}</div>` : ''}
      </section>`;
    }

    document.getElementById('output').innerHTML = summaryHtml + sectionsHtml;

    // 더보기 버튼 이벤트
    document.querySelectorAll('.sched-card-more-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const hiddenEl   = btn.previousElementSibling;
        const isExpanded = hiddenEl.style.display !== 'none';
        hiddenEl.style.display = isExpanded ? 'none' : '';
        const cnt = hiddenEl.querySelectorAll('.sched-bar-item').length;
        btn.textContent = isExpanded ? `+${cnt}명 더보기` : '접기 ▴';
      });
    });
  }

  document.getElementById('reloadBtn').addEventListener('click', load);
  await load();
})();
</script>
</body>
</html>
