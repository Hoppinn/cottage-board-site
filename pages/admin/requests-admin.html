<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/images/main/favicon-square.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/images/main/favicon-square.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>관리자 페이지 | 코티지보드</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    /* 최상위 그룹 */
    .admin-group { margin-bottom: 32px; scroll-margin-top: calc(var(--header-total-h) + 8px); }
    .admin-group + .admin-group { margin-top: 8px; }
    .admin-group .admin-section-title { border-bottom: none; }
    .admin-group-title { font-size: 16px; font-weight: 700; color: #2c3e50; padding: 10px 2px; border-bottom: 3px solid #2c3e50; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; background: var(--bg); }
    .admin-group-title:hover { color: var(--green); border-bottom-color: var(--green); }
    .admin-group-arrow { font-size: 13px; color: var(--muted); transition: transform 0.2s; }
    .admin-group.is-open .admin-group-arrow { transform: rotate(180deg); }
    .admin-group-body { display: none; }
    .admin-group.is-open .admin-group-body { display: block; }
    /* 🚫 overflow:hidden 금지 — 이 안에서 열리는 상태 설정 드롭다운(.req-status-picker)이
       섹션 경계에서 잘린다(2026-07-27 실측, play-records .pr-session과 동일 패턴, DESIGN_RULES 6-a).
       원래는 title의 각진 배경을 섹션 반경에 맞추려고 걸었던 것이라, 그 일은 title이 직접 한다. */
    .admin-section { margin-bottom: 16px; border: 1px solid var(--border); border-radius: 12px; }
    .admin-section > .admin-section-title { border-radius: 11px 11px 0 0; }
    /* 접히면 title이 곧 섹션이다 — 네 모서리 전부 */
    .admin-section:not(.is-open) > .admin-section-title { border-radius: 11px; }
    .admin-section-title { font-size: 15px; font-weight: 700; color: var(--green); padding: 12px 16px; border-bottom: 2px solid var(--green); cursor: pointer; display: flex; align-items: center; justify-content: space-between; user-select: none; margin: 0; background: var(--bg); }
    .admin-section-title:hover { background: #ede8df; }
    .admin-section-count { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--card-bg,#fff); border-radius: 20px; padding: 1px 8px; margin-left: 6px; }
    .admin-section-arrow { font-size: 13px; color: var(--muted); transition: transform 0.2s; margin-left: auto; }
    .admin-section.is-open .admin-section-arrow { transform: rotate(180deg); }
    .admin-section-body { display: none; padding: 12px; }
    .admin-section.is-open .admin-section-body { display: block; }
    .admin-req-list { display: flex; flex-direction: column; gap: 8px; }
    .admin-req-item { background: var(--card-bg, #fff); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .admin-req-name { font-size: 14px; font-weight: 700; white-space: nowrap; min-width: 0; }
    /* 회원 카드 전용 */
    .admin-member-card { background: var(--card-bg,#fff); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; }
    .admin-member-card.is-banned { border-color: #f5c6c6; background: #fff8f8; }
    .admin-member-name { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
    .admin-member-metas { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .admin-member-metas span { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .admin-ban-btn { font-size: 11px; border: none; border-radius: 5px; padding: 3px 9px; cursor: pointer; margin-left: auto; }
    .admin-ban-btn.ban { background: #fce8e0; color: #9e3a2a; }
    .admin-ban-btn.unban { background: #e8f5e9; color: #2e7d32; }
    .admin-banned-badge { font-size: 11px; color: #9e3a2a; background: #fce8e0; border-radius: 4px; padding: 2px 7px; }
    .admin-req-content { font-size: 13px; flex: 1; line-height: 1.5; white-space: pre-wrap; color: var(--text); }
    .admin-req-meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .admin-req-requester { font-size: 11px; color: var(--muted); background: var(--bg); border-radius: 4px; padding: 2px 7px; white-space: nowrap; }
    .admin-req-voters { font-size: 11px; color: var(--muted); background: var(--bg); border-radius: 4px; padding: 2px 7px; flex: 1; }
    .admin-req-plan, .admin-suggest-plan { background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 6px; color: #2e7d32; cursor: pointer; font-size: 12px; padding: 4px 10px; white-space: nowrap; }
    .admin-req-plan.is-planned, .admin-suggest-plan.is-planned { background: #2e7d32; color: #fff; border-color: #2e7d32; }
    .admin-req-plan:hover, .admin-suggest-plan:hover { opacity: 0.85; }
    .admin-req-done, .admin-suggest-done { background: var(--green); border: none; border-radius: 6px; color: #fff; cursor: pointer; font-size: 12px; padding: 4px 10px; white-space: nowrap; }
    .admin-req-done.is-done, .admin-suggest-done.is-done { background: #888; }
    .admin-req-done:hover, .admin-suggest-done:hover { opacity: 0.85; }
    .admin-req-content--done { text-decoration: line-through; opacity: 0.5; }
    .admin-req-del { background: none; border: 1px solid #e0d5c5; border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 12px; padding: 4px 10px; white-space: nowrap; }
    .admin-req-del:hover { border-color: #c0392b; color: #c0392b; }
    .admin-req-item.is-done { opacity: 0.45; }
    .admin-req-item.is-done .admin-req-name { text-decoration: line-through; }
    .admin-gate { text-align: center; padding: 60px 20px; color: var(--muted); }
    .admin-empty { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 0; }
    .admin-back { display: inline-block; font-size: 13px; color: rgba(255,255,255,0.85); font-weight: 600; margin-bottom: 4px; text-decoration: underline; text-underline-offset: 2px; }
    .admin-back:hover { color: #fff; opacity: 1; }
    .admin-real-name { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 2px; }
    .admin-realname-edit { background: none; border: none; font-size: 11px; color: #bbb; cursor: pointer; padding: 0 2px; vertical-align: middle; }
    .admin-realname-edit:hover { color: var(--green); }
    .admin-analytics-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
    .admin-analytics-table th { background: var(--bg); padding: 7px 10px; text-align: left; font-size: 11px; color: var(--muted); border-bottom: 2px solid var(--border); white-space: nowrap; }
    .admin-analytics-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .admin-analytics-table tr:last-child td { border-bottom: none; }
    .admin-analytics-table tr:hover td { background: var(--bg); }
    .anat-page { font-weight: 600; color: var(--green); }
    /* 방문자 카드 안 "페이지 N개" 펼침 */
    .admin-visitor-pages-btn { font-size: 11px; font-weight: 600; border: 1px solid var(--border); border-radius: 5px; padding: 3px 8px; background: var(--card-bg,#fff); color: var(--muted); cursor: pointer; }
    .admin-visitor-pages-btn:hover { background: var(--bg); }
    .admin-visitor-pages { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 4px; overflow-x: auto; }
    .admin-visitor-pages[hidden] { display: none; }
    /* 펼침 표 안의 기간 선택 — 목록 위 필터/정렬 칩과 같은 시각 언어(알약+초록 활성)를 쓰되
       카드 안에 들어가므로 한 치수 작다. 좁은 화면에서 줄바꿈되도록 wrap. */
    .admin-vp-periods { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 2px 6px; }
    .admin-vp-period-btn { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 20px;
      border: 1px solid var(--border); background: var(--card-bg,#fff); color: var(--muted); cursor: pointer; }
    .admin-vp-period-btn.is-active { background: var(--green); color: #fff; border-color: var(--green); }
    .admin-vp-empty { font-size: 11px; color: var(--muted); font-weight: 600; padding: 8px 2px; }
    /* 특정 날짜 선택 — ◀ [달력 점프] ▶. 주력은 점프고 화살표는 하루씩 보조다(이 사이트는
       회원이 띄엄띄엄 와서 옆날이 대부분 비어 있다 — 실측). chartDateNav의 숨은 date input
       패턴을 그대로 재사용한다. */
    .admin-vp-datenav { display: flex; align-items: center; gap: 4px; padding: 0 2px 6px; position: relative; }
    .admin-vp-date-arrow { font-size: 11px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--card-bg,#fff); color: var(--muted); cursor: pointer; }
    .admin-vp-date-arrow:disabled { opacity: .35; cursor: default; }
    .admin-vp-date-label { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 6px;
      border: 1px dashed var(--border); background: var(--card-bg,#fff); color: var(--muted); cursor: pointer; min-width: 62px; }
    .admin-vp-date-label.is-active { border-style: solid; background: var(--green); color: #fff; border-color: var(--green); }
    .admin-vp-date-input { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }
    .anat-ref { color: var(--muted); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 드릴다운(원칙 ⑤) — 숫자 → 「이걸 한 사람들」. 이벤트 탭·페이지 탭이 같은 스타일을 쓴다 */
    .admin-dd-btn { font-size: 11px; font-weight: 700; border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; background: var(--card-bg,#fff); color: var(--muted); cursor: pointer; white-space: nowrap; }
    .admin-dd-btn:hover { background: var(--bg); color: var(--text); }
    .admin-dd-btn.is-open { color: var(--green); border-color: var(--green); }
    /* 패널이 「바로 위 줄에 속한다」는 걸 왼쪽 선으로 묶어준다 — 형제 줄이 위아래로 이어지는
       자리(이벤트 축 카드)에서 어느 줄의 명단인지가 여백만으로는 안 읽힌다 */
    .admin-dd-panel { margin: 4px 0 8px 10px; border-left: 2px solid var(--border); padding: 3px 0 3px 10px; }
    .admin-dd-panel[hidden] { display: none; }
    .admin-dd-note { font-size: 10px; color: var(--muted); font-weight: 600; padding: 1px 2px 4px; line-height: 1.4; }
    /* 원칙 ① — 이 탭의 숫자가 「어느 기간」인지 화면에 적는다. 회원 탭만 날짜 네비가
       숨겨져 있어(usesDateFilter 제외) 다른 탭에서 고른 기간이 여기에도 걸린 줄 오해할 수 있다. */
    .admin-scope-note { font-size: 11px; color: var(--muted); font-weight: 600; line-height: 1.4;
      padding: 6px 9px; margin: 0 0 8px; border-radius: 6px; background: var(--surface-2, rgba(0,0,0,.04));
      border-left: 3px solid var(--border); }
    .admin-dd-row { display: flex; align-items: baseline; gap: 6px; font-size: 11px; padding: 2px 2px; border-bottom: 1px solid var(--border); }
    .admin-dd-row:last-child { border-bottom: none; }
    .admin-dd-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: var(--text); }
    .admin-dd-row.is-anon .admin-dd-name { font-weight: 500; color: var(--muted); }
    .admin-dd-meta { flex-shrink: 0; font-size: 10px; color: var(--muted); font-weight: 600; }
    /* 분석 기간 섹션 */
    .admin-period-section { margin-bottom: 12px; }
    .admin-period-title { font-size: 13px; font-weight: 800; color: var(--text); padding: 8px 4px; border-bottom: 2px solid var(--border); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .admin-period-arrow { font-size: 12px; color: var(--muted); transition: transform 0.2s; margin-left: auto; }
    .admin-period-section.is-open .admin-period-arrow { transform: rotate(180deg); }
    .admin-period-body { display: none; }
    .admin-period-section.is-open .admin-period-body { display: block; }
    /* 접속 상태 배지 */
    .admin-online-status { display: inline-block; font-size: 11px; color: var(--muted); margin-left: 6px; white-space: nowrap; }
    .admin-online-status.is-online { color: #3d8a3d; font-weight: 600; }
    /* 분석 서브 섹션 */
    .admin-sub-section { margin: 6px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .admin-sub-section-title { font-size: 12px; font-weight: 700; color: var(--text); padding: 8px 12px; background: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: space-between; user-select: none; }
    .admin-sub-section-title:hover { background: #ede8df; }
    .admin-sub-section-arrow { font-size: 11px; color: var(--muted); transition: transform 0.2s; }
    .admin-sub-section.is-open > .admin-sub-section-title .admin-sub-section-arrow { transform: rotate(180deg); }
    .admin-sub-section-body { display: none; padding: 8px 0; }
    .admin-sub-section.is-open > .admin-sub-section-body { display: block; }
    .admin-visitor-filter { display: flex; gap: 6px; margin-bottom: 10px; }
    .admin-visitor-filter-btn { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--card-bg,#fff); color: var(--muted); cursor: pointer; }
    .admin-visitor-filter-btn.is-active { background: var(--green); color: #fff; border-color: var(--green); }
    .admin-visitor-more-btn { display: block; width: 100%; margin-top: 8px; padding: 8px; font-size: 13px; font-weight: 600; color: var(--green); background: transparent; border: 1px dashed var(--border); border-radius: 8px; cursor: pointer; text-align: center; }
    .admin-visitor-more-btn:hover { background: var(--bg-soft); }
    /* 분석 탭 (방문/회원/유입/페이지/이벤트) */
    .admin-analysis-controls { position: sticky; top: var(--header-total-h); z-index: 5; background: var(--bg); padding: 2px 0 8px; margin-bottom: 12px; }
    .admin-analysis-tabs { display: flex; gap: 4px; margin-bottom: 8px; border-bottom: 2px solid var(--border); overflow-x: auto; }
    .admin-analysis-tab { flex-shrink: 0; font-size: 13px; font-weight: 700; padding: 8px 14px; border: none; background: none; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .admin-analysis-tab.is-active { color: var(--green); border-bottom-color: var(--green); }
    .admin-analysis-subtabs { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
    .admin-analysis-subtab { font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--card-bg,#fff); color: var(--muted); cursor: pointer; }
    .admin-analysis-subtab.is-active { background: #5a3418; color: #fff; border-color: #5a3418; }
    .admin-analysis-subtab:disabled { opacity: .45; cursor: not-allowed; }
    .admin-tab-panel { display: none; }
    .admin-tab-panel.is-active { display: block; }
    /* 차트 그리드 */
    .admin-date-controls { display: flex; align-items: center; gap: 4px; min-width: 0; }
    .admin-chart-filter { display: flex; gap: 3px; margin-bottom: 0; flex-shrink: 0; }
    .admin-chart-period-btn { font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 20px; border: 1px solid var(--border); background: var(--card-bg,#fff); color: var(--muted); cursor: pointer; }
    .admin-chart-period-btn.is-active { background: var(--green); color: #fff; border-color: var(--green); }
    .admin-chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .admin-chart-wide { grid-column: 1 / -1; }
    .admin-chart-card { background: var(--card-bg,#fff); border: 1px solid var(--border); border-radius: 12px; padding: 14px 14px 10px; }
    .admin-chart-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
    .admin-chart-sub { font-size: 10px; font-weight: 400; color: var(--muted); }
    /* 날짜 탐색 */
    .admin-date-nav { display: none; align-items: center; gap: 3px; margin-bottom: 0; min-width: 0; flex: 1; }
    .admin-date-nav.is-visible { display: flex; }
    .admin-date-nav-arrow { background: var(--card-bg,#fff); border: 1px solid var(--border); border-radius: 20px; padding: 3px 6px; cursor: pointer; font-size: 11px; color: var(--muted); line-height: 1.4; flex-shrink: 0; }
    .admin-date-nav-arrow:hover { border-color: var(--green); color: var(--green); }
    .admin-date-nav-label { border: 1px solid var(--border); border-radius: 20px; padding: 3px 8px; font-size: 11px; font-weight: 700; color: var(--text); background: var(--card-bg,#fff); flex: 1; min-width: 68px; cursor: pointer; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .admin-date-nav-label:hover { border-color: var(--green); color: var(--green); }
    @media (max-width: 600px) { .admin-chart-grid { grid-template-columns: 1fr; } }
    /* 요약 카드 */
    .admin-summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .admin-summary-card { background: var(--card-bg,#fff); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; }
    .admin-summary-label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.3px; margin-bottom: 5px; }
    .admin-summary-value { font-size: 26px; font-weight: 900; color: var(--text); line-height: 1.1; }
    .admin-summary-sub { font-size: 10px; color: var(--muted); font-weight: 500; margin-top: 5px; line-height: 1.5; }
    .admin-summary-delta { font-size: 22px; font-weight: 900; }
    .admin-summary-delta.up { color: #2e7d32; }
    .admin-summary-delta.down { color: #9e3a2a; }
    .admin-summary-delta.flat { color: var(--muted); }
    .admin-visitor-summary-card { margin-top: 0; }
    .admin-visitor-summary-main { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .admin-visitor-breakdown { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 6px; white-space: nowrap; }
    .admin-visitor-breakdown .admin-summary-delta { font-size: 10px; font-weight: 700; }
    .admin-nav-summary-card { cursor: pointer; transition: box-shadow 0.15s; }
    .admin-nav-summary-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .admin-visitor-breakdown-item { display: inline-flex; align-items: baseline; gap: 3px; min-width: 0; }
    .admin-visitor-breakdown-label,
    .admin-visitor-breakdown-value { display: inline; font-size: 10px; font-weight: 400; color: var(--muted); line-height: 1.2; }
    @media (max-width: 600px) { .admin-summary-grid { grid-template-columns: repeat(2, 1fr); } }
    /* 교차분석 */
    .admin-cross-list { display: flex; flex-direction: column; gap: 0; padding: 4px 0; }
    .admin-cross-row { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
    .admin-cross-row:last-child { border-bottom: none; }
    .admin-cross-source { font-size: 12px; font-weight: 800; color: var(--text); min-width: 62px; flex-shrink: 0; line-height: 1.3; padding-top: 2px; }
    .admin-cross-total { display: block; font-size: 10px; font-weight: 600; color: var(--muted); }
    .admin-cross-chips { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
    .admin-cross-chip { font-size: 11px; background: var(--bg); border-radius: 20px; padding: 3px 10px; color: var(--text); }
    .admin-cross-chip strong { font-weight: 800; color: var(--green); }
    .admin-cross-empty { font-size: 13px; color: var(--muted); text-align: center; padding: 20px 0; }
    /* 관리자 메뉴 카드 */
    .admin-menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
    .inner-page--admin { padding-top: 14px; }
    .admin-menu-card { background: var(--card-bg,#fff); border: 1px solid var(--border); border-radius: 14px; padding: 9px 12px 7px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--text); text-align: center; line-height: 1.3; }
    .admin-menu-card:hover { border-color: var(--green); color: var(--green); }
    .admin-menu-icon { font-size: 26px; line-height: 1; }
    .admin-menu-badge { display: inline-block; background: var(--green); color: #fff; border-radius: 20px; font-size: 10px; font-weight: 700; padding: 1px 6px; vertical-align: middle; margin-left: 4px; }
    /* 이벤트 퍼널 */
    .admin-event-funnel { display: flex; flex-direction: column; gap: 6px; }
    .admin-event-section-title { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: 0.3px; margin-top: 4px; padding: 4px 0; }
    .admin-event-row { display: flex; align-items: center; gap: 10px; background: var(--card-bg,#fff); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
    .admin-event-label { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; min-width: 0; }
    .admin-event-today, .admin-event-week { font-size: 18px; font-weight: 900; color: var(--text); min-width: 52px; text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
    .admin-event-today small, .admin-event-week small { font-size: 10px; font-weight: 500; color: var(--muted); }
    .admin-event-week { color: var(--muted); font-size: 15px; }
    /* 바텀시트 */
    .admin-bs-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 9200; align-items: flex-end; justify-content: center; }
    .admin-bs-panel { background: #fff; border-radius: 18px 18px 0 0; width: 100%; max-width: 600px; max-height: 88vh; display: flex; flex-direction: column; }
    /* 게임 관리 시트는 내용(검색창 1개)이 짧아 화면 맨 아래에 붙어 자동완성 목록이 잘렸다 —
       최소 높이를 줘서 검색창을 위로 밀어 올리고 그 아래 펼침 공간을 확보한다. */
    #bsGameAdmin .admin-bs-panel { min-height: 60vh; }
    .admin-bs-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .admin-bs-title { font-size: 16px; font-weight: 800; color: var(--text); }
    .admin-bs-close { background: none; border: none; font-size: 20px; color: var(--muted); cursor: pointer; padding: 2px 6px; line-height: 1; }
    .admin-bs-body { overflow-y: auto; padding: 16px; flex: 1; -webkit-overflow-scrolling: touch; }
    /* 게임 관리 */
    .admin-game-search-input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
    .admin-game-form { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
    .admin-game-form-title { font-size: 15px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
    .admin-game-photo-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .admin-game-photo-item { position: relative; width: 72px; height: 72px; }
    .admin-game-photo-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
    .admin-game-photo-del { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: #d9534f; color: #fff; border: none; font-size: 12px; line-height: 1; cursor: pointer; }
    .admin-game-rule-textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; resize: vertical; margin-bottom: 10px; }
    .admin-game-rule-sublabel { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 8px 0 4px; }
    .admin-game-rule-optional { font-weight: 400; color: #aaa; }
    .admin-save-btn { align-self: flex-start; background: var(--green); color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 6px; }
    .admin-game-save-status { font-size: 12px; color: var(--muted); }
  </style>
</head>

<body class="owned-page">
  <script src="../../assets/js/header.js" data-index="false"></script>

  <main>
    <div class="about-hero">
      <nav class="breadcrumb">코티지 이용 <span class="bc-sep">›</span> <span style="color:#111;opacity:1">관리자</span></nav>
      <a class="admin-back" href="./requests.html">← 요청하기로 돌아가기</a>
      <span class="about-hero-eyebrow">관리자 전용</span>
      <h2>관리자 페이지</h2>
      <p class="about-hero-sub">비주얼 분석 · 요청 관리</p>
    </div>

    <section class="inner-page inner-page--admin">
      <div class="inner-page-body" id="mainContent">
        <div class="admin-empty">로딩 중...</div>
      </div>
    </section>
  </main>

  <script src="../../game-system/config/bgg-label-map.js"></script>
  <script src="../../game-system/game-data/library/3-output/cottage-games-data-output.js"></script>
  <script src="../../assets/js/game-display-adapter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../../assets/js/supabase-config.js"></script>
  <script src="../../assets/js/supabase-client.js"></script>
  <script src="../../assets/js/achievements.js"></script>
  <script src="../../assets/js/page-labels.js"></script>
  <script src="../../assets/js/script-nav.js"></script>
  <script src="../../assets/js/game-sheet.js"></script>
  <script src="../../assets/js/play-records-utils.js"></script>
  <script src="../../assets/js/member-analytics.js"></script>
  <script src="../../assets/js/kakao-auth.js"></script>

  <script>
  (function () {
    function escH(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    async function load() {
      const el = document.getElementById('mainContent');
      if (!window.isOwner?.()) {
        el.innerHTML = '<div class="admin-gate">관리자만 볼 수 있는 페이지예요.</div>';
        return;
      }
      // 관리자 확인됐으면 유입경로 제외 플래그 자동 설정
      localStorage.setItem('cottage_is_admin', '1');

      const cfg = window.SUPABASE_CONFIG;
      if (!cfg || !window.supabase) { el.innerHTML = '<div class="admin-empty">DB 연결 실패</div>'; return; }
      if (!window._cottageSupabaseDb) window._cottageSupabaseDb = window.supabase.createClient(cfg.url, cfg.anonKey);
      const db = window._cottageSupabaseDb;

      const [gameRes, snackRes, suggestRes, profileRes, votesRes, introsRes, voucherRes] = await Promise.all([
        db.from('game_requests').select('id, game_name, request_count, purchase_status, status_date, purchased_at, is_planned, added_at, actual_games, user_id').order('request_count', { ascending: false }),
        db.from('snack_requests').select('id, item_name, request_count, user_id, is_done, done_at, purchase_status, status_date').order('is_done', { ascending: true }).order('request_count', { ascending: false }),
        db.from('suggestions').select('id, content, created_at, user_id, is_done, is_planned').order('is_done', { ascending: true }).order('created_at', { ascending: false }),
        db.from('profiles').select('user_id, nickname, real_name'),
        db.from('game_request_votes').select('request_id, user_id'),
        db.from('member_intros').select('user_id, nickname').not('user_id', 'is', null),
        db.from('voucher_log').select('id, user_id, delta, reason, product_id, created_at, voucher_products(name)').order('created_at', { ascending: true }),
      ]);

      // user_id → 회원자기소개 닉네임 (타입 불일치 방지용 String() 변환)
      const introNickMap = {};
      (introsRes.data||[]).forEach(i => { if (i.user_id) introNickMap[String(i.user_id)] = i.nickname; });

      const profileMap = {};
      (profileRes.data||[]).forEach(p => { profileMap[String(p.user_id)] = p.nickname || p.real_name || p.user_id?.slice(0,8)+'…'; });
      function nick(userId) { return userId ? (profileMap[String(userId)] || String(userId).slice(0,8)+'…') : '비회원'; }

      // request_id → voter nicknames[]
      const voteMap = {};
      (votesRes.data||[]).forEach(v => {
        if (!voteMap[v.request_id]) voteMap[v.request_id] = [];
        voteMap[v.request_id].push(nick(v.user_id));
      });

      function votersTag(requestId) {
        const voters = voteMap[requestId];
        if (!voters?.length) return '';
        return `<span class="admin-req-voters">👤 ${voters.map(n => escH(n)).join(', ')}</span>`;
      }

      function requesterTag(userId) {
        if (!userId) return '';
        return `<span class="admin-req-requester">${escH(nick(userId))}</span>`;
      }

      const STATUS_LABEL = { '구매예정':'구매 예정', '선주문완료':'선주문 완료', '배송중':'배송중', '추가됨':'추가됨' };
      const STATUS_CLASS = { '구매예정':'req-status-planned', '선주문완료':'req-status-ordered', '배송중':'req-status-shipping', '추가됨':'req-status-added' };
      // 간식·음료는 게임구매요청과 같은 UI를 쓰되 상태를 2단계로 축소(자동 입고 파이프라인이 없어
      // "구매완료"를 고르는 순간 배지(purchase_status)와 알림 트리거(is_done/done_at)를 함께 채운다)
      const SNACK_STATUS_LABEL = { '구매예정': '구매 예정', '구매완료': '구매 완료' };
      const SNACK_STATUS_CLASS = { '구매예정': 'req-status-planned', '구매완료': 'req-status-done' };
      const fmtDate = s => { if (!s) return ''; const d = new Date(s); return `${d.getMonth()+1}월${d.getDate()}일`; };

      function gameReqItem(r) {
        const done = !!(r.purchased_at || r.purchase_status === '추가됨' || r.added_at);
        const planned = !!r.is_planned;
        let statusBadge = '';
        if (r.purchase_status) {
          const lbl = STATUS_LABEL[r.purchase_status] || r.purchase_status;
          const cls = STATUS_CLASS[r.purchase_status] || 'req-status-planned';
          const dateEl = r.status_date ? ` · <span class="req-date-edit" data-action="edit-status-date" data-id="${r.id}" data-date="${r.status_date}">${fmtDate(r.status_date)}</span>` : '';
          statusBadge = `<span class="req-status-badge ${cls}">${lbl}${dateEl}</span>`;
        } else if (r.purchased_at) {
          statusBadge = `<span class="req-status-badge req-status-done">구매 완료 · <span class="req-date-edit" data-action="edit-purchased-date" data-id="${r.id}" data-date="${r.purchased_at}">${fmtDate(r.purchased_at)}</span></span>`;
        } else if (r.is_planned) {
          statusBadge = `<span class="req-status-badge req-status-planned">구매 예정</span>`;
        }
        const statusPicker = `<span class="req-status-picker-wrap">
          <button class="req-action-btn req-action-status req-status-picker-btn" type="button" data-id="${r.id}">상태 설정 ▾</button>
          <div class="req-status-picker" hidden>
            <button type="button" class="req-status-option" data-action="set-status" data-id="${r.id}" data-status="구매예정">구매 예정</button>
            <button type="button" class="req-status-option" data-action="set-status" data-id="${r.id}" data-status="선주문완료">선주문 완료</button>
            <button type="button" class="req-status-option" data-action="set-status" data-id="${r.id}" data-status="배송중">배송중</button>
            <button type="button" class="req-status-option" data-action="set-status" data-id="${r.id}" data-status="추가됨">📦 추가됨</button>
            <button type="button" class="req-status-option req-status-option--unset" data-action="unset-all" data-id="${r.id}">해제</button>
          </div>
        </span>`;
        const voters = voteMap[r.id] || [];
        const votersHtml = voters.length ? `<span class="req-voters-names">${voters.map(n => escH(n)).join(', ')}</span>` : '';
        const actualList = Array.isArray(r.actual_games) ? r.actual_games : [];
        const actualHtml = `<details class="req-actual-wrap" data-id="${r.id}" data-games="${escH(JSON.stringify(actualList))}">
          <summary class="req-actual-toggle">실제 게임${actualList.length ? ` <span class="req-actual-count">${actualList.length}개</span>` : ''}</summary>
          <div class="req-actual-body">
            <div class="req-actual-tags">${actualList.map(g=>`<span class="req-actual-tag">${escH(g)}<button aria-label="이 게임 빼기" class="req-actual-remove" type="button" data-action="remove-actual-game" data-id="${r.id}" data-game="${escH(g)}">×</button></span>`).join('')}</div>
            <div class="req-actual-input-wrap"><input type="text" class="req-actual-input" placeholder="초성 검색..." autocomplete="off" data-req-id="${r.id}"><ul class="req-actual-dropdown" hidden></ul></div>
          </div>
        </details>`;
        return `<li class="req-list-item${done?' req-item-done':''}${planned&&!done?' req-item-planned':''}" data-id="${r.id}" data-table="game_requests" data-name="${escH(r.game_name)}" data-count="${r.request_count}">
          <span class="req-card-name">${escH(r.game_name)}</span>
          <span class="req-card-count"><span class="req-list-count">${r.request_count}명 희망</span></span>
          ${votersHtml}
          ${statusBadge ? `<span class="req-card-badges">${statusBadge}</span>` : ''}
          <span class="req-card-actions">${statusPicker}<button class="req-action-btn admin-req-del" type="button" data-id="${r.id}" data-table="game_requests">삭제</button></span>
          ${actualHtml}
        </li>`;
      }

      function snackReqItem(r) {
        const voters = voteMap[r.id] || [];
        const votersHtml = voters.length ? `<span class="req-voters-names">${voters.map(n => escH(n)).join(', ')}</span>` : '';
        let statusBadge = '';
        if (r.purchase_status) {
          const lbl = SNACK_STATUS_LABEL[r.purchase_status] || r.purchase_status;
          const cls = SNACK_STATUS_CLASS[r.purchase_status] || 'req-status-planned';
          const dateEl = r.status_date ? ` · ${fmtDate(r.status_date)}` : '';
          statusBadge = `<span class="req-card-badges"><span class="req-status-badge ${cls}">${lbl}${dateEl}</span></span>`;
        }
        const statusPicker = `<span class="req-status-picker-wrap">
          <button class="req-action-btn req-action-status req-status-picker-btn" type="button" data-id="${r.id}">상태 설정 ▾</button>
          <div class="req-status-picker" hidden>
            <button type="button" class="req-status-option" data-action="set-status" data-id="${r.id}" data-status="구매예정">구매 예정</button>
            <button type="button" class="req-status-option" data-action="set-status" data-id="${r.id}" data-status="구매완료">구매 완료</button>
            <button type="button" class="req-status-option req-status-option--unset" data-action="unset-all" data-id="${r.id}">해제</button>
          </div>
        </span>`;
        return `<li class="req-list-item" data-id="${r.id}" data-table="snack_requests" data-name="${escH(r.item_name)}" data-count="${r.request_count}">
          <span class="req-card-name">${escH(r.item_name)}</span>
          <span class="req-card-count"><span class="req-list-count">${r.request_count}명 희망</span></span>
          ${votersHtml}
          ${statusBadge}
          <span class="req-card-actions">${statusPicker}<button class="req-action-btn admin-req-del" type="button" data-id="${r.id}" data-table="snack_requests">삭제</button></span>
        </li>`;
      }

      function suggestItem(id, content, date, userId, isDone, isPlanned) {
        return `<div class="admin-req-item${isDone?' is-done':isPlanned?' is-planned':''}" data-id="${id}" data-table="suggestions">
          <span class="admin-req-content${isDone?' admin-req-content--done':''}">${escH(content)}</span>
          <span class="admin-req-meta">${formatDate(date)}</span>
          ${requesterTag(userId)}
          <button class="admin-suggest-plan${isPlanned?' is-planned':''}" type="button">${isPlanned?'예정됨':'예정'}</button>
          <button class="admin-suggest-done${isDone?' is-done':''}" type="button">${isDone?'완료됨':'완료'}</button>
          <button class="admin-req-del" type="button" data-id="${id}" data-table="suggestions">삭제</button>
        </div>`;
      }

      const gameHtml = (gameRes.data||[]).map(r => gameReqItem(r)).join('');
      const snackHtml = (snackRes.data||[]).map(r => snackReqItem(r)).join('');
      const suggestHtml = (suggestRes.data||[]).map(r=>suggestItem(r.id,r.content,r.created_at,r.user_id,r.is_done,r.is_planned)).join('');


      if (voucherRes.error) console.warn('[voucher] 로그 조회 실패', voucherRes.error);
      const voucherRowsAsc = voucherRes.data || [];
      const fmtDt = iso => new Date(iso).toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });

      // user별 누적 잔액 계산 (ASC 기준 순차 처리)
      const _userBalMap = new Map();
      const voucherRowsWithBal = voucherRowsAsc.map(r => {
        const uid = String(r.user_id);
        const balAfter = (_userBalMap.get(uid) || 0) + r.delta;
        _userBalMap.set(uid, balAfter);
        return { ...r, balAfter };
      });
      const voucherRows = [...voucherRowsWithBal].reverse();

      const voucherTableHtml = voucherRows.length
        ? `<table class="admin-analytics-table">
            <thead><tr><th>닉네임</th><th>내역</th><th>장수</th><th>잔액</th><th>시각</th></tr></thead>
            <tbody>${voucherRows.map(r => {
              const isGrant = r.delta > 0;
              const _vDisp = { '생수': '생수 2개', '곤약젤리': '곤약젤리 2개' };
              const _vn = r.voucher_products?.name || '';
              const label = isGrant
                ? (r.reason === 'first_play' ? '첫 기록 보상' : r.reason === 'dev_test' ? '테스트 지급 [DEV]' : '지급')
                : escH(_vDisp[_vn] || _vn || '사용');
              const deltaStr = (isGrant ? '+' : '') + r.delta + '장';
              return `<tr style="color:${isGrant?'#2e7d32':'inherit'}">
                <td>${escH(nick(r.user_id))}</td>
                <td>${label}</td>
                <td>${deltaStr}</td>
                <td style="color:var(--muted)">${r.balAfter}장</td>
                <td>${escH(fmtDt(r.created_at))}</td>
              </tr>`;
            }).join('')}</tbody>
          </table>`
        : '<div class="admin-empty">아직 내역이 없습니다</div>';

      const gameCount  = (gameRes.data||[]).length;
      const snackCount = (snackRes.data||[]).length;
      const suggestCount = (suggestRes.data||[]).filter(r => !r.is_done).length;

      el.innerHTML = `
        <div class="admin-menu-grid">
          <button class="admin-menu-card" data-bs="bsVoucher" type="button"><span class="admin-menu-icon">🎫</span><span>교환권 관리</span></button>
          <button class="admin-menu-card" data-bs="bsRequests" type="button"><span class="admin-menu-icon">📝</span><span>요청관리</span></button>
          <button class="admin-menu-card" data-bs="bsGameAdmin" type="button"><span class="admin-menu-icon">🎮</span><span>게임 관리</span></button>
        </div>
        <div class="admin-group is-open" id="groupAnalysis">
          <div class="admin-group-title">📊 분석<span class="admin-group-arrow">▾</span></div>
          <div class="admin-group-body">
            <div id="analysisControlsAnchor"></div>
            <div class="admin-analysis-controls" id="analysisControls">
              <div class="admin-analysis-tabs" id="analysisTabs">
                <button class="admin-analysis-tab is-active" data-tab="summary" type="button">요약</button>
                <button class="admin-analysis-tab" data-tab="visit" type="button">방문</button>
                <button class="admin-analysis-tab" data-tab="referrer" type="button">유입</button>
                <button class="admin-analysis-tab" data-tab="page" type="button">페이지</button>
                <button class="admin-analysis-tab" data-tab="event" type="button">이벤트</button>
                <button class="admin-analysis-tab" data-tab="member" type="button">회원</button>
              </div>
              <div class="admin-date-controls" id="analysisDateControls">
                <div class="admin-chart-filter" id="chartPeriodBtns">
                  <button class="admin-chart-period-btn is-active" data-days="1">오늘</button>
                  <!-- 라벨은 실제 동작과 일치해야 한다(#11): data-days는 과거 롤링 일수의 잔재이고
                       실제로는 _navType을 week/month로 바꾸는 **단위 선택기**다. "7일"은 최근 7일이
                       아니라 이번 주(월~일), "30일"은 이번 달이었다 — 실증: 30일 합계 1,453 vs 전체 1,493.
                       ◀▶로 과거 주/월로 이동하면 옆 날짜 네비 라벨이 실제 기간을 보여준다. -->
                  <button class="admin-chart-period-btn" data-days="7">이번 주</button>
                  <button class="admin-chart-period-btn" data-days="30">이번 달</button>
                  <button class="admin-chart-period-btn" data-days="0">전체</button>
                </div>
                <div class="admin-date-nav is-visible" id="chartDateNav">

      // 바텀시트 open/close
      function openAdminBS(id) {
        el.querySelectorAll('.admin-bs-overlay').forEach(o => { o.style.display = 'none'; });
        const overlay = document.getElementById(id);
        if (overlay) overlay.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }
      function closeAdminBS() {
        el.querySelectorAll('.admin-bs-overlay').forEach(o => { o.style.display = 'none'; });
        document.body.style.overflow = '';
      }
      el.querySelectorAll('.admin-menu-card[data-bs]').forEach(card => {
        card.addEventListener('click', () => openAdminBS(card.dataset.bs));
      });
      el.querySelectorAll('.admin-menu-card[data-scroll]').forEach(card => {
        card.addEventListener('click', () => {
          const target = document.getElementById(card.dataset.scroll);
          if (target) { target.classList.add('is-open'); target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        });
      });
      el.querySelectorAll('.admin-bs-close').forEach(btn => btn.addEventListener('click', closeAdminBS));
      el.querySelectorAll('.admin-bs-overlay').forEach(overlay => {
        overlay.addEventListener('click', e => { if (e.target === overlay) closeAdminBS(); });
      });

      // 게임 관리 — 검색 + 정리법 사진/룰설명 편집
      (function initGameAdminBS() {
        const searchInput = document.getElementById('gameAdminSearchInput');
        const formEl = document.getElementById('gameAdminForm');
        const nameEl = document.getElementById('gameAdminSelectedName');
        const photoGrid = document.getElementById('gameAdminPhotoGrid');
        const photoInput = document.getElementById('gameAdminPhotoInput');
        // 021: rule_note(레거시 단일 텍스트) 대신 4칸으로 구조화 — 이 폼은 더 이상 rule_note를
        // 읽거나 쓰지 않는다(기존 rule_note는 그대로 DB에 남지만 편집 UI에서 손을 뗀 값).
        const goalTextarea = document.getElementById('gameAdminRuleGoal');
        const setupTextarea = document.getElementById('gameAdminRuleSetup');
        const playTextarea = document.getElementById('gameAdminRulePlay');
        const endTextarea = document.getElementById('gameAdminRuleEnd');
        const errorTextarea = document.getElementById('gameAdminErrorNote');
        const saveBtn = document.getElementById('gameAdminSaveBtn');
        const statusEl = document.getElementById('gameAdminSaveStatus');
        if (!searchInput || !window.attachAc) return;

        let selectedGameKey = null;
        let currentPhotoUrls = [];

        function renderPhotoGrid() {
          photoGrid.innerHTML = currentPhotoUrls.map((url, i) => `
            <div class="admin-game-photo-item" data-idx="${i}">
              <img src="${url}" alt="정리법 사진">
              <button type="button" class="admin-game-photo-del" data-idx="${i}">✕</button>
            </div>`).join('');
          photoGrid.querySelectorAll('.admin-game-photo-del').forEach(btn => {
            btn.addEventListener('click', () => {
              currentPhotoUrls.splice(Number(btn.dataset.idx), 1);
              renderPhotoGrid();
            });
          });
        }

        async function selectGame(gameKey, display) {
          selectedGameKey = gameKey;
          nameEl.textContent = display;
          formEl.style.display = '';
          statusEl.textContent = '불러오는 중...';
          const override = await window.CottageDB.getGameOverride(gameKey);
          currentPhotoUrls = override?.organizer_photo_urls || [];
          const sections = override?.rule_sections || {};
          goalTextarea.value = sections.goal || '';
          setupTextarea.value = sections.setup || '';
          playTextarea.value = sections.play || '';
          endTextarea.value = sections.end || '';
          errorTextarea.value = override?.error_note || '';
          photoInput.value = '';
          renderPhotoGrid();
          statusEl.textContent = '';
        }

        window.attachAc(
          searchInput,
          () => (window.COTTAGE_GAMES || []).map(g => g.display).filter(Boolean),
          (selected) => {
            const cg = (window.COTTAGE_GAMES || []).find(g => g.display === selected);
            if (!cg) return;
            searchInput.value = selected;
            selectGame(cg.id, selected);
          }
        );
        // .admin-bs-body(overflow-y:auto)가 드롭다운을 클리핑하는 문제 우회 (club-schedule.html과 동일 패턴)
        const acList = searchInput.parentElement?.querySelector('.pr-autocomplete-list');
        if (acList) {
          acList.style.position = 'fixed';
          acList.style.zIndex = '9300';
          const _reposAc = () => {
            const r = searchInput.getBoundingClientRect();
            acList.style.left = r.left + 'px';
            acList.style.top = (r.bottom + 2) + 'px';
            acList.style.width = r.width + 'px';
          };
          searchInput.addEventListener('input', _reposAc, { passive: true });
          searchInput.addEventListener('focus', _reposAc, { passive: true });
        }

        saveBtn.addEventListener('click', async () => {
          if (!selectedGameKey) return;
          saveBtn.disabled = true;
          statusEl.textContent = '저장 중...';
          try {
            const files = Array.from(photoInput.files || []);
            for (const file of files) {
              const resized = window.resizeImageFile ? await window.resizeImageFile(file) : file;
              const url = await window.CottageDB.uploadOrganizerPhoto(resized, selectedGameKey);
              if (url) currentPhotoUrls.push(url);
            }
            const ok = await window.CottageDB.upsertGameOverride(selectedGameKey, {
              organizerPhotoUrls: currentPhotoUrls,
              errorNote: errorTextarea.value.trim(),
              ruleSections: {
                goal: goalTextarea.value.trim(),
                setup: setupTextarea.value.trim(),
                play: playTextarea.value.trim(),
                end: endTextarea.value.trim(),
              },
            });
            photoInput.value = '';
            renderPhotoGrid();
            statusEl.textContent = ok ? '저장됨' : '저장 실패';
          } catch (err) {
            console.error('[gameAdminSave]', err);
            statusEl.textContent = '저장 실패';
          } finally {
            saveBtn.disabled = false;
          }
        });
      })();

      // 그룹 접기/펴기
      el.querySelectorAll('.admin-group-title').forEach(title => {
        title.addEventListener('click', () => {
          title.closest('.admin-group').classList.toggle('is-open');
        });
      });
      // 섹션 접기/펴기 (기본 접힘)
      el.querySelectorAll('.admin-section-title').forEach(title => {
        title.addEventListener('click', () => {
          title.closest('.admin-section').classList.toggle('is-open');
        });
      });

      // 분석 탭 전환 (방문/회원/유입/페이지/이벤트) — 패널만 교체, 데이터는 이미 로드되어 있음
      const analysisTabs = document.getElementById('analysisTabs');
      if (analysisTabs) {
        analysisTabs.addEventListener('click', e => {
          const btn = e.target.closest('.admin-analysis-tab');
          if (!btn || btn.disabled) return;
          const tab = btn.dataset.tab;
          analysisTabs.querySelectorAll('.admin-analysis-tab').forEach(b => b.classList.toggle('is-active', b === btn));
          el.querySelectorAll('.admin-tab-panel').forEach(p => {
            p.classList.toggle('is-active', p.dataset.panel === tab);
          });
          // 날짜 필터를 쓰는 탭 — 회원 탭은 제외한다.
          // 회원 카드는 그 자체가 개인 타임라인 요약("46분 전 · 오늘 19초 · 방문 13회 · 가입 5/31")이라
          // 목록을 다시 날짜로 거르면 필터 칩 숫자(누적)와 목록(그날 활동자)의 모집단이 어긋난다.
          // 실제로 칩 "전체 (341)"에 목록은 4명이었다. 누적 회원 수는 요약 탭 「회원」 카드가 보여준다.
          // 반대로 이벤트는 "기간별 몇 건"이 본질이라 날짜 필터가 있어야 한다.
          const usesDateFilter = tab === 'summary' || tab === 'visit' || tab === 'referrer' || tab === 'page' || tab === 'event';
          const periodBtns = document.getElementById('chartPeriodBtns');
          const dateNav = document.getElementById('chartDateNav');
          if (periodBtns) periodBtns.style.display = usesDateFilter ? '' : 'none';
          if (dateNav) dateNav.style.display = usesDateFilter && dateNav.classList.contains('is-visible') ? '' : 'none';
          requestAnimationFrame(() => requestAnimationFrame(() => {

    // ── 페이지 키 정규화 (#14) ────────────────────────────────────────
    // `page_sessions.page`에는 역사적으로 **네 형태**가 섞여 있다: 슬러그(heartbeat 경로),
    // 한글 표시 라벨(구 세션 트래커), 원시 pathname(초기 데이터), 그리고 **개명 전 옛 라벨**.
    // 2026-07-20부터 저장은 슬러그로 통일했지만 **과거 행은 그대로 남아 있으므로**
    // 읽는 쪽에서 슬러그로 접는다. 접는 자리는 **loadAnalytics의 rows 진입점 한 곳**이고,
    // 그 뒤의 모든 집계(회원·비회원 카드 펼침 / 페이지 탭 막대 / 요약 페이지 카드)는
    // 슬러그를 키로 쓴다 — 화면에 라벨을 붙이는 건 렌더 시점의 PAGE_LABEL이다.
    const PAGE_LABEL = window.COTTAGE_PAGE_LABELS || {};
    // 페이지 키 정규화·별칭표는 member-analytics.js가 단일 소스(P4, 2026-07-22). 여기선 가리킨다.
    // ⚠️ 별칭표에서 한글 키를 지우지 말 것 — 상세 이유는 member-analytics.js 헤더.
    const PAGE_KEY_ALIASES = MemberAnalytics.PAGE_KEY_ALIASES;
    // ── 쌍둥이 INSERT 접기 ────────────────────────────────────────────
    // `page_sessions`에 INSERT하는 경로가 **셋**인데 한 번의 방문에 둘이 함께 발사된다:
    //   ① supabase-client.js `_syncTimeToDBNow` — 로그인, visibilitychange(탭 숨김)
    //   ② supabase-client.js `_startAnonHeartbeat` — 비로그인, 입장 1회, duration_sec=0 하드코딩
    //   ③ script-nav.js `_send` — 전원, visibilitychange/pagehide, 3초 미만 제외
    //      (raw fetch라 `db.from('page_sessions')` grep에 안 걸린다 — 경로를 셀 때 놓치기 쉽다)
    // 로그인=①+③, 비로그인=②+③ → **방문 1회가 2행**이 되고 「진입 N회」가 그만큼 부풀었다.
    // 실측(2026-07-22, `scripts/audit-session-double-insert.js`): 정규화 후 전 구간 방문 9,467건 중
    // **1,064건(11%)이 2행**, #14 통일 이후 구간은 28%. 체류 합계는 2% 과다(비회원 쌍은 0초라 무영향).
    // 창이 3초인 건 임의값이 아니다 — 같은 (사람·페이지) 이웃 행 간격에 **절벽**이 있다:
    // 쌍 16개가 전부 ≤1.9초이고 그다음 값이 8.6초다. 2~5초 어디를 잡아도 같은 16쌍이 잡힌다.
    // ⚠️ 저장 쪽은 그대로 둔다 — ①과 ③은 서로 다른 것을 재고(누적초 vs 진입 후 실제초,
    //    3초 미만 유무) 한쪽을 지우면 그 차이가 사라진다. 고치는 건 **읽기**다(#14와 같은 방침).
    const TWIN_WINDOW_MS = 3000;
    function collapseTwinInserts(rowset) {
      const byKey = new Map();
      for (const r of rowset) {
        const pid = r.user_id ? 'u:' + r.user_id : (r.session_key ? 's:' + r.session_key : null);
        if (!pid || !r.entered_at) { byKey.set(Symbol(), [r]); continue; } // 묶을 근거가 없으면 그대로 둔다
        const k = pid + '\x00' + r.page;
        if (!byKey.has(k)) byKey.set(k, []);
        byKey.get(k).push(r);
      }
      // referrer 고르기 — 2026-07-21(#28) 이후로는 두 경로가 같은 `COTTAGE_SESSION_REF`를 써서
      // 값이 같지만, **그 이전 행은 ③이 유입 소스 대신 내부 라벨**(`메인`·`/pages/...`)을 넣었다.
      // 체류만 보고 대표를 고르면 그 내부 라벨 쪽이 남아 진짜 유입(naver_place·google 등)이
      // 사라진다 — 실측 31쌍이 그렇게 새고 있었다. 내부인지 아닌지는 **바로 위 별칭표를 그대로
      // 재사용**해 판정한다(같은 개념에 판정 규칙을 두 벌 만들면 #15가 재발한다).
      const _isInternalRef = ref => !!ref && (ref.startsWith('/') || Object.prototype.hasOwnProperty.call(PAGE_KEY_ALIASES, ref));
      const out = [];
      for (const list of byKey.values()) {
        if (list.length === 1) { out.push(list[0]); continue; }
        list.sort((a, b) => new Date(a.entered_at) - new Date(b.entered_at));
        let group = [list[0]];
        const flush = () => {
          // 대표는 **체류가 가장 긴 행**. ①과 ③이 같은 방문을 서로 다른 기준으로 잰 값이라
          // 합치면 중복이고, 큰 쪽이 그 방문의 최선 추정이다.
          let best = group[0];
          for (const r of group) if ((r.duration_sec || 0) > (best.duration_sec || 0)) best = r;
          if (_isInternalRef(best.referrer) || !best.referrer) {
            const better = group.find(r => r.referrer && !_isInternalRef(r.referrer));
            if (better) best = { ...best, referrer: better.referrer };
          }
          out.push(best);
        };
        // ⚠️ 다음 행과의 간격은 **직전 행 기준**으로 본다(묶음 첫 행 기준이 아니라).
        //    첫 행 기준으로 끊으면 대표가 묶음 끝 행일 때 다음 묶음 대표와 3초 안에 남아
        //    접은 뒤에도 중복이 잔존한다 — 실제로 1건 잔존해 검사기에 걸렸다.
        for (let i = 1; i < list.length; i++) {
          if (new Date(list[i].entered_at) - new Date(list[i - 1].entered_at) <= TWIN_WINDOW_MS) group.push(list[i]);
          else { flush(); group = [list[i]]; }
        }
        flush();
      }
      return out;
    }

      ]);
      const ADMIN_UID = '4916417947';
      // ⚠️ 여기서 **슬러그로 접는다**(#14). 예전엔 슬러그→한글 라벨로 바꿨는데, 그러면
      //    라벨맵 두 개가 서로 달라(`game-reviews`가 '기록 보기' vs '플레이 기록') 오히려
      //    같은 페이지가 **이름까지 갈린 두 줄**이 됐다. 표시는 렌더에서 PAGE_LABEL로 붙인다.
      // 접는 순서가 중요하다 — **정규화 먼저**. 과거 행은 두 경로가 라벨/슬러그로 다른 page를
      // 넣었으므로(#14) 정규화 전에 묶으면 같은 방문의 쌍이 서로 다른 페이지로 보여 안 접힌다.
      const rows = collapseTwinInserts(
        (rawRows || []).filter(r => String(r.user_id || '') !== ADMIN_UID)
          .map(r => ({ ...r, page: normalizePageKey(r.page) })));
      const allProfiles = (rawProfiles || []).filter(p => String(p.user_id || '') !== ADMIN_UID);
      const pageViews = (pvResult?.data || []).filter(r => String(r.user_id || '') !== ADMIN_UID);
      const anonSessions = anonResult?.data || [];
      const intros = db2 ? (await db2.from('member_intros').select('user_id,nickname').not('user_id','is',null)).data || [] : [];
      const introNickMap = new Map(intros.map(i => [String(i.user_id), i.nickname]));

      // ── 헬퍼 ────────────────────────────────────────────────────
      const fmtTime = s => {
        if (!s) return '-';
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
        if (h > 0) return m > 0 ? `${h}시간 ${m}분` : `${h}시간`;
        return m > 0 ? (sec > 0 ? `${m}분 ${sec}초` : `${m}분`) : `${sec}초`;
      };

      function dispName(p) {
        const uid = String(p.user_id);
        const nick = introNickMap.get(uid) || p.nickname || p.real_name || uid.slice(0,8)+'…';
        return p.real_name && nick !== p.real_name ? `${nick}(${p.real_name})` : nick;
      }
      const profilesMap = new Map(allProfiles.map(p => [p.user_id, dispName(p)]));
      const profilesByUid = new Map(allProfiles.map(p => [String(p.user_id), p]));
      // 드릴다운 명단이 회원 이름을 붙이려면 profiles가 필요한데 loadEventStats는 그걸 안 받는다.
      // 키를 String으로 고정한다 — page_events.user_id와 profiles.user_id의 타입이 섞이면
      // 이름이 조용히 안 붙고 회원이 「회원 4916…」로 보인다.
      window._adminNameOfUid = uid => {
        const p = profilesByUid.get(String(uid));
        return p ? dispName(p) : null;
      };


      const todayKst = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);

      // ── 집계 헬퍼 ────────────────────────────────────────────
      // 같은 사람이 같은 페이지를 당일 여러 번 방문해도 1회로 카운트
      function dedupUserPageDay(rowset) {
        const seen = new Set();
        const out = [];
        for (const r of rowset) {
          const day = (r.entered_at || '').slice(0, 10);
          let key;
          if (r.user_id) {
            key = 'u:' + r.user_id + '\x00' + r.page + '\x00' + day;
          } else if (r.session_key) {
            key = 's:' + r.session_key + '\x00' + r.page + '\x00' + day;
          } else {
            out.push(r); continue;
          }
          if (!seen.has(key)) { seen.add(key); out.push(r); }
        }
        return out;
      }

      function buildUserMap(rowset) {
        const m = new Map();
        for (const r of rowset) {
          if (!r.user_id) continue;
          if (!m.has(r.user_id)) m.set(r.user_id, new Map());
          const pm = m.get(r.user_id);
          if (!pm.has(r.page)) pm.set(r.page, { visits: 0, totalSec: 0 });
          pm.get(r.page).visits++; pm.get(r.page).totalSec += r.duration_sec || 0;
        }
        return [...m.entries()].sort((a,b) => {
          const la = profilesByUid.get(String(a[0]))?.last_seen_at || '';
          const lb = profilesByUid.get(String(b[0]))?.last_seen_at || '';
          return lb.localeCompare(la);
        });
      }

      // 비회원 통계 — session_key 기반, page_sessions에서 파생
      const _toKstDate = MemberAnalytics.toKstDate;  // 단일 소스: member-analytics.js (P4)

      // ── 펼침 표의 기간 선택 ──────────────────────────────────────────
      // 기간 헬퍼·페이지 맵은 member-analytics.js가 단일 소스(P4, 2026-07-22). _inVpPeriod와
      // pageMapFor만 loadAnalytics의 todayKst/rows를 넘기는 지역 래퍼로 둔다 — 그래야 관리자
      // 페이지가 loadAnalytics 시점의 고정 todayKst와 그때의 rows를 그대로 쓴다.
      // ⚠️ 이건 탭 필터가 아니라 펼친 표 안의 선택기다 — 탭 전체를 기간으로 거르면 #5 재발.
      //    명부가 답하는 질문("누가 있나")과 이 표("그 기간에 뭘 봤나")가 달라 선택기는 표에만.
      const VP_PERIODS = MemberAnalytics.VP_PERIODS;
      const _VP_DATE_RE = MemberAnalytics.VP_DATE_RE;
      const _kstShift = MemberAnalytics.kstShift;
      const _vpLabel = MemberAnalytics.vpLabel;
      const _inVpPeriod = (r, period) => MemberAnalytics.inVpPeriod(r, period, todayKst);
      const pageMapFor = (idType, id, period) => MemberAnalytics.buildPageMap(rows, idType, id, period, todayKst);
      function buildAnonUserMap(rowset) {
        const m = new Map(); // session_key → { pm, days, todaySec, lastAt }
        for (const r of rowset) {
          if (r.user_id || !r.session_key) continue;
          if (!m.has(r.session_key)) m.set(r.session_key, { pm: new Map(), days: new Set(), todaySec: 0, lastAt: '' });
          const entry = m.get(r.session_key);
          if (!entry.pm.has(r.page)) entry.pm.set(r.page, { visits: 0, totalSec: 0 });
          entry.pm.get(r.page).visits++; entry.pm.get(r.page).totalSec += r.duration_sec || 0;
          if (r.entered_at) {
            const dayKst = _toKstDate(r.entered_at);
            entry.days.add(dayKst);
            if (dayKst === todayKst) entry.todaySec += r.duration_sec || 0;
            if (r.entered_at > entry.lastAt) entry.lastAt = r.entered_at;
          }
        }
        return [...m.entries()].sort((a, b) => b[1].lastAt.localeCompare(a[1].lastAt));
      }


      // ── 요약 카드 + 통합 방문자 목록 ───────────────────────────
      // (#memberCountBadge 갱신 코드가 여기 있었으나 그 요소가 HTML에 없어 항상 no-op이었다 — #4, 2026-07-19 제거.
      //  회원 수는 아래 sumMemberTotal 카드가 보여준다.)
      const _now = Date.now();
      // 회원 탭(명부) 안쪽 미니카드는 날짜 네비가 없으므로(원칙 ④) 고정 30일 그대로 둔다.
      // 요약 탭의 sumMemberNew는 draw()가 선택 기간에 맞춰 갱신한다(아래 "요약: 회원 카드").
      const cnt30dNew = allProfiles.filter(p => p.first_seen_at && _now - new Date(p.first_seen_at).getTime() < 30 * 86400000).length;
      const _sumMemberTotal = document.getElementById('sumMemberTotal');
      if (_sumMemberTotal) _sumMemberTotal.textContent = allProfiles.length + '명';
      const summaryCardsHtml = `<div class="admin-summary-grid" style="grid-template-columns:1fr;margin-bottom:12px">
        <div class="admin-summary-card"><div class="admin-summary-label">30일 신규</div><div class="admin-summary-value">${cnt30dNew}명</div></div>
      </div>`;

      const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' }) : '-';
      // page_sessions 기반 비회원 집계 (방문일수·오늘초·총초) — DB 컬럼보다 정확한 역사 데이터
      const anonPageMap = new Map(buildAnonUserMap(rows));
      // 회원별 페이지 분포 — 카드 안 "페이지 N개" 펼침용.
      // ⚠️ dedupUserPageDay를 거치지 않고 **원본 rows**를 쓴다. dedup은 (유저·페이지·일)을
      //    한 행으로 접어서 체류시간이 그날 첫 세션 것만 합산돼 과소집계된다. 비회원 경로
      //    (buildAnonUserMap)도 원본을 쓰므로 이쪽이 회원/비회원 간에도 일관적이다.
      const memberPageMap = new Map(buildUserMap(rows));

      // 한 사람의 페이지 분포 표. 체류시간 내림차순 — "어떤 페이지에 오래 머물렀나"가 질문이라
      // 진입 횟수보다 체류가 먼저다. 너무 길어지지 않게 상위 10개만 펼치고 나머지는 합계로.
      const _PAGE_ROWS_MAX = 10;
      // 패널 **안쪽**만 만든다 — 기간 버튼을 누르면 이 부분만 갈아끼운다(껍데기는 유지해야
      // 열림 상태와 위임 대상이 살아남는다).
      function _visitorPagesInner(pm, period) {
        const sorted = [...pm.entries()].sort((a, b) => b[1].totalSec - a[1].totalSec);
        const head = sorted.slice(0, _PAGE_ROWS_MAX);
        const rest = sorted.slice(_PAGE_ROWS_MAX);
        const restSec = rest.reduce((s, [, d]) => s + d.totalSec, 0);
        const restVisits = rest.reduce((s, [, d]) => s + d.visits, 0);
        const pLabel = _vpLabel(period);
        const isDateMode = _VP_DATE_RE.test(period);
        // 기준 표기(원칙 ①) — 무엇을 센 값인지 밝힌다. **라벨을 하드코딩하지 않고 고른 기간에서
        // 파생**시킨다. 문구와 데이터가 어긋나는 건 시간문제다(#9·#11이 그 사례).
        const periodBar = `<div class="admin-vp-periods">${VP_PERIODS.map(p =>
          `<button class="admin-vp-period-btn${p.key === period ? ' is-active' : ''}" type="button" data-vp-period="${p.key}">${p.label}</button>`
        ).join('')}</div>`;
        // 특정 날짜 — 주력은 달력 점프(관리자는 오래 머문 날을 이미 알고 그날로 간다), 화살표는 보조.
        // ▶는 미래로 못 가게 막는다. input의 max도 오늘이라 달력에서도 미래가 안 골라진다.
        const dateNav = `<div class="admin-vp-datenav">
          <button class="admin-vp-date-arrow" type="button" data-vp-arrow="-1" aria-label="하루 전">◀</button>
          <button class="admin-vp-date-label${isDateMode ? ' is-active' : ''}" type="button" data-vp-datelabel>${isDateMode ? escH(pLabel) : '특정 날 📅'}</button>
          <input class="admin-vp-date-input" type="date" data-vp-dateinput max="${todayKst}" value="${isDateMode ? period : ''}" aria-label="날짜 고르기">
          <button class="admin-vp-date-arrow" type="button" data-vp-arrow="1" aria-label="하루 후"${isDateMode && period >= todayKst ? ' disabled' : ''}>▶</button>
        </div>`;
        const note = `<div style="font-size:11px;color:var(--muted);padding:2px 2px" title="page_sessions(페이지별 체류 기록) 기준. heartbeat 분은 이 표에 안 들어오므로 위 '⏱ 총'보다 작습니다 — 서로 다른 것을 세는 값이라 정상입니다. 기간은 이 표에만 적용되며 위 목록·카드 숫자는 전 기간 그대로입니다.">페이지별 체류 · <b>${escH(pLabel)}</b> · 합계는 위 ⏱ 총과 다름</div>`;
        // 「0」과 「없음」을 구분한다 — 빈 표를 내면 "고장인가"로 읽힌다(_todayChip과 같은 판단).
        if (!pm.size) {
          return periodBar + dateNav + note + `<div class="admin-vp-empty">이 기간에 기록된 페이지 체류가 없습니다.</div>`;
        }
        return periodBar + dateNav + note + `<table class="admin-analytics-table">
            <thead><tr><th>페이지</th><th>진입</th><th>체류</th></tr></thead>
            <tbody>
              ${head.map(([page, d]) =>
                `<tr><td class="anat-page">${escH(PAGE_LABEL[page] || page)}</td><td>${d.visits}회</td><td>${fmtTime(d.totalSec)}</td></tr>`
              ).join('')}
              ${rest.length
                ? `<tr><td style="color:var(--muted)">외 ${rest.length}개 페이지</td><td>${restVisits}회</td><td>${fmtTime(restSec)}</td></tr>`
                : ''}
            </tbody>
          </table>`;
      }
      function _visitorPagesHtml(pm) {
        if (!pm || !pm.size) return '';
        // data-vp-period는 위임 핸들러가 「지금 무슨 기간인지」를 읽는 자리다(화살표 ±1의 기준).
        return `<div class="admin-visitor-pages" hidden data-vp-period="all">${_visitorPagesInner(pm, 'all')}</div>`;
      }
      // 토글 버튼 라벨. 기간을 바꾸면 이 숫자도 함께 간다 — 버튼 12개 / 표 3줄로 갈리면
      // #5와 같은 종류의 어긋남이다(원칙 ⑤: 명단과 「N개」는 같은 순회에서 만든다).
      const _pagesBtnLabel = (count, open) => `📄 페이지 ${count}개 ${open ? '▴' : '▾'}`;
      const _visitorPagesToggle = pm => pm && pm.size
        ? `<button class="admin-visitor-pages-btn" type="button">${_pagesBtnLabel(pm.size, false)}</button>`
        : '';

      const unified = [
        ...allProfiles.map(p => ({ _type: 'member', _last: p.last_seen_at || '', ...p })),
        ...anonSessions.map(a => ({ _type: 'anon', _last: a.last_seen_at || '', ...a }))
      ].sort((a, b) => b._last.localeCompare(a._last));

      const memberCount = allProfiles.length;
      const anonCount = anonSessions.length;
      const visitorFilterBar = `<div class="admin-visitor-filter" id="visitorFilterBar">
        <button class="admin-visitor-filter-btn is-active" data-filter="all" onclick="applyVisitorFilter('all',this)">전체 (${unified.length})</button>
        <button class="admin-visitor-filter-btn" data-filter="member" onclick="applyVisitorFilter('member',this)">회원 (${memberCount})</button>
        <button class="admin-visitor-filter-btn" data-filter="anon" onclick="applyVisitorFilter('anon',this)">비회원 (${anonCount})</button>
      </div>`;
      // 「오늘」 칩 — 「0」과 「없음」을 화면에서 구분한다.
      //
      // 예전엔 `todayS > 0`일 때만 칩을 그렸다. 그래서 **오늘 온 게 확실한 회원인데도**
      // today_seconds가 0이면 칩이 통째로 사라졌고, 화면만 봐서는 아래 셋이 구별되지 않았다:
      //   ① 오늘 안 왔다  ② 왔는데 0초로 잡혔다  ③ 조회·렌더가 실패했다
      // 「관리자 금일이용데이터 간헐 미표시」라는 버그 기재가 이 구별 불가에서 나왔다.
      // 이제 **오늘 흔적(last_seen_at)이 있으면 값이 0이어도 칩을 그린다** — 0이면 0이라고 말한다.
      // 오늘 안 온 회원은 지금처럼 칩이 없다(노이즈를 늘리지 않기 위해).
      //
      // 0이 정상적으로 나오는 경로가 실제로 있다(= 이 칩은 고장 신호가 아니다):
      //   · today_seconds는 heartbeat(1분)·visibilitychange로만 오른다 → 1분 미만 방문은 0
      //   · 자정 넘김 시 today_date가 세션 시작값에 고정되는 알려진 건(§4 ④)
      const _todayChip = (p, todayS) => {
        const seenToday = p.last_seen_at && _toKstDate(p.last_seen_at) === todayKst;
        if (!seenToday && todayS === 0) return '';
        if (todayS > 0) {
          return `<span style="color:var(--green);font-weight:600" title="profiles.today_seconds — 오늘 누적(heartbeat 포함). 1분 미만 방문은 0으로 남을 수 있어 실제의 하한입니다">오늘 ${fmtTime(todayS)}</span>`;
        }
        return `<span style="color:var(--muted);font-weight:600" title="오늘 방문 흔적(last_seen_at)은 있는데 today_seconds가 0입니다. 1분 미만 방문이거나 동기화가 안 실린 경우로, 「데이터 없음」이 아니라 「0으로 기록됨」입니다">오늘 0분</span>`;
      };

      // i는 목록에서의 위치 — 초기엔 상위 3개만 보이고 나머지는 접힌다(더보기 버튼).
      // 예전엔 이 3개를 #visitorList, 나머지를 #visitorExtras로 **DOM을 갈라** 담았는데,
      // 정렬을 붙이려면 카드가 한 컨테이너 안에 있어야 순서를 바꿀 수 있어 한 곳으로 합쳤다.
      // (applyVisitorFilter/expandVisitorMore는 원래부터 두 컨테이너를 합쳐 훑으므로 그대로 동작한다.)
      const _renderVisitorCard = (u, i) => {
        const hid = i >= 3 ? 'display:none;' : '';
        if (u._type === 'member') {
          const p = u;
          const todayS = p.today_date === todayKst ? (p.today_seconds || 0) : 0;
          const totalS = p.total_minutes || 0;
          const isBanned = !!p.is_banned;
          const isMe = String(p.user_id) === '4916417947';
          const nick = introNickMap.get(String(p.user_id)) || p.nickname || p.real_name || '(닉네임없음)';
          const dnHtml = p.real_name
            ? `${escH(nick)}<span class="admin-real-name">(${escH(p.real_name)})</span>`
            : escH(nick);
          return `<div class="admin-member-card${isBanned?' is-banned':''}" data-uid="${escH(p.user_id)}" data-banned="${isBanned}" data-last-seen="${escH(p.last_seen_at||'')}" data-visitor-type="member" data-total-sec="${totalS}" data-today-sec="${todayS}" style="${hid}">
            <div class="admin-member-name">${dnHtml}<span style="font-size:10px;background:#e8f4e8;color:#2e7d32;border-radius:3px;padding:1px 5px;margin-left:4px;font-weight:600">회원</span>${isBanned?' <span class="admin-banned-badge">🚫 밴됨</span>':''}${isMe?' <span style="font-size:11px;color:var(--green)">👑 관리자</span>':''}<span class="admin-online-status" data-uid="${escH(p.user_id)}"></span></div>
            <div class="admin-member-metas">
              <span>가입 ${fmtDate(p.first_seen_at)}</span>
              <span>최근 ${fmtDate(p.last_seen_at)}</span>
              <span>방문 ${p.visit_count != null ? p.visit_count + '회' : '-'}</span>
              ${_todayChip(p, todayS)}
              <span title="profiles.total_minutes — 전 기간 누적(heartbeat 포함). 아래 페이지별 합계는 page_sessions 기준이라 이보다 작습니다.">⏱ 총 ${fmtTime(totalS)}</span>
              ${_visitorPagesToggle(memberPageMap.get(p.user_id))}
              ${isMe ? '' : `<button class="admin-ban-btn ${isBanned?'unban':'ban'}" data-uid="${escH(p.user_id)}">${isBanned?'✅ 밴 해제':'🚫 밴'}</button>`}
            </div>
            ${_visitorPagesHtml(memberPageMap.get(p.user_id))}
          </div>`;
        } else {
          const a = u;

    // 한쪽만 규칙이 바뀌어도 조용히 다른 답을 낸다(#15가 정확히 그 사고였다).

    function renderCharts(rows, allProfiles, profilesMap, pageViews = [], anonSessions = []) {

      // 물리기 시작하므로, 그때 라벨이 조용히 거짓이 되지 않도록 미리 감지해 둔다.
      // 판정: 가장 오래된 행이 90일 컷에 닿아 있으면(여유 1일) 그 너머가 잘렸다고 본다.
      const _oldestSession = rows.reduce((m, r) => (!m || (r.entered_at && r.entered_at < m)) ? r.entered_at : m, null);

      };

      function kstDate(isoStr) {

      }
      function kstDateStr(date) {
        return new Date((date ? date.getTime() : Date.now()) + 9 * 3600000).toISOString().slice(0, 10);
      }
      function toWeekStr(date) {
        const d = new Date(date.getTime() + 9 * 3600000);
        d.setUTCHours(0, 0, 0, 0);
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        const week = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);

      function calcRange(type, value) {
