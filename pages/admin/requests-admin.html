<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/images/main/favicon-square.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/images/main/favicon-square.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>관리자 페이지 | 코티지보드</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    /* 최상위 그룹 */
    .admin-group { margin-bottom: 32px; }
    .admin-group + .admin-group { margin-top: 8px; }
    .admin-group .admin-section-title { border-bottom: none; }
    .admin-group-title { font-size: 16px; font-weight: 900; color: #2c3e50; padding: 10px 2px; border-bottom: 3px solid #2c3e50; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
    .admin-group-title:hover { color: var(--green); border-bottom-color: var(--green); }
    .admin-group-arrow { font-size: 13px; color: var(--muted); transition: transform 0.2s; }
    .admin-group.is-open .admin-group-arrow { transform: rotate(180deg); }
    .admin-group-body { display: none; }
    .admin-group.is-open .admin-group-body { display: block; }
    .admin-section { margin-bottom: 16px; border: 1px solid var(--border,#e8e4dc); border-radius: 12px; overflow: hidden; }
    .admin-section-title { font-size: 15px; font-weight: 700; color: var(--green); padding: 12px 16px; border-bottom: 2px solid var(--green); cursor: pointer; display: flex; align-items: center; justify-content: space-between; user-select: none; margin: 0; background: var(--bg,#f5f0e8); }
    .admin-section-title:hover { background: #ede8df; }
    .admin-section-count { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--card-bg,#fff); border-radius: 20px; padding: 1px 8px; margin-left: 6px; }
    .admin-section-arrow { font-size: 13px; color: var(--muted); transition: transform 0.2s; margin-left: auto; }
    .admin-section.is-open .admin-section-arrow { transform: rotate(180deg); }
    .admin-section-body { display: none; padding: 12px; }
    .admin-section.is-open .admin-section-body { display: block; }
    .admin-req-list { display: flex; flex-direction: column; gap: 8px; }
    .admin-req-item { background: var(--card-bg, #fff); border: 1px solid var(--border, #e8e4dc); border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .admin-req-name { font-size: 14px; font-weight: 700; white-space: nowrap; min-width: 0; }
    /* 회원 카드 전용 */
    .admin-member-card { background: var(--card-bg,#fff); border: 1px solid var(--border,#e8e4dc); border-radius: 10px; padding: 11px 14px; }
    .admin-member-card.is-banned { border-color: #f5c6c6; background: #fff8f8; }
    .admin-member-name { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
    .admin-member-metas { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .admin-member-metas span { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .admin-ban-btn { font-size: 11px; border: none; border-radius: 5px; padding: 3px 9px; cursor: pointer; margin-left: auto; }
    .admin-ban-btn.ban { background: #fce8e0; color: #9e3a2a; }
    .admin-ban-btn.unban { background: #e8f5e9; color: #2e7d32; }
    .admin-banned-badge { font-size: 11px; color: #9e3a2a; background: #fce8e0; border-radius: 4px; padding: 2px 7px; }
    .admin-req-content { font-size: 13px; flex: 1; line-height: 1.5; white-space: pre-wrap; color: var(--text); }
    .admin-req-meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .admin-req-requester { font-size: 11px; color: var(--muted); background: var(--bg,#f5f0e8); border-radius: 4px; padding: 2px 7px; white-space: nowrap; }
    .admin-req-voters { font-size: 11px; color: var(--muted); background: var(--bg,#f5f0e8); border-radius: 4px; padding: 2px 7px; flex: 1; }
    .admin-req-plan, .admin-suggest-plan { background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 6px; color: #2e7d32; cursor: pointer; font-size: 12px; padding: 4px 10px; white-space: nowrap; }
    .admin-req-plan.is-planned, .admin-suggest-plan.is-planned { background: #2e7d32; color: #fff; border-color: #2e7d32; }
    .admin-req-plan:hover, .admin-suggest-plan:hover { opacity: 0.85; }
    .admin-req-done, .admin-suggest-done { background: var(--green); border: none; border-radius: 6px; color: #fff; cursor: pointer; font-size: 12px; padding: 4px 10px; white-space: nowrap; }
    .admin-req-done.is-done, .admin-suggest-done.is-done { background: #888; }
    .admin-req-done:hover, .admin-suggest-done:hover { opacity: 0.85; }
    .admin-req-content--done { text-decoration: line-through; opacity: 0.5; }
    .admin-req-del { background: none; border: 1px solid #e0d5c5; border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 12px; padding: 4px 10px; white-space: nowrap; }
    .admin-req-del:hover { border-color: #c0392b; color: #c0392b; }
    .admin-req-item.is-done { opacity: 0.45; }
    .admin-req-item.is-done .admin-req-name { text-decoration: line-through; }
    .admin-gate { text-align: center; padding: 60px 20px; color: var(--muted); }
    .admin-empty { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 0; }
    .admin-back { display: inline-block; font-size: 13px; color: rgba(255,255,255,0.85); font-weight: 600; margin-bottom: 4px; text-decoration: underline; text-underline-offset: 2px; }
    .admin-back:hover { color: #fff; opacity: 1; }
    .admin-real-name { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 2px; }
    .admin-realname-edit { background: none; border: none; font-size: 11px; color: #bbb; cursor: pointer; padding: 0 2px; vertical-align: middle; }
    .admin-realname-edit:hover { color: var(--green); }
    .admin-analytics-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
    .admin-analytics-table th { background: var(--bg, #f5f0e8); padding: 7px 10px; text-align: left; font-size: 11px; color: var(--muted); border-bottom: 2px solid var(--border, #e8e4dc); white-space: nowrap; }
    .admin-analytics-table td { padding: 7px 10px; border-bottom: 1px solid var(--border, #e8e4dc); vertical-align: middle; }
    .admin-analytics-table tr:last-child td { border-bottom: none; }
    .admin-analytics-table tr:hover td { background: var(--bg, #f5f0e8); }
    .anat-page { font-weight: 600; color: var(--green); }
    .anat-ref { color: var(--muted); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 분석 기간 섹션 */
    .admin-period-section { margin-bottom: 12px; }
    .admin-period-title { font-size: 13px; font-weight: 800; color: var(--text); padding: 8px 4px; border-bottom: 2px solid var(--border,#e8e4dc); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .admin-period-arrow { font-size: 12px; color: var(--muted); transition: transform 0.2s; margin-left: auto; }
    .admin-period-section.is-open .admin-period-arrow { transform: rotate(180deg); }
    .admin-period-body { display: none; }
    .admin-period-section.is-open .admin-period-body { display: block; }
    /* 접속 상태 배지 */
    .admin-online-status { display: inline-block; font-size: 11px; color: var(--muted); margin-left: 6px; white-space: nowrap; }
    .admin-online-status.is-online { color: #3d8a3d; font-weight: 600; }
    /* 분석 서브 섹션 */
    .admin-sub-section { margin: 6px 0; border: 1px solid var(--border,#e8e4dc); border-radius: 8px; overflow: hidden; }
    .admin-sub-section-title { font-size: 12px; font-weight: 700; color: var(--text); padding: 8px 12px; background: var(--bg,#f5f0e8); cursor: pointer; display: flex; align-items: center; justify-content: space-between; user-select: none; }
    .admin-sub-section-title:hover { background: #ede8df; }
    .admin-sub-section-arrow { font-size: 11px; color: var(--muted); transition: transform 0.2s; }
    .admin-sub-section.is-open > .admin-sub-section-title .admin-sub-section-arrow { transform: rotate(180deg); }
    .admin-sub-section-body { display: none; padding: 8px 0; }
    .admin-sub-section.is-open > .admin-sub-section-body { display: block; }
    .admin-visitor-filter { display: flex; gap: 6px; margin-bottom: 10px; }
    .admin-visitor-filter-btn { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border,#e8e4dc); background: var(--card-bg,#fff); color: var(--muted); cursor: pointer; }
    .admin-visitor-filter-btn.is-active { background: #7a4828; color: #fff; border-color: #7a4828; }
    .admin-visitor-more-btn { display: block; width: 100%; margin-top: 8px; padding: 8px; font-size: 13px; font-weight: 600; color: var(--green); background: transparent; border: 1px dashed var(--border,#e8e4dc); border-radius: 8px; cursor: pointer; text-align: center; }
    .admin-visitor-more-btn:hover { background: #f5f0e8; }
    /* 차트 그리드 */
    .admin-chart-filter { display: flex; gap: 6px; margin-bottom: 12px; }
    .admin-chart-period-btn { font-size: 12px; font-weight: 600; padding: 4px 14px; border-radius: 20px; border: 1px solid var(--border,#e8e4dc); background: var(--card-bg,#fff); color: var(--muted); cursor: pointer; }
    .admin-chart-period-btn.is-active { background: var(--green); color: #fff; border-color: var(--green); }
    .admin-chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .admin-chart-wide { grid-column: 1 / -1; }
    .admin-chart-card { background: var(--card-bg,#fff); border: 1px solid var(--border,#e8e4dc); border-radius: 12px; padding: 14px 14px 10px; }
    .admin-chart-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
    .admin-chart-sub { font-size: 10px; font-weight: 400; color: var(--muted); }
    /* 날짜 탐색 */
    .admin-date-nav { display: none; align-items: center; gap: 6px; margin-bottom: 12px; }
    .admin-date-nav.is-visible { display: flex; }
    .admin-date-nav-arrow { background: var(--card-bg,#fff); border: 1px solid var(--border,#e8e4dc); border-radius: 20px; padding: 3px 10px; cursor: pointer; font-size: 12px; color: var(--muted); line-height: 1.4; }
    .admin-date-nav-arrow:hover { border-color: var(--green); color: var(--green); }
    .admin-date-nav-label { border: 1px solid var(--border,#e8e4dc); border-radius: 20px; padding: 3px 14px; font-size: 12px; font-weight: 700; color: var(--text); background: var(--card-bg,#fff); flex: 1; min-width: 0; cursor: pointer; text-align: center; }
    .admin-date-nav-label:hover { border-color: var(--green); color: var(--green); }
    @media (max-width: 600px) { .admin-chart-grid { grid-template-columns: 1fr; } }
    /* 요약 카드 */
    .admin-summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
    .admin-summary-card { background: var(--card-bg,#fff); border: 1px solid var(--border,#e8e4dc); border-radius: 12px; padding: 14px 16px; }
    .admin-summary-label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.3px; margin-bottom: 5px; }
    .admin-summary-value { font-size: 26px; font-weight: 900; color: var(--text); line-height: 1.1; }
    .admin-summary-sub { font-size: 10px; color: var(--muted); margin-top: 5px; }
    .admin-summary-delta { font-size: 22px; font-weight: 900; }
    .admin-summary-delta.up { color: #2e7d32; }
    .admin-summary-delta.down { color: #9e3a2a; }
    .admin-summary-delta.flat { color: var(--muted); }
    @media (max-width: 600px) { .admin-summary-grid { grid-template-columns: repeat(2, 1fr); } }
    /* 교차분석 */
    .admin-cross-list { display: flex; flex-direction: column; gap: 0; padding: 4px 0; }
    .admin-cross-row { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border,#e8e4dc); }
    .admin-cross-row:last-child { border-bottom: none; }
    .admin-cross-source { font-size: 12px; font-weight: 800; color: var(--text); min-width: 62px; flex-shrink: 0; line-height: 1.3; padding-top: 2px; }
    .admin-cross-total { display: block; font-size: 10px; font-weight: 600; color: var(--muted); }
    .admin-cross-chips { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
    .admin-cross-chip { font-size: 11px; background: var(--bg,#f5f0e8); border-radius: 20px; padding: 3px 10px; color: var(--text); }
    .admin-cross-chip strong { font-weight: 800; color: var(--green); }
    .admin-cross-empty { font-size: 13px; color: var(--muted); text-align: center; padding: 20px 0; }
    /* 관리자 메뉴 카드 */
    .admin-menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 24px; }
    .admin-menu-card { background: var(--card-bg,#fff); border: 1px solid var(--border,#e8e4dc); border-radius: 14px; padding: 18px 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--text); text-align: center; line-height: 1.3; }
    .admin-menu-card:hover { border-color: var(--green); color: var(--green); }
    .admin-menu-icon { font-size: 26px; line-height: 1; }
    .admin-menu-badge { display: inline-block; background: var(--green); color: #fff; border-radius: 20px; font-size: 10px; font-weight: 700; padding: 1px 6px; vertical-align: middle; margin-left: 4px; }
    /* 바텀시트 */
    .admin-bs-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 9200; align-items: flex-end; justify-content: center; }
    .admin-bs-panel { background: #fff; border-radius: 18px 18px 0 0; width: 100%; max-width: 600px; max-height: 88vh; display: flex; flex-direction: column; }
    .admin-bs-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px; border-bottom: 1px solid var(--border,#e8e4dc); flex-shrink: 0; }
    .admin-bs-title { font-size: 16px; font-weight: 800; color: var(--text); }
    .admin-bs-close { background: none; border: none; font-size: 20px; color: var(--muted); cursor: pointer; padding: 2px 6px; line-height: 1; }
    .admin-bs-body { overflow-y: auto; padding: 16px; flex: 1; -webkit-overflow-scrolling: touch; }
  </style>
</head>

<body class="owned-page">
  <script src="../../assets/js/header.js" data-index="false"></script>

  <main>
    <div class="about-hero">
      <a class="admin-back" href="./requests.html">← 요청하기로 돌아가기</a>
      <span class="about-hero-eyebrow">관리자 전용</span>
      <h2>관리자 페이지</h2>
      <p class="about-hero-sub">비주얼 분석 · 요청 관리</p>
    </div>

    <section class="inner-page">
      <div class="inner-page-body" id="mainContent">
        <div class="admin-empty">로딩 중...</div>
      </div>
    </section>
  </main>

  <script src="../../game-system/config/bgg-label-map.js"></script>
  <script src="../../game-system/game-data/library/3-output/cottage-games-data-output.js"></script>
  <script src="../../assets/js/game-display-adapter.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../../assets/js/supabase-config.js"></script>
  <script src="../../assets/js/supabase-client.js"></script>
  <script src="../../assets/js/achievements.js"></script>
  <script src="../../assets/js/script.js"></script>
  <script src="../../assets/js/kakao-auth.js"></script>

  <script>
  (function () {
    function escH(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    async function load() {
      const el = document.getElementById('mainContent');
      if (!window.isOwner?.()) {
        el.innerHTML = '<div class="admin-gate">관리자만 볼 수 있는 페이지예요.</div>';
        return;
      }
      // 관리자 확인됐으면 유입경로 제외 플래그 자동 설정
      localStorage.setItem('cottage_is_admin', '1');

      const cfg = window.SUPABASE_CONFIG;
      if (!cfg || !window.supabase) { el.innerHTML = '<div class="admin-empty">DB 연결 실패</div>'; return; }
      if (!window._cottageSupabaseDb) window._cottageSupabaseDb = window.supabase.createClient(cfg.url, cfg.anonKey);
      const db = window._cottageSupabaseDb;

      const [gameRes, snackRes, suggestRes, profileRes, votesRes, introsRes, voucherRes] = await Promise.all([
        db.from('game_requests').select('id, game_name, request_count, purchase_status, status_date, purchased_at, is_planned, added_at, actual_games, user_id').order('request_count', { ascending: false }),
        db.from('snack_requests').select('id, item_name, request_count, user_id').order('request_count', { ascending: false }),
        db.from('suggestions').select('id, content, created_at, user_id, is_done, is_planned').order('is_done', { ascending: true }).order('created_at', { ascending: false }),
        db.from('profiles').select('user_id, nickname, real_name'),
        db.from('game_request_votes').select('request_id, user_id'),
        db.from('member_intros').select('user_id, nickname').not('user_id', 'is', null),
        db.from('voucher_log').select('id, user_id, delta, reason, product_id, created_at, voucher_products(name)').order('created_at', { ascending: true }),
      ]);

      // user_id → 회원자기소개 닉네임 (타입 불일치 방지용 String() 변환)
      const introNickMap = {};
      (introsRes.data||[]).forEach(i => { if (i.user_id) introNickMap[String(i.user_id)] = i.nickname; });

      const profileMap = {};
      (profileRes.data||[]).forEach(p => { profileMap[String(p.user_id)] = p.nickname || p.real_name || p.user_id?.slice(0,8)+'…'; });
      function nick(userId) { return userId ? (profileMap[String(userId)] || String(userId).slice(0,8)+'…') : '비회원'; }

      // request_id → voter nicknames[]
      const voteMap = {};
      (votesRes.data||[]).forEach(v => {
        if (!voteMap[v.request_id]) voteMap[v.request_id] = [];
        voteMap[v.request_id].push(nick(v.user_id));
      });

      function votersTag(requestId) {
        const voters = voteMap[requestId];
        if (!voters?.length) return '';
        return `<span class="admin-req-voters">👤 ${voters.map(n => escH(n)).join(', ')}</span>`;
      }

      function requesterTag(userId) {
        if (!userId) return '';
        return `<span class="admin-req-requester">${escH(nick(userId))}</span>`;
      }

      const STATUS_LABEL = { '구매예정':'구매 예정', '선주문완료':'선주문 완료', '배송중':'배송중', '추가됨':'추가됨' };
      const STATUS_CLASS = { '구매예정':'req-status-planned', '선주문완료':'req-status-ordered', '배송중':'req-status-shipping', '추가됨':'req-status-added' };
      const fmtDate = s => { if (!s) return ''; const d = new Date(s); return `${d.getMonth()+1}월${d.getDate()}일`; };

      function gameReqItem(r) {
        const done = !!(r.purchased_at || r.purchase_status === '추가됨' || r.added_at);
        const planned = !!r.is_planned;
        let statusBadge = '';
        if (r.purchase_status) {
          const lbl = STATUS_LABEL[r.purchase_status] || r.purchase_status;
          const cls = STATUS_CLASS[r.purchase_status] || 'req-status-planned';
          const dateEl = r.status_date ? ` · <span class="req-date-edit" data-action="edit-status-date" data-id="${r.id}" data-date="${r.status_date}">${fmtDate(r.status_date)}</span>` : '';
          statusBadge = `<span class="req-status-badge ${cls}">${lbl}${dateEl}</span>`;
        } else if (r.purchased_at) {
          statusBadge = `<span class="req-status-badge req-status-done">구매 완료 · <span class="req-date-edit" data-action="edit-purchased-date" data-id="${r.id}" data-date="${r.purchased_at}">${fmtDate(r.purchased_at)}</span></span>`;
        } else if (r.is_planned) {
          statusBadge = `<span class="req-status-badge req-status-planned">구매 예정</span>`;
        }
        const statusPicker = `<span class="req-status-picker-wrap">
          <button class="req-action-btn req-action-status req-status-picker-btn" type="button" data-id="${r.id}">상태 설정 ▾</button>
          <div class="req-status-picker" hidden>
            <button type="button" class="req-status-option" data-action="set-status" data-id="${r.id}" data-status="구매예정">구매 예정</button>
            <button type="button" class="req-status-option" data-action="set-status" data-id="${r.id}" data-status="선주문완료">선주문 완료</button>
            <button type="button" class="req-status-option" data-action="set-status" data-id="${r.id}" data-status="배송중">배송중</button>
            <button type="button" class="req-status-option" data-action="set-status" data-id="${r.id}" data-status="추가됨">📦 추가됨</button>

      function suggestItem(id, content, date, userId, isDone, isPlanned) {
        return `<div class="admin-req-item${isDone?' is-done':isPlanned?' is-planned':''}" data-id="${id}" data-table="suggestions">

          <button class="admin-req-del" type="button" data-id="${id}" data-table="suggestions">삭제</button>
        </div>`;
      }

      const gameHtml = (gameRes.data||[]).map(r => gameReqItem(r)).join('');

      if (voucherRes.error) console.warn('[voucher] 로그 조회 실패', voucherRes.error);
      const voucherRowsAsc = voucherRes.data || [];

      // user별 누적 잔액 계산 (ASC 기준 순차 처리)

              const label = isGrant
                ? (r.reason === 'first_play' ? '첫 기록 보상' : r.reason === 'dev_test' ? '테스트 지급 [DEV]' : '지급')

      el.innerHTML = `

        <div class="admin-bs-overlay" id="bsVoucher">

            <div class="admin-bs-body">${voucherTableHtml}</div>

              <div class="admin-section is-open">

                <div class="admin-section-body">${gameHtml ? `<ul class="req-list">${gameHtml}</ul>` : '<div class="admin-empty">없음</div>'}</div>

              <div class="admin-section">
                <div class="admin-section-title">🍿 간식·음료 요청 <span class="admin-section-count">${snackCount}건</span><span class="admin-section-arrow">▾</span></div>
                <div class="admin-section-body">${snackHtml ? `<ul class="req-list">${snackHtml}</ul>` : '<div class="admin-empty">없음</div>'}</div>
              </div>

              </div>

      // 바텀시트 open/close
      function openAdminBS(id) {
        el.querySelectorAll('.admin-bs-overlay').forEach(o => { o.style.display = 'none'; });
        const overlay = document.getElementById(id);
        if (overlay) overlay.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }
      function closeAdminBS() {
        el.querySelectorAll('.admin-bs-overlay').forEach(o => { o.style.display = 'none'; });
        document.body.style.overflow = '';
      }
      el.querySelectorAll('.admin-menu-card[data-bs]').forEach(card => {
        card.addEventListener('click', () => openAdminBS(card.dataset.bs));
      });
      el.querySelectorAll('.admin-menu-card[data-scroll]').forEach(card => {
        card.addEventListener('click', () => {
          const target = document.getElementById(card.dataset.scroll);
          if (target) { target.classList.add('is-open'); target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        });
      });
      el.querySelectorAll('.admin-bs-close').forEach(btn => btn.addEventListener('click', closeAdminBS));
      el.querySelectorAll('.admin-bs-overlay').forEach(overlay => {
        overlay.addEventListener('click', e => { if (e.target === overlay) closeAdminBS(); });
      });

      // 그룹 접기/펴기
      el.querySelectorAll('.admin-group-title').forEach(title => {
        title.addEventListener('click', () => {
          title.closest('.admin-group').classList.toggle('is-open');
        });
      });
      // 섹션 접기/펴기 (기본 접힘)
      el.querySelectorAll('.admin-section-title').forEach(title => {
        title.addEventListener('click', () => {
          title.closest('.admin-section').classList.toggle('is-open');
        });
      });

      // 삭제 버튼 (게임요청·간식·건의 공통)
      el.querySelectorAll('.admin-req-del').forEach(btn => {
        btn.addEventListener('click', async () => {
          const item = btn.closest('[data-table]');
          if (!confirm('삭제할까요?')) return;
          const table = btn.dataset.table || item?.dataset.table;
          const id = btn.dataset.id || item?.dataset.id;
          await db.from(table).delete().eq('id', id);
          item?.remove();
        });
      });

      // 게임요청 상태 피커
      el.querySelectorAll('.req-status-picker-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const picker = btn.nextElementSibling;
          el.querySelectorAll('.req-status-picker').forEach(p => { if (p !== picker) p.hidden = true; });
          picker.hidden = !picker.hidden;
        });
      });
      el.querySelectorAll('.req-status-option').forEach(opt => {
        opt.addEventListener('click', async e => {
          e.stopPropagation();
          const id = opt.dataset.id;
          const li = opt.closest('li[data-id]');
          const picker = opt.closest('.req-status-picker');
          if (picker) picker.hidden = true;
          const today = new Date().toISOString().slice(0, 10);
          if (opt.dataset.action === 'unset-all') {
            await db.from('game_requests').update({ purchase_status: null, status_date: null, purchased_at: null, is_planned: false }).eq('id', id);
            if (li) { li.classList.remove('req-item-done', 'req-item-planned'); li.querySelector('.req-card-badges')?.remove(); }
          } else if (opt.dataset.action === 'set-status') {
            const status = opt.dataset.status;
            const isDone = status === '추가됨';
            const isPlanned = status === '구매예정';
            await db.from('game_requests').update({ purchase_status: status, status_date: today, purchased_at: null, is_planned: isPlanned }).eq('id', id);
            if (li) {
              li.classList.toggle('req-item-done', isDone);
              li.classList.toggle('req-item-planned', isPlanned && !isDone);
              let badges = li.querySelector('.req-card-badges');
              if (!badges) { badges = document.createElement('span'); badges.className = 'req-card-badges'; li.querySelector('.req-card-count').after(badges); }
              const cls = STATUS_CLASS[status] || 'req-status-planned';
              badges.innerHTML = `<span class="req-status-badge ${cls}">${STATUS_LABEL[status] || status} · ${fmtDate(today)}</span>`;
            }
          }
        });
      });
      document.addEventListener('click', () => el.querySelectorAll('.req-status-picker').forEach(p => { p.hidden = true; }));

      // 건의사항 상태 버튼
      el.querySelectorAll('.admin-suggest-plan').forEach(btn => {
        btn.addEventListener('click', async () => {
          const item = btn.closest('.admin-req-item');
          const isPlanned = btn.classList.contains('is-planned');
          await db.from('suggestions').update({ is_planned: !isPlanned, is_done: false }).eq('id', item.dataset.id);
          btn.classList.toggle('is-planned', !isPlanned);
          btn.textContent = isPlanned ? '예정' : '예정됨';
          item.className = `admin-req-item${!isPlanned?' is-planned':''}`;
        });
      });
      el.querySelectorAll('.admin-suggest-done').forEach(btn => {
        btn.addEventListener('click', async () => {
          const item = btn.closest('.admin-req-item');
          const isDone = btn.classList.contains('is-done');
          await db.from('suggestions').update({ is_done: !isDone, is_planned: false }).eq('id', item.dataset.id);
          btn.classList.toggle('is-done', !isDone);
          btn.textContent = isDone ? '완료' : '완료됨';
          item.className = `admin-req-item${!isDone?' is-done':''}`;
          if (!isDone) { const p = item.querySelector('.admin-suggest-plan'); if (p) { p.classList.remove('is-planned'); p.textContent = '예정'; } }
        });
      });

      // 실제 게임명 삭제
      el.querySelectorAll('.req-actual-remove').forEach(btn => {
        btn.addEventListener('click', async e => {
          e.stopPropagation();
          const id = btn.dataset.id, game = btn.dataset.game;
          const wrap = btn.closest('.req-actual-wrap');
          let cur = []; try { cur = JSON.parse(wrap?.dataset.games || '[]'); } catch {}
          cur = cur.filter(g => g !== game);
          await db.from('game_requests').update({ actual_games: cur }).eq('id', id);
          if (wrap) { wrap.dataset.games = JSON.stringify(cur); btn.closest('.req-actual-tag')?.remove(); const cnt = wrap.querySelector('.req-actual-count'); if (cnt) cnt.textContent = cur.length ? `${cur.length}개` : ''; }
        });
      });

      // 실제 게임명 추가 (초성 검색)
      function _choMatch(q, t) { const tl = t.toLowerCase(), ql = q.toLowerCase(); const cho = s => [...s].map(c => { const n = c.charCodeAt(0); return n >= 0xAC00 ? 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'[Math.floor((n-0xAC00)/28/21)] : c; }).join(''); return tl.includes(ql) || cho(t).includes(ql); }
      el.querySelectorAll('.req-actual-input').forEach(input => {
        const dd = input.nextElementSibling;
        const reqId = input.dataset.reqId;
        input.addEventListener('input', () => {
          const q = input.value.trim(); dd.innerHTML = '';
          if (!q) { dd.hidden = true; return; }
          const matches = (window.COTTAGE_GAMES || []).filter(g => _choMatch(q, g.display || '')).slice(0, 8);
          if (!matches.length) { dd.hidden = true; return; }
          matches.forEach(g => {
            const li = document.createElement('li'); li.className = 'req-actual-option'; li.textContent = g.display;
            li.addEventListener('mousedown', async e => {
              e.preventDefault();
              const wrap = input.closest('.req-actual-wrap');
              let cur = []; try { cur = JSON.parse(wrap?.dataset.games || '[]'); } catch {}
              if (!cur.includes(g.display)) {
                cur.push(g.display);
                await db.from('game_requests').update({ actual_games: cur }).eq('id', reqId);
                if (wrap) {
                  wrap.dataset.games = JSON.stringify(cur);
                  const tagsEl = wrap.querySelector('.req-actual-tags');
                  const newTag = document.createElement('span'); newTag.className = 'req-actual-tag';
                  newTag.innerHTML = `${escH(g.display)}<button class="req-actual-remove" type="button" data-action="remove-actual-game" data-id="${reqId}" data-game="${escH(g.display)}">×</button>`;
                  newTag.querySelector('.req-actual-remove').addEventListener('click', async ev => { ev.stopPropagation(); cur = cur.filter(x => x !== g.display); await db.from('game_requests').update({ actual_games: cur }).eq('id', reqId); wrap.dataset.games = JSON.stringify(cur); newTag.remove(); const cnt = wrap.querySelector('.req-actual-count'); if (cnt) cnt.textContent = cur.length ? `${cur.length}개` : ''; });
                  tagsEl?.appendChild(newTag);
                  const cnt = wrap.querySelector('.req-actual-count'); if (cnt) cnt.textContent = `${cur.length}개`; else { const sum = wrap.querySelector('.req-actual-toggle'); if (sum) { const s = document.createElement('span'); s.className = 'req-actual-count'; s.textContent = `${cur.length}개`; sum.appendChild(s); } }
                }
              }
              input.value = ''; dd.hidden = true;
            });
            dd.appendChild(li);
          });
          dd.hidden = false;
        });
        input.addEventListener('blur', () => setTimeout(() => { dd.hidden = true; }, 150));
      });

      // 밴/밴해제 버튼 — event delegation으로 동적 생성된 카드도 처리
      el.addEventListener('click', async (e) => {
        const btn = e.target.closest('.admin-ban-btn');
        if (!btn) return;
        const uid = btn.dataset.uid;
        const isBanning = btn.classList.contains('ban');
        const label = isBanning ? '밴' : '밴 해제';
        if (!confirm(`이 회원을 ${label}하시겠습니까?`)) return;
        const fn = isBanning ? window.CottageDB?.banUser : window.CottageDB?.unbanUser;
        if (!fn) return;
        const res = await fn(uid);
        if (res?.error) { alert(`${label}에 실패했습니다.`); return; }
        const card = btn.closest('.admin-member-card');
        if (isBanning) {
          card.classList.add('is-banned');
          card.dataset.banned = 'true';
          btn.classList.replace('ban', 'unban');
          btn.textContent = '✅ 밴 해제';
          const nameEl = card.querySelector('.admin-member-name');
          if (nameEl && !nameEl.querySelector('.admin-banned-badge')) {
            nameEl.insertAdjacentHTML('beforeend', ' <span class="admin-banned-badge">🚫 밴됨</span>');
          }
        } else {
          card.classList.remove('is-banned');
          card.dataset.banned = 'false';
          btn.classList.replace('unban', 'ban');
          btn.textContent = '🚫 밴';
          card.querySelector('.admin-banned-badge')?.remove();
        }
      });

    }

    async function loadAnalytics() {
      if (!window.CottageDB?.getPageAnalytics) return;

      // ── 데이터 로드 ────────────────────────────────────────────
      const db2 = window._cottageSupabaseDb;
      const [rows, allProfiles, pvResult, anonResult] = await Promise.all([
        window.CottageDB.getPageAnalytics(),
        window.CottageDB.getAllProfiles(),
        db2 ? db2.from('page_views').select('page, created_at, referrer').order('created_at', { ascending: false }).limit(10000) : Promise.resolve({ data: [] }),
        db2 ? db2.from('anon_sessions').select('session_key, first_seen_at, last_seen_at, visit_count, today_seconds, today_date').order('last_seen_at', { ascending: false }).limit(500) : Promise.resolve({ data: [] }),
      ]);
      const pageViews = pvResult?.data || [];
      const anonSessions = anonResult?.data || [];
      const intros = db2 ? (await db2.from('member_intros').select('user_id,nickname').not('user_id','is',null)).data || [] : [];
      const introNickMap = new Map(intros.map(i => [String(i.user_id), i.nickname]));

      // ── 헬퍼 ────────────────────────────────────────────────────
      const fmtTime = s => {
        if (!s) return '-';
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
        if (h > 0) return m > 0 ? `${h}시간 ${m}분` : `${h}시간`;
        return m > 0 ? (sec > 0 ? `${m}분 ${sec}초` : `${m}분`) : `${sec}초`;
      };

      function dispName(p) {
        const uid = String(p.user_id);
        const nick = introNickMap.get(uid) || p.nickname || p.real_name || uid.slice(0,8)+'…';
        return p.real_name && nick !== p.real_name ? `${nick}(${p.real_name})` : nick;
      }
      const profilesMap = new Map(allProfiles.map(p => [p.user_id, dispName(p)]));
      const profilesByUid = new Map(allProfiles.map(p => [String(p.user_id), p]));

      let subIdx = 0;
      function subSection(title, content, open = false) {
        const id = `asub${subIdx++}`;
        return `<div class="admin-sub-section${open?' is-open':''}" id="${id}">
          <div class="admin-sub-section-title" onclick="document.getElementById('${id}').classList.toggle('is-open')">
            ${title}<span class="admin-sub-section-arrow">▾</span>
          </div>
          <div class="admin-sub-section-body">${content}</div>
        </div>`;
      }

      // KST 날짜 범위 헬퍼
      const DAY_MS = 86400000;
      function kstDayBounds(daysAgo) {
        const nowKst = Date.now() + 9 * 3600000;
        const todayMidKst = Math.floor(nowKst / DAY_MS) * DAY_MS;
        return [
          new Date(todayMidKst - daysAgo * DAY_MS - 9 * 3600000).toISOString(),
          new Date(todayMidKst - (daysAgo - 1) * DAY_MS - 9 * 3600000).toISOString(),
        ];
      }
      const todayKst = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
      const DAY_LABELS = ['오늘', '어제', '그제', '3일 전', '4일 전', '5일 전', '6일 전'];

      function rowsForDay(daysAgo) {
        const [s, e] = kstDayBounds(daysAgo);
        return rows.filter(r => r.entered_at >= s && r.entered_at < e);
      }

      // ── 집계 헬퍼 ────────────────────────────────────────────
      // 같은 사람이 같은 페이지를 당일 여러 번 방문해도 1회로 카운트
      function dedupUserPageDay(rowset) {
        const seen = new Set();
        const out = [];
        for (const r of rowset) {
          if (!r.user_id) { out.push(r); continue; }
          const day = (r.entered_at || '').slice(0, 10);
          const key = r.user_id + '\x00' + r.page + '\x00' + day;
          if (!seen.has(key)) { seen.add(key); out.push(r); }
        }
        return out;
      }

      function buildPageMap(rowset) {
        const m = new Map();
        for (const r of rowset) {
          if (!m.has(r.page)) m.set(r.page, { visits: 0, totalSec: 0, users: new Set() });
          const p = m.get(r.page);
          p.visits++; p.totalSec += r.duration_sec || 0;
          if (r.user_id) p.users.add(r.user_id);
          else if (r.session_key) p.users.add(`anon:${r.session_key}`);
        }
        return [...m.entries()].sort((a, b) => b[1].visits - a[1].visits);
      }

      function buildUserMap(rowset) {
        const m = new Map();
        for (const r of rowset) {
          if (!r.user_id) continue;
          if (!m.has(r.user_id)) m.set(r.user_id, new Map());
          const pm = m.get(r.user_id);
          if (!pm.has(r.page)) pm.set(r.page, { visits: 0, totalSec: 0 });
          pm.get(r.page).visits++; pm.get(r.page).totalSec += r.duration_sec || 0;
        }
        return [...m.entries()].sort((a,b) => {
          const la = profilesByUid.get(String(a[0]))?.last_seen_at || '';
          const lb = profilesByUid.get(String(b[0]))?.last_seen_at || '';
          return lb.localeCompare(la);
        });
      }

      // 비회원 통계 — session_key 기반, page_sessions에서 파생
      function _toKstDate(isoStr) {
        return new Date(new Date(isoStr).getTime() + 9 * 3600000).toISOString().slice(0, 10);
      }
      function buildAnonUserMap(rowset) {
        const m = new Map(); // session_key → { pm, days, todaySec, lastAt }
        for (const r of rowset) {
          if (r.user_id || !r.session_key) continue;
          if (!m.has(r.session_key)) m.set(r.session_key, { pm: new Map(), days: new Set(), todaySec: 0, lastAt: '' });
          const entry = m.get(r.session_key);
          if (!entry.pm.has(r.page)) entry.pm.set(r.page, { visits: 0, totalSec: 0 });
          entry.pm.get(r.page).visits++; entry.pm.get(r.page).totalSec += r.duration_sec || 0;
          if (r.entered_at) {
            const dayKst = _toKstDate(r.entered_at);
            entry.days.add(dayKst);
            if (dayKst === todayKst) entry.todaySec += r.duration_sec || 0;
            if (r.entered_at > entry.lastAt) entry.lastAt = r.entered_at;
          }
        }
        return [...m.entries()].sort((a, b) => b[1].lastAt.localeCompare(a[1].lastAt));
      }

      function renderPageTable(sorted) {
        if (!sorted.length) return '<div class="admin-empty">데이터 없음</div>';
        let h = `<table class="admin-analytics-table"><thead><tr><th>페이지</th><th>방문</th><th>총체류</th><th>평균체류</th><th>로그인</th></tr></thead><tbody>`;
        for (const [page, d] of sorted) {
          const avg = d.visits ? Math.round(d.totalSec / d.visits) : 0;
          h += `<tr><td class="anat-page">${escH(page)}</td><td>${d.visits}회</td><td>${fmtTime(d.totalSec)}</td><td>${fmtTime(avg)}</td><td>${d.users.size}명</td></tr>`;
        }
        return h + '</tbody></table>';
      }

      // 이용상세 > 전체: 로그인 회원 + 비회원 통합 표시
      function renderUserDetailAll(sortedUsers, anonMap = []) {
        const memberHtml = sortedUsers.map(([uid, pm]) => {
          const nick = profilesMap.get(uid) || uid.slice(0,8)+'…';
          const profile = profilesByUid.get(String(uid));
          const visitCount = profile?.visit_count != null ? profile.visit_count + '회' : '-';
          const totalSec = profile?.total_minutes || 0;
          const todayS   = profile?.today_date === todayKst ? (profile?.today_seconds || 0) : 0;
          const sortedPages = [...pm.entries()].sort((a,b)=>b[1].totalSec-a[1].totalSec);
          return `<div style="margin-bottom:6px;">
            <div style="font-size:13px;font-weight:700;color:var(--green);padding:6px 8px 6px;cursor:pointer;user-select:none;background:rgba(0,0,0,0.04);border-radius:6px;" onclick="const b=this.nextElementSibling;const c=b.style.display==='none';b.style.display=c?'block':'none';this.querySelector('.acc-arr').textContent=c?'▼ ':'▶ ';">
              <span class="acc-arr">▶ </span>${escH(nick)}
              <span style="font-size:11px;color:var(--muted);font-weight:400;">
                방문 ${visitCount} · 총체류 ${fmtTime(totalSec)}${todayS > 0 ? ` · 오늘 ${fmtTime(todayS)}` : ''}
              </span>
            </div>
            <div style="display:none;">
            <table class="admin-analytics-table"><thead><tr><th>페이지</th><th>방문</th><th>체류(로그)</th></tr></thead><tbody>
            ${sortedPages.map(([page, d]) => `<tr><td class="anat-page">${escH(page)}</td><td>${d.visits}회</td><td>${fmtTime(d.totalSec)}</td></tr>`).join('')}
            </tbody></table></div></div>`;
        }).join('');

        const anonHtml = anonMap.map(([sk, entry]) => {
          const shortKey = sk.slice(0, 8) + '…';
          const visitCount = entry.days.size + '회';
          const totalSec = [...entry.pm.values()].reduce((s, v) => s + v.totalSec, 0);
          const sortedPages = [...entry.pm.entries()].sort((a,b)=>b[1].totalSec-a[1].totalSec);
          return `<div style="margin-bottom:6px;">
            <div style="font-size:13px;font-weight:700;color:var(--muted);padding:6px 8px 6px;cursor:pointer;user-select:none;background:rgba(0,0,0,0.03);border-radius:6px;" onclick="const b=this.nextElementSibling;const c=b.style.display==='none';b.style.display=c?'block':'none';this.querySelector('.acc-arr').textContent=c?'▼ ':'▶ ';">
              <span class="acc-arr">▶ </span>비회원 <code style="font-size:10px">${escH(shortKey)}</code>
              <span style="font-size:11px;color:var(--muted);font-weight:400;">
                방문 ${visitCount} · 총체류 ${fmtTime(totalSec)}${entry.todaySec > 0 ? ` · 오늘 ${fmtTime(entry.todaySec)}` : ''}
              </span>
            </div>
            <div style="display:none;">
            <table class="admin-analytics-table"><thead><tr><th>페이지</th><th>방문</th><th>체류(로그)</th></tr></thead><tbody>
            ${sortedPages.map(([page, d]) => `<tr><td class="anat-page">${escH(page)}</td><td>${d.visits}회</td><td>${fmtTime(d.totalSec)}</td></tr>`).join('')}
            </tbody></table></div></div>`;
        }).join('');

        if (!sortedUsers.length && !anonMap.length) return '<div class="admin-empty">데이터 없음</div>';
        return memberHtml + (anonHtml ? `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border,#e8e4dc);"><div style="font-size:11px;color:var(--muted);padding:4px 0 6px;font-weight:600;">비로그인 방문자</div>${anonHtml}</div>` : '');
      }

      // 이용상세 > 날짜별: O/X 방문 여부 + 체류시간 (n회 없음)
      function renderUserDetailDay(sortedUsers) {
        if (!sortedUsers.length) return '<div class="admin-empty">데이터 없음 (로그인 세션 필요)</div>';
        let h = '';
        for (const [uid, pm] of sortedUsers) {
          const nick = profilesMap.get(uid) || uid.slice(0,8)+'…';
          const totalSec = [...pm.values()].reduce((s,v)=>s+v.totalSec,0);
          const sortedPages = [...pm.entries()].sort((a,b)=>b[1].totalSec-a[1].totalSec);
          h += `<div style="margin-bottom:6px;">
            <div style="font-size:13px;font-weight:700;color:var(--green);padding:6px 8px 6px;cursor:pointer;user-select:none;background:rgba(0,0,0,0.04);border-radius:6px;" onclick="const b=this.nextElementSibling;const c=b.style.display==='none';b.style.display=c?'block':'none';this.querySelector('.acc-arr').textContent=c?'▼ ':'▶ ';">
              <span class="acc-arr">▶ </span>${escH(nick)} <span style="font-size:11px;color:var(--muted);font-weight:400;">체류 ${fmtTime(totalSec)}</span>
            </div>
            <div style="display:none;">
            <table class="admin-analytics-table"><thead><tr><th>페이지</th><th>방문</th><th>체류시간</th></tr></thead><tbody>`;
          for (const [page, d] of sortedPages) {
            h += `<tr><td class="anat-page">${escH(page)}</td><td style="color:#4a8c4a">O</td><td>${fmtTime(d.totalSec)}</td></tr>`;
          }
          h += '</tbody></table></div></div>';
        }
        return h;
      }

      // ── 요약 카드 + 통합 방문자 목록 ───────────────────────────
      const memberCountEl = document.getElementById('memberCountBadge');
      if (memberCountEl) memberCountEl.textContent = `${allProfiles.length}명`;

      const _now = Date.now();
      const cnt30dNew = allProfiles.filter(p => p.first_seen_at && _now - new Date(p.first_seen_at).getTime() < 30 * 86400000).length;
      const summaryCardsHtml = `<div class="admin-summary-grid" style="grid-template-columns:1fr;margin-bottom:12px">
        <div class="admin-summary-card"><div class="admin-summary-label">30일 신규</div><div class="admin-summary-value">${cnt30dNew}명</div></div>
      </div>`;

      const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' }) : '-';
      // page_sessions 기반 비회원 집계 (방문일수·오늘초·총초) — DB 컬럼보다 정확한 역사 데이터
      const anonPageMap = new Map(buildAnonUserMap(rows));

      const unified = [
        ...allProfiles.map(p => ({ _type: 'member', _last: p.last_seen_at || '', ...p })),
        ...anonSessions.map(a => ({ _type: 'anon', _last: a.last_seen_at || '', ...a }))
      ].sort((a, b) => b._last.localeCompare(a._last));

      const memberCount = allProfiles.length;
      const anonCount = anonSessions.length;
      const visitorFilterBar = `<div class="admin-visitor-filter" id="visitorFilterBar">
        <button class="admin-visitor-filter-btn is-active" data-filter="all" onclick="applyVisitorFilter('all',this)">전체 (${unified.length})</button>
        <button class="admin-visitor-filter-btn" data-filter="member" onclick="applyVisitorFilter('member',this)">회원 (${memberCount})</button>
        <button class="admin-visitor-filter-btn" data-filter="anon" onclick="applyVisitorFilter('anon',this)">비회원 (${anonCount})</button>
      </div>`;
      const _renderVisitorCard = u => {
        if (u._type === 'member') {
          const p = u;
          const todayS = p.today_date === todayKst ? (p.today_seconds || 0) : 0;
          const totalS = p.total_minutes || 0;
          const isBanned = !!p.is_banned;
          const isMe = String(p.user_id) === '4916417947';
          const nick = introNickMap.get(String(p.user_id)) || p.nickname || p.real_name || '(닉네임없음)';
          const dnHtml = p.real_name
            ? `${escH(nick)}<span class="admin-real-name">(${escH(p.real_name)})</span>`
            : escH(nick);
          return `<div class="admin-member-card${isBanned?' is-banned':''}" data-uid="${escH(p.user_id)}" data-banned="${isBanned}" data-last-seen="${escH(p.last_seen_at||'')}" data-visitor-type="member">
            <div class="admin-member-name">${dnHtml}<span style="font-size:10px;background:#e8f4e8;color:#2e7d32;border-radius:3px;padding:1px 5px;margin-left:4px;font-weight:600">회원</span>${isBanned?' <span class="admin-banned-badge">🚫 밴됨</span>':''}${isMe?' <span style="font-size:11px;color:#7a4828">👑 관리자</span>':''}<span class="admin-online-status" data-uid="${escH(p.user_id)}"></span></div>
            <div class="admin-member-metas">
              <span>가입 ${fmtDate(p.first_seen_at)}</span>
              <span>최근 ${fmtDate(p.last_seen_at)}</span>
              <span>방문 ${p.visit_count != null ? p.visit_count + '회' : '-'}</span>
              ${todayS > 0 ? `<span style="color:#7a4828;font-weight:600">오늘 ${fmtTime(todayS)}</span>` : ''}
              <span>⏱ ${fmtTime(totalS)}</span>
              ${isMe ? '' : `<button class="admin-ban-btn ${isBanned?'unban':'ban'}" data-uid="${escH(p.user_id)}">${isBanned?'✅ 밴 해제':'🚫 밴'}</button>`}
            </div>
          </div>`;
        } else {
          const a = u;
          const { text: statusText, online } = fmtOnlineStatus(a.last_seen_at);
          const shortKey = a.session_key.slice(0, 8) + '…';
          const ent = anonPageMap.get(a.session_key);
          const anonVisitCount = ent ? ent.days.size + '회' : (a.visit_count != null ? a.visit_count + '회' : '-');
          const anonTodayS = ent ? ent.todaySec : (a.today_date === todayKst ? (a.today_seconds || 0) : 0);
          const anonTotalS = ent ? [...ent.pm.values()].reduce((s, v) => s + v.totalSec, 0) : 0;
          return `<div class="admin-member-card" data-last-seen="${a.last_seen_at || ''}" data-visitor-type="anon" style="opacity:${online ? 1 : 0.7}">
            <div class="admin-member-name">비회원 <code style="font-size:11px;color:var(--muted)">${escH(shortKey)}</code><span style="font-size:10px;background:#f5f0e8;color:var(--muted);border-radius:3px;padding:1px 5px;margin-left:4px;font-weight:600">비로그인</span>
              <span class="admin-online-status${online ? ' is-online' : ''}">${escH(statusText)}</span>
            </div>
            <div class="admin-member-metas">
              <span>첫 방문 ${fmtDate(a.first_seen_at)}</span>
              <span>최근 ${fmtDate(a.last_seen_at)}</span>
              <span>방문 ${anonVisitCount}</span>
              ${anonTodayS > 0 ? `<span style="color:#7a4828;font-weight:600">오늘 ${fmtTime(anonTodayS)}</span>` : ''}
              ${anonTotalS > 0 ? `<span>⏱ ${fmtTime(anonTotalS)}</span>` : ''}
            </div>
          </div>`;
        }
      };
      const _visFirst = unified.slice(0, 3);
      const _visExtra = unified.slice(3);
      const unifiedHtml = unified.length ? (
        visitorFilterBar +
        `<div class="admin-req-list" id="visitorList">${_visFirst.map(_renderVisitorCard).join('')}</div>` +
        (_visExtra.length
          ? `<div id="visitorExtras" style="display:none"><div class="admin-req-list">${_visExtra.map(_renderVisitorCard).join('')}</div></div>
             <button class="admin-visitor-more-btn" id="visitorMoreBtn" onclick="expandVisitorMore()">더보기 (${_visExtra.length}명 더) ▾</button>`
          : '')
      ) : '<div class="admin-empty">방문자 없음</div>';


      // ── 사용자별 이용 상세 (page_sessions 기반, 날짜별) ─────────
      const userDayParts = DAY_LABELS.map((label, i) => {
        const dr = dedupUserPageDay(rowsForDay(i));
        return subSection(
          `${label} <span style="font-size:11px;color:var(--muted)">${dr.length}세션</span>`,
          renderUserDetailDay(buildUserMap(dr)),
          false
        );
      }).join('');
      const userAllDetail = renderUserDetailAll(buildUserMap(dedupUserPageDay(rows)), buildAnonUserMap(rows));

      // ── 페이지별 (날짜별) ────────────────────────────────────
      const pageDayParts = DAY_LABELS.map((label, i) => {
        const dr = dedupUserPageDay(rowsForDay(i));
        return subSection(
          `${label} <span style="font-size:11px;color:var(--muted)">${dr.length}세션</span>`,
          renderPageTable(buildPageMap(dr)),
          false
        );
      }).join('');
      const pageAllDetail = renderPageTable(buildPageMap(dedupUserPageDay(rows)));

    function renderCharts(rows, allProfiles, profilesMap, pageViews = []) {
      if (!window.Chart) return;

      const ADMIN_UID = '4916417947';

      const _chartInstances = {};

      // ── 헬퍼 ──────────────────────────────────────────────────────────
      function kstDate(isoStr) {
        return new Date(new Date(isoStr).getTime() + 9 * 3600000).toISOString().slice(0, 10);
      }
      function kstHour(isoStr) {
        return (new Date(isoStr).getUTCHours() + 9) % 24;
      }
      function kstDateStr(date) {
        return new Date((date ? date.getTime() : Date.now()) + 9 * 3600000).toISOString().slice(0, 10);
      }
      function toWeekStr(date) {
        const d = new Date(date.getTime() + 9 * 3600000);
        d.setUTCHours(0, 0, 0, 0);
        d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        const week = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
        return `${d.getUTCFullYear()}-W${String(week).padStart(2, '0')}`;
      }
      function calcRange(type, value) {
        if (type === 'all' || !type) return { start: null, end: null };
        if (type === 'day') {
          const [y, m, d] = value.split('-').map(Number);
          const s = Date.UTC(y, m - 1, d) - 9 * 3600000;
          return { start: new Date(s).toISOString(), end: new Date(s + 86400000).toISOString() };
        }
        if (type === 'week') {
          const [yearStr, weekStr] = value.split('-W');
          const y = Number(yearStr), w = Number(weekStr);
          const jan4 = new Date(Date.UTC(y, 0, 4));
          const dow = (jan4.getUTCDay() + 6) % 7;
          const weekMon = new Date(jan4.getTime() - dow * 86400000 + (w - 1) * 7 * 86400000);
          const s = weekMon.getTime() - 9 * 3600000;
          return { start: new Date(s).toISOString(), end: new Date(s + 7 * 86400000).toISOString() };
        }
        if (type === 'month') {
          const [y, m] = value.split('-').map(Number);
          const s = Date.UTC(y, m - 1, 1) - 9 * 3600000;
          const e = Date.UTC(y, m, 1) - 9 * 3600000;
          return { start: new Date(s).toISOString(), end: new Date(e).toISOString() };
        }
        return { start: null, end: null };
      }
      function filterByRange(data, start, end, field) {
        if (!start && !end) return data;
        return data.filter(r => {
          const v = r[field];
          return (!start || v >= start) && (!end || v < end);
        });
      }
      function periodLabelFor(type, value) {

          const [y, m, d] = value.split('-');
          const dateStr = `${y}.${Number(m)}.${Number(d)} (${dow})`;

          if (value === today) return `오늘 · ${dateStr}`;

        if (type === 'week') {

          'my-board-voucher': '내 보드 > 교환권', 'my-board-notif': '내 보드 > 소식',

        function _punycodeLabel(s) {
          if (!s.startsWith('xn--')) return s;
          s = s.slice(4);
          const B=36,Tm=1,TX=26,SK=38,DM=700,B0=72,N0=128;
          const dg=c=>c<48?B:c<58?c-22:c<65?B:c<91?c-65:c<97?B:c<123?c-97:B;
          const ad=(d,n,f)=>{d=f?Math.floor(d/DM):d>>1;d+=Math.floor(d/n);let k=0;while(d>((B-Tm)*TX)>>1){d=Math.floor(d/(B-Tm));k+=B;}return k+Math.floor((B-Tm+1)*d/(d+SK));};
          const out=[];const sep=s.lastIndexOf('-');
          for(let j=0;j<(sep>0?sep:0);j++)out.push(s.charCodeAt(j));
          let pos=sep>0?sep+1:0,n=N0,i=0,bias=B0;
          while(pos<s.length){const oi=i;let w=1;for(let k=B;;k+=B){const d=dg(s.charCodeAt(pos++));i+=d*w;const t=k<=bias?Tm:k>=bias+TX?TX:k-bias;if(d<t)break;w*=B-t;}bias=ad(i-oi,out.length+1,oi===0);n+=Math.floor(i/(out.length+1));i%=out.length+1;out.splice(i++,0,n);}
          return String.fromCodePoint(...out);
        }
        function _decodeHost(host) { return host.split('.').map(_punycodeLabel).join('.'); }
        const _utmBrandMap = { kakao: '카카오', kakao_club: '카카오 동호회', qr: 'QR', store_qr: '매장 QR', flyer_qr: '전단지 QR', boardlife: '보드라이프', naver: '네이버', naver_place: '네이버 플레이스', google: '구글', daangn: '당근마켓', instagram: '인스타그램', blog: '블로그', cafe: '카페', youtube: '유튜브' };

        function categorizeRef(ref) {

        // __visitor__ 마커 행만: 히어로 페이지와 동일 방식으로 방문자 집계

        const VIRTUAL_PAGE_PREFIX = 'my-board';
        for (const r of filteredPV) {
          if (!r.page?.startsWith(VIRTUAL_PAGE_PREFIX)) continue;
          const key = (r.user_id || 'pv') + '|' + r.page + '|' + kstDate(r.created_at);
          if (seen2.has(key)) continue;
          seen2.add(key);
          pageUniq[r.page] = (pageUniq[r.page] || 0) + 1;
        }
        const topPages = Object.entries(pageUniq).sort((a, b) => b[1] - a[1]).slice(0, 8);
        document.getElementById('chartPagesSub').textContent = label;
        makeOrUpdate('chartPages', 'bar', {
          labels: topPages.map(([p]) => PAGE_LABEL[p] || p),
          datasets: [{ data: topPages.map(([, v]) => v), backgroundColor: C2, borderRadius: 4 }],
        }, {
          indexAxis: 'y',
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: GRID }, ticks: { font: { size: 10 }, stepSize: 1, precision: 0 } },
            y: { grid: { display: false }, ticks: { font: { size: 10 }, autoSkip: false } },
          },
        });

        // ── 4. 유입경로 × 페이지 교차분석 ───────────────────────────
        {
          const crossMap = {};
          // 명 카운트: filteredVisitor(__visitor__ 행) 기준
          const crossUserMap = {};
          for (const r of filteredVisitor) {
            const cat = categorizeRef(r.referrer) || '직접 방문';
            crossUserMap[cat] = (crossUserMap[cat] || 0) + 1;
          }
          for (const r of filteredPV) {
            const cat = categorizeRef(r.referrer) || '직접 방문';
            const pg = PAGE_LABEL[r.page] || r.page || '?';
            if (!crossMap[cat]) crossMap[cat] = {};
            crossMap[cat][pg] = (crossMap[cat][pg] || 0) + 1;
          }
          document.getElementById('chartCrossSub').textContent = label;
          const crossEl = document.getElementById('chartCrossRef');
          if (crossEl) {
            if (!Object.keys(crossMap).length) {
              crossEl.innerHTML = '<div class="admin-cross-empty">유입 데이터 없음</div>';
            } else {
              const sources = Object.entries(crossMap).sort((a, b) =>
                Object.values(b[1]).reduce((s, v) => s + v, 0) - Object.values(a[1]).reduce((s, v) => s + v, 0)
              );
              crossEl.innerHTML = `<div class="admin-cross-list">${sources.map(([src, pages]) => {
                const sortedPgs = Object.entries(pages).sort((a, b) => b[1] - a[1]);
                const total = Object.values(pages).reduce((s, v) => s + v, 0);
                const uCnt = crossUserMap[src] || 0;
                return `<div class="admin-cross-row">
                  <div class="admin-cross-source">${escH(src)}<span class="admin-cross-total">${uCnt}명 (${total}회)</span></div>
                  <div class="admin-cross-chips">${
                    sortedPgs.map(([pg, cnt]) => `<span class="admin-cross-chip">${escH(pg)} <strong>${cnt}</strong></span>`).join('')
                  }</div>
                </div>`;
              }).join('')}</div>`;
            }
          }
        }

        // ── 보조: 시간대별 — page_views 기반 방문 시간대 패턴 ──────
        const hourly = new Array(24).fill(0);
        for (const pv of filteredPV) hourly[kstHour(pv.created_at)]++;
        const hMax = Math.max(...hourly) || 1;
        document.getElementById('chartHourlySub').textContent = label;
        makeOrUpdate('chartHourly', 'bar', {
          labels: Array.from({ length: 24 }, (_, i) => `${i}시`),
          datasets: [{
            data: hourly,
            backgroundColor: hourly.map(v => `rgba(158,58,42,${(0.25 + 0.75 * v / hMax).toFixed(2)})`),
            borderRadius: 3,
          }],
        }, {
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 9 }, maxRotation: 0 } },
            y: { beginAtZero: true, grid: { color: GRID }, ticks: { stepSize: 1 } },
          },
        });

        // ── 보조: 방문자 구성 도넛 ──────────────────────────────────
        const totalCount = filteredPV.length;
        const fromMs = start ? new Date(start).getTime() : 0;
        const memberUidSet = new Set();
        for (const p of allProfiles) {
          if (!p.last_seen_at) continue;
          if (fromMs && new Date(p.last_seen_at).getTime() < fromMs) continue;
          memberUidSet.add(p.user_id);
        }
        const mCnt = Math.min(memberUidSet.size, totalCount);
        const gCnt = Math.max(0, totalCount - mCnt);
        document.getElementById('chartRatioSub').textContent = label;
        makeOrUpdate('chartMemberRatio', 'doughnut', {
          labels: [`회원 (${mCnt}명)`, `비회원 (${gCnt}명)`],
          datasets: [{ data: [mCnt, gCnt], backgroundColor: [C1, CMUTED], borderWidth: 0 }],
        }, {
          cutout: '60%',
          plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } },
        });

        // ── 보조: 회원별 이용시간 ────────────────────────────────────
        const fmtHM = s => s >= 3600
          ? `${Math.floor(s/3600)}시간 ${Math.floor((s%3600)/60)}분`
          : `${Math.floor(s/60)}분 ${s%60}초`;
        let memberSecMap;
        const todayKst = kstDateStr();
        if (!start) {
          memberSecMap = new Map(allProfiles.map(p => [p.user_id, p.total_minutes || 0]));
        } else if (type === 'day' && start === calcRange('day', todayKst).start) {
          memberSecMap = new Map(allProfiles.map(p => [
            p.user_id,
            p.today_date === todayKst ? (p.today_seconds || 0) : 0,
          ]));
        } else {
          memberSecMap = new Map();
          for (const r of filtered) {
            if (!r.user_id) continue;
            memberSecMap.set(r.user_id, (memberSecMap.get(r.user_id) || 0) + (r.duration_sec || 0));
          }
        }
        document.getElementById('chartMemberTimeSub').textContent = label;
        const topMembers = allProfiles
          .map(p => ({ uid: p.user_id, name: profilesMap?.get(p.user_id) || p.nickname || '?', secs: memberSecMap.get(p.user_id) || 0 }))
          .filter(m => m.secs > 0)
          .sort((a, b) => b.secs - a.secs)
          .slice(0, 10);
        if (topMembers.length) {
          makeOrUpdate('chartMemberTime', 'bar', {
            labels: topMembers.map(m => m.name),
            datasets: [{
              data: topMembers.map(m => m.secs),
              backgroundColor: C3, borderColor: C2, borderWidth: 1, borderRadius: 4,
            }],
          }, {
            indexAxis: 'y',
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: ctx => fmtHM(topMembers[ctx.dataIndex].secs) } },
            },
            scales: {
              x: {
                grid: { color: GRID },
                ticks: { callback: v => v >= 3600 ? `${Math.floor(v/3600)}h` : `${Math.floor(v/60)}m`, font: { size: 10 } },
              },
              y: { grid: { display: false }, ticks: { font: { size: 11 } } },
            },
          });
        }
      }

      // 날짜 탐색 상태
      let _navType = 'day';
      let _navValue = kstDateStr();
      const _today = kstDateStr();

      function _updateNavLabel() {
        const lbl = document.getElementById('chartDateLabel');
        if (lbl) lbl.textContent = _navType === 'all' ? '' : periodLabelFor(_navType, _navValue);
      }

      function _drawForNav() {
        const { start, end } = calcRange(_navType, _navValue);
        draw(start, end, periodLabelFor(_navType, _navValue), _navType);
        _updateNavLabel();
      }

      function _stepNav(dir) {
        if (_navType === 'day') {
          const d = new Date(_navValue + 'T12:00:00Z');
          d.setUTCDate(d.getUTCDate() + dir);
          _navValue = d.toISOString().slice(0, 10);
          if (_navValue > _today) _navValue = _today;
        } else if (_navType === 'week') {
          const { start: ws } = calcRange('week', _navValue);
          _navValue = toWeekStr(new Date(new Date(ws).getTime() + 9 * 3600000 + dir * 7 * 86400000));
          const _thisWeek = toWeekStr(new Date());
          if (_navValue > _thisWeek) _navValue = _thisWeek;
        } else if (_navType === 'month') {
          const [y, m] = _navValue.split('-').map(Number);
          const nd = new Date(Date.UTC(y, m - 1 + dir, 1));
          _navValue = nd.toISOString().slice(0, 7);
          if (_navValue > _today.slice(0, 7)) _navValue = _today.slice(0, 7);
        }
        const _di = document.getElementById('chartDateInput');
        if (_di) _di.value = _navValue;
        _drawForNav();
      }

      // 기본값: 오늘
      const _di0 = document.getElementById('chartDateInput');
      if (_di0) { _di0.type = 'date'; _di0.value = _today; _di0.max = _today; }
      _drawForNav();

      // 레이블 클릭 → picker 열기
      const _lblEl = document.getElementById('chartDateLabel');
      if (_lblEl) _lblEl.addEventListener('click', () => {
        const di = document.getElementById('chartDateInput');
        if (di) try { di.showPicker(); } catch (_) {}
      });

      // 기간 버튼 이벤트
      const btns = document.getElementById('chartPeriodBtns');
      const navEl = document.getElementById('chartDateNav');
      if (btns) {
        btns.addEventListener('click', e => {
          const btn = e.target.closest('.admin-chart-period-btn');
          if (!btn) return;
          btns.querySelectorAll('.admin-chart-period-btn').forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          const days = Number(btn.dataset.days);
          const di = document.getElementById('chartDateInput');
          if (days === 0) {
            _navType = 'all'; _navValue = '';
            navEl?.classList.remove('is-visible');
            draw(null, null, '전체', 'all');
          } else if (days === 1) {
            _navType = 'day'; _navValue = _today;
            if (di) { di.type = 'date'; di.value = _today; di.max = _today; }
            navEl?.classList.add('is-visible');
            _drawForNav();
          } else if (days === 7) {
            _navType = 'week'; _navValue = toWeekStr(new Date());
            if (di) { di.type = 'week'; di.value = _navValue; di.max = toWeekStr(new Date()); }
            navEl?.classList.add('is-visible');
            _drawForNav();
          } else if (days === 30) {
            _navType = 'month'; _navValue = _today.slice(0, 7);
            if (di) { di.type = 'month'; di.value = _navValue; di.max = _today.slice(0, 7); }
            navEl?.classList.add('is-visible');
            _drawForNav();
          }
        });
      }

      const _diEl = document.getElementById('chartDateInput');
      if (_diEl) _diEl.addEventListener('change', e => { _navValue = e.target.value; _drawForNav(); });
      const _prevBtn = document.getElementById('chartNavPrev');
      const _nextBtn = document.getElementById('chartNavNext');
      if (_prevBtn) _prevBtn.addEventListener('click', () => _stepNav(-1));
      if (_nextBtn) _nextBtn.addEventListener('click', () => _stepNav(1));
    }

    // ── 접속 상태 배지 ──────────────────────────────────────────
    function fmtOnlineStatus(lastSeenAt) {
      if (!lastSeenAt) return { text: '', online: false };
      const diff = Date.now() - new Date(lastSeenAt).getTime();
      const secs = Math.floor(diff / 1000);
      if (secs < 120) return { text: '🟢 접속중', online: true };
      const mins = Math.floor(secs / 60);
      if (mins < 60) return { text: `⚪ ${mins}분 전`, online: false };
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return { text: `⚪ ${hrs}시간 전`, online: false };
      return { text: `⚪ ${Math.floor(hrs / 24)}일 전`, online: false };
    }

    function refreshOnlineBadges() {
      document.querySelectorAll('.admin-member-card[data-last-seen]').forEach(card => {
        const lastSeen = card.dataset.lastSeen;
        const badge = card.querySelector('.admin-online-status');
        if (!badge) return;
        const { text, online } = fmtOnlineStatus(lastSeen);
        badge.textContent = text;
        badge.classList.toggle('is-online', online);
      });
    }

    // 30초마다 배지 표시 갱신 (DB 재조회 없이 시간 재계산)
    setInterval(refreshOnlineBadges, 30 * 1000);

    // 2분마다 DB 재조회 → data-last-seen 업데이트 후 배지 갱신
    let _profilesCache = [];
    async function refreshProfilesAndBadges() {
      if (!window.CottageDB) return;
      try {
        _profilesCache = await window.CottageDB.getAllProfiles();
        for (const p of _profilesCache) {
          const card = document.querySelector(`.admin-member-card[data-uid="${p.user_id}"]`);
          if (card && p.last_seen_at) card.dataset.lastSeen = p.last_seen_at;
        }
        refreshOnlineBadges();
      } catch (_) {}
    }
    setInterval(refreshProfilesAndBadges, 2 * 60 * 1000);

    let tried = false;
    function tryLoad() {
      if (tried) return; tried = true;
      load().then(loadAnalytics).then(() => {
        // 초기 렌더 직후 배지 표시
        setTimeout(refreshOnlineBadges, 100);
      });
    }
    window.addEventListener('cottage-auth-changed', tryLoad);
    setTimeout(tryLoad, 1200);
  })();

  function applyVisitorFilter(type, btn) {
    document.querySelectorAll('#visitorFilterBar .admin-visitor-filter-btn').forEach(b => b.classList.remove('is-active'));
    if (btn) btn.classList.add('is-active');
    const extrasEl = document.getElementById('visitorExtras');
    if (extrasEl) extrasEl.style.display = 'block';
    document.getElementById('visitorCloseBtn')?.remove();
    const allCards = [...document.querySelectorAll('#visitorList .admin-member-card, #visitorExtras .admin-member-card')];
    const matched = type === 'all' ? allCards : allCards.filter(c => c.dataset.visitorType === type);
    allCards.forEach(c => c.style.display = 'none');
    matched.slice(0, 3).forEach(c => c.style.display = '');
    const moreBtn = document.getElementById('visitorMoreBtn');
    const hiddenCount = matched.length - 3;
    if (moreBtn) {
      if (hiddenCount > 0) {
        moreBtn.style.display = '';
        moreBtn.textContent = '더보기 (' + hiddenCount + '명 더) ▾';
        moreBtn.onclick = () => expandVisitorMore();
      } else {
        moreBtn.style.display = 'none';
      }
    }
  }

  function expandVisitorMore() {
    const activeFilter = document.querySelector('#visitorFilterBar .admin-visitor-filter-btn.is-active')?.dataset.filter || 'all';
    const allCards = [...document.querySelectorAll('#visitorList .admin-member-card, #visitorExtras .admin-member-card')];
    const matched = activeFilter === 'all' ? allCards : allCards.filter(c => c.dataset.visitorType === activeFilter);
    matched.forEach(c => c.style.display = '');
    const moreBtn = document.getElementById('visitorMoreBtn');
    if (moreBtn) moreBtn.style.display = 'none';
    const thirdCard = matched[2];
    if (thirdCard) {
      const closeBtn = document.createElement('button');
      closeBtn.id = 'visitorCloseBtn';
      closeBtn.className = 'admin-visitor-more-btn';
      closeBtn.textContent = '닫기 ▲';
      closeBtn.onclick = () => {
        const ab = document.querySelector('#visitorFilterBar .admin-visitor-filter-btn.is-active');
        applyVisitorFilter(ab?.dataset.filter || 'all', ab);
      };
      thirdCard.insertAdjacentElement('afterend', closeBtn);
    }
  }

  </script>
