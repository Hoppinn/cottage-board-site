            const wStartMs = new Date(wStart).getTime();
            const weekArr = [];
            for (let i = 3; i >= 0; i--) weekArr.push(toWeekStr(new Date(wStartMs - i * 7 * 86400000)));
            const wVis = Object.fromEntries(weekArr.map(k => [k, 0]));
            for (const pv of visitorRows) {
              const wk = toWeekStr(new Date(pv.created_at));
              if (wk in wVis) wVis[wk]++;
            }
            chartLabels = weekArr.map(w => periodLabelFor('week', w));
            thisData = weekArr.map(w => wVis[w]);

          } else if (type === 'month' || type === 'all') {
            const base = type === 'all' ? kstDateStr().slice(0, 7) : baseStr.slice(0, 7);
            const [cy, cm] = base.split('-').map(Number);
            const monthArr = [];
            for (let i = 11; i >= 0; i--) {
              let m = cm - i, y = cy;
              while (m <= 0) { m += 12; y--; }
              monthArr.push(`${y}-${String(m).padStart(2, '0')}`);
            }
            const mVis = Object.fromEntries(monthArr.map(k => [k, 0]));
            for (const pv of visitorRows) {
              const k = kstDate(pv.created_at).slice(0, 7);
              if (k in mVis) mVis[k]++;
            }
            chartLabels = monthArr.map(k => `${k.split('-')[0].slice(2)}년 ${Number(k.split('-')[1])}월`);
            thisData = monthArr.map(k => mVis[k]);

          } else {
            const thisKeys = [], prevKeys = [];
            const thisVis = {}, prevVisObj = {};
            for (let i = 6; i >= 0; i--) { const k = _addDays(baseStr, -i); thisKeys.push(k); thisVis[k] = 0; }
            for (let i = 13; i >= 7; i--) { const k = _addDays(baseStr, -i); prevKeys.push(k); prevVisObj[k] = 0; }
            for (const pv of visitorRows) {
              const k = kstDate(pv.created_at);
              if (k in thisVis) thisVis[k]++;
              if (k in prevVisObj) prevVisObj[k]++;
            }
            const DOW = ['일','월','화','수','목','금','토'];
            chartLabels = thisKeys.map(k => `${k.slice(5)} (${DOW[new Date(k + 'T12:00:00Z').getUTCDay()]})`);
            thisData = thisKeys.map(k => thisVis[k]);
            prevDataArr = prevKeys.map(k => prevVisObj[k]);
          }

          const datasets = [{
            label: '이번 기간',
            data: thisData,
            borderColor: C1, backgroundColor: 'rgba(158,58,42,0.07)',
            fill: true, tension: 0.35, pointRadius: 4, pointBackgroundColor: C1, borderWidth: 2,
          }];
          if (prevDataArr) {
            datasets.push({
              label: '이전 7일',
              data: prevDataArr,
              borderColor: CMUTED, backgroundColor: 'transparent',
              fill: false, tension: 0.35, pointRadius: 3, pointBackgroundColor: CMUTED,
              borderWidth: 1.5, borderDash: [5, 4],
            });
          }
          makeOrUpdate('chartDaily', 'line', { labels: chartLabels, datasets }, {
            plugins: { legend: { display: !!prevDataArr, labels: { font: { size: 11 }, boxWidth: 24, padding: 12 } } },
            scales: {
              x: { grid: { color: GRID }, ticks: { font: { size: 10 } } },
              y: { beginAtZero: true, grid: { color: GRID }, ticks: { stepSize: 1 } },
            },
          });
        }

        // ── 2. 유입 경로 — 수평 막대 (__visitor__ 기준 명/회) ──
        const filteredVisitor = filterByRange(visitorRows, start, end, 'created_at');
        const refMap = {}, refUserMap = {};
        filteredVisitor.forEach((r, idx) => {
          const cat = (r.referrer ? (categorizeRef(r.referrer) || '귀속 불가') : '직접 방문');
          refMap[cat] = (refMap[cat] || 0) + 1;
          if (!refUserMap[cat]) refUserMap[cat] = new Set();
          refUserMap[cat].add(visitorKey(r, idx, cat));
        });
        // page_sessions에 referrer 컬럼이 있으므로 직접 집계 (join 불필요)
        //
        // 🚨 `|| '직접 방문'` 폴백을 여기에 쓰면 안 된다(#28, 2026-07-21). 이 루프만 모집단이
        //    page_sessions인데, 2026-07-21 이전 행은 script-nav.js가 **유입 소스 대신 referrer
        //    페이지의 내부 라벨**(`메인`·`/pages/info/guide.html`)을 넣어뒀다. categorizeRef는
        //    그걸 전부 null로 떨구므로 폴백을 걸면 **귀속 불가를 진짜 직접 방문으로 위조**한다
        //    (실측: 11,825행 중 8,382행 = 71%가 「직접 방문」 272h로 뭉쳐 채널별 체류가 과소).
        //    referrer가 아예 없는 행만 직접 방문이고, 값이 있는데 분류 실패면 **세지 않고 따로 센다**.
        //    ※ 위 refMap/아래 crossMap은 page_views(`effectiveSource`, 올바른 규칙)라 해당 없음.
        const refSecMap = {};
        let refUnattribSec = 0, refUnattribRows = 0;
        for (const r of filtered) {
          const cat = r.referrer ? categorizeRef(r.referrer) : '직접 방문';
          if (!cat) { refUnattribSec += (r.duration_sec || 0); refUnattribRows++; continue; }
          refSecMap[cat] = (refSecMap[cat] || 0) + (r.duration_sec || 0);
        }
        const refEntries = Object.entries(refMap).sort((a, b) => b[1] - a[1]);
        const chartRefSub = document.getElementById('chartRefSub');
        // 원칙 ① — 제외된 체류를 조용히 없애지 않는다. 막대의 체류시간 합이 전체와 안 맞는
        // 이유를 화면에서 바로 알 수 있어야 한다(#28의 옛 행은 유입 소스가 기록되지 않았다).
        if (chartRefSub) chartRefSub.textContent = label +
          (refUnattribRows ? ` · 유입 소스 미기록 ${refUnattribRows}건(${fmtTime(refUnattribSec)})은 체류 집계에서 제외` : '');
        const refEmpty = document.getElementById('chartRefEmpty');
        const refCanvas = document.getElementById('chartReferrer');
        const refWrap = document.getElementById('chartReferrerWrap');
        if (refEntries.length) {
          if (refEmpty) refEmpty.style.display = 'none';
          if (refCanvas) refCanvas.style.display = '';
          if (refWrap) refWrap.style.height = Math.max(60, refEntries.length * 36 + 16) + 'px';
          const refTimeStrs = refEntries.map(([k]) => {
            const totS = refSecMap[k] || 0;
            const uCnt = refUserMap[k]?.size ?? 0;
            const avgS = uCnt > 0 ? Math.round(totS / uCnt) : 0;
            return totS > 0 ? `총${fmtTime(totS)} (평균${fmtTime(avgS)})` : '';
          });
          makeOrUpdate('chartReferrer', 'bar', {
            labels: refEntries.map(([k, v]) => `${k}  ${v}회 (${refUserMap[k]?.size ?? '?'}명)`),
            datasets: [{ data: refEntries.map(([, v]) => v), backgroundColor: PALETTE.slice(0, refEntries.length), borderRadius: 4, barThickness: 22 }],
          }, {
            indexAxis: 'y',
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: ctx => `${ctx.raw}회` } },
            },
            scales: {
              x: { beginAtZero: true, grid: { color: GRID }, ticks: { stepSize: 1, font: { size: 10 } } },
              y: { grid: { display: false }, ticks: { font: { size: 11, weight: '700' } } },
            },
          }, [{
            id: 'refTimeLabelPlugin',
            afterDatasetsDraw(chart) {
              const ctx = chart.ctx;
              const meta = chart.getDatasetMeta(0);
              const x0 = chart.scales.x.getPixelForValue(0);
              meta.data.forEach((bar, i) => {
                const text = refTimeStrs[i];
                if (!text) return;
                const barWidth = bar.x - x0;
                if (barWidth < 50) return;
                ctx.save();
                ctx.font = '9px sans-serif';
                ctx.fillStyle = 'rgba(255,255,255,0.92)';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, x0 + barWidth / 2, bar.y);
                ctx.restore();
              });
            },
          }]);
        } else {
          if (refCanvas) refCanvas.style.display = 'none';
          if (refWrap) refWrap.style.height = '0';
          if (refEmpty) refEmpty.style.display = '';
        }

        // ── 3. 페이지별 방문 — (유저+페이지+날짜) 유니크 기준 ─────────
        const pageUniq = {};
        const pageTotSec = {};
        // 드릴다운(원칙 ⑤) — 「이 페이지를 본 사람들」. 막대와 **같은 순회**에서 만들어야
        // 명단과 막대가 어긋나지 않는다. 사람 식별은 이 화면의 기존 규칙 그대로
        // (user_id 우선, 없으면 anon:session_key) — 새 규칙을 만들면 #15가 재발한다.
        const pagePeople = {};
        const seen2 = new Set();
        for (const r of filtered) {
          if (!r.page) continue;
          const pageKey = normalizePageKey(r.page);
          pageTotSec[pageKey] = (pageTotSec[pageKey] || 0) + (r.duration_sec || 0);
          const pid = r.user_id ? String(r.user_id) : (r.session_key ? `anon:${r.session_key}` : null);
          const day = kstDate(r.entered_at);
          if (pid) {
            if (!pagePeople[pageKey]) pagePeople[pageKey] = new Map();
            const pp = pagePeople[pageKey];
            if (!pp.has(pid)) pp.set(pid, { visits: 0, sec: 0, _days: new Set() });
            const person = pp.get(pid);
            person.sec += r.duration_sec || 0;
            // 🚨 visits는 raw 행 수가 아니라 **방문일수**로 센다 — 위 pageUniq와 같은 (pid·page·day)
            // 기준이라야 "방문 N"(막대·상단 숫자)과 개인별 합계가 정확히 같아진다. 예전엔 raw
            // 행 수를 셌는데, 그러면 하루에 여러 번 들어온 사람 때문에 개인별 합이 방문N을
            // 넘어서 "12명인데 왜 3회·4회가 있냐"는 혼란이 났다(사용자 신고, 2026-07-30).
            if (!person._days.has(day)) { person._days.add(day); person.visits++; }
          }
          const key = (pid || 'anon') + '|' + pageKey + '|' + day;
          if (seen2.has(key)) continue;
          seen2.add(key);
          pageUniq[pageKey] = (pageUniq[pageKey] || 0) + 1;
        }
        // 내 보드 가상 페이지 — page_views에서 추가 (page_sessions 미기록)
        const VIRTUAL_PAGE_PREFIX = 'my-board';
        for (const r of filteredPV) {
          const pageKey = normalizePageKey(r.page);
          if (!pageKey?.startsWith(VIRTUAL_PAGE_PREFIX)) continue;
          const pid = r.user_id ? String(r.user_id) : (r.session_key ? `anon:${r.session_key}` : null);
          const day = kstDate(r.created_at);
          if (pid) {
            if (!pagePeople[pageKey]) pagePeople[pageKey] = new Map();
            const pp = pagePeople[pageKey];
            // 가상 페이지는 page_sessions가 없어 체류를 모른다 — 0으로 두고 명단엔 '진입 N일'만.
            if (!pp.has(pid)) pp.set(pid, { visits: 0, sec: 0, _days: new Set() });
            const person = pp.get(pid);
            if (!person._days.has(day)) { person._days.add(day); person.visits++; }
          }
          const key = (r.user_id || 'pv') + '|' + pageKey + '|' + day;
          if (seen2.has(key)) continue;
          seen2.add(key);
          pageUniq[pageKey] = (pageUniq[pageKey] || 0) + 1;
        }
        const topPages = Object.entries(pageUniq).sort((a, b) => b[1] - a[1]).slice(0, 8);
        const chartPagesSub = document.getElementById('chartPagesSub');
        if (chartPagesSub) chartPagesSub.textContent = label;
        // ⏱ 접두사는 장식이 아니라 **단위 구분**이다(#8) — 막대 길이는 '방문 수'인데
        // 막대 위 텍스트는 '체류시간'이라 서로 다른 지표다. 표식이 없으면 텍스트가
        // 막대의 값처럼 읽히고, 방문 수가 동률이면 막대가 전부 같은 길이라 정반대로 읽힌다.
        const pageTimeStrs = topPages.map(([p, v]) => {
          const totS = pageTotSec[p] || 0;
          const avgS = v > 0 ? Math.round(totS / v) : 0;
          return totS > 0 ? `⏱ 총${fmtTime(totS)} (평균${fmtTime(avgS)})` : '';
        });
        makeOrUpdate('chartPages', 'bar', {
          labels: topPages.map(([p]) => PAGE_LABEL[p] || p),
          datasets: [{ data: topPages.map(([, v]) => v), backgroundColor: C2, borderRadius: 4 }],
        }, {
          indexAxis: 'y',
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            // 막대가 무엇을 센 것인지 축에 밝힌다(#8·원칙 ①). pageUniq는 (사람·페이지·날짜)를
            // 접은 값이라 같은 사람이 같은 날 여러 번 봐도 1이다 — '조회수'가 아니다.
            x: {
              grid: { color: GRID },
              ticks: { font: { size: 10 }, stepSize: 1, precision: 0 },
              title: { display: true, text: '방문 (같은 사람·같은 날은 1회)', font: { size: 9 }, color: CMUTED },
            },
            y: { grid: { display: false }, ticks: { font: { size: 10 }, autoSkip: false } },
          },
        }, [{
          id: 'pageTimeLabelPlugin',
          afterDatasetsDraw(chart) {
            const ctx = chart.ctx;
            const meta = chart.getDatasetMeta(0);
            const x0 = chart.scales.x.getPixelForValue(0);
            meta.data.forEach((bar, i) => {
              const text = pageTimeStrs[i];
              if (!text) return;
              const barRight = bar.x;
              const barWidth = barRight - x0;
              ctx.save();
              ctx.font = '9px sans-serif';
              ctx.textBaseline = 'middle';
              // 막대 안에 안 들어가면 **오른쪽 바깥에** 어두운 색으로 그린다.
              // 예전엔 폭 50px만 넘으면 흰 글씨를 무조건 막대 중앙에 그려서, 텍스트가 막대보다
              // 길면 크림색 배경 위로 흰 글씨가 넘쳐 읽을 수 없었다(짧은 막대일수록 심함).
              const textW = ctx.measureText(text).width;
              if (textW <= barWidth - 10) {
                ctx.fillStyle = 'rgba(255,255,255,0.92)';
                ctx.textAlign = 'center';
                ctx.fillText(text, x0 + barWidth / 2, bar.y);
              } else {
                ctx.fillStyle = '#8c7a68';
                ctx.textAlign = 'left';
                ctx.fillText(text, barRight + 5, bar.y);
              }
              ctx.restore();
            });
          },
        }]);

        // ── 3-b. 페이지 → 「이 페이지를 본 사람들」 (원칙 ⑤ 드릴다운) ──────
        // 막대 자체를 클릭 대상으로 삼지 않는다 — 차트는 좁고 라벨이 잘리며, 무엇보다
        // "몇 명인지"가 막대에 안 보인다(막대는 사람·날짜 유니크 = 방문 수라 사람 수와 다르다).
        // 차트 바로 아래 목록에 **명 수를 먼저 보여주고** 그 숫자를 눌러 내려가게 한다.
        {
          const pagesBodyEl = document.getElementById('pagesBody');
          if (pagesBodyEl) {
            const rowsHtml = topPages.map(([p, v]) => {
              const pp = pagePeople[p];
              const people = pp
                ? [...pp.entries()].sort((a, b) => b[1].sec - a[1].sec || b[1].visits - a[1].visits)
                    .map(([pid, d]) => ({
                      // 🚨 이름을 못 찾은 user_id를 「회원」이라 부르지 않는다 — 실제로
                      //    `__racetest_*`(#22 통제 실험 잔여)·`test_meeting_999` 두 개가
                      //    profiles 없이 page_sessions에 남아 있고, 「회원 __racete」로 보이면
                      //    사람으로 읽힌다. 이름이 없다는 사실 자체를 표시한다(드릴다운이
                      //    이걸 드러낸 것이 바로 원칙 ⑤가 하는 일이다).
                      name: pid.startsWith('anon:')
                        ? `비회원 ${pid.slice(5, 13)}…`
                        : (profilesMap?.get(pid) || profilesMap?.get(Number(pid)) || `미등록 ID ${pid.slice(0, 14)}…`),
                      isMember: !pid.startsWith('anon:'),
                      // visits는 이제 위 방문N과 같은 (pid·page·day) 기준(방문일수)이라
                      // "일"로 표기한다 — "회"였을 때는 raw 행 수라 위 방문N과 안 맞았다.
                      meta: d.sec > 0 ? `${d.visits}일 · ${fmtTime(d.sec)}` : `${d.visits}일`,
                    }))
                : [];
              const memCnt = people.filter(x => x.isMember).length;
              return `<div class="admin-dd-host" style="border-bottom:1px solid var(--border);padding:6px 2px">
                <div style="display:flex;align-items:center;gap:8px">
                  <span class="anat-page" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${escH(PAGE_LABEL[p] || p)}</span>
                  <span style="font-size:11px;color:var(--muted);font-weight:600;flex-shrink:0">방문 ${v}</span>
                  ${ddToggle(people.length)}
                </div>
                ${people.length ? ddPanelHtml(people, {
                  // 개인별 방문일수(meta)를 위 방문N과 **같은 (pid·page·day) 기준**으로 바꿔서
                  // (2026-07-30) 이제 이 명단의 일수를 다 더하면 위 "방문 N"과 같다 — raw 행 수를
                  // 셀 때는 하루 중복 방문 때문에 합이 방문N을 넘어 "12명인데 왜 3일·4일이
                  // 있냐"는 혼란이 났었다(사용자 신고). 체류시간(sec)은 여전히 그 날의 모든
                  // 접속을 합산한 실제 값 — 이것까지 첫 세션만으로 줄이면 과소집계된다(R3와 같은 이유).
                  note: `이 페이지를 본 사람 · 체류 긴 순 · 회원 ${memCnt}명 · 비회원 ${people.length - memCnt}명 · 아래 일수의 합 = 위 방문수`,
                }) : ''}
              </div>`;
            }).join('');
            // 🚨 "방문 수와 명 수는 다른 값"이 하루짜리 기간(type==='day')에선 거짓말이 된다 —
            // 방문N은 (사람·페이지·날짜) 유니크인데 날짜가 하루뿐이면 날짜 차원이 사라져
            // 방문N=명N이 **항상** 성립한다(사용자 스크린샷: 방문12=👥12명, 우연이 아니라 필연).
            // 여러 날짜를 보는 기간에서만 실제로 갈린다 — 그 경우만 "다른 값" 문구를 쓴다.
            const _dayCoincide = type === 'day';
            const _visitorCaption = _dayCoincide
              ? '<span style="font-weight:400">· 하루만 보고 있어 방문 수 = 명 수(날짜가 하나뿐이라 항상 같음)</span>'
              : '<span style="font-weight:400">· 방문 수와 명 수는 다른 값(한 사람이 여러 날 오면 방문 수가 더 큼)</span>';
            pagesBodyEl.innerHTML = topPages.length
              ? `<div style="font-size:11px;color:var(--muted);font-weight:600;margin:4px 2px 2px" title="방문 = 같은 사람·같은 날은 1회로 접은 값(위 막대와 같은 값). 명 = 그 방문을 만든 사람 수. 기간이 하루면 두 값이 항상 같고, 여러 날이면 갈립니다.">👥 누가 봤나 · 기간 ${escH(label || '전체')} ${_visitorCaption}</div>${rowsHtml}`
              : '<div class="admin-empty">페이지 데이터 없음</div>';
          }
        }

        // ── 4. 유입경로 × 페이지 교차분석 ───────────────────────────
        {
          const crossMap = {};
          // 명 카운트: filteredVisitor(__visitor__ 행) 기준
          const crossUserMap = {};
          filteredVisitor.forEach((r, idx) => {
            const cat = (r.referrer ? (categorizeRef(r.referrer) || '귀속 불가') : '직접 방문');
            if (!crossUserMap[cat]) crossUserMap[cat] = new Set();
            crossUserMap[cat].add(visitorKey(r, idx, cat));
          });
          for (const r of filteredPV) {
            const cat = (r.referrer ? (categorizeRef(r.referrer) || '귀속 불가') : '직접 방문');
            const pg = PAGE_LABEL[r.page] || r.page || '?';
            if (!crossMap[cat]) crossMap[cat] = {};
            crossMap[cat][pg] = (crossMap[cat][pg] || 0) + 1;
          }
          const chartCrossSub = document.getElementById('chartCrossSub');
          if (chartCrossSub) chartCrossSub.textContent = label;
          const crossEl = document.getElementById('chartCrossRef');
          if (crossEl) {
            if (!Object.keys(crossMap).length) {
              crossEl.innerHTML = '<div class="admin-cross-empty">유입 데이터 없음</div>';
            } else {
              const sources = Object.entries(crossMap).sort((a, b) =>
                Object.values(b[1]).reduce((s, v) => s + v, 0) - Object.values(a[1]).reduce((s, v) => s + v, 0)
              );
              crossEl.innerHTML = `<div class="admin-cross-list">${sources.map(([src, pages]) => {
                const sortedPgs = Object.entries(pages).sort((a, b) => b[1] - a[1]);
                const total = Object.values(pages).reduce((s, v) => s + v, 0);
                  const uCnt = crossUserMap[src]?.size || 0;
                return `<div class="admin-cross-row">
                  <div class="admin-cross-source">${escH(src)}<span class="admin-cross-total">${uCnt}명 (${total}회)</span></div>
                  <div class="admin-cross-chips">${
                    sortedPgs.map(([pg, cnt]) => `<span class="admin-cross-chip">${escH(pg)} <strong>${cnt}</strong></span>`).join('')
                  }</div>
                </div>`;
              }).join('')}</div>`;
            }
          }
        }

        // ── 보조: 시간대별 — page_views 기반 방문 시간대 패턴 ──────
        const hourly = new Array(24).fill(0);
        for (const pv of filteredPV) hourly[kstHour(pv.created_at)]++;
        const hMax = Math.max(...hourly) || 1;
        const chartHourlySub = document.getElementById('chartHourlySub');
        if (chartHourlySub) chartHourlySub.textContent = label;
        makeOrUpdate('chartHourly', 'bar', {
          labels: Array.from({ length: 24 }, (_, i) => `${i}시`),
          datasets: [{
            data: hourly,
            backgroundColor: hourly.map(v => `rgba(158,58,42,${(0.25 + 0.75 * v / hMax).toFixed(2)})`),
            borderRadius: 3,
          }],
        }, {
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 9 }, maxRotation: 0 } },
            y: { beginAtZero: true, grid: { color: GRID }, ticks: { stepSize: 1 } },
          },
        });

        // ── 보조: 방문자 구성 도넛 ──────────────────────────────────
        // 회원·비회원 **둘 다 사람 단위**로 센다 — visitorKey는 이 페이지의 공용 식별 규칙이고
        // 유입 경로·교차분석도 같은 키를 쓴다(#15 이전엔 여기와 요약카드만 이 규칙 밖에 있었다).
        // 🚨 예전 계산 `비회원 = 전체 행 - 고유 회원수`는 두 가지를 동시에 틀렸다:
        //    ①비회원을 사람이 아니라 행(=하루 첫 방문 1건) 단위로 셌고
        //    ②회원의 재방문 행이 통째로 비회원 칸으로 넘어갔다(회원이 자주 올수록 비회원이 늘어남).
        //    실측 7일: 비회원 84명으로 표시됐으나 실제 45명, 그중 36명이 회원 재방문분이었다.
        // ⚠️ legacy 행(session_key 없음, 2026-07 이전)은 visitorKey가 행마다 다른 키를 주므로
        //    각각 1명으로 잡힌다 = 상한값. 소급 식별이 불가능해 이 페이지 전체가 쓰는 관례다.
        const ratioVisitors = filteredVisitor;
        const mSet = new Set(), gSet = new Set();
        ratioVisitors.forEach((r, idx) => {
          (r.user_id ? mSet : gSet).add(visitorKey(r, idx, 'ratio'));
        });
        const mCnt = mSet.size;
        const gCnt = gSet.size;
        const chartRatioSub = document.getElementById('chartRatioSub');
        if (chartRatioSub) chartRatioSub.textContent = label;
        makeOrUpdate('chartMemberRatio', 'doughnut', {
          labels: [`회원 (${mCnt}명)`, `비회원 (${gCnt}명)`],
          datasets: [{ data: [mCnt, gCnt], backgroundColor: [C1, CMUTED], borderWidth: 0 }],
        }, {
          cutout: '60%',
          plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } },
        });

        // ── 보조: 회원별 이용시간 ────────────────────────────────────
        const fmtHM = s => s >= 3600
          ? `${Math.floor(s/3600)}시간 ${Math.floor((s%3600)/60)}분`
          : `${Math.floor(s/60)}분 ${s%60}초`;
        // 🚨 소스는 **항상 page_sessions 하나**다 (R3).
        // 예전엔 '전체'일 때만 profiles.total_minutes로 갈아탔는데, 그러면 기간을 바꿀 때
        // 지표의 정의 자체가 바뀌어 같은 차트가 다른 것을 그렸다(#12·#23).
        // 두 소스는 애초에 같은 것을 세지 않는다 — heartbeat가 insertPageSession=false로
        // 호출돼 profiles만 올리므로 **page_sessions는 구조적으로 profiles의 부분집합**이다.
        // 그래서 "어느 쪽이 맞나"가 아니라 **질문별로 하나씩** 쓴다:
        //   기간이 걸린 시간(이 차트·펼침 표) → page_sessions
        //   전체 누적 총량(카드 ⏱·오늘)      → profiles
        const todayKst = kstDateStr();
        // 🚨 **전 기간 고정**이다 — 선택 기간(`filtered`)을 쓰지 않는다 (#12).
        // 회원 탭은 날짜 네비가 없는 **명부**라(원칙 ④, #5) 사용자가 기간을 바꿀 수단이 없다.
        // 그런데 기본값이 '오늘'이라 선택 기간을 따르면 **차트가 늘 비어 있게 된다**(실제로 그랬다).
        // 명부가 답할 질문은 "이 사람들이 통틀어 얼마나 썼나"이므로 전 기간이 맞다.
        const memberSecMap = new Map();
        for (const r of rows) {
          if (!r.user_id) continue;
          memberSecMap.set(r.user_id, (memberSecMap.get(r.user_id) || 0) + (r.duration_sec || 0));
        }
        const chartMemberTimeSub = document.getElementById('chartMemberTimeSub');
        // 기간뿐 아니라 **무엇을 센 값인지**도 밝힌다(원칙 ①) — 카드 ⏱와 값이 다른 게 정상이고,
        // 그 이유(heartbeat 미포함)를 모르면 또 "숫자가 안 맞는다"가 된다.
        if (chartMemberTimeSub) {
          chartMemberTimeSub.textContent = '전 기간 · 페이지 체류 합계';
          chartMemberTimeSub.title = '회원 탭은 명부라 기간 선택이 없어 전 기간으로 고정합니다. 페이지별 체류 기록(page_sessions) 합계이며, 카드의 ⏱ 총 누적은 heartbeat 분까지 포함한 profiles 값이라 더 큽니다.';
        }
        const topMembers = allProfiles
          .map(p => ({ uid: p.user_id, name: profilesMap?.get(p.user_id) || p.nickname || '?', secs: memberSecMap.get(p.user_id) || 0 }))
          .filter(m => m.secs > 0)
          .sort((a, b) => b.secs - a.secs)
          .slice(0, 10);
        // x축 눈금을 60초(또는 1시간) 배수로 고정한다 — #7.
        // 데이터가 초라서 Chart.js는 0·500·1000…처럼 초 기준으로 눈금을 잡는데, 라벨만
        // Math.floor(v/60)로 분으로 바꾸면 "0m 8m 16m 25m 33m 41m"처럼 간격이 들쭉날쭉해
        // 보인다(값은 균등한데 라벨이 반올림돼 어긋난 것). step을 60의 배수로 잡고 축 끝을
        // 그 배수에 맞추면 v/60이 항상 정수라 라벨이 실제 간격과 일치한다.
        const _maxSecs = topMembers.length ? topMembers[0].secs : 0;
        const _tickStep = [60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200]
          .find(s => _maxSecs / s <= 6) || 86400;
        const _tickMax = Math.max(_tickStep, Math.ceil(_maxSecs / _tickStep) * _tickStep);
        if (topMembers.length) {
          makeOrUpdate('chartMemberTime', 'bar', {
            labels: topMembers.map(m => m.name),
            datasets: [{
              data: topMembers.map(m => m.secs),
              backgroundColor: C3, borderColor: C2, borderWidth: 1, borderRadius: 4,
            }],
          }, {
            indexAxis: 'y',
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: ctx => fmtHM(topMembers[ctx.dataIndex].secs) } },
            },
            scales: {
              x: {
                grid: { color: GRID },
                max: _tickMax,
                ticks: {
                  stepSize: _tickStep,
                  // step이 60(또는 3600)의 배수라 나눗셈이 항상 정수 — 반올림이 필요 없다.
                  callback: v => _tickStep >= 3600 ? `${v / 3600}h` : `${v / 60}m`,
                  font: { size: 10 },
                },
              },
              y: { grid: { display: false }, ticks: { font: { size: 11 } } },
            },
          });
        } else {
          if (_chartInstances['chartMemberTime']) {
            _chartInstances['chartMemberTime'].destroy();
            delete _chartInstances['chartMemberTime'];
          }
        }

        // ── 요약: 페이지 카드 (날짜 연동) ───────────────────────────────
        {
          const _src = start ? filtered : rows;
          const _pageC = {};
          for (const r of _src) { if (r.page) _pageC[r.page] = (_pageC[r.page] || 0) + 1; }
          // 키는 슬러그(#14) — 카드가 좁아 라벨이 긴 셋만 줄여 쓴다.
          const _PAGE_SHORT = { about: '소개', guide: '기능안내', club: '동호회' };
          const _topP = Object.entries(_pageC).sort((a, b) => b[1] - a[1]).slice(0, 4);
          const _sumPage = document.getElementById('sumPageCount');
          if (_sumPage) {
            _sumPage.innerHTML = _topP.length
              ? _topP.map(([p, n]) => `<span style="white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis">${escH(_PAGE_SHORT[p] || PAGE_LABEL[p] || p)} <span>(${n}회)</span></span>`).join('')
              : '—';
          }
        }

        // ── 요약: 회원 카드 신규 (날짜 연동) ─────────────────────────────
        // 전체 회원 수(sumMemberTotal)는 명부 총량이라 기간과 무관 — loadAnalytics에서 1회 고정.
        // 신규 수만 선택 기간(start/end)에 맞춰 갱신한다. 라벨은 하드코딩하지 않고
        // 실제 선택값에서 파생시킨다(원칙 ① — #9·#11이 라벨 하드코딩으로 터진 전례).
        {
          const _newMembers = (start || end) ? filterByRange(allProfiles, start, end, 'first_seen_at') : allProfiles;
          const _sumMemberNewEl = document.getElementById('sumMemberNew');
          if (_sumMemberNewEl) _sumMemberNewEl.textContent = `신규 ${_newMembers.length}명 · ${label}`;
        }

        // ── 요약: 이벤트 카드 (날짜 연동, loadEventStats 이후 갱신됨) ────
        // 개별 이벤트를 건수순으로 평평하게 나열하면 같은 계열이 흩어져 읽기 어렵다
        // (이벤트 탭은 이미 계열로 묶여 있으므로 표현도 그쪽에 맞춘다).
        // 계열당 한 줄 = "어느 영역이 활발한가"를 한눈에, 상세는 카드 클릭 → 이벤트 탭.
        if (_cachedEvents !== null) {
          const evts = (start || end) ? filterByRange(_cachedEvents, start, end, 'created_at') : _cachedEvents;
          const famRows = EVENT_FAMILIES
            .map(f => ({ f, ...countEvents(evts, f.types) }))
            .filter(x => x.n > 0)
            .sort((a, b) => b.n - a.n);
          const _sumEvt = document.getElementById('sumEventCount');
          if (_sumEvt) {
            // 건수와 명을 함께 — 건수만 보면 소수의 반복 클릭이 활동량으로 오독된다.
            _sumEvt.innerHTML = famRows.length
              ? famRows.map(({ f, n, u }) =>
                  `<span style="white-space:nowrap;display:block">${f.emoji} ${escH(f.label)} <span>${n.toLocaleString()}회</span>` +
                  (u ? `<span style="color:var(--muted)"> · ${u}명</span>` : '') + `</span>`
                ).join('')
              : '—';
          }
        }

        // ── 이벤트 탭 퍼널도 같은 기간을 따른다 ─────────────────────────
        // loadEventStats가 renderCharts보다 나중에 끝나므로 최초 1회는 그쪽이 이 함수를
        // 다시 호출해준다(_adminRedrawForNav). 그 전까지는 아직 없으므로 옵셔널 호출.
        //
        // 도달률 분모("그 기간에 온 사람")를 함께 넘긴다. 절대수 23명만으로는 많은지
        // 적은지 판단할 수 없다(원칙 ②).
        // 🚨 분모로 __visitor__(방문자 도넛의 소스)를 쓰면 안 된다 — 2026-07-19 실측에서
        //    이벤트를 일으킨 회원 14명 중 9명(64%)만 그 안에 있었다. 분자가 분모 밖으로
        //    새므로 도달률이 100%를 넘는다(#10과 같은 종류의 거짓말). page_sessions는
        //    같은 실측에서 회원·비회원 모두 100% 포함 — 그래서 이쪽만 분모 자격이 있다.
        // 식별 규칙은 eventPersonId와 같아야 교집합이 성립한다(user_id 우선, 없으면 session_key).
        const reachMem = new Set(), reachAnon = new Set();
        for (const r of filtered) {
          if (r.user_id) reachMem.add(String(r.user_id));
          else if (r.session_key) reachAnon.add(String(r.session_key));
        }
        window._adminRenderFunnel?.(start, end, label, { mem: reachMem, anon: reachAnon });

        // ── 회원 탭은 날짜 네비를 따르지 않는다 ──────────────────────────
        // 예전엔 여기서 data-last-seen으로 카드를 걸러 dateHidden을 세웠는데, 그러면
        // 필터 칩(누적 341)과 목록(그날 활동자 4명)이 다른 모집단을 세게 된다.
        // 카드 자체가 이미 기간 정보를 담고 있으므로 목록은 항상 전체를 보여주고,
        // dateHidden을 아예 세우지 않는다(applyVisitorFilter는 미설정을 '보임'으로 취급).
      }

      // 날짜 탐색 상태
      let _navType = 'day';
      let _navValue = kstDateStr();
      const _today = kstDateStr();

      function _updateNavLabel() {
        const lbl = document.getElementById('chartDateLabel');
        if (lbl) lbl.textContent = _navType === 'all' ? '' : compactPeriodLabelFor(_navType, _navValue);
      }

      function _drawForNav() {
        const { start, end } = calcRange(_navType, _navValue);
        draw(start, end, periodLabelFor(_navType, _navValue), _navType);
        _updateNavLabel();
      }
      window._adminRedrawForNav = _drawForNav;

      function _stepNav(dir) {
        if (_navType === 'day') {
          const d = new Date(_navValue + 'T12:00:00Z');
          d.setUTCDate(d.getUTCDate() + dir);
          _navValue = d.toISOString().slice(0, 10);
          if (_navValue > _today) _navValue = _today;
        } else if (_navType === 'week') {
          const { start: ws } = calcRange('week', _navValue);
          _navValue = toWeekStr(new Date(new Date(ws).getTime() + 9 * 3600000 + dir * 7 * 86400000));
          const _thisWeek = toWeekStr(new Date());
          if (_navValue > _thisWeek) _navValue = _thisWeek;
        } else if (_navType === 'month') {
          const [y, m] = _navValue.split('-').map(Number);
          const nd = new Date(Date.UTC(y, m - 1 + dir, 1));
          _navValue = nd.toISOString().slice(0, 7);
          if (_navValue > _today.slice(0, 7)) _navValue = _today.slice(0, 7);
        }
        const _di = document.getElementById('chartDateInput');
        if (_di) _di.value = _navValue;
        _drawForNav();
      }

      // 기본값: 오늘
      const _di0 = document.getElementById('chartDateInput');
      if (_di0) { _di0.type = 'date'; _di0.value = _today; _di0.max = _today; }
      _drawForNav();

      // 레이블 클릭 → picker 열기
      const _lblEl = document.getElementById('chartDateLabel');
      if (_lblEl) _lblEl.addEventListener('click', () => {
        const di = document.getElementById('chartDateInput');
        if (di) try { di.showPicker(); } catch (_) {}
      });

      // 기간 버튼 이벤트
      const btns = document.getElementById('chartPeriodBtns');
      const navEl = document.getElementById('chartDateNav');
      if (btns) {
        btns.addEventListener('click', e => {
          const btn = e.target.closest('.admin-chart-period-btn');
          if (!btn) return;
          btns.querySelectorAll('.admin-chart-period-btn').forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          const days = Number(btn.dataset.days);
          const di = document.getElementById('chartDateInput');
          if (days === 0) {
            _navType = 'all'; _navValue = '';
            navEl?.classList.remove('is-visible');
            draw(null, null, '전체', 'all');
          } else if (days === 1) {
            _navType = 'day'; _navValue = _today;
            if (di) { di.type = 'date'; di.value = _today; di.max = _today; }
            navEl?.classList.add('is-visible');
            _drawForNav();
          } else if (days === 7) {
            _navType = 'week'; _navValue = toWeekStr(new Date());
            if (di) { di.type = 'week'; di.value = _navValue; di.max = toWeekStr(new Date()); }
            navEl?.classList.add('is-visible');
            _drawForNav();
          } else if (days === 30) {
            _navType = 'month'; _navValue = _today.slice(0, 7);
            if (di) { di.type = 'month'; di.value = _navValue; di.max = _today.slice(0, 7); }
            navEl?.classList.add('is-visible');
            _drawForNav();
          }
        });
      }

      const _diEl = document.getElementById('chartDateInput');
      if (_diEl) _diEl.addEventListener('change', e => { _navValue = e.target.value; _drawForNav(); });
      const _prevBtn = document.getElementById('chartNavPrev');
      const _nextBtn = document.getElementById('chartNavNext');
      if (_prevBtn) _prevBtn.addEventListener('click', () => _stepNav(-1));
      if (_nextBtn) _nextBtn.addEventListener('click', () => _stepNav(1));
    }

    // ── 접속 상태 배지 ──────────────────────────────────────────
    function fmtOnlineStatus(lastSeenAt) {
      if (!lastSeenAt) return { text: '', online: false };
      const diff = Date.now() - new Date(lastSeenAt).getTime();
      const secs = Math.floor(diff / 1000);
      if (secs < 120) return { text: '🟢 접속중', online: true };
      const mins = Math.floor(secs / 60);
      if (mins < 60) return { text: `⚪ ${mins}분 전`, online: false };
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return { text: `⚪ ${hrs}시간 전`, online: false };
      return { text: `⚪ ${Math.floor(hrs / 24)}일 전`, online: false };
    }

    function refreshOnlineBadges() {
      document.querySelectorAll('.admin-member-card[data-last-seen]').forEach(card => {
        const lastSeen = card.dataset.lastSeen;
        const badge = card.querySelector('.admin-online-status');
        if (!badge) return;
        const { text, online } = fmtOnlineStatus(lastSeen);
        badge.textContent = text;
        badge.classList.toggle('is-online', online);
      });
    }

    // 30초마다 배지 표시 갱신 (DB 재조회 없이 시간 재계산)
    setInterval(refreshOnlineBadges, 30 * 1000);

    // 2분마다 DB 재조회 → data-last-seen 업데이트 후 배지 갱신
    let _profilesCache = [];
    async function refreshProfilesAndBadges() {
      if (!window.CottageDB) return;
      try {
        _profilesCache = await window.CottageDB.getAllProfiles();
        for (const p of _profilesCache) {
          const card = document.querySelector(`.admin-member-card[data-uid="${p.user_id}"]`);
          if (card && p.last_seen_at) card.dataset.lastSeen = p.last_seen_at;
        }
        refreshOnlineBadges();
      } catch (_) {}
    }
    setInterval(refreshProfilesAndBadges, 2 * 60 * 1000);

    async function loadEventStats() {
      const el = document.getElementById('eventFunnelBody');
      if (!el || !window.CottageDB?.getEventCounts) return;
      try {
        // 전 기간 조회 — 퍼널이 날짜 네비를 따르므로 '전체'나 오래된 월을 골라도 비지 않아야 한다.
        // page_events는 전체 1,500행 수준이라 전량 받아도 가볍다(max-rows 50000).
        // 조회 타입은 EVENT_FAMILIES에서 파생한다 — 목록을 두 벌 두면 어긋난다(그래서 실제로
        // 77%가 안 보였다). 새 이벤트는 그 표에만 등록하면 조회·요약이 함께 따라온다.
        const ALL_DAYS = 3650;
        const events = await window.CottageDB.getEventCounts(EVENT_ALL_TYPES, ALL_DAYS);

        // 선택 기간으로 거른다 — renderCharts의 filterByRange와 같은 규칙(start 포함, end 미포함).
        const inRange = (rows, start, end) => (!start && !end) ? rows
          : rows.filter(r => (!start || r.created_at >= start) && (!end || r.created_at < end));

        function pct(a, b) { return b > 0 ? Math.round(a/b*100) + '%' : '-'; }
        // 이벤트 명단 — 「이 행동을 한 사람」. 회 많은 순(누가 이 행동을 이끌었나가 질문).
        // detail은 countEvents가 people(Set)과 같은 순회에서 만든 것이라 명단과 「N명」이
        // 원리상 어긋날 수 없다.
        function ddPeopleFromEvents(s) {
          return [...s.detail.entries()]
            .sort((a, b) => b[1].n - a[1].n)
            .map(([pid, d]) => ({
              name: d.isMember
                ? (window._adminNameOfUid?.(pid) || `미등록 ID ${String(pid).slice(0, 14)}…`)
                : `비회원 ${String(pid).slice(0, 8)}…`,
              isMember: d.isMember,
              meta: `${d.n}회`,
            }));
        }
        // 건수 / 사람수 / 평균을 함께 — 443회가 38명이면 완전히 다른 이야기다.
        // 「N명」이 곧 드릴다운 버튼이다(원칙 ⑤) — 숫자를 눌러 그걸 만든 사람으로 내려간다.
        function stepRow(badge, label, s) {
          const avg = s.u ? (s.n / s.u).toFixed(1) : null;
          return `<div class="admin-dd-host">
            <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:10px;font-weight:600;color:var(--muted);flex-shrink:0;width:22px;line-height:1">${badge}</span>
            <span style="font-size:12px;color:var(--muted);font-weight:500;flex:1;min-width:0;line-height:1.3">${label}</span>
            <div style="text-align:right;flex-shrink:0;line-height:1.25">
              <div style="font-size:17px;font-weight:900;color:var(--text)">${s.n.toLocaleString()}<span style="font-size:10px;font-weight:600;color:var(--muted)">회</span></div>
              <div style="font-size:10px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:2px">
                ${ddToggle(s.u, s.n > 0)}${avg ? `<span>· 평균 ${avg}</span>` : ''}
              </div>
            </div>
            </div>
            ${s.n > 0 ? ddPanelHtml(ddPeopleFromEvents(s), {
              note: '이 행동을 한 사람 · 회 많은 순 · 순서도, 앞 단계를 거쳤는지도 세지 않음',
              unknown: s.noId,
            }) : ''}
          </div>`;
        }
        // 🚨 이 화면은 퍼널도 분기 트리도 아니다 — **행동 관계(교집합)**다. (#26, 2026-07-20 실측)
        //
        //    화살표 ↓ 와 트리 ├└ 는 둘 다 "B를 한 사람은 A를 거쳤다"는 **포함관계를 주장**한다.
        //    전 기간 실측에서 그 주장이 **5쌍 중 4쌍에서 깨진다**:
        //      1-1→1-2  B 6명 중 2명이 1-1 안 함     1-1→1-3  B 5명 중 3명이 안 함
        //      2-1→2-2  B 7명 중 3명이 안 함          3-1→3-2  B 23명 중 6명이 안 함
        //    홈 섹션 버튼들은 스크롤·딥링크·다른 화면 등 **여러 경로로 도달 가능**해서 그렇다.
        //    ⚠️ 순서도 못 센다: 계산이 사람 집합 교집합이라 시각을 안 본다. 참고로 세션·시각까지
        //    비교하면 3-1→3-2는 17명이 아니라 13명이다(23% 차이) — 「다음 단계로 이어졌다」는
        //    표현은 그 계산을 붙인 뒤에만 쓸 수 있다.
        //
        //    그래서 도형을 없애고 **행동을 나열한 뒤 겹침만 문장으로** 적는다.
        //    진짜 순차 퍼널이 필요해지면 같은 session_key 안에서 A→B 시각 비교로 새로 만들 것.
        //
        // 📌 2026-07-20에 이 자리를 **세 번** 고쳤다. ①↓만 있던 것 → ②⇄ 기호 추가 →
        //    ③진입 아래 트리. ②③ 둘 다 **관계를 데이터로 확인하지 않고 그림부터 바꾼 것**이고,
        //    ③은 외부 지적("선형으로 보인다")이 준 프레임을 그대로 해답으로 삼은 결과였다.
        //    지적은 **문제 가설**이지 해결안이 아니다 — 도형을 바꾸기 전에 그 도형이 주장하는
        //    관계를 한 문장으로 적고 데이터가 보장하는지부터 셀 것.
        function relBlock(anchorBadge, anchor, rest) {
          if (!anchor.u) return '';
          const line = rest.map(([b, s]) => {
            let inter = 0; for (const p of s.people) if (anchor.people.has(p)) inter++;
            return `${b}도 <b style="color:var(--green);font-weight:700">${inter}명 ${pct(inter, anchor.u)}</b>`;
          }).join(' · ');
          let both = '';
          if (rest.length === 2) {
            const [[ab, a], [bb, b]] = rest;
            let inter = 0; for (const p of b.people) if (a.people.has(p)) inter++;
            const base = new Set([...a.people, ...b.people]).size;
            both = base ? `<div style="margin-top:2px">${ab}·${bb} 둘 다 한 사람 <b style="color:var(--text);font-weight:700">${inter}명</b> <span style="font-weight:500">(둘 중 하나라도 한 ${base}명 중)</span></div>` : '';
          }
          // 기본은 접어둔다 — 회·명·평균만으로도 숫자가 여럿인데 겹침 설명까지 늘 펼쳐두면
          // 한 화면 정보가 과밀해진다(사용자 지적 2026-07-30: 페이지·이벤트 탭 둘 다 "숫자가
          // 다 다르면 뭐가뭔지 모른다"). 정보는 안 지운다 — 이미 있는 드릴다운 인프라
          // (.admin-dd-btn/.admin-dd-panel, document 위임)를 그대로 재사용해 필요할 때만 편다.
          return `<div class="admin-dd-host" style="margin-top:8px;padding-top:7px;border-top:1px dashed var(--border)">
            <button class="admin-dd-btn" type="button" style="font-size:10px">🔗 겹친 사람 보기 ▾</button>
            <div class="admin-dd-panel" hidden style="font-size:10px;color:var(--muted);font-weight:600;line-height:1.45;margin-left:0;border-left:none;padding-left:0"
              title="같은 사람이 두 행동을 모두 했는지만 셉니다. 순서도, 한쪽을 거쳐야 하는지도 세지 않습니다">
              <span style="font-weight:500">순서·경로는 세지 않음</span>
              <div style="margin-top:2px">${anchorBadge} 한 ${anchor.u}명 중 ${line}</div>${both}
            </div>
          </div>`;
        }
        // 도달률 — "그 기간에 온 사람 중 몇 %가 하나라도 액션했나".
        // 분모는 renderCharts가 page_sessions에서 만들어 넘긴다(위 주석의 실측 근거 참조).
        // ⚠️ 화면 위쪽 「방문자 구성」 도넛과 숫자가 다른 게 정상이다 — 그건 __visitor__ 마커
        //    기준이라 **모집단이 다르다**. 원칙 ①에 따라 어느 기준인지를 문구와 title에 밝힌다.
        //    ✅ 여기 있던 "게다가 비회원을 행 단위로 세는 과대집계가 있다(#15)"는 **낡은 기재**라
        //       지웠다(2026-07-20). #15가 도넛을 visitorKey(사람 단위)로 통일해 이미 해소됐고,
        //       #27이 「세션이 형성된 접속만」까지 좁혔다. 남은 차이는 과대집계가 아니라 소스 차이다.
        // ⚠️ 식별자가 없는 이벤트 행(6월 legacy 43행)은 명에서 빠져 도달률이 약간 과소.
        function reachRow(evts, reach) {
          if (!reach) return '';
          const mTot = reach.mem.size, aTot = reach.anon.size, tot = mTot + aTot;
          if (!tot) return '';
          const people = countEvents(evts, EVENT_ALL_TYPES).people;
          let mHit = 0, aHit = 0, orphan = 0;
          for (const p of people) {
            if (reach.mem.has(p)) mHit++;
            else if (reach.anon.has(p)) aHit++;
            else orphan++;  // 분모 밖 = 세션 기록이 없는 사람. 0이 정상, 늘면 조사 신호.
          }
          const hit = mHit + aHit;
          // 회원과 비회원은 갈라서 보여준다 — 합친 값 하나는 두 이야기를 다 지운다(원칙 ②).
          const seg = (n, d) => `${n}/${d}<span style="color:var(--muted)">(${pct(n, d)})</span>`;
          const tip = `분모=선택 기간에 세션 기록이 있는 사람(page_sessions 기준)`
            + `\n분자=그 기간에 추적 이벤트를 하나 이상 일으킨 사람`
            + (orphan ? `\n⚠️ 분모 밖 ${orphan}명 — 이벤트는 있는데 세션 기록이 없음` : '');
          return `<div title="${escH(tip)}" style="border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:6px;background:var(--card-bg,#fff)">
            <div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap">
              <span style="font-size:12px;font-weight:800;color:var(--text)">📊 도달률</span>
              <span style="font-size:12px;color:var(--muted);font-weight:500">방문 ${tot}명 중</span>
              <span style="font-size:17px;font-weight:900;color:var(--text);line-height:1.1">${hit}명</span>
              <span style="font-size:14px;font-weight:800;color:var(--green)">${pct(hit, tot)}</span>
              <span style="font-size:11px;color:var(--muted);font-weight:500">가 하나 이상 액션</span>
            </div>
            <div style="font-size:11px;color:var(--muted);font-weight:600;margin-top:3px">
              회원 ${seg(mHit, mTot)} · 비회원 ${seg(aHit, aTot)}
              <span style="font-weight:400">· 방문=세션 기록 기준</span>
            </div>
          </div>`;
        }
        // ⚠️ 헤더에 순서를 암시하는 도형(●─●)을 두지 않는다 — 본문이 "순서는 안 센다"라고
        //    말하는데 도형이 반대말을 한다(#26).
        // 「행동 N개」 배지는 2026-07-30 제거 — 아래 단계 수를 세면 바로 보이는 값이라
        // 판단에 안 쓰이고, 카드마다 반복되는 또 하나의 숫자로 화면만 복잡하게 했다(사용자 지적).
        function axisCard(emoji, title, steps, subline = '') {
          return `<div style="border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--card-bg,#fff)">
            <div style="font-size:13px;font-weight:800;color:var(--text)">${emoji} ${title}</div>
            ${subline ? `<div style="font-size:10px;color:var(--muted);font-weight:600;margin:2px 0 10px">${subline}</div>` : ''}
            <div style="display:flex;flex-direction:column">${steps}</div>
          </div>`;
        }
        // 도달률(전체 사이트 합산)과 기능별 카드 숫자가 왜 안 맞는지 "다른 스코프"라고만
        // 밝히는 데서 그치지 않고, 실제 겹침 인원을 계산해 보여준다(사용자 요청, 2026-07-30).
        // "다른 기능도 함께 M명"으로 뭉치지 않고 상대를 하나씩 짚되(같은 날 후속 요청),
        // 번호(1번·2번)가 아니라 **기능 이름**으로 부른다 — 번호는 예시였을 뿐, 실제로 부를 땐
        // 그 기능이 뭔지 바로 알아야 한다는 게 요청의 요지였다.
        // 각 계열의 "이 기능 이용자"는 그 계열의 전체 타입(EVENT_FAMILIES.types)으로 다시 센다 —
        // 카드에 보이는 낱개 스텝(1-1·1-2·1-3)만 합치면 그 계열의 다른 타입(예: 추천게임의
        // recommend_game_click 등)에서만 활동한 사람이 빠져 과소집계된다.
        // label은 아래 axisCard 제목과 그대로 맞춘다(카드에서 본 이름과 다르면 또 헷갈린다).
        // 가입(signup) 계열은 카드가 없어 제외.
        const FAM_ORDER = [
          { key: 'recommend', label: '추천게임 찾기' },
          { key: 'record', label: '플레이 기록' },
          { key: 'meeting', label: '모임' },
        ];
        function famOverlapSubline(evts, myKey) {
          const famPeople = {};
          for (const f of EVENT_FAMILIES) famPeople[f.key] = countEvents(evts, f.types).people;
          const mine = famPeople[myKey];
          if (!mine || !mine.size) return '';
          const parts = FAM_ORDER.filter(f => f.key !== myKey).map(f => {
            const other = famPeople[f.key] || new Set();
            let n = 0; for (const p of mine) if (other.has(p)) n++;
            return `${f.label}도 ${n}명`;
          });
          return `이 기능 이용 ${mine.size}명 · ${parts.join(' · ')}`;
        }
        // 선택 기간 기준으로 퍼널을 그린다. 날짜 네비가 바뀔 때마다 draw()가 다시 부른다.
        // 이전엔 '오늘' 값으로만 전환율을 계산해 오늘 클릭이 0이면 5칸 전부 '-'였다.
        function renderFunnel(start, end, label, reach) {
          const evts = inRange(events, start, end);
          const c = t => countEvents(evts, [t]);
          const hr = c('home_recommend_main_click'), rgd = c('home_recommend_game_detail_click'), rall = c('home_recommend_all_click');
          const hg = c('home_record_main_click'), rm = c('home_record_more_click'), rw = c('home_record_write_click');
          const mt = c('home_meeting_main_click'), mp = c('home_meeting_planner_click');
          el.innerHTML = `<div style="font-size:11px;color:var(--muted);font-weight:600;margin-bottom:8px">기간: ${escH(label || '전체')} <span style="font-weight:400">· 각 축은 <b>같은 기능의 행동 묶음</b>이다 — 퍼널이 아니다. 비율은 <b>같은 사람이 둘 다 했나</b>이고, 순서도 「거쳐야 하는 길」도 세지 않는다(실제로 앞을 안 거치고 뒤를 한 사람이 있다)</span></div>
          ${reachRow(evts, reach)}
          <div style="font-size:10px;color:var(--muted);font-weight:700;margin:2px 2px 6px">
            🔻 기능별 상세 <span style="font-weight:400">— 위 도달률은 전체 사이트 합산(겹쳐 세지 않음), 아래는 기능마다 따로 센 값이라 단순히 더해서는 안 맞음. 각 카드의 "OO도 M명"이 그 카드와 OO 기능을 함께 쓴 사람 수</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
          ${axisCard('🔍', '추천게임 찾기', `
            ${stepRow('1-1', '히어로 추천게임찾기 클릭', hr)}
            ${stepRow('1-2', '추천 결과 게임정보 클릭', rgd)}
            ${stepRow('1-3', '추천 섹션 전체보기 클릭', rall)}
            ${relBlock('1-1', hr, [['1-2', rgd], ['1-3', rall]])}
          `, famOverlapSubline(evts, 'recommend'))}
          ${axisCard('📋', '플레이 기록', `
            ${stepRow('2-1', '히어로 기록남기기 클릭', hg)}
            ${stepRow('2-2', '최근 플레이 기록 더보기 클릭', rm)}
            ${stepRow('2-3', '최근 플레이 기록 남기기 클릭', rw)}
            ${relBlock('2-1', hg, [['2-2', rm], ['2-3', rw]])}
          `, famOverlapSubline(evts, 'record'))}
          ${axisCard('🤝', '모임', `
            ${stepRow('3-1', '히어로 모임 클릭', mt)}
            ${stepRow('3-2', '이번 주 모임 플래너 보기 클릭', mp)}
            ${relBlock('3-1', mt, [['3-2', mp]])}
          `, famOverlapSubline(evts, 'meeting'))}
        </div>`;
        }
        window._adminRenderFunnel = renderFunnel;
        window._adminSetEvents && window._adminSetEvents(events);
        window._adminRedrawForNav && window._adminRedrawForNav();
      } catch(e) {
        el.innerHTML = '<div class="admin-empty">이벤트 데이터 없음</div>';
      }
    }

    let tried = false;
    function tryLoad() {
      if (tried) return; tried = true;
      load().then(loadAnalytics).then(loadEventStats).then(() => {
        // 초기 렌더 직후 배지 표시
        setTimeout(refreshOnlineBadges, 100);
      });
    }
    window.addEventListener('cottage-auth-changed', tryLoad);
    setTimeout(tryLoad, 1200);
  })();

  function applyVisitorFilter(type, btn) {
    document.querySelectorAll('#visitorFilterBar .admin-visitor-filter-btn').forEach(b => b.classList.remove('is-active'));
    if (btn) btn.classList.add('is-active');
    document.getElementById('visitorCloseBtn')?.remove();
    // 카드는 전부 #visitorList 한 곳에 있다(정렬을 붙이며 #visitorExtras 분리 폐지).
    const allCards = [...document.querySelectorAll('#visitorList .admin-member-card')];
    const dateVisible = allCards.filter(c => c.dataset.dateHidden !== '1');
    const matched = type === 'all' ? dateVisible : dateVisible.filter(c => c.dataset.visitorType === type);
    allCards.forEach(c => c.style.display = 'none');
    matched.slice(0, 3).forEach(c => c.style.display = '');
    const moreBtn = document.getElementById('visitorMoreBtn');
    const hiddenCount = matched.length - 3;
    if (moreBtn) {
      if (hiddenCount > 0) {
        moreBtn.style.display = '';
        moreBtn.textContent = '더보기 (' + hiddenCount + '명 더) ▾';
        moreBtn.onclick = () => expandVisitorMore();
      } else {
        moreBtn.style.display = 'none';
      }
    }
  }

  // 방문자 목록 정렬 — 카드를 다시 만들지 않고 #visitorList 안에서 **순서만** 바꾼다.
  // (다시 그리면 밴 버튼·펼침 상태 같은 바인딩을 전부 되살려야 한다.)
  // 정렬 후에는 반드시 현재 필터를 다시 적용해야 한다 — 안 그러면 "상위 3개만 보임"이
  // 옛 순서 기준으로 남아 목록 중간이 비어 보인다.
  function applyVisitorSort(mode, btn) {
    document.querySelectorAll('#visitorSortBar .admin-visitor-filter-btn').forEach(b => b.classList.remove('is-active'));
    if (btn) btn.classList.add('is-active');
    const note = document.getElementById('visitorSortNote');
    if (note) note.hidden = (mode === 'recent');
    const list = document.getElementById('visitorList');
    if (list) {
      const cards = [...list.querySelectorAll(':scope > .admin-member-card')];
      const last = c => c.dataset.lastSeen || '';
      const num  = c => Number(mode === 'total' ? c.dataset.totalSec : c.dataset.todaySec) || 0;
      // 시간 정렬에서 동점(특히 0초)이 대량으로 생기므로 2차 키는 최근 방문순.
      cards.sort((a, b) => mode === 'recent'
        ? last(b).localeCompare(last(a))
        : (num(b) - num(a)) || last(b).localeCompare(last(a)));
      cards.forEach(c => list.appendChild(c));
    }
    const ab = document.querySelector('#visitorFilterBar .admin-visitor-filter-btn.is-active');
    applyVisitorFilter(ab?.dataset.filter || 'all', ab);
  }

  function expandVisitorMore() {
    const activeFilter = document.querySelector('#visitorFilterBar .admin-visitor-filter-btn.is-active')?.dataset.filter || 'all';
    const allCards = [...document.querySelectorAll('#visitorList .admin-member-card')];
    const dateVisible = allCards.filter(c => c.dataset.dateHidden !== '1');
    const matched = activeFilter === 'all' ? dateVisible : dateVisible.filter(c => c.dataset.visitorType === activeFilter);
    matched.forEach(c => c.style.display = '');
    const moreBtn = document.getElementById('visitorMoreBtn');
    if (moreBtn) moreBtn.style.display = 'none';
    const thirdCard = matched[2];
    if (thirdCard) {
      document.getElementById('visitorCloseBtn')?.remove(); // 두 번 불려도 "닫기 ▲"가 중복 생성되지 않게
      const closeBtn = document.createElement('button');
      closeBtn.id = 'visitorCloseBtn';
      closeBtn.className = 'admin-visitor-more-btn';
      closeBtn.textContent = '닫기 ▲';
      closeBtn.onclick = () => {
        const ab = document.querySelector('#visitorFilterBar .admin-visitor-filter-btn.is-active');
        applyVisitorFilter(ab?.dataset.filter || 'all', ab);
      };
      thirdCard.insertAdjacentElement('afterend', closeBtn);
    }
  }

  </script>
