  <style>
    .history-photo { display: block; max-width: 100%; max-height: 200px; object-fit: cover; border-radius: 10px; margin-top: 10px; }
    .history-tip { font-size: 12px; color: var(--muted, #888); background: var(--bg, #f5f0e8); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }

    /* 모임 섹션 */
    .history-group { border: 1px solid var(--border,#e8e4dc); border-radius: 14px; margin-bottom: 14px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .history-group-header { background: #2c3e50; color:#fff; padding:13px 16px; display:flex; align-items:center; gap:10px; }
    .history-group-name { font-size:16px; font-weight:900; letter-spacing:-0.3px; color:#fff; }
    .history-group-count { font-size:12px; font-weight:700; color:#fff; background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.45); border-radius:20px; padding:2px 9px; }

    /* 날짜 세션 — 접기/펴기 */
    .history-session { border-top: 1px solid var(--border,#e8e4dc); background: var(--card-bg,#fff); }
    .history-session:first-child { border-top: none; }
    .history-session-header { display: flex; align-items: center; gap: 8px; padding: 11px 16px; background: var(--bg,#f5f0e8); border-left: 4px solid transparent; cursor: pointer; user-select: none; }
    .history-session-header:hover { background: #ece7dc; }
    .history-session.is-open > .history-session-header { background: var(--bg,#f5f0e8); border-left-color: #9e3a2a; }
    .history-session-date { font-size: 15px; font-weight: 800; color: #2c3e50; flex: 1; }
    .history-session.is-open > .history-session-header .history-session-date { color: #9e3a2a; }
    .history-session-summary { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .history-session-arrow { font-size: 13px; color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
    .history-session.is-open .history-session-arrow { transform: rotate(180deg); }
    .history-copy-btn { font-size: 12px; color: var(--green,#3d8a74); background: rgba(61,138,116,0.1); border: 1px solid rgba(61,138,116,0.3); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-family: inherit; white-space: nowrap; flex-shrink: 0; }
    .history-copy-btn:hover { background: rgba(61,138,116,0.2); }
    .history-copy-btn.is-copied { background: var(--green,#3d8a74); color: #fff; border-color: var(--green,#3d8a74); }
    .history-record-list { display: none; padding: 0; }
    .history-session.is-open .history-record-list { display: block; }
    /* 교차링크 */
    .history-cross-link { display: block; text-align: center; padding: 10px 14px; font-size: 13px; font-weight: 700; color: var(--green,#3d8a74); text-decoration: none; border-top: 1px dashed var(--border,#e8e4dc); }
    .history-cross-link:hover { background: var(--bg,#f5f0e8); }

    /* 플레이어 헤더 */
    .history-player-header { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px; background: #ece7dc; border-top: 1px solid #e8e4dc; }
    .history-player-header + .history-player-header { border-top: 1px solid #e0dbd0; }
    .history-tag { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 20px; padding: 3px 10px; background: #fff; color: #4a3728; border: 1px solid #d8d0c6; }
    .history-tag-count { background: #37474f !important; color: #fff !important; border-color: #37474f !important; }

    /* 게임 레코드 행 */
    .history-record-item { display: flex; flex-direction: column; padding: 10px 16px; border-top: 1px solid var(--border,#e8e4dc); gap: 6px; }
    .history-record-item:first-of-type { border-top: none; }
    .history-record-item:hover { background: #f6fcfa; }
    .history-game-row { display: flex; align-items: center; gap: 10px; }
    .history-game-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
    .history-game-info { flex: 1; min-width: 0; }
    .history-game-name { font-size: 15px; font-weight: 800; color: #1a1a1a; text-decoration: none; display: block; }
    .history-game-name:hover { text-decoration: underline; color: #9e3a2a; }
    .history-record-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
    .history-record-tags .history-tag { background: var(--bg,#f5f0e8); color: var(--text,#333); font-size: 12px; border-radius: 6px; padding: 2px 8px; }
  </style>
</head>

  <script>
  (function () {
    function getGameName(gameId) {
      if (!window.COTTAGE_GAMES) return gameId;
      const g = window.COTTAGE_GAMES.find(g => String(g.bggId) === String(gameId) || g.id === gameId);
      return g ? (g.display || g.titleKo || g.titleEn || gameId) : gameId;
    }

    function getGameKey(gameId) {
      if (!gameId || !window.gameData) return null;
      if (window.gameData[gameId]) return gameId;
      const entry = Object.entries(window.gameData).find(([, g]) => String(g.bgg?.id) === String(gameId));
      return entry ? entry[0] : null;
    }

    // KST 날짜 문자열 (YYYY-MM-DD)
    function toKstDate(isoStr) {
      const d = new Date(new Date(isoStr).getTime() + 9 * 3600000);
      return d.toISOString().slice(0, 10);
    }

    // YYYY-MM-DD → 읽기 좋은 형태
    function formatKstDate(dateStr) {
      const [y, m, d] = dateStr.split('-');
      return `${y}년 ${Number(m)}월 ${Number(d)}일`;
    }

    // 인스타 캡션 생성
    function buildCaption(groupName, dateStr, records) {
      const dateLabel = formatKstDate(dateStr);
      const lines = records.map(r => {
        const name = getGameName(r.game_id);
        const tags = [
          r.player_count ? `${r.player_count}명` : null,
          r.player_names || null,
          r.play_time_min ? `${r.play_time_min}분` : null,
          r.score_note || null,
        ].filter(Boolean);
        return `- ${name}${tags.length ? ' · ' + tags.join(' · ') : ''}`;
      });
      return `🎲 ${groupName} (${dateLabel})\n${lines.join('\n')}\n\n#코티지보드 #보드게임`;
    }

    async function render() {
      const root = document.getElementById('historyRoot');
      if (!window.CottageDB) {
        root.innerHTML = '<p class="history-empty">데이터를 불러올 수 없습니다.</p>';
        return;
      }

      const records = await window.CottageDB.getAllPlayRecordsForHistory();

      const tipHtml = `<div class="history-tip">💡 <span><a href="./game-reviews.html" style="color:inherit;text-decoration:underline">플레이 기록</a> 시 <strong>"모임 기록으로 남기기"</strong>를 체크하면 여기에 기록돼요</span></div>`;

      if (!records.length) {
        root.innerHTML = tipHtml + '<p class="history-empty">아직 모임 기록이 없습니다.</p>';
        return;
      }

      // 코티지보드 동호회 기록만 필터
      const clubRecords = records.filter(r => r.group_name === '코티지보드 동호회');

      if (!clubRecords.length) {
        root.innerHTML = tipHtml + '<p class="history-empty">아직 동호회 모임 기록이 없습니다.</p>';
        return;
      }

      // group_name → date → records[]
      const grouped = {};
      for (const r of clubRecords) {
        const g = r.group_name;
        const d = r.played_at || toKstDate(r.created_at);
        if (!grouped[g]) grouped[g] = {};
        if (!grouped[g][d]) grouped[g][d] = [];
        grouped[g][d].push(r);
      }

      let html = tipHtml;
      for (const [groupName, dates] of Object.entries(grouped)) {
        const totalSessions = Object.keys(dates).length;
        html += `<div class="history-group" data-history-group="${escAttr(groupName)}">
          <div class="history-group-header">
            <span class="history-group-name">${escH(groupName)}</span>
            <span class="history-group-count">${totalSessions}회</span>
          </div>`;

        for (const [dateStr, recs] of Object.entries(dates).sort((a, b) => b[0].localeCompare(a[0]))) {
          const captionAttr = escAttr(buildCaption(groupName, dateStr, recs));
          const gameCount = recs.length;
          html += `<div class="history-session is-open">
            <div class="history-session-header">
              <span class="history-session-date">${formatKstDate(dateStr)}</span>
              <span class="history-session-summary">${gameCount}게임</span>
              <button class="history-copy-btn" data-caption="${captionAttr}" type="button">캡션 복사</button>
              <span class="history-session-arrow">▾</span>
            </div>
            <div class="history-record-list">
              ${(() => {
                // 같은 인원+이름끼리 묶기
                const playerGroups = new Map();
                for (const r of recs) {
                  const key = `${r.player_count||''}|${(r.player_names||'').trim()}`;
                  if (!playerGroups.has(key)) playerGroups.set(key, []);
                  playerGroups.get(key).push(r);
                }
                let out = '';
                for (const [, grp] of playerGroups) {
                  const f = grp[0];
                  const pTags = [];
                  if (f.player_count) pTags.push(`<span class="history-tag history-tag-count">${f.player_count}명</span>`);
                  if (f.player_names) {
                    f.player_names.split(',').map(n => n.trim()).filter(Boolean)
                      .forEach(n => pTags.push(`<span class="history-tag">${escH(n)}</span>`));
                  }
                  if (pTags.length) {
                    out += `<div class="history-player-header">${pTags.join('')}</div>`;
                  }
                  out += grp.map(r => {
                    const name = getGameName(r.game_id);
                    const gameKey = getGameKey(r.game_id) || r.game_id;
                    const thumbUrl = window.gameData?.[gameKey]?.images?.thumbnail || '';
                    const tags = [
                      r.play_time_min ? `⏱ ${r.play_time_min}분` : null,
                      r.score_note ? `🏆 ${escH(r.score_note)}` : null,
                    ].filter(Boolean);
                    return `<div class="history-record-item">
                      <div class="history-game-row">
                        ${thumbUrl ? `<img class="history-game-thumb" src="${escH(thumbUrl)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
                        <div class="history-game-info">
                          <a class="history-game-name" href="#" onclick="event.preventDefault();openGameSheet('${gameKey.replace(/'/g,"\\'")}');return false">${escH(name)}</a>
                          ${tags.length ? `<div class="history-record-tags">${tags.map(t=>`<span class="history-tag">${t}</span>`).join('')}</div>` : ''}
                        </div>
                      </div>
                      ${r.photo_url ? `<img class="history-photo" src="${escAttr(r.photo_url)}" alt="사진" loading="lazy">` : ''}
                    </div>`;
                  }).join('');
                }
                return out;
              })()}
            </div>
          </div>`;
        }

        html += `<a class="history-cross-link" href="./game-reviews.html">🎲 전체 플레이 기록 보기 →</a>`;
        html += `</div>`;
      }

      root.innerHTML = html;

      // 날짜 섹션 접기/펴기
      root.querySelectorAll('.history-session-header').forEach(hd => {
        hd.addEventListener('click', e => {
          if (e.target.classList.contains('history-copy-btn')) return; // 복사 버튼 클릭은 제외
          hd.closest('.history-session').classList.toggle('is-open');
        });
      });

      // ?group= 파라미터로 특정 그룹 섹션 스크롤
      const groupParam = new URLSearchParams(location.search).get('group');
      if (groupParam) {
        const el = root.querySelector(`[data-history-group="${CSS.escape(groupParam)}"]`);
        if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 150);
      }

      root.querySelectorAll('.history-copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const caption = btn.dataset.caption;
          navigator.clipboard.writeText(caption).then(() => {
            btn.textContent = '복사됨!';
            btn.classList.add('is-copied');
            setTimeout(() => {
              btn.textContent = '캡션 복사';
              btn.classList.remove('is-copied');
            }, 2000);
          }).catch(() => {
            prompt('아래 텍스트를 복사해주세요', caption);
          });
        });
      });
    }

    function escH(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escAttr(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    }

    document.addEventListener('DOMContentLoaded', render);
  })();
  </script>
